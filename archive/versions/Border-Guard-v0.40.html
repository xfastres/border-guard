<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#102b32">
<title>边境守卫 · Border Guard v0.40</title>
<style>
:root{
  --bg:#0d232a;
  --panel:linear-gradient(180deg,rgba(22,58,64,.94),rgba(11,33,40,.96));
  --panel-solid:#12333b;
  --border:rgba(232,194,114,.55);
  --border-soft:rgba(165,212,208,.24);
  --gold:#ffd670;
  --gold-deep:#c98a2c;
  --text:#eef6ec;
  --muted:#a8c6c2;
  --good:#88e070;
  --bad:#ff8066;
  --ice:#80dcff;
  --shadow:0 10px 28px rgba(0,0,0,.42);
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font);user-select:none}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
button:disabled{opacity:.44;cursor:not-allowed}

/* ===== Main layout ===== */
#app{position:relative;width:100%;height:100%;overflow:hidden}
#gameCanvas{display:block;width:100%;height:100%;touch-action:none;cursor:pointer}

/* ===== Top HUD ===== */
.topbar{
  position:fixed;top:0;left:0;right:0;z-index:30;
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:8px 12px;
  background:linear-gradient(180deg,rgba(15,44,50,.96),rgba(10,30,36,.92));
  border-bottom:1.5px solid var(--border);
  box-shadow:0 4px 18px rgba(0,0,0,.35);
  backdrop-filter:blur(8px);
}
.brand{
  display:flex;align-items:center;gap:7px;font-weight:900;font-size:15px;letter-spacing:.5px;
  color:var(--gold);padding-right:6px;white-space:nowrap;
}
.brand .ver{font-size:11px;font-weight:700;color:#bce0da;background:rgba(255,255,255,.08);padding:2px 6px;border-radius:999px}
.phase-box{
  display:flex;align-items:center;gap:8px;
  padding:5px 11px;border-radius:999px;
  background:rgba(9,26,32,.78);border:1px solid var(--border);
  min-width:190px;position:relative;overflow:hidden;
}
.phase-box .time-fill{
  position:absolute;left:0;bottom:0;height:3px;width:100%;
  background:linear-gradient(90deg,#f5b952,#ffe594);transition:width .18s linear;
}
.phase-box.night .time-fill{background:linear-gradient(90deg,#ff6e54,#ffae70)}
.phase-icon{font-size:15px}
.phase-label{font-weight:800;font-size:13px;color:#fff4d2;white-space:nowrap}
.phase-clock{font-size:12px;color:#d6e9e4;margin-left:auto;font-variant-numeric:tabular-nums;white-space:nowrap}

.stocks{display:flex;align-items:center;gap:6px;flex:1;min-width:220px;flex-wrap:wrap}
.stock{
  display:flex;align-items:center;gap:5px;
  padding:4px 10px;border-radius:999px;
  background:rgba(9,27,33,.78);border:1px solid var(--border-soft);
  font-size:13px;position:relative;
}
.stock .ico{font-size:14px;line-height:1}
.stock .sname{font-size:11px;color:var(--muted);font-weight:600}
.stock strong{font-size:14px;font-weight:900;color:#fff6dc;font-variant-numeric:tabular-nums}
.stock .rate{
  font-size:11px;font-weight:800;padding:1px 6px;border-radius:999px;
  background:rgba(136,224,112,.16);color:#a7f58d;border:1px solid rgba(136,224,112,.32);
}
.stock .rate.zero{background:rgba(255,255,255,.06);color:#8eb0ac;border-color:transparent}
.stock.pulse{animation:stockPulse .38s ease}
@keyframes stockPulse{0%{transform:scale(1)}40%{transform:scale(1.09);border-color:var(--gold)}100%{transform:scale(1)}}

.top-actions{display:flex;align-items:center;gap:6px;margin-left:auto}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:5px;
  padding:6px 11px;border-radius:10px;font-size:12px;font-weight:800;
  background:linear-gradient(180deg,rgba(35,88,92,.92),rgba(20,56,64,.95));
  border:1px solid rgba(164,218,210,.36);color:var(--text);
  box-shadow:0 2px 8px rgba(0,0,0,.24),inset 0 1px rgba(255,255,255,.12);
  transition:transform .1s ease,border-color .15s ease,filter .15s ease;
  white-space:nowrap;
}
.btn:hover:not(:disabled){border-color:var(--gold);filter:brightness(1.1)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn.gold{
  background:linear-gradient(180deg,#ffdf86,#d8962e);
  color:#2b1a04;border-color:#fff2bd;
  box-shadow:0 4px 14px rgba(216,150,46,.38),inset 0 1px rgba(255,255,255,.55);
}
.btn.active{
  border-color:var(--gold);
  box-shadow:0 0 0 2px rgba(255,214,112,.38),0 4px 12px rgba(0,0,0,.3);
  background:linear-gradient(180deg,rgba(56,118,112,.96),rgba(28,74,78,.98));
}
.btn.danger{
  background:linear-gradient(180deg,#c94f3a,#8a2c20);border-color:#ffaa8e;color:#fff4ee;
}

/* ===== Sub-status strip ===== */
.subbar{
  position:fixed;left:12px;right:12px;top:calc(var(--top-h, 52px) + 6px);z-index:25;
  display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
  padding:6px 12px;border-radius:12px;
  background:rgba(13,37,44,.86);border:1px solid var(--border-soft);
  backdrop-filter:blur(6px);pointer-events:auto;
}
.sub-left{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px}
.sub-hint{color:#e6f3ea;font-weight:700}
.wave-pill{
  padding:2px 9px;border-radius:999px;font-size:11px;font-weight:800;
  background:rgba(190,68,48,.32);border:1px solid rgba(255,134,104,.6);color:#ffd7cc;
}
.vital-pills{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.vpill{
  padding:2px 9px;border-radius:999px;font-size:12px;font-weight:800;
  background:rgba(8,24,30,.82);border:1px solid var(--border-soft);color:#e4f2eb;
  font-variant-numeric:tabular-nums;
}
.vpill.warn{background:rgba(168,42,30,.58);border-color:#ff8668;color:#fff1ea;animation:warnBlink 1.1s ease-in-out infinite}
.vpill.shield{border-color:#7be0ff;color:#ccf3ff}
@keyframes warnBlink{0%,100%{box-shadow:0 0 0 0 rgba(255,112,84,0)}50%{box-shadow:0 0 12px 1px rgba(255,112,84,.55)}}
.sub-right{display:flex;align-items:center;gap:6px}

/* ===== Banner & Toast ===== */
#banner{
  position:fixed;left:50%;top:calc(var(--sub-bottom, 102px) + 8px);transform:translateX(-50%);z-index:40;
  padding:10px 22px;border-radius:14px;text-align:center;
  background:linear-gradient(180deg,rgba(24,66,70,.97),rgba(11,36,44,.97));
  border:1.5px solid var(--gold);box-shadow:var(--shadow);
  pointer-events:none;min-width:250px;max-width:90vw;
  transition:opacity .25s ease,transform .25s ease;
}
#banner.good{background:linear-gradient(180deg,rgba(36,96,56,.97),rgba(18,54,36,.97));border-color:#b2f285}
#banner.night{background:linear-gradient(180deg,rgba(38,54,96,.97),rgba(19,30,58,.97));border-color:#9ebaff}
#banner.danger{background:linear-gradient(180deg,rgba(122,42,32,.97),rgba(68,22,20,.97));border-color:#ff9478}
#banner b{display:block;font-size:18px;font-weight:900;color:#fff0bd;letter-spacing:.6px}
#banner span{display:block;font-size:12px;color:#e0eee6;margin-top:2px}
#banner[hidden]{display:none}

#toast{
  position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:45;
  padding:7px 14px;border-radius:999px;font-size:12px;font-weight:800;
  background:rgba(16,49,54,.96);border:1px solid var(--gold);color:#fff0c4;
  box-shadow:0 6px 18px rgba(0,0,0,.38);pointer-events:none;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis;
}
#toast.bad{border-color:#ff8b70;color:#ffe2da}
#toast[hidden]{display:none}

/* ===== Inspector Side Card ===== */
#inspector{
  position:fixed;right:12px;top:106px;z-index:32;width:276px;max-width:calc(100vw - 24px);
  max-height:calc(100vh - 210px);overflow-y:auto;
  padding:12px 14px;border-radius:15px;
  background:var(--panel);border:1.5px solid var(--border);box-shadow:var(--shadow);
  backdrop-filter:blur(8px);
}
#inspector[hidden]{display:none}
.insp-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.insp-head h3{font-size:15px;font-weight:900;color:var(--gold)}
.insp-desc{font-size:12px;color:#d6e8e2;line-height:1.5;margin-bottom:10px}
.insp-stats{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.bar-row{display:flex;align-items:center;gap:7px;font-size:12px}
.bar-row .blabel{width:38px;color:var(--muted);font-weight:700}
.bar-track{flex:1;height:8px;border-radius:999px;background:rgba(6,19,24,.85);overflow:hidden;border:1px solid rgba(255,255,255,.1)}
.bar-track i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#62d66a,#b4f57a);transition:width .18s}
.bar-track.wall i{background:linear-gradient(90deg,#e4b457,#ffe69a)}
.bar-val{font-size:11px;font-weight:800;font-variant-numeric:tabular-nums;min-width:52px;text-align:right}
.insp-actions{display:flex;flex-wrap:wrap;gap:6px}
.insp-actions .btn{flex:1 1 46%;flex-direction:column;padding:7px 9px;gap:2px}
.insp-actions .btn small{font-size:10px;font-weight:600;color:#cde4de;opacity:.92}
.insp-actions .btn.gold small{color:#493008}
.res-list{margin-top:10px;border-top:1px solid var(--border-soft);padding-top:8px;display:flex;flex-direction:column;gap:6px}
.res-row{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:12px;background:rgba(7,22,27,.55);padding:5px 8px;border-radius:9px}
.res-row .rrole{font-weight:700;color:#eef6ec}
.res-row .rsub{font-size:11px;color:var(--muted)}

/* ===== Bottom Command Dock ===== */
.dock{
  position:fixed;left:50%;bottom:10px;transform:translateX(-50%);z-index:30;
  display:flex;align-items:center;gap:7px;
  padding:8px 10px;border-radius:16px;
  background:var(--panel);border:1.5px solid var(--border);box-shadow:var(--shadow);
  backdrop-filter:blur(8px);max-width:calc(100vw - 16px);overflow-x:auto;
}
.cmd-btn{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  min-width:92px;padding:7px 10px;border-radius:12px;position:relative;
  background:linear-gradient(180deg,rgba(31,79,84,.92),rgba(18,50,57,.96));
  border:1px solid rgba(164,218,210,.34);color:var(--text);
  transition:transform .1s,border-color .15s,filter .15s;flex:0 0 auto;
}
.cmd-btn:hover:not(:disabled){border-color:var(--gold);filter:brightness(1.1)}
.cmd-btn:active:not(:disabled){transform:translateY(1px)}
.cmd-btn.active{border-color:var(--gold);box-shadow:0 0 0 2px rgba(255,214,112,.45);background:linear-gradient(180deg,rgba(54,116,108,.96),rgba(24,68,72,.98))}
.cmd-btn.gold{background:linear-gradient(180deg,#ffe088,#d8952c);color:#2a1904;border-color:#fff2bd}
.cmd-btn.gold .csub{color:#4b3006}
.cmd-btn .cico{font-size:17px;line-height:1.1}
.cmd-btn .cname{font-size:12px;font-weight:900;white-space:nowrap}
.cmd-btn .csub{font-size:10px;font-weight:700;color:#b8d7d2;white-space:nowrap}
.cmd-btn .ckey{
  position:absolute;top:4px;left:5px;font-size:10px;font-weight:900;
  padding:0 4px;border-radius:4px;background:rgba(0,0,0,.38);color:#ffe49b;
}
.cmd-btn.gold .ckey{background:rgba(42,25,4,.22);color:#2a1904}
.cmd-btn .cd-mask{
  position:absolute;inset:0;border-radius:12px;background:rgba(8,20,26,.72);
  display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900;color:#ffe18f;
}
.cmd-btn .cd-mask[hidden]{display:none}

/* ===== Modals (Cards / Intro / Victory / Loss / Cards List) ===== */
.modal-backdrop{
  position:fixed;inset:0;z-index:60;
  display:flex;align-items:center;justify-content:center;padding:16px;
  background:rgba(6,17,22,.68);backdrop-filter:blur(5px);
}
.modal-backdrop[hidden]{display:none}
.modal-card{
  width:min(760px,96vw);max-height:90vh;overflow-y:auto;
  padding:20px 22px;border-radius:18px;
  background:linear-gradient(155deg,#183f45,#0e272f);
  border:1.5px solid var(--gold);box-shadow:0 22px 60px rgba(0,0,0,.6);
}
.modal-card h2{font-size:21px;font-weight:900;color:#ffe69e;text-align:center;margin-bottom:6px}
.modal-card .msub{font-size:13px;color:#cde3dd;text-align:center;margin-bottom:16px;line-height:1.55}
.cards-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.pick-card{
  display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;
  padding:16px 12px;border-radius:15px;color:#1d2b28;
  background:linear-gradient(180deg,#eef8ff,#d8ecfa);
  border:2px solid #8bc3e8;box-shadow:0 8px 20px rgba(0,0,0,.28);
  transition:transform .14s ease,box-shadow .14s ease,border-color .14s ease;
}
.pick-card.tone-tower{background:linear-gradient(180deg,#e9fbf2,#cdeee0);border-color:#72cfa4}
.pick-card.tone-hero{background:linear-gradient(180deg,#f5efff,#e3d6fa);border-color:#b090ea}
.pick-card.tone-econ{background:linear-gradient(180deg,#fff9e6,#f7e5b0);border-color:#e5b755}
.pick-card:hover{transform:translateY(-4px);border-color:#ffd670;box-shadow:0 12px 26px rgba(0,0,0,.38)}
.pick-card .cbadge{
  width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:26px;background:rgba(255,255,255,.78);border:2px solid rgba(0,0,0,.1);
}
.pick-card .ctag{font-size:10px;font-weight:900;padding:2px 8px;border-radius:999px;background:rgba(20,40,48,.12);color:#26464e}
.pick-card b{font-size:15px;font-weight:900;color:#182a2e}
.pick-card p{font-size:12px;line-height:1.45;color:#2f494e}
.pick-card .cgo{
  margin-top:auto;padding:6px 14px;border-radius:999px;font-size:12px;font-weight:900;
  background:linear-gradient(180deg,#ffe088,#d8952c);color:#2b1a04;
}
.modal-footer{display:flex;justify-content:center;gap:10px;margin-top:16px;flex-wrap:wrap}
.intro-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.intro-box{
  padding:11px 12px;border-radius:12px;background:rgba(8,25,30,.66);border:1px solid var(--border-soft);
}
.intro-box b{display:block;font-size:13px;color:var(--gold);margin-bottom:4px}
.intro-box p{font-size:12px;color:#d6e8e2;line-height:1.5}
.summary-list{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px}
.sum-item{padding:10px 12px;border-radius:11px;background:rgba(8,25,30,.72);border:1px solid var(--border-soft);text-align:center}
.sum-item span{display:block;font-size:11px;color:var(--muted)}
.sum-item strong{display:block;font-size:18px;font-weight:900;color:#ffe69e;margin-top:2px}

@media (max-width:720px){
  .topbar{padding:6px 8px;gap:5px}
  .brand .ver,.stock .sname{display:none}
  .phase-box{min-width:146px;padding:4px 9px}
  .subbar{left:8px;right:8px;padding:5px 8px}
  #inspector{right:8px;left:8px;top:auto;bottom:84px;width:auto;max-height:42vh}
  .dock{bottom:6px;padding:6px 7px;gap:5px}
  .cmd-btn{min-width:74px;padding:6px 7px}
  .cards-grid,.intro-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="app">
  <canvas id="gameCanvas" aria-label="边境守卫战场地图"></canvas>

  <!-- Top HUD -->
  <header class="topbar">
    <div class="brand">🛡️ 边境守卫 <span class="ver">v0.40 MVP</span></div>
    <div class="phase-box" id="phaseBox">
      <span class="phase-icon" id="phaseIcon">☀️</span>
      <span class="phase-label" id="phaseLabel">第 1 日 · 白天</span>
      <span class="phase-clock" id="phaseClock">01:15</span>
      <i class="time-fill" id="timeFill"></i>
    </div>
    <div class="stocks">
      <div class="stock" id="stockGold" title="金币：建造与升级防御塔、扩建领地、招募居民、夜间急修">
        <span class="ico">🪙</span><span class="sname">金币</span><strong id="valGold">22</strong><span class="rate zero" id="rateGold">+0/5s</span>
      </div>
      <div class="stock" id="stockMat" title="材料：开发资源点、建造防御塔、修补城墙">
        <span class="ico">🪵</span><span class="sname">材料</span><strong id="valMat">26</strong><span class="rate zero" id="rateMat">+0/5s</span>
      </div>
      <div class="stock" id="stockFood" title="粮食：用于招募更多居民，无扣粮惩罚">
        <span class="ico">🌾</span><span class="sname">粮食</span><strong id="valFood">6</strong><span class="rate zero" id="rateFood">+0/5s</span>
      </div>
      <div class="stock" id="stockPop" title="居民：自动进驻生产建筑提产，夜间守卫协防">
        <span class="ico">👥</span><span class="sname">居民</span><strong id="valPop">3</strong>
      </div>
    </div>
    <div class="top-actions">
      <button class="btn" id="speedBtn" type="button" title="切换倍速 (F)">1×</button>
      <button class="btn" id="pauseBtn" type="button">暂停</button>
      <button class="btn" id="soundBtn" type="button">🔊</button>
      <button class="btn" id="helpBtn" type="button">说明</button>
      <button class="btn" id="resetBtn" type="button">重开</button>
    </div>
  </header>

  <!-- Sub-bar -->
  <div class="subbar" id="subbar">
    <div class="sub-left">
      <span class="wave-pill" id="wavePreview">今夜敌袭：西侧</span>
      <span class="sub-hint" id="subHint">点带 + 号的资源点开发（每 5 秒实时产出），在西门两侧草地建塔！</span>
    </div>
    <div class="vital-pills" id="vitalPills">
      <span class="vpill" id="pillCastle">🏰 主城 100/100</span>
      <span class="vpill" id="pillWall">🧱 城墙 480/480</span>
      <span class="vpill" id="pillHero">⚔️ 领主 120/120</span>
      <span class="vpill" id="pillEnemies" hidden>👾 残敌 0</span>
    </div>
    <div class="sub-right">
      <button class="btn" id="cardsBtn" type="button">强化 0</button>
      <button class="btn" id="centerBtn" type="button">回主城</button>
    </div>
  </div>

  <!-- Transient Banner & Toast -->
  <div id="banner" hidden><b id="bannerTitle"></b><span id="bannerSub"></span></div>
  <div id="toast" hidden></div>

  <!-- Right Inspector -->
  <aside id="inspector" hidden>
    <div class="insp-head">
      <h3 id="inspTitle">地点详情</h3>
      <button class="btn" id="inspClose" type="button">关闭</button>
    </div>
    <p class="insp-desc" id="inspDesc"></p>
    <div class="insp-stats" id="inspStats"></div>
    <div class="insp-actions" id="inspActions"></div>
    <div class="res-list" id="inspList" hidden></div>
  </aside>

  <!-- Bottom Command Dock -->
  <nav class="dock" id="dock" aria-label="快捷指令栏"></nav>

  <!-- Modal -->
  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <div class="modal-card" id="modalCard"></div>
  </div>
</div>

<script>
'use strict';

/* =========================================================================
   Border Guard v0.40 MVP
   Core Skeleton:
   - Day: 75s real-time economy (workshops tick every 5s with floating popups),
     auto-assigned residents, clean 5x5 inner-production / clear-gates /
     outer-tower-ring layout, strict no-build on trees/rocks/roads/gates,
     free expansion pushing the wall ring outward, ready-anytime "立即开战".
   - Night: 3 distinct towers (Arrow / Cannon / Frost, upgradable to Lv2),
     4 distinct enemies + Night 5 Siege Boss with telegraphed AoE slam,
     Hero active skills (Q Whirlwind, E Dash+Shield, R Rally), instant gold
     drops on kill, and 8 transformative Roguelike cards after each night.
   ========================================================================= */

const WIDTH = 22;
const HEIGHT = 15;
const CELL = 56;
const WORLD_W = WIDTH * CELL;
const WORLD_H = HEIGHT * CELL;
const LAST_NIGHT = 5;
const CASTLE_X = 10;
const CASTLE_Y = 7;
const TICK_INTERVAL = 5.0; // Daytime real-time production tick (seconds)
const DAY_DURATION = 75;   // Daytime timer (seconds), skippable anytime

const DIRS = [[1,0],[-1,0],[0,1],[0,-1]];

/* ---------- Utility & Seeded RNG ---------- */
const $ = id => document.getElementById(id);
function mulberry32(seed){
  let a = seed >>> 0;
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hash2(x, y, s=0){
  let n = Math.imul(x + 37, 374761393) ^ Math.imul(y + 91, 668265263) ^ Math.imul(s + 13, 1442695041);
  n = (n ^ (n >>> 13)) * 1274126177;
  return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
}
function inside(x, y){ return x >= 0 && x < WIDTH && y >= 0 && y < HEIGHT; }
function idxOf(x, y){ return y * WIDTH + x; }
function tileAt(x, y){ return inside(x, y) ? game.tiles[idxOf(x, y)] : null; }
function dist(a, b){ return Math.hypot(a.x - b.x, a.y - b.y); }
function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }

/* ---------- Lightweight Web Audio SFX ---------- */
const AudioKit = {
  ctx: null,
  enabled: true,
  last: {},
  unlock(){
    if (!this.enabled) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!this.ctx) {
      try { this.ctx = new AC(); } catch { this.ctx = null; }
    }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(()=>{});
  },
  play(kind){
    if (!this.enabled || !this.ctx || this.ctx.state !== 'running') return;
    const now = performance.now();
    const gap = { arrow:55, cannon:90, frost:80, slash:70, hit:55, coin:60, build:90, skill:120, alarm:400, dawn:600 }[kind] || 60;
    if (now - (this.last[kind] || 0) < gap) return;
    this.last[kind] = now;
    const defs = {
      arrow:  [[760, 420, 'triangle', 0.06, 0.09]],
      cannon: [[145, 52,  'sawtooth', 0.16, 0.16]],
      frost:  [[980, 1420,'sine',     0.10, 0.09]],
      slash:  [[420, 160, 'sawtooth', 0.09, 0.12]],
      skill:  [[320, 740, 'triangle', 0.15, 0.15],[740, 520, 'sine', 0.10, 0.10]],
      dash:   [[520, 240, 'sine',     0.11, 0.11]],
      coin:   [[880, 1320,'sine',     0.08, 0.08]],
      build:  [[420, 680, 'triangle', 0.12, 0.12]],
      alarm:  [[240, 180, 'square',   0.22, 0.11]],
      dawn:   [[523, 659, 'triangle', 0.12, 0.13],[659, 987, 'triangle', 0.18, 0.13]],
      victory:[[523, 659, 'triangle', 0.14, 0.15],[659, 784, 'triangle', 0.14, 0.15],[784, 1046, 'triangle', 0.28, 0.16]],
      hit:    [[210, 95,  'square',   0.07, 0.08]]
    };
    const notes = defs[kind];
    if (!notes) return;
    try {
      let t = this.ctx.currentTime;
      for (const [f0, f1, type, dur, vol] of notes) {
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(f0, t);
        osc.frequency.exponentialRampToValueAtTime(Math.max(40, f1), t + dur);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        osc.connect(g); g.connect(this.ctx.destination);
        osc.start(t); osc.stop(t + dur + 0.02);
        t += dur * 0.85;
      }
    } catch {}
  }
};

/* ---------- Game State Construction ---------- */
let game = null;
let paused = false;
let introSeen = false;

function buildMap(seed){
  const rnd = mulberry32(seed);
  const tiles = [];
  for (let y = 0; y < HEIGHT; y++) {
    for (let x = 0; x < WIDTH; x++) {
      // River bend in bottom-right / top-left corners (never blocks spawn roads)
      const water = (y === 0 && x >= 15) || (y === HEIGHT - 1 && x <= 5) ||
                    (y === HEIGHT - 2 && x <= 3) || (x === WIDTH - 1 && y <= 2);
      const road = (y === CASTLE_Y) || (x === CASTLE_X && y <= CASTLE_Y) || (x === CASTLE_X && y >= CASTLE_Y && y <= 11);
      let ground = water ? 'water' : road ? 'road' : 'grass';
      let cover = 'none';
      const inCastleBox = Math.abs(x - CASTLE_X) <= 2 && Math.abs(y - CASTLE_Y) <= 2;
      const nearSpawn = (x <= 1 && Math.abs(y - CASTLE_Y) <= 1) ||
                        (x >= WIDTH - 2 && Math.abs(y - CASTLE_Y) <= 1) ||
                        (y <= 1 && Math.abs(x - CASTLE_X) <= 1);
      if (ground === 'grass' && !inCastleBox && !nearSpawn) {
        const r = rnd();
        if (r < 0.16) cover = 'forest';
        else if (r < 0.22) cover = 'mountain';
      }
      tiles.push({
        x, y, ground, cover,
        owned: inCastleBox,
        node: null,
        building: null,
        variation: rnd()
      });
    }
  }

  // Place Castle at center
  const castleTile = tiles[idxOf(CASTLE_X, CASTLE_Y)];
  castleTile.ground = 'grass';
  castleTile.cover = 'none';
  castleTile.building = { type:'castle' };

  // Clean 5x5 inner-ring resource nodes (NEVER on gates or front tower strip!)
  const innerNodes = [
    [CASTLE_X - 1, CASTLE_Y - 1, 'farm'],
    [CASTLE_X + 1, CASTLE_Y - 1, 'wood'],
    [CASTLE_X - 1, CASTLE_Y + 1, 'stone'],
    [CASTLE_X + 1, CASTLE_Y + 1, 'mine']
  ];
  for (const [nx, ny, kind] of innerNodes) {
    const t = tiles[idxOf(nx, ny)];
    t.ground = 'grass'; t.cover = 'none';
    t.node = { kind, developed:false, level:1, workerId:null };
  }

  // Wild high-yield & extra resource nodes outside the 5x5 walls (for expansion!)
  const wildNodes = [
    [CASTLE_X + 4, CASTLE_Y - 1, 'rich'],   // East rich gold mine
    [CASTLE_X - 4, CASTLE_Y + 1, 'wood'],   // West outer forest
    [CASTLE_X - 1, CASTLE_Y + 4, 'iron'],   // South rich iron vein
    [CASTLE_X + 3, CASTLE_Y + 3, 'farm'],   // Southeast farm
    [CASTLE_X - 3, CASTLE_Y - 3, 'stone'],  // Northwest quarry
    [CASTLE_X + 3, CASTLE_Y - 3, 'mine']    // Northeast gold
  ];
  for (const [nx, ny, kind] of wildNodes) {
    const t = tiles[idxOf(nx, ny)];
    if (!t || t.ground === 'water' || t.ground === 'road') continue;
    t.ground = 'grass'; t.cover = 'none';
    t.node = { kind, developed:false, level:1, workerId:null };
  }

  return { tiles, rnd };
}
