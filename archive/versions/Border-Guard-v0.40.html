/* ---------- Map Pointer & Keyboard Bindings ---------- */
let dragState = null;
canvas.addEventListener('pointerdown', e => {
  AudioKit.unlock();
  dragState = { id: e.pointerId, sx: e.clientX, sy: e.clientY, cx: cam.x, cy: cam.y, moved: false };
});
window.addEventListener('pointermove', e => {
  if (dragState && dragState.id === e.pointerId) {
    const dx = e.clientX - dragState.sx, dy = e.clientY - dragState.sy;
    if (Math.hypot(dx, dy) > 8) dragState.moved = true;
    if (dragState.moved) {
      cam.x = dragState.cx - dx / cam.zoom;
      cam.y = dragState.cy - dy / cam.zoom;
      clampCam();
    }
    return;
  }
  const wp = screenToWorld(e.clientX, e.clientY);
  const t = tileAt(Math.floor(wp.x), Math.floor(wp.y));
  game.hoverTile = t ? idxOf(t.x, t.y) : null;
});
window.addEventListener('pointerup', e => {
  if (!dragState || dragState.id !== e.pointerId) return;
  const wasDrag = dragState.moved;
  dragState = null;
  if (wasDrag) return;
  const wp = screenToWorld(e.clientX, e.clientY);
  handleMapClick(wp.x, wp.y);
});
canvas.addEventListener('wheel', e => {
  const factor = e.deltaY < 0 ? 1.09 : 0.92;
  cam.zoom = clamp(cam.zoom * factor, 0.55, 1.65);
  clampCam();
}, { passive:true });

function handleMapClick(wx, wy){
  if (!game || !['day','night'].includes(game.phase)) return;
  const t = tileAt(Math.floor(wx), Math.floor(wy));
  if (!t) return;

  if (game.phase === 'day' && game.mode) {
    if (game.mode === 'move') { moveTowerTo(t); return; }
    if (TOWERS[game.mode]) { buildTower(t, game.mode); return; }
    if (game.mode === 'expand') { expandTile(t); return; }
  }

  // Day quick 1-click develop on owned undeveloped resource node
  if (game.phase === 'day' && canDevelopNode(t)) {
    developNode(t);
    game.selectedTile = idxOf(t.x, t.y);
    renderInspector();
    return;
  }

  // Inspect: during night, only Castle/Tower opens inspector so clicking workshops/enemies smoothly moves Hero
  const canInspect = game.phase === 'day'
    ? (t.building || t.node)
    : (t.building?.type === 'castle' || t.building?.type === 'tower');
  if (canInspect) {
    const idx = idxOf(t.x, t.y);
    game.selectedTile = game.selectedTile === idx ? null : idx;
    renderUI();
    return;
  }

  // Otherwise move hero to clicked point
  game.selectedTile = null;
  if (t.ground !== 'water') {
    game.hero.goal = { x: clamp(wx, 0.4, WIDTH - 0.4), y: clamp(wy, 0.4, HEIGHT - 0.4) };
  }
  renderUI();
}

window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (!$('modalBackdrop').hidden) {
    if (k === 'escape' && !game.cardChoices && game.phase !== 'won' && game.phase !== 'lost') closeModal();
    return;
  }
  if (k === 'escape') {
    if (game.mode) { game.mode = null; game.movingTowerFrom = null; renderUI(); }
    else if (game.selectedTile != null) { game.selectedTile = null; renderUI(); }
    else if (paused) { paused = false; renderUI(); }
    return;
  }
  if (k === 'f') { game.speed = game.speed === 2 ? 1 : 2; renderUI(); return; }
  if (game.phase === 'day') {
    if (k === '1') { game.movingTowerFrom = null; game.mode = game.mode === 'arrow' ? null : 'arrow'; renderUI(); return; }
    if (k === '2') { game.movingTowerFrom = null; game.mode = game.mode === 'cannon' ? null : 'cannon'; renderUI(); return; }
    if (k === '3') { game.movingTowerFrom = null; game.mode = game.mode === 'frost' ? null : 'frost'; renderUI(); return; }
    if (k === '4') { game.movingTowerFrom = null; game.mode = game.mode === 'expand' ? null : 'expand'; renderUI(); return; }
  } else if (game.phase === 'night') {
    if (k === 'q') { castWhirlwind(); return; }
    if (k === 'e') { castDash(); return; }
    if (k === 'r') { castRally(); return; }
  }
  if (['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) {
    if (k === ' ') e.preventDefault();
    keys.add(k);
  }
});
window.addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
window.addEventListener('blur', () => keys.clear());

/* ---------- Top/Side Button Bindings ---------- */
$('speedBtn').addEventListener('click', () => { game.speed = game.speed === 2 ? 1 : 2; renderUI(); });
$('pauseBtn').addEventListener('click', () => { paused = !paused; renderUI(); });
$('soundBtn').addEventListener('click', () => { AudioKit.enabled = !AudioKit.enabled; if (AudioKit.enabled) AudioKit.unlock(); renderUI(); });
$('helpBtn').addEventListener('click', showIntroModal);
$('resetBtn').addEventListener('click', () => startNewRun());
$('cardsBtn').addEventListener('click', showOwnedCardsModal);
$('centerBtn').addEventListener('click', centerOnCastle);
$('inspClose').addEventListener('click', () => { game.selectedTile = null; if (game.mode === 'move') { game.mode = null; game.movingTowerFrom = null; } renderUI(); });
canvas.addEventListener('contextmenu', e => {
  if (game?.mode) { e.preventDefault(); game.mode = null; game.movingTowerFrom = null; renderUI(); }
});
window.addEventListener('resize', resizeCanvas);

/* ---------- Bootstrap & Main Loop ---------- */
function startNewRun(seed){
  paused = false;
  keys.clear();
  lastInspKey = '';
  clearTimeout(bannerTimer); clearTimeout(toastTimer);
  $('banner').hidden = true; $('toast').hidden = true;
  game = makeGame(seed);
  rebuildWallRing();
  autoAssignResidents();
  resizeCanvas();
  centerOnCastle();
  renderUI();
  syncBarOffsets();
  if (!introSeen) showIntroModal();
}

let lastFrame = 0, lastUi = 0;
function loop(now){
  if (!lastFrame) lastFrame = now;
  const rawDt = Math.min(0.12, Math.max(0, (now - lastFrame) / 1000));
  lastFrame = now;
  const scaled = rawDt * (game ? game.speed : 1);
  let rem = scaled;
  while (rem > 0) {
    const step = Math.min(0.033, rem);
    tick(step);
    rem -= step;
  }
  draw();
  if (now - lastUi > 160) { renderUI(); lastUi = now; }
  requestAnimationFrame(loop);
}

startNewRun();
requestAnimationFrame(loop);

// Expose clean test/debug hook for automated QA
window.BG40 = {
  get game(){ return game; },
  startNewRun, rebuildWallRing,
  canBuildTower, canDevelopNode, canExpandTile, isGateInteriorTile,
  developNode, upgradeWorkshop, buildTower, upgradeTower, sellTower,
  startMoveTower, moveTowerTo,
  expandTile, recruitResident, toggleResidentRole, repairWallDay, repairCastleNight,
  startNight, castWhirlwind, castDash, castRally, pickCard, tick,
  TOWERS, CARDS, NODE_META, ENEMY_TYPES, NIGHT_CONFIG,
  tileAt, idxOf, currentRates, workshopYield,
  worldToScreen(wx, wy){
    return { x: (wx * CELL - cam.x) * cam.zoom + cam.w / 2, y: (wy * CELL - cam.y) * cam.zoom + cam.h / 2 };
  }
};
