/* ---------- Wall Ring Geometry (Closed Perimeter + 4 Cardinal Gates) ---------- */
function rebuildWallRing(g = game){
  const edges = [];
  const gates = [];
  const gateTiles = new Set();

  for (const t of g.tiles) {
    if (!t.owned) continue;
    const checks = [
      { dir:'N', dx:0, dy:-1, x1:t.x,   y1:t.y,   x2:t.x+1, y2:t.y   },
      { dir:'S', dx:0, dy:1,  x1:t.x,   y1:t.y+1, x2:t.x+1, y2:t.y+1 },
      { dir:'W', dx:-1,dy:0,  x1:t.x,   y1:t.y,   x2:t.x,   y2:t.y+1 },
      { dir:'E', dx:1, dy:0,  x1:t.x+1, y1:t.y,   x2:t.x+1, y2:t.y+1 }
    ];
    for (const c of checks) {
      const nb = tileAt(t.x + c.dx, t.y + c.dy);
      if (!nb || !nb.owned) {
        edges.push({
          id: `${t.x},${t.y},${c.dir}`,
          tx: t.x, ty: t.y, dir: c.dir,
          x1: c.x1, y1: c.y1, x2: c.x2, y2: c.y2,
          mx: (c.x1 + c.x2) / 2, my: (c.y1 + c.y2) / 2,
          isGate: false
        });
      }
    }
  }

  // Pick 1 best gate per cardinal direction aligned with castle axis / road
  for (const dir of ['W','E','N','S']) {
    const candidates = edges.filter(e => e.dir === dir);
    if (!candidates.length) continue;
    candidates.sort((a, b) => {
      const aRoad = tileAt(a.tx, a.ty)?.ground === 'road' ? 0 : 1;
      const bRoad = tileAt(b.tx, b.ty)?.ground === 'road' ? 0 : 1;
      if (aRoad !== bRoad) return aRoad - bRoad;
      const da = Math.abs(a.mx - (CASTLE_X + 0.5)) + Math.abs(a.my - (CASTLE_Y + 0.5));
      const db = Math.abs(b.mx - (CASTLE_X + 0.5)) + Math.abs(b.my - (CASTLE_Y + 0.5));
      return da - db;
    });
    candidates[0].isGate = true;
    gates.push(candidates[0]);
    gateTiles.add(idxOf(candidates[0].tx, candidates[0].ty));
  }

  g.wall.edges = edges;
  g.wall.gates = gates;
  g.wall.gateTiles = gateTiles;
}

/* ---------- Strict Terrain & Placement Rules ---------- */
function isGateInteriorTile(t){
  return !!t && game.wall.gateTiles.has(idxOf(t.x, t.y));
}

function canBuildTower(t){
  if (!t || !t.owned) return false;
  if (t.ground !== 'grass') return false;   // NEVER on road or water
  if (t.cover !== 'none') return false;     // NEVER on forest/trees or mountain/rock
  if (t.node || t.building) return false;   // NEVER on resources or existing buildings
  if (isGateInteriorTile(t)) return false;  // NEVER blocking behind a gate
  return true;
}

function canDevelopNode(t){
  return !!t && t.owned && !!t.node && !t.node.developed && !t.building;
}

function canExpandTile(t){
  if (!t || t.owned || t.ground === 'water') return false;
  return DIRS.some(([dx, dy]) => tileAt(t.x + dx, t.y + dy)?.owned);
}

/* ---------- Economy Helpers ---------- */
function canAfford(cost){
  return Object.entries(cost).every(([k, v]) => (game.resources[k] || 0) >= v);
}
function spend(cost){
  if (!canAfford(cost)) return false;
  for (const [k, v] of Object.entries(cost)) game.resources[k] -= v;
  return true;
}
function addRes(res, amount, fxX, fxY, label){
  if (!amount) return;
  game.resources[res] = (game.resources[res] || 0) + amount;
  if (res === 'gold') game.stats.goldEarned += amount;
  const elMap = { gold:'stockGold', material:'stockMat', food:'stockFood' };
  const el = $(elMap[res]);
  if (el) { el.classList.remove('pulse'); void el.offsetWidth; el.classList.add('pulse'); }
  if (fxX != null) {
    const color = res === 'gold' ? '#ffe074' : res === 'food' ? '#b8f285' : '#e8d5b0';
    addFloat(fxX, fxY, label || `+${amount} ${RES_LABELS[res]}`, color);
  }
}

function workshopYield(t){
  if (!t?.node?.developed) return 0;
  const meta = NODE_META[t.node.kind];
  if (!meta) return 0;
  const hasWorker = !!t.node.workerId && game.residents.some(r => r.id === t.node.workerId);
  const lvlBonus = (t.node.level || 1) - 1;
  return (hasWorker ? meta.worker : meta.base) + lvlBonus;
}

function currentRates(){
  const r = { gold:0, material:0, food:0 };
  for (const t of game.tiles) {
    if (t.owned && t.node?.developed) {
      const meta = NODE_META[t.node.kind];
      r[meta.res] += workshopYield(t);
    }
  }
  return r;
}

function autoAssignResidents(){
  // Free invalid assignments
  for (const r of game.residents) {
    if (r.workTile != null) {
      const t = game.tiles[r.workTile];
      if (!t || !t.owned || !t.node?.developed || t.node.workerId !== r.id) r.workTile = null;
    }
  }
  // Assign idle non-guard (or guard if needed) workers to empty developed workshops
  const emptyWorkshops = game.tiles.filter(t => t.owned && t.node?.developed && !t.node.workerId);
  for (const t of emptyWorkshops) {
    const idle = game.residents.find(r => r.workTile == null && r.role === 'worker') ||
                 game.residents.find(r => r.workTile == null);
    if (!idle) break;
    idle.workTile = idxOf(t.x, t.y);
    t.node.workerId = idle.id;
  }
}

/* ---------- Player Actions ---------- */
function developNode(t){
  if (game.phase !== 'day') { toast('只能在白天开发资源点。', true); return false; }
  if (!canDevelopNode(t)) { toast('只能开发领地内未开发的资源点。', true); return false; }
  if (!spend({ material:2 })) { toast('材料不足（需要 2 材料）。', true); return false; }
  t.node.developed = true;
  t.node.level = 1;
  t.cover = 'none';
  autoAssignResidents();
  const meta = NODE_META[t.node.kind];
  addRing(t.x + 0.5, t.y + 0.5, '#ffe074', 0.9);
  addFloat(t.x + 0.5, t.y + 0.2, `${meta.prod}建成 · +${workshopYield(t)}/5s`, '#ffe694');
  AudioKit.play('build');
  toast(`${meta.prod}已建成！每 5 秒实时产出 ${meta.res === 'gold' ? '金币' : meta.res === 'food' ? '粮食' : '材料'}。`);
  renderUI();
  return true;
}

function upgradeWorkshop(t){
  if (game.phase !== 'day' || !t?.node?.developed) return false;
  if (t.node.level >= 2) { toast('已达最高等级。', true); return false; }
  if (!spend({ material:6, gold:4 })) { toast('需要 6 材料 · 4 金币。', true); return false; }
  t.node.level = 2;
  addRing(t.x + 0.5, t.y + 0.5, '#a8f582', 0.9);
  addFloat(t.x + 0.5, t.y + 0.2, `升级 Lv.2 · +${workshopYield(t)}/5s`, '#b6f78c');
  AudioKit.play('build');
  renderUI();
  return true;
}

function buildTower(t, kind){
  if (game.phase !== 'day') { toast('只能在白天建造防御塔。', true); return false; }
  const spec = TOWERS[kind];
  if (!spec) return false;
  if (!canBuildTower(t)) {
    if (t?.cover && t.cover !== 'none') toast('不能在树林或山石上建造防御塔！', true);
    else if (t?.ground === 'road' || isGateInteriorTile(t)) toast('道路与城门通道需保持畅通，请建在城墙两侧草地！', true);
    else toast('请选择领地内干净的草地塔位。', true);
    return false;
  }
  if (!spend(spec.cost)) { toast(`资源不足（需要 ${costStr(spec.cost)}）。`, true); return false; }
  t.building = { type:'tower', kind, level:1, cd:0, angle:0 };
  game.stats.towersBuilt++;
  addRing(t.x + 0.5, t.y + 0.5, '#ffe074', 0.95);
  addFloat(t.x + 0.5, t.y + 0.2, `${spec.name}建成`, '#ffe694');
  AudioKit.play('build');
  if (!canAfford(spec.cost)) game.mode = null;
  renderUI();
  return true;
}

function upgradeTower(t){
  if (game.phase !== 'day' || t?.building?.type !== 'tower') return false;
  const spec = TOWERS[t.building.kind];
  if (t.building.level >= 2) { toast('该防御塔已满级。', true); return false; }
  if (!spend(spec.upCost)) { toast(`资源不足（需要 ${costStr(spec.upCost)}）。`, true); return false; }
  t.building.level = 2;
  addRing(t.x + 0.5, t.y + 0.5, '#ffe074', 1.1);
  addFloat(t.x + 0.5, t.y + 0.2, `${spec.name} Lv.2`, '#ffe694');
  AudioKit.play('build');
  renderUI();
  return true;
}

function sellTower(t){
  if (game.phase !== 'day' || t?.building?.type !== 'tower') return false;
  const spec = TOWERS[t.building.kind];
  const matBack = Math.round((spec.cost.material + (t.building.level > 1 ? spec.upCost.material : 0)) * 0.7);
  const goldBack = Math.round((spec.cost.gold + (t.building.level > 1 ? spec.upCost.gold : 0)) * 0.7);
  t.building = null;
  addRes('material', matBack, t.x + 0.3, t.y + 0.3);
  addRes('gold', goldBack, t.x + 0.7, t.y + 0.6);
  AudioKit.play('coin');
  toast(`已拆除并返还 ${matBack} 材料 · ${goldBack} 金币。`);
  game.selectedTile = null;
  if (game.movingTowerFrom === idxOf(t.x, t.y)) { game.movingTowerFrom = null; game.mode = null; }
  renderUI();
  return true;
}

function startMoveTower(t){
  if (game.phase !== 'day' || t?.building?.type !== 'tower') return false;
  game.mode = 'move';
  game.movingTowerFrom = idxOf(t.x, t.y);
  toast(`已选中搬迁【${TOWERS[t.building.kind].name}】，请点击城内高亮草地新位置（免费 · 保留等级）。`);
  renderUI();
  return true;
}

function moveTowerTo(dest){
  if (game.phase !== 'day' || game.mode !== 'move' || game.movingTowerFrom == null) return false;
  const src = game.tiles[game.movingTowerFrom];
  if (!src || src.building?.type !== 'tower') {
    game.mode = null; game.movingTowerFrom = null; renderUI(); return false;
  }
  if (dest === src) {
    game.mode = null; game.movingTowerFrom = null;
    toast('已取消移动塔位。');
    renderUI();
    return false;
  }
  if (!canBuildTower(dest)) {
    if (dest?.cover && dest.cover !== 'none') toast('不能搬到树林或山石上！', true);
    else if (dest?.ground === 'road' || isGateInteriorTile(dest)) toast('道路与城门通道需保持畅通，请选择城墙内侧草地！', true);
    else toast('请选择领地内干净的空草地作为新塔位。', true);
    return false;
  }
  const tower = src.building;
  dest.building = tower;
  src.building = null;
  game.mode = null;
  game.movingTowerFrom = null;
  game.selectedTile = idxOf(dest.x, dest.y);
  addRing(dest.x + 0.5, dest.y + 0.5, '#7be8ff', 1.0);
  addFloat(dest.x + 0.5, dest.y + 0.2, `${TOWERS[tower.kind].name}已迁移`, '#9ef0ff');
  AudioKit.play('build');
  toast(`${TOWERS[tower.kind].name}（Lv.${tower.level}）已免费搬迁到新位置！`);
  renderUI();
  return true;
}

function expandTile(t){
  if (game.phase !== 'day') { toast('只能在白天扩建领地。', true); return false; }
  if (!canExpandTile(t)) { toast('请选择紧邻现有城墙的陆地格进行扩建。', true); return false; }
  if (!spend({ gold:6 })) { toast('需要 6 金币才能扩建领地。', true); return false; }
  const ratio = game.wall.broken ? 0 : (game.wall.hp / Math.max(1, game.wall.maxHp));
  t.owned = true;
  if (!t.node && t.cover !== 'none') t.cover = 'none'; // Expanding clears wild brush cleanly
  game.wall.maxHp += 25;
  if (!game.wall.broken) game.wall.hp = Math.min(game.wall.maxHp, Math.round(game.wall.maxHp * ratio) + 25);
  rebuildWallRing();
  game.stats.expansions++;
  addRing(t.x + 0.5, t.y + 0.5, '#92f582', 1.0);
  addFloat(t.x + 0.5, t.y + 0.2, '领地 +1 · 城墙扩建', '#b2f792');
  AudioKit.play('build');
  if (!canAfford({ gold:6 })) game.mode = null;
  renderUI();
  return true;
}

function recruitResident(){
  if (game.phase !== 'day') { toast('只能在白天招募居民。', true); return false; }
  if (game.residents.length >= 10) { toast('主城居民已达上限（10 人）。', true); return false; }
  if (!spend({ gold:6, food:3 })) { toast('需要 6 金币 · 3 粮食。', true); return false; }
  const r = {
    id: game.nextResId++,
    role: 'worker',
    x: CASTLE_X + 0.5 + (game.rnd() - 0.5) * 0.6,
    y: CASTLE_Y + 0.9,
    workTile: null,
    bob: game.rnd() * 6
  };
  game.residents.push(r);
  autoAssignResidents();
  addFloat(CASTLE_X + 0.5, CASTLE_Y + 0.1, '新居民报到！', '#b8f285');
  AudioKit.play('coin');
  toast('招募成功！居民会自动进驻空余工坊，也可切换为守卫。');
  renderUI();
  return true;
}

function toggleResidentRole(resId){
  if (game.phase !== 'day') return;
  const r = game.residents.find(x => x.id === resId);
  if (!r) return;
  if (r.role === 'worker') {
    if (r.workTile != null) {
      const wt = game.tiles[r.workTile];
      if (wt?.node && wt.node.workerId === r.id) wt.node.workerId = null;
      r.workTile = null;
    }
    r.role = 'guard';
    toast(`居民 ${r.id} 转为城墙守卫（夜间自动弩箭协防）。`);
  } else {
    r.role = 'worker';
    autoAssignResidents();
    toast(`居民 ${r.id} 转为工匠（自动进驻生产建筑提产）。`);
  }
  renderUI();
}

function repairWallDay(){
  if (game.phase !== 'day') return false;
  const cur = game.wall.broken ? 0 : game.wall.hp;
  const missing = game.wall.maxHp - cur;
  if (missing <= 0 && !game.wall.broken) { toast('城墙耐久已满。'); return false; }
  const need = Math.max(1, Math.ceil(missing / 60));
  const avail = game.resources.material;
  if (avail <= 0) { toast(`需要材料才能修墙（修满需 ${need} 材料）。`, true); return false; }
  const pay = Math.min(avail, need);
  spend({ material: pay });
  const heal = pay >= need ? missing : Math.min(missing, pay * 60);
  game.wall.hp = Math.min(game.wall.maxHp, cur + heal);
  game.wall.broken = false;
  addRing(CASTLE_X + 0.5, CASTLE_Y + 0.5, '#ffe074', 2.2);
  addFloat(CASTLE_X + 0.5, CASTLE_Y - 0.1, `城墙 +${heal}`, '#ffe694');
  AudioKit.play('build');
  toast(pay >= need ? `城墙已修满（花费 ${pay} 材料）。` : `已用现有 ${pay} 材料部分修补城墙 +${heal} 耐久。`);
  renderUI();
  return true;
}

function repairCastleNight(){
  if (game.phase !== 'night' || paused) return false;
  if (game.castleHp >= game.castleMax) { toast('主城耐久已满。'); return false; }
  if (!spend({ gold:6 })) { toast('需要 6 金币才能紧急修复主城。', true); return false; }
  const before = game.castleHp;
  game.castleHp = Math.min(game.castleMax, game.castleHp + 30);
  game.castleShield = 3.5;
  addRing(CASTLE_X + 0.5, CASTLE_Y + 0.5, '#7de0ff', 1.5);
  addFloat(CASTLE_X + 0.5, CASTLE_Y, `急修 +${Math.round(game.castleHp - before)} · 减伤护盾`, '#9cebff');
  AudioKit.play('skill');
  toast('主城急修完成，并获得 3.5 秒 50% 减伤护盾！');
  renderUI();
  return true;
}

/* ---------- Hero Active Skills ---------- */
function castWhirlwind(){
  if (game.phase !== 'night' || paused) return false;
  const h = game.hero;
  if (h.downTimer > 0) { toast('领主休整中，稍候回场。', true); return false; }
  if (h.qCd > 0) { toast(`旋风重斩冷却中（${h.qCd.toFixed(1)}s）。`, true); return false; }
  h.qCd = 7.0;
  const hasVamp = game.cards.has('vamp');
  const radius = hasVamp ? 2.55 : 2.15;
  addRing(h.x, h.y, '#ffbe5c', radius);
  game.effects.push({ type:'whirl', x:h.x, y:h.y, r:radius, t:0.35, max:0.35 });
  game.shake = Math.max(game.shake, 5);
  AudioKit.play('skill');

  let hits = 0;
  for (const e of game.enemies) {
    if (e.hp <= 0) continue;
    const d = dist(h, e);
    if (d <= radius + e.radius) {
      hits++;
      damageEnemy(e, 44, 'hero');
      // Strong knockback away from hero
      if (!e.boss && d > 0.01) {
        const push = 1.1;
        e.x = clamp(e.x + (e.x - h.x) / d * push, 0.3, WIDTH - 0.3);
        e.y = clamp(e.y + (e.y - h.y) / d * push, 0.3, HEIGHT - 0.3);
        e.stun = Math.max(e.stun || 0, 0.45);
      }
    }
  }
  if (hasVamp && hits > 0) {
    const heal = hits * 5;
    h.hp = Math.min(h.maxHp, h.hp + heal);
    addFloat(h.x, h.y - 0.4, `+${heal} 生命`, '#8cf27a');
  }
  return true;
}

function castDash(){
  if (game.phase !== 'night' || paused) return false;
  const h = game.hero;
  if (h.downTimer > 0) { toast('领主休整中。', true); return false; }
  if (h.eCd > 0) { toast(`战术冲刺冷却中（${h.eCd.toFixed(1)}s）。`, true); return false; }
  const swift = game.cards.has('swift');
  h.eCd = swift ? 4.0 : 6.0;
  // Determine direction from keys or goal or facing
  let dx = Number(keys.has('d') || keys.has('arrowright')) - Number(keys.has('a') || keys.has('arrowleft'));
  let dy = Number(keys.has('s') || keys.has('arrowdown')) - Number(keys.has('w') || keys.has('arrowup'));
  if (!dx && !dy && h.goal) { dx = h.goal.x - h.x; dy = h.goal.y - h.y; }
  if (!dx && !dy) { dx = h.face; dy = 0; }
  const len = Math.hypot(dx, dy) || 1;
  dx /= len; dy /= len;
  const steps = 10, totalDist = 3.2;
  const ox = h.x, oy = h.y;
  for (let i = 1; i <= steps; i++) {
    const nx = clamp(ox + dx * (totalDist * i / steps), 0.4, WIDTH - 0.4);
    const ny = clamp(oy + dy * (totalDist * i / steps), 0.4, HEIGHT - 0.4);
    const t = tileAt(Math.floor(nx), Math.floor(ny));
    if (t && t.ground !== 'water') { h.x = nx; h.y = ny; }
  }
  h.goal = null;
  h.invuln = Math.max(h.invuln, 0.45);
  h.shield = swift ? 45 : 30;
  h.shieldTimer = 3.2;
  game.effects.push({ type:'dash', x1:ox, y1:oy, x2:h.x, y2:h.y, t:0.32, max:0.32 });
  addFloat(h.x, h.y - 0.4, `冲刺护盾 +${h.shield}`, '#8ae8ff');
  AudioKit.play('dash');
  return true;
}

function castRally(){
  if (game.phase !== 'night' || paused) return false;
  const h = game.hero;
  if (h.rallyCharges <= 0) { toast('本夜号令齐射已用尽。', true); return false; }
  h.rallyCharges--;
  addRing(CASTLE_X + 0.5, CASTLE_Y + 0.5, '#ffe074', 5.2);
  game.shake = Math.max(game.shake, 5);
  AudioKit.play('skill');
  if (h.downTimer <= 0) h.hp = Math.min(h.maxHp, h.hp + 20);

  // Every tower immediately fires a 2x volley at nearest enemy within extended range
  const alive = game.enemies.filter(e => e.hp > 0);
  let shots = 0;
  for (const t of game.tiles) {
    if (t.building?.type !== 'tower') continue;
    const spec = TOWERS[t.building.kind];
    const lv = spec.levels[t.building.level - 1];
    const target = alive.slice().sort((a, b) => dist(a, {x:t.x+0.5, y:t.y+0.5}) - dist(b, {x:t.x+0.5, y:t.y+0.5}))[0];
    if (target && dist(target, {x:t.x+0.5, y:t.y+0.5}) <= lv.range + 2.4) {
      fireTowerProjectile(t, target, 1.9);
      shots++;
    }
  }
  addFloat(CASTLE_X + 0.5, CASTLE_Y - 0.3, `号令齐射！（${shots} 塔响应）`, '#ffe58f');
  renderUI();
  return true;
}

/* ---------- Night Start / Spawning / Combat / Dawn ---------- */
function startNight(early = false){
  if (game.phase !== 'day') return;
  if (early && game.dayTimer >= 10) {
    const bonus = Math.min(5, Math.floor(game.dayTimer / 15));
    if (bonus > 0) addRes('gold', bonus, CASTLE_X + 0.5, CASTLE_Y - 0.2, `提前备战 +${bonus} 金币`);
  }
  game.phase = 'night';
  game.mode = null;
  game.movingTowerFrom = null;
  game.selectedTile = null;
  game.nightClock = 0;
  game.castleShield = 0;
  game.hero.rallyCharges = 1;
  game.hero.qCd = 0;
  game.hero.eCd = 0;
  game.hero.downTimer = 0;
  game.hero.hp = Math.min(game.hero.maxHp, Math.max(game.hero.hp, Math.round(game.hero.maxHp * 0.75)));
  game.enemies = [];
  game.projectiles = [];
  game.zones = [];

  // Build wave spawn queue (tight assault packs with flank surge alerts)
  const cfg = NIGHT_CONFIG[game.day] || NIGHT_CONFIG[LAST_NIGHT];
  game.wavePlan = [];
  cfg.waves.forEach((w, wi) => {
    w.list.forEach((kind, i) => {
      game.wavePlan.push({
        at: w.at + i * 0.42,
        side: w.side,
        kind,
        spawned: false,
        surge: i === 0 && wi > 0
      });
    });
  });
  AudioKit.play('alarm');
  showBanner(
    game.day === LAST_NIGHT ? '第 5 夜 · 首领终战！' : `第 ${game.day} 夜 · 敌军来袭`,
    `来袭方向：${cfg.preview}`,
    game.day === LAST_NIGHT ? 'danger' : 'night'
  );
  renderUI();
}

function spawnPointFor(side){
  if (side === 'west')  return { x: 0.45, y: CASTLE_Y + 0.5 + (game.rnd() - 0.5) * 1.4 };
  if (side === 'east')  return { x: WIDTH - 0.45, y: CASTLE_Y + 0.5 + (game.rnd() - 0.5) * 1.4 };
  return { x: CASTLE_X + 0.5 + (game.rnd() - 0.5) * 1.6, y: 0.45 };
}

function spawnEnemy(kind, side, customPos = null){
  const spec = ENEMY_TYPES[kind];
  const pos = customPos || spawnPointFor(side);
  const hp = spec.hpBase + spec.hpPerDay * (game.day - 1);
  const e = {
    id: game.nextEnemyId++,
    kind, name: spec.name,
    x: pos.x, y: pos.y,
    hp, maxHp: hp,
    speed: spec.speed,
    wallDmg: spec.wallDmg,
    heroDmg: spec.heroDmg,
    gold: spec.gold,
    radius: spec.radius,
    ranged: !!spec.ranged,
    range: spec.range || 0,
    boss: !!spec.boss,
    cd: 0.4, slow: 0, slowTimer: 0, stun: 0, flash: 0,
    bossSkillTimer: 6.5,
    face: pos.x > CASTLE_X + 0.5 ? -1 : 1
  };
  game.enemies.push(e);
  addRing(e.x, e.y, '#e8b688', 0.5);
  return e;
}

function damageEnemy(e, rawAmount, source){
  if (!e || e.hp <= 0) return;
  let dmg = rawAmount;
  if (game.cards.has('shatter') && e.slowTimer > 0) dmg = Math.round(dmg * 1.3);
  e.hp -= dmg;
  e.flash = 0.11;
  addFloat(e.x, e.y - 0.35, `-${dmg}`, source === 'frost' ? '#9ceeff' : source === 'lava' ? '#ff9654' : '#ffe8a8');
  if (e.hp <= 0) {
    game.stats.kills++;
    let g = e.gold;
    if (game.cards.has('bounty') && (e.kind === 'ram' || e.kind === 'archer')) g *= 2;
    addRes('gold', g, e.x, e.y - 0.1, `+${g} 金`);
    addRing(e.x, e.y, '#ffbe6b', e.boss ? 1.8 : 0.55);
    AudioKit.play('coin');
  }
}

function damageWall(amount, hitX, hitY){
  if (game.wall.broken) return;
  game.wall.hp = Math.max(0, game.wall.hp - amount);
  addRing(hitX, hitY, '#d8ccb0', 0.45);
  AudioKit.play('hit');
  if (game.wall.hp <= 0) {
    game.wall.broken = true;
    game.shake = 7;
    // Wall collapse stun + emergency rally charge
    for (const e of game.enemies) {
      if (e.hp > 0 && !e.boss) e.stun = Math.max(e.stun || 0, 1.3);
    }
    if (game.hero.rallyCharges <= 0) game.hero.rallyCharges = 1;
    showBanner('城墙倒塌！', '碎石阻滞敌军 1.3 秒 · 已补发紧急号令，快回城保护主城！', 'danger');
    AudioKit.play('alarm');
    renderUI();
  }
}

function damageCastle(amount){
  const dealt = game.castleShield > 0 ? Math.max(1, Math.floor(amount * 0.5)) : amount;
  game.castleHp = Math.max(0, game.castleHp - dealt);
  game.shake = Math.max(game.shake, 4);
  addFloat(CASTLE_X + 0.5, CASTLE_Y - 0.2, `-${dealt}`, '#ff7e66');
  AudioKit.play('hit');
  if (game.castleHp <= 0) finishGame(false);
}

function damageHero(amount){
  const h = game.hero;
  if (h.downTimer > 0 || h.invuln > 0) return;
  h.invuln = 0.25; // Prevents 1-frame burst deletion
  let rem = amount;
  if (h.shield > 0) {
    const abs = Math.min(h.shield, rem);
    h.shield -= abs; rem -= abs;
  }
  if (rem > 0) {
    h.hp = Math.max(0, h.hp - rem);
    addFloat(h.x, h.y - 0.4, `-${rem}`, '#ff9482');
    AudioKit.play('hit');
  }
  if (h.hp <= 0) {
    h.downTimer = 8.0;
    toast('领主重伤撤回主城，8 秒后重返战场！', true);
  }
}

function fireTowerProjectile(t, target, dmgMul = 1){
  const spec = TOWERS[t.building.kind];
  const lv = spec.levels[t.building.level - 1];
  const ox = t.x + 0.5, oy = t.y + 0.35;
  const speed = t.building.kind === 'arrow' ? 14 : t.building.kind === 'frost' ? 10 : 8.5;
  const fireOne = (mul, delayOffset = 0) => {
    const d = Math.max(0.12, dist({x:ox, y:oy}, target) / speed);
    game.projectiles.push({
      kind: t.building.kind,
      sx: ox, sy: oy, x: ox, y: oy,
      tx: target.x, ty: target.y,
      targetId: target.id,
      t: -delayOffset, dur: d,
      dmg: Math.round(lv.dmg * mul),
      splash: lv.splash, slow: lv.slow, slowDur: lv.slowDur || 0
    });
  };
  if (t.building.kind === 'arrow' && game.cards.has('multishot')) {
    fireOne(dmgMul * 0.65, 0);
    fireOne(dmgMul * 0.65, 0.08);
  } else {
    fireOne(dmgMul, 0);
  }
  AudioKit.play(t.building.kind === 'cannon' ? 'cannon' : t.building.kind === 'frost' ? 'frost' : 'arrow');
}

function nearestWallEdge(x, y){
  let best = null, bestD = Infinity;
  for (const edge of game.wall.edges) {
    const d = Math.hypot(edge.mx - x, edge.my - y);
    if (d < bestD) { bestD = d; best = edge; }
  }
  return { edge: best, d: bestD };
}

function endNightToDawn(){
  if (game.day >= LAST_NIGHT) {
    finishGame(true);
    return;
  }
  game.phase = 'day';
  game.day++;
  game.dayTimer = DAY_DURATION;
  game.prodTickTimer = TICK_INTERVAL;
  game.enemies = [];
  game.projectiles = [];
  game.zones = [];
  game.castleShield = 0;
  game.hero.downTimer = 0;
  game.hero.hp = Math.min(game.hero.maxHp, game.hero.hp + 40);
  AudioKit.play('dawn');
  showBanner(`天亮了 · 第 ${game.day} 日`, '选择一项质变强化，准备迎接更强敌军！', 'good');
  offerCards();
  renderUI();
}

function offerCards(){
  const pool = CARDS.filter(c => !game.cards.has(c.key));
  const choices = [];
  const copy = pool.slice();
  while (choices.length < 3 && copy.length) {
    const idx = Math.floor(game.rnd() * copy.length);
    choices.push(copy.splice(idx, 1)[0]);
  }
  if (!choices.length) return;
  game.cardChoices = choices;
  showCardModal();
}

function pickCard(key){
  const card = CARDS.find(c => c.key === key);
  if (!card) return;
  game.cards.add(card.key);
  game.cardList.push(card);
  game.cardChoices = null;
  game.stats.cardsPicked++;
  if (card.key === 'bounty') addRes('gold', 12, CASTLE_X + 0.5, CASTLE_Y, '赏金号角 +12 金');
  closeModal();
  AudioKit.play('coin');
  toast(`已获得强化【${card.name}】！`);
  renderUI();
}

function finishGame(victory){
  game.phase = victory ? 'won' : 'lost';
  game.mode = null;
  game.speed = 1;
  AudioKit.play(victory ? 'victory' : 'alarm');
  showEndModal(victory);
  renderUI();
}

/* ---------- Simulation Tick ---------- */
function tick(dt){
  if (!game || !['day','night'].includes(game.phase)) return;
  if (paused || !$('modalBackdrop').hidden) return;

  updateEffects(dt);
  updateHero(dt);
  updateResidents(dt);

  // Artisan auto wall repair card works day & night
  if (game.cards.has('artisan') && !game.wall.broken && game.wall.hp < game.wall.maxHp) {
    game.artisanTimer -= dt;
    if (game.artisanTimer <= 0) {
      game.artisanTimer = TICK_INTERVAL;
      const before = game.wall.hp;
      game.wall.hp = Math.min(game.wall.maxHp, game.wall.hp + 18);
      if (game.wall.hp > before) addFloat(CASTLE_X + 0.5, CASTLE_Y - 0.5, `工匠修墙 +${game.wall.hp - before}`, '#a6f28a');
    }
  }

  if (game.phase === 'day') {
    game.dayTimer -= dt;
    game.prodTickTimer -= dt;
    if (game.prodTickTimer <= 0) {
      game.prodTickTimer = TICK_INTERVAL;
      runProductionTick();
    }
    if (game.dayTimer <= 0) {
      game.dayTimer = 0;
      startNight(false);
    }
    return;
  }

  // Night simulation
  game.nightClock += dt;
  if (game.castleShield > 0) game.castleShield = Math.max(0, game.castleShield - dt);

  // 1. Spawn scheduled enemies
  for (const w of game.wavePlan) {
    if (!w.spawned && game.nightClock >= w.at) {
      w.spawned = true;
      spawnEnemy(w.kind, w.side);
      if (w.surge) {
        const sideLabel = w.side === 'west' ? '西侧' : w.side === 'east' ? '东侧' : '北侧';
        toast(`⚠️ ${sideLabel}新一波敌军突袭逼近！`, true);
      }
    }
  }

  // 2. Towers & Wall Guards fire
  updateTowersAndGuards(dt);

  // 3. Projectiles & Zones (lava / boss slam telegraphs)
  updateProjectiles(dt);
  updateZones(dt);

  // 4. Enemies move & attack
  updateEnemies(dt);

  // Clean dead enemies
  game.enemies = game.enemies.filter(e => e.hp > 0);
  if (game.phase !== 'night') return;

  // Check night clear
  const allSpawned = game.wavePlan.every(w => w.spawned);
  if (allSpawned && game.enemies.length === 0 && game.projectiles.length === 0) {
    endNightToDawn();
  }
}

function runProductionTick(){
  let any = false;
  for (const t of game.tiles) {
    if (!t.owned || !t.node?.developed) continue;
    const meta = NODE_META[t.node.kind];
    const amt = workshopYield(t);
    if (amt > 0) {
      addRes(meta.res, amt, t.x + 0.5, t.y + 0.25);
      any = true;
    }
  }
  if (any) AudioKit.play('coin');
}

function updateHero(dt){
  const h = game.hero;
  h.atkCd = Math.max(0, h.atkCd - dt);
  h.invuln = Math.max(0, h.invuln - dt);
  h.qCd = Math.max(0, h.qCd - dt);
  h.eCd = Math.max(0, h.eCd - dt);
  if (h.shieldTimer > 0) {
    h.shieldTimer = Math.max(0, h.shieldTimer - dt);
    if (h.shieldTimer === 0) h.shield = 0;
  }
  if (h.swing) {
    h.swing.t += dt;
    if (h.swing.t >= 0.24) h.swing = null;
  }
  if (h.downTimer > 0) {
    h.downTimer = Math.max(0, h.downTimer - dt);
    if (h.downTimer === 0) {
      h.x = CASTLE_X - 0.8; h.y = CASTLE_Y + 0.5;
      h.hp = Math.round(h.maxHp * 0.65);
      h.invuln = 1.5;
      addFloat(h.x, h.y - 0.3, '领主重返战场！', '#ffe694');
    }
    return;
  }

  // Movement (WASD or click-to-move)
  const spd = 4.2 * (game.cards.has('swift') ? 1.25 : 1);
  let dx = Number(keys.has('d') || keys.has('arrowright')) - Number(keys.has('a') || keys.has('arrowleft'));
  let dy = Number(keys.has('s') || keys.has('arrowdown')) - Number(keys.has('w') || keys.has('arrowup'));
  if (dx || dy) {
    h.goal = null;
    const len = Math.hypot(dx, dy);
    dx /= len; dy /= len;
    if (dx) h.face = dx < 0 ? -1 : 1;
    moveHeroBy(dx * spd * dt, dy * spd * dt);
    h.moving = true;
  } else if (h.goal) {
    const d = dist(h, h.goal);
    if (d <= 0.14) { h.goal = null; h.moving = false; }
    else {
      const mx = (h.goal.x - h.x) / d, my = (h.goal.y - h.y) / d;
      if (Math.abs(mx) > 0.05) h.face = mx < 0 ? -1 : 1;
      moveHeroBy(mx * spd * dt, my * spd * dt);
      h.moving = true;
    }
  } else {
    h.moving = false;
  }

  // Night melee slash (auto or Space)
  if (game.phase === 'night' && h.atkCd <= 0) {
    const targets = game.enemies
      .filter(e => e.hp > 0 && dist(h, e) <= 1.65 + e.radius)
      .sort((a, b) => dist(h, a) - dist(h, b))
      .slice(0, 3);
    if (keys.has(' ') || (game.autoAttack && targets.length)) {
      h.atkCd = 0.44;
      if (targets[0]) h.face = targets[0].x < h.x ? -1 : 1;
      h.swing = { t: 0, face: h.face };
      AudioKit.play('slash');
      for (const e of targets) damageEnemy(e, 20, 'hero');
    }
  }
}

function moveHeroBy(dx, dy){
  const h = game.hero;
  const nx = clamp(h.x + dx, 0.35, WIDTH - 0.35);
  const ny = clamp(h.y + dy, 0.35, HEIGHT - 0.35);
  const tx = tileAt(Math.floor(nx), Math.floor(h.y));
  if (tx && tx.ground !== 'water') h.x = nx;
  const ty = tileAt(Math.floor(h.x), Math.floor(ny));
  if (ty && ty.ground !== 'water') h.y = ny;
}

function updateResidents(dt){
  for (let i = 0; i < game.residents.length; i++) {
    const r = game.residents[i];
    r.bob += dt * 4.5;
    let targetX = CASTLE_X + 0.5 + Math.cos(i * 1.4) * 0.65;
    let targetY = CASTLE_Y + 0.8 + Math.sin(i * 1.4) * 0.35;
    if (r.role === 'worker' && r.workTile != null) {
      const wt = game.tiles[r.workTile];
      if (wt) { targetX = wt.x + 0.5; targetY = wt.y + 0.72; }
    } else if (r.role === 'guard' && game.wall.gates.length) {
      const g = game.wall.gates[i % game.wall.gates.length];
      targetX = g.tx + 0.5; targetY = g.ty + 0.5;
    }
    const d = Math.hypot(targetX - r.x, targetY - r.y);
    if (d > 0.08) {
      const step = Math.min(d, 2.8 * dt);
      r.x += (targetX - r.x) / d * step;
      r.y += (targetY - r.y) / d * step;
    }
  }
}

function updateTowersAndGuards(dt){
  const alive = game.enemies.filter(e => e.hp > 0);
  if (!alive.length) return;
  const castleC = { x: CASTLE_X + 0.5, y: CASTLE_Y + 0.5 };

  for (const t of game.tiles) {
    if (t.building?.type !== 'tower') continue;
    const b = t.building;
    b.cd = Math.max(0, b.cd - dt);
    if (b.cd > 0) continue;
    const spec = TOWERS[b.kind];
    const lv = spec.levels[b.level - 1];
    const origin = { x: t.x + 0.5, y: t.y + 0.5 };
    const inRange = alive.filter(e => dist(origin, e) <= lv.range);
    if (!inRange.length) continue;
    // Frost tower prioritizes un-slowed enemies; Arrow tower prioritizes ranged archers; others closest to castle
    inRange.sort((a, c) => {
      if (b.kind === 'frost' && (a.slowTimer <= 0) !== (c.slowTimer <= 0)) return a.slowTimer <= 0 ? -1 : 1;
      const sa = dist(a, castleC) - (b.kind === 'arrow' && a.ranged ? 1.4 : 0);
      const sc = dist(c, castleC) - (b.kind === 'arrow' && c.ranged ? 1.4 : 0);
      return sa - sc;
    });
    b.cd = lv.cd;
    fireTowerProjectile(t, inRange[0], 1);
  }

  // Wall guards (or all residents if militia_all card picked) fire supporting bolts
  game.guardCd = Math.max(0, game.guardCd - dt);
  if (game.guardCd <= 0) {
    const shooters = game.cards.has('militia_all')
      ? game.residents
      : game.residents.filter(r => r.role === 'guard');
    if (shooters.length) {
      const target = alive.slice().sort((a, b) => dist(a, castleC) - dist(b, castleC))[0];
      if (target && dist(target, castleC) <= 4.6) {
        game.guardCd = 0.85;
        const from = shooters[0];
        game.projectiles.push({
          kind: 'arrow', sx: from.x, sy: from.y, x: from.x, y: from.y,
          tx: target.x, ty: target.y, targetId: target.id,
          t: 0, dur: 0.22, dmg: shooters.length * 8, splash: 0, slow: 0, slowDur: 0
        });
      }
    }
  }
}

function updateProjectiles(dt){
  for (const p of game.projectiles) {
    p.t += dt;
    if (p.t < 0) continue;
    if (p.enemyArrow) {
      const u = clamp(p.t / p.dur, 0, 1);
      p.x = p.sx + (p.tx - p.sx) * u;
      p.y = p.sy + (p.ty - p.sy) * u;
      if (u >= 1) {
        p.done = true;
        if (p.targetKind === 'hero') damageHero(p.dmg);
        else if (p.targetKind === 'wall') damageWall(p.dmg, p.tx, p.ty);
        else damageCastle(p.dmg);
      }
      continue;
    }
    const tgt = game.enemies.find(e => e.id === p.targetId && e.hp > 0);
    if (tgt) { p.tx = tgt.x; p.ty = tgt.y; }
    const u = clamp(p.t / p.dur, 0, 1);
    p.x = p.sx + (p.tx - p.sx) * u;
    p.y = p.sy + (p.ty - p.sy) * u;
    if (u >= 1) {
      p.done = true;
      if (p.splash > 0) {
        addRing(p.tx, p.ty, p.kind === 'frost' ? '#8ce8ff' : '#ff9848', p.splash);
        for (const e of game.enemies) {
          if (e.hp > 0 && dist(e, {x:p.tx, y:p.ty}) <= p.splash + e.radius) {
            damageEnemy(e, p.dmg, p.kind);
            if (p.slow > 0) {
              e.slow = Math.max(e.slow, p.slow);
              e.slowTimer = Math.max(e.slowTimer, p.slowDur);
            }
          }
        }
        if (p.kind === 'cannon' && game.cards.has('lava')) {
          game.zones.push({ kind:'lava', x:p.tx, y:p.ty, r:1.25, t:3.0, max:3.0, tick:0.5 });
        }
      } else if (tgt) {
        damageEnemy(tgt, p.dmg, p.kind);
      }
    }
  }
  game.projectiles = game.projectiles.filter(p => !p.done);
}

function updateZones(dt){
  for (const z of game.zones) {
    z.t -= dt;
    if (z.kind === 'lava') {
      z.tick -= dt;
      if (z.tick <= 0) {
        z.tick = 0.5;
        for (const e of game.enemies) {
          if (e.hp > 0 && dist(e, z) <= z.r + e.radius) damageEnemy(e, 6, 'lava');
        }
      }
    } else if (z.kind === 'bossSlam' && z.t <= 0) {
      z.done = true;
      addRing(z.x, z.y, '#ff5b42', z.r);
      game.shake = 7;
      AudioKit.play('cannon');
      if (game.hero.downTimer <= 0 && dist(game.hero, z) <= z.r) damageHero(28);
      if (!game.wall.broken && nearestWallEdge(z.x, z.y).d <= z.r + 0.3) damageWall(45, z.x, z.y);
      else if (game.wall.broken && dist({x:CASTLE_X+0.5, y:CASTLE_Y+0.5}, z) <= z.r + 0.5) damageCastle(24);
    }
  }
  game.zones = game.zones.filter(z => z.t > 0 && !z.done);
}

function updateEnemies(dt){
  const castleC = { x: CASTLE_X + 0.5, y: CASTLE_Y + 0.5 };
  const h = game.hero;

  for (const e of game.enemies) {
    if (e.hp <= 0) continue;
    e.cd = Math.max(0, e.cd - dt);
    e.flash = Math.max(0, e.flash - dt);
    if (e.slowTimer > 0) {
      e.slowTimer = Math.max(0, e.slowTimer - dt);
      if (e.slowTimer === 0) e.slow = 0;
    }
    if (e.stun > 0) { e.stun = Math.max(0, e.stun - dt); continue; }

    // Boss special: telegraphed slam + goblin summon every 8s
    if (e.boss) {
      e.bossSkillTimer -= dt;
      if (e.bossSkillTimer <= 0) {
        e.bossSkillTimer = 8.0;
        const slamTarget = !game.wall.broken ? nearestWallEdge(e.x, e.y).edge : castleC;
        const sx = slamTarget?.mx ?? castleC.x;
        const sy = slamTarget?.my ?? castleC.y;
        game.zones.push({ kind:'bossSlam', x:sx, y:sy, r:1.75, t:1.75, max:1.75 });
        addFloat(e.x, e.y - 0.5, '裂城重击蓄力！', '#ff8c70');
        // Summon 3 goblins
        spawnEnemy('goblin', 'west', { x: clamp(e.x - 0.4, 0.5, WIDTH-0.5), y: clamp(e.y - 0.55, 0.5, HEIGHT-0.5) });
        spawnEnemy('goblin', 'west', { x: clamp(e.x - 0.4, 0.5, WIDTH-0.5), y: clamp(e.y + 0.55, 0.5, HEIGHT-0.5) });
        spawnEnemy('goblin', 'west', { x: clamp(e.x - 0.7, 0.5, WIDTH-0.5), y: clamp(e.y, 0.5, HEIGHT-0.5) });
      }
    }

    // Melee hit hero if hero is right next to enemy
    if (h.downTimer <= 0 && dist(e, h) <= 0.85 + e.radius) {
      e.face = h.x < e.x ? -1 : 1;
      if (e.cd <= 0) {
        damageHero(e.heroDmg);
        e.cd = 0.95;
      }
      continue;
    }

    const curSpeed = e.speed * (1 - (e.slow || 0));
    const wallHit = !game.wall.broken ? nearestWallEdge(e.x, e.y) : null;

    // Ranged archer stops at range and fires arrows
    if (e.ranged) {
      const heroNear = h.downTimer <= 0 && dist(e, h) <= e.range;
      const wallNear = wallHit && wallHit.d <= e.range;
      const castleNear = game.wall.broken && dist(e, castleC) <= e.range;
      if (heroNear || wallNear || castleNear) {
        const tx = heroNear ? h.x : wallNear ? wallHit.edge.mx : castleC.x;
        const ty = heroNear ? h.y : wallNear ? wallHit.edge.my : castleC.y;
        e.face = tx < e.x ? -1 : 1;
        if (e.cd <= 0) {
          e.cd = 1.45;
          game.projectiles.push({
            enemyArrow: true, kind:'enemyArrow',
            sx:e.x, sy:e.y, x:e.x, y:e.y, tx, ty,
            t:0, dur:0.28,
            dmg: heroNear ? e.heroDmg : e.wallDmg,
            targetKind: heroNear ? 'hero' : wallNear ? 'wall' : 'castle'
          });
        }
        continue;
      }
    }

    // Attack wall if wall is intact and close
    if (wallHit && wallHit.d <= 0.52 + e.radius) {
      e.face = wallHit.edge.mx < e.x ? -1 : 1;
      if (e.cd <= 0) {
        damageWall(e.wallDmg, wallHit.edge.mx, wallHit.edge.my);
        e.cd = e.boss ? 1.05 : 0.92;
      }
      continue;
    }

    // Attack castle if wall broken and close
    if (game.wall.broken && dist(e, castleC) <= 0.95 + e.radius) {
      e.face = castleC.x < e.x ? -1 : 1;
      if (e.cd <= 0) {
        damageCastle(e.boss ? 16 : e.kind === 'ram' ? 12 : 6);
        e.cd = 1.0;
      }
      continue;
    }

    // Move toward nearest wall edge (if intact) or castle
    const goal = (!game.wall.broken && wallHit?.edge) ? { x: wallHit.edge.mx, y: wallHit.edge.my } : castleC;
    const d = Math.max(0.001, dist(e, goal));
    const mx = (goal.x - e.x) / d, my = (goal.y - e.y) / d;
    if (Math.abs(mx) > 0.05) e.face = mx < 0 ? -1 : 1;
    e.x = clamp(e.x + mx * curSpeed * dt, 0.25, WIDTH - 0.25);
    e.y = clamp(e.y + my * curSpeed * dt, 0.25, HEIGHT - 0.25);
  }

  // Gentle unit separation so enemies don't stack into 1 pixel
  for (let i = 0; i < game.enemies.length; i++) {
    const a = game.enemies[i];
    if (a.hp <= 0) continue;
    for (let j = i + 1; j < game.enemies.length; j++) {
      const b = game.enemies[j];
      if (b.hp <= 0) continue;
      const dx = b.x - a.x, dy = b.y - a.y;
      const d = Math.hypot(dx, dy);
      const minD = a.radius + b.radius;
      if (d > 0.001 && d < minD) {
        const push = (minD - d) * 0.35;
        const ux = dx / d * push, uy = dy / d * push;
        a.x -= ux; a.y -= uy; b.x += ux; b.y += uy;
      }
    }
  }
}

/* ---------- Visual Effects Helpers ---------- */
function addRing(x, y, color, r){
  game.effects.push({ type:'ring', x, y, r, t:0.42, max:0.42, color });
}
function addFloat(x, y, text, color){
  const near = game.floats.filter(f => Math.hypot(f.x - x, f.y - y) < 1.2).length;
  game.floats.push({ x, y: y - near * 0.34, text, color, t:1.05, max:1.05 });
}
function updateEffects(dt){
  for (const fx of game.effects) fx.t -= dt;
  game.effects = game.effects.filter(fx => fx.t > 0);
  for (const fl of game.floats) { fl.t -= dt; fl.y -= dt * 0.45; }
  game.floats = game.floats.filter(fl => fl.t > 0);
  if (game.shake > 0) game.shake = Math.max(0, game.shake - dt * 24);
}

/* ---------- Camera & Input ---------- */
const canvas = $('gameCanvas');
const ctx = canvas.getContext('2d');
const cam = { x: WORLD_W / 2, y: WORLD_H / 2, zoom: 1, w: 1280, h: 720 };
const keys = new Set();

function syncBarOffsets(){
  const topEl = document.querySelector('.topbar');
  const subEl = $('subbar');
  const topH = topEl ? Math.ceil(topEl.getBoundingClientRect().height) : 52;
  document.documentElement.style.setProperty('--top-h', topH + 'px');
  const subBot = subEl ? Math.ceil(subEl.getBoundingClientRect().bottom) : (topH + 46);
  document.documentElement.style.setProperty('--sub-bottom', Math.max(topH + 44, subBot) + 'px');
}

function resizeCanvas(){
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  cam.w = window.innerWidth;
  cam.h = window.innerHeight;
  canvas.width = Math.round(cam.w * dpr);
  canvas.height = Math.round(cam.h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  syncBarOffsets();
  // Fit world cleanly inside viewport
  const topSafe = cam.w <= 720 ? 180 : 112;
  const botSafe = 86;
  const availW = cam.w - 24;
  const availH = Math.max(240, cam.h - topSafe - botSafe);
  cam.zoom = clamp(Math.min(availW / WORLD_W, availH / WORLD_H), 0.58, 1.35);
  clampCam();
}
function clampCam(){
  const halfW = cam.w / (2 * cam.zoom), halfH = cam.h / (2 * cam.zoom);
  if (WORLD_W <= halfW * 2) cam.x = WORLD_W / 2;
  else cam.x = clamp(cam.x, halfW - 40, WORLD_W - halfW + 40);
  if (WORLD_H <= halfH * 2) cam.y = WORLD_H / 2;
  else cam.y = clamp(cam.y, halfH - 90, WORLD_H - halfH + 80);
}
function centerOnCastle(){
  cam.x = (CASTLE_X + 0.5) * CELL;
  cam.y = (CASTLE_Y + 0.5) * CELL;
  clampCam();
}
function screenToWorld(sx, sy){
  const wx = (sx - cam.w / 2) / cam.zoom + cam.x;
  const wy = (sy - cam.h / 2) / cam.zoom + cam.y;
  return { x: wx / CELL, y: wy / CELL };
}

/* ---------- Canvas Rendering (Bright Cartoon Medieval Style) ---------- */
function draw(){
  if (!game) return;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#183d2e';
  ctx.fillRect(0, 0, cam.w, cam.h);

  ctx.save();
  const sx = game.shake > 0 ? (Math.random() - 0.5) * game.shake * 1.4 : 0;
  const sy = game.shake > 0 ? (Math.random() - 0.5) * game.shake * 1.4 : 0;
  ctx.translate(cam.w / 2 + sx, cam.h / 2 + sy);
  ctx.scale(cam.zoom, cam.zoom);
  ctx.translate(-cam.x, -cam.y);

  // 1. Terrain tiles
  for (const t of game.tiles) drawTile(t);

  // 2. Tool placement highlight + hover preview
  if (game.phase === 'day' && game.mode) drawToolHighlights();

  // 3. Spawn direction markers (Day preview & Night active)
  drawSpawnMarkers();

  // 4. Wall Ring & Gates
  drawWallRing();

  // 5. Zones (lava & boss slam telegraph)
  drawZones();

  // 6. Foliage (wild forests/mountains), Resource Nodes & Buildings
  for (const t of game.tiles) {
    if (t.cover === 'forest') drawForest(t);
    else if (t.cover === 'mountain') drawMountain(t);
    if (t.node) drawResourceNode(t);
    if (t.building) drawBuilding(t);
  }

  // 7. Selected tower range preview
  if (game.selectedTile != null) {
    const st = game.tiles[game.selectedTile];
    if (st) {
      ctx.save();
      ctx.strokeStyle = '#ffe074';
      ctx.lineWidth = 3;
      ctx.strokeRect(st.x * CELL + 2, st.y * CELL + 2, CELL - 4, CELL - 4);
      if (st.building?.type === 'tower') {
        const lv = TOWERS[st.building.kind].levels[st.building.level - 1];
        ctx.beginPath();
        ctx.arc((st.x + 0.5) * CELL, (st.y + 0.5) * CELL, lv.range * CELL, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,224,116,0.12)'; ctx.fill();
        ctx.setLineDash([7, 6]); ctx.strokeStyle = 'rgba(255,224,116,0.85)'; ctx.lineWidth = 2; ctx.stroke();
      }
      ctx.restore();
    }
  }

  // 8. Residents, Hero, Enemies (sorted by Y for clean 2.5D overlap)
  const actors = [];
  for (const r of game.residents) actors.push({ y: r.y, draw: () => drawResident(r) });
  if (game.hero.downTimer <= 0) actors.push({ y: game.hero.y, draw: () => drawHero(game.hero) });
  for (const e of game.enemies) if (e.hp > 0) actors.push({ y: e.y, draw: () => drawEnemy(e) });
  actors.sort((a, b) => a.y - b.y);
  for (const a of actors) a.draw();

  // 9. Projectiles, Effects, Night Tint, Floating Texts
  drawProjectiles();
  drawEffects();

  if (game.phase === 'night') {
    ctx.fillStyle = 'rgba(12, 22, 54, 0.28)';
    ctx.fillRect(-100, -100, WORLD_W + 200, WORLD_H + 200);
  }
  drawFloats();

  ctx.restore();
}

function drawTile(t){
  const x = t.x * CELL, y = t.y * CELL;
  if (t.ground === 'water') {
    ctx.fillStyle = '#3b98d8';
    ctx.fillRect(x, y, CELL + 0.5, CELL + 0.5);
    ctx.fillStyle = 'rgba(186,232,255,0.28)';
    ctx.fillRect(x + 8, y + 16 + Math.sin(performance.now() / 600 + t.x) * 3, 24, 3);
    return;
  }
  const checker = (t.x + t.y) % 2 === 0;
  ctx.fillStyle = t.owned
    ? (checker ? '#86ce58' : '#7ec750')
    : (checker ? '#69b145' : '#62a93f');
  ctx.fillRect(x, y, CELL + 0.5, CELL + 0.5);

  if (t.ground === 'road') {
    ctx.fillStyle = '#dfc082';
    ctx.fillRect(x + 6, y + 6, CELL - 12, CELL - 12);
    // Connect adjacent roads
    if (tileAt(t.x - 1, t.y)?.ground === 'road') ctx.fillRect(x, y + 8, 12, CELL - 16);
    if (tileAt(t.x + 1, t.y)?.ground === 'road') ctx.fillRect(x + CELL - 12, y + 8, 12, CELL - 16);
    if (tileAt(t.x, t.y - 1)?.ground === 'road') ctx.fillRect(x + 8, y, CELL - 16, 12);
    if (tileAt(t.x, t.y + 1)?.ground === 'road') ctx.fillRect(x + 8, y + CELL - 12, CELL - 16, 12);
  } else if (t.owned && !t.node && !t.building && t.cover === 'none' && !isGateInteriorTile(t)) {
    // Subtle clean grass blade accent
    ctx.strokeStyle = 'rgba(42,102,26,0.28)';
    ctx.lineWidth = 1.5;
    const gx = x + 16 + hash2(t.x, t.y, 1) * 24;
    const gy = y + 22 + hash2(t.x, t.y, 2) * 20;
    ctx.beginPath(); ctx.moveTo(gx, gy); ctx.lineTo(gx - 3, gy - 6); ctx.moveTo(gx, gy); ctx.lineTo(gx + 3, gy - 5); ctx.stroke();
  }
}

function drawToolHighlights(){
  const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 220);
  const isTower = !!TOWERS[game.mode];
  const isMove = game.mode === 'move';
  const movingTile = isMove && game.movingTowerFrom != null ? game.tiles[game.movingTowerFrom] : null;
  for (const t of game.tiles) {
    const ok = (isTower || isMove) ? canBuildTower(t) : game.mode === 'expand' ? canExpandTile(t) : false;
    if (!ok) continue;
    const x = t.x * CELL, y = t.y * CELL;
    ctx.fillStyle = isMove
      ? `rgba(123,232,255,${0.20 + 0.12 * pulse})`
      : isTower ? `rgba(255,230,115,${0.18 + 0.12 * pulse})`
      : `rgba(130,245,155,${0.18 + 0.12 * pulse})`;
    ctx.fillRect(x + 2, y + 2, CELL - 4, CELL - 4);
    ctx.strokeStyle = isMove ? '#7be8ff' : isTower ? '#ffe070' : '#96f7a8';
    ctx.lineWidth = 2;
    ctx.strokeRect(x + 3, y + 3, CELL - 6, CELL - 6);
  }
  if (game.hoverTile != null) {
    const ht = game.tiles[game.hoverTile];
    if (ht) {
      const ok = (isTower || isMove) ? canBuildTower(ht) : game.mode === 'expand' ? canExpandTile(ht) : false;
      ctx.save();
      ctx.strokeStyle = ok ? (isMove ? '#b8f4ff' : '#fff5b5') : '#ff6b52';
      ctx.lineWidth = 3;
      ctx.strokeRect(ht.x * CELL + 1.5, ht.y * CELL + 1.5, CELL - 3, CELL - 3);
      if (ok && (isTower || (isMove && movingTile?.building?.type === 'tower'))) {
        const bSpec = isTower ? TOWERS[game.mode].levels[0] : TOWERS[movingTile.building.kind].levels[movingTile.building.level - 1];
        ctx.beginPath();
        ctx.arc((ht.x + 0.5) * CELL, (ht.y + 0.5) * CELL, bSpec.range * CELL, 0, Math.PI * 2);
        ctx.fillStyle = isMove ? 'rgba(123,232,255,0.14)' : 'rgba(255,226,118,0.12)'; ctx.fill();
        ctx.setLineDash([6, 5]); ctx.strokeStyle = isMove ? 'rgba(140,238,255,0.9)' : 'rgba(255,230,126,0.85)'; ctx.lineWidth = 2; ctx.stroke();
      } else if (!ok) {
        ctx.beginPath();
        ctx.moveTo(ht.x * CELL + 12, ht.y * CELL + 12);
        ctx.lineTo((ht.x + 1) * CELL - 12, (ht.y + 1) * CELL - 12);
        ctx.stroke();
      }
      ctx.restore();
    }
  }
}

function drawSpawnMarkers(){
  const cfg = NIGHT_CONFIG[game.day] || NIGHT_CONFIG[LAST_NIGHT];
  const pulse = 0.65 + 0.35 * Math.sin(performance.now() / 220);
  for (const side of cfg.sides) {
    const gx = side === 'west' ? 0 : side === 'east' ? WIDTH - 1 : CASTLE_X;
    const gy = side === 'north' ? 0 : CASTLE_Y;
    const cx = (gx + 0.5) * CELL, cy = (gy + 0.5) * CELL;
    ctx.save();
    ctx.fillStyle = `rgba(226,72,56,${0.25 * pulse})`;
    ctx.beginPath(); ctx.arc(cx, cy, 24, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#a83226'; ctx.strokeStyle = '#331c14'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(cx, cy, 15, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    // Arrow pointing toward castle
    const ang = Math.atan2((CASTLE_Y + 0.5) * CELL - cy, (CASTLE_X + 0.5) * CELL - cx);
    ctx.translate(cx, cy); ctx.rotate(ang);
    ctx.fillStyle = '#ffe074';
    ctx.beginPath(); ctx.moveTo(8, 0); ctx.lineTo(-5, -6); ctx.lineTo(-5, 6); ctx.closePath(); ctx.fill();
    ctx.restore();
    drawPillText(cx, cy + 22, game.phase === 'day' ? '今夜敌袭' : '来袭中', '#fff', '#8f271d');
  }
}

function drawWallRing(){
  const broken = game.wall.broken;
  ctx.save();
  for (const e of game.wall.edges) {
    const x1 = e.x1 * CELL, y1 = e.y1 * CELL, x2 = e.x2 * CELL, y2 = e.y2 * CELL;
    ctx.strokeStyle = '#352a1e';
    ctx.lineWidth = broken ? 4 : 11;
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();

    ctx.strokeStyle = broken ? '#7d6c5d' : '#ded6c4';
    ctx.lineWidth = broken ? 2 : 7.5;
    if (broken) ctx.setLineDash([5, 7]);
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.setLineDash([]);

    if (e.isGate && !broken) {
      const mx = e.mx * CELL, my = e.my * CELL;
      ctx.fillStyle = '#3c7fd8'; ctx.strokeStyle = '#2d231a'; ctx.lineWidth = 1.8;
      ctx.beginPath(); ctx.roundRect(mx - 12, my - 11, 24, 22, 5); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#6b4222';
      ctx.fillRect(mx - 6, my - 3, 12, 11);
    }
  }
  ctx.restore();
}

function drawForest(t){
  const cx = (t.x + 0.5) * CELL, cy = (t.y + 0.5) * CELL;
  for (const [ox, oy, s] of [[-11, -8, 12], [11, -6, 13], [0, 8, 15]]) {
    ctx.fillStyle = 'rgba(18,45,14,0.28)';
    ctx.beginPath(); ctx.ellipse(cx + ox, cy + oy + 8, s * 0.8, s * 0.35, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#2b7d3b'; ctx.strokeStyle = '#1f361c'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(cx + ox, cy + oy - s); ctx.lineTo(cx + ox - s * 0.85, cy + oy + 6); ctx.lineTo(cx + ox + s * 0.85, cy + oy + 6); ctx.closePath(); ctx.fill(); ctx.stroke();
  }
}

function drawMountain(t){
  const cx = (t.x + 0.5) * CELL, cy = (t.y + 0.5) * CELL;
  ctx.fillStyle = '#9aa19d'; ctx.strokeStyle = '#332e26'; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(cx - 18, cy + 14); ctx.lineTo(cx - 4, cy - 14); ctx.lineTo(cx + 10, cy + 14); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#b9c0bc';
  ctx.beginPath(); ctx.moveTo(cx + 1, cy + 16); ctx.lineTo(cx + 12, cy - 6); ctx.lineTo(cx + 22, cy + 16); ctx.closePath(); ctx.fill(); ctx.stroke();
}

function drawResourceNode(t){
  const meta = NODE_META[t.node.kind];
  const cx = (t.x + 0.5) * CELL, cy = (t.y + 0.5) * CELL;
  ctx.save();
  if (!t.node.developed) {
    // Raw node with clear glowing '+' badge
    ctx.fillStyle = 'rgba(20,40,20,0.22)';
    ctx.beginPath(); ctx.ellipse(cx, cy + 12, 18, 8, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = meta.color; ctx.strokeStyle = '#342718'; ctx.lineWidth = 1.8;
    ctx.beginPath(); ctx.roundRect(cx - 16, cy - 12, 32, 24, 7); ctx.fill(); ctx.stroke();
    ctx.font = '18px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(meta.icon, cx, cy);
    if (t.owned) {
      ctx.fillStyle = '#ffd65a'; ctx.strokeStyle = '#3a2709'; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.arc(cx + 16, cy - 14, 9, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#2d1c05'; ctx.font = '900 13px sans-serif';
      ctx.fillText('+', cx + 16, cy - 13.5);
    }
  } else {
    // Developed Workshop roof + icon + live yield badge
    ctx.fillStyle = 'rgba(18,38,16,0.28)';
    ctx.beginPath(); ctx.ellipse(cx, cy + 15, 20, 8, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#e8dec8'; ctx.strokeStyle = '#342718'; ctx.lineWidth = 1.8;
    ctx.beginPath(); ctx.roundRect(cx - 17, cy - 6, 34, 21, 4); ctx.fill(); ctx.stroke();
    // Pitched roof colored by resource type
    ctx.fillStyle = t.node.kind === 'farm' ? '#e5b343' : t.node.kind === 'wood' ? '#589e4b' : t.node.kind === 'stone' ? '#6d8794' : '#d69731';
    ctx.beginPath(); ctx.moveTo(cx - 21, cy - 4); ctx.lineTo(cx, cy - 22); ctx.lineTo(cx + 21, cy - 4); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.font = '15px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(meta.icon, cx, cy + 5);
    // Worker & Level badge
    const badge = t.node.workerId ? `👤${t.node.level > 1 ? '★' : ''}+${workshopYield(t)}` : `空 +${workshopYield(t)}`;
    drawPillText(cx, cy - 24, badge, t.node.workerId ? '#eaffd6' : '#ffd8cc', t.node.workerId ? 'rgba(20,58,42,0.92)' : 'rgba(96,38,28,0.92)');
  }
  ctx.restore();
}

function drawBuilding(t){
  const cx = (t.x + 0.5) * CELL, cy = (t.y + 0.5) * CELL;
  if (t.building.type === 'castle') {
    ctx.save();
    // Castle shadow
    ctx.fillStyle = 'rgba(18,38,18,0.32)';
    ctx.beginPath(); ctx.ellipse(cx, cy + 18, 28, 11, 0, 0, Math.PI * 2); ctx.fill();
    // Main stone keep
    ctx.fillStyle = '#eee8da'; ctx.strokeStyle = '#352a1e'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.roundRect(cx - 21, cy - 12, 42, 30, 5); ctx.fill(); ctx.stroke();
    // Side turrets + central spire with blue fairy-tale roofs
    for (const [ox, w, h, top] of [[-18, 12, 24, 16], [18, 12, 24, 16], [0, 18, 32, 22]]) {
      ctx.fillStyle = '#f5f0e4';
      ctx.fillRect(cx + ox - w / 2, cy + 16 - h, w, h);
      ctx.strokeRect(cx + ox - w / 2, cy + 16 - h, w, h);
      ctx.fillStyle = '#3c80dc';
      ctx.beginPath();
      ctx.moveTo(cx + ox - w / 2 - 3, cy + 16 - h);
      ctx.lineTo(cx + ox, cy + 16 - h - top);
      ctx.lineTo(cx + ox + w / 2 + 3, cy + 16 - h);
      ctx.closePath(); ctx.fill(); ctx.stroke();
    }
    // Red banner flag
    ctx.fillStyle = '#e64d3d';
    ctx.beginPath(); ctx.moveTo(cx, cy - 38); ctx.lineTo(cx + 12, cy - 34); ctx.lineTo(cx, cy - 30); ctx.closePath(); ctx.fill();
    // Castle door
    ctx.fillStyle = '#683f1f';
    ctx.beginPath(); ctx.roundRect(cx - 6, cy + 3, 12, 15, [6,6,0,0]); ctx.fill();
    // Shield aura if active
    if (game.castleShield > 0) {
      ctx.strokeStyle = '#7be6ff'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(cx, cy, 32, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.restore();
    return;
  }

  if (t.building.type === 'tower') {
    const b = t.building;
    const isLv2 = b.level >= 2;
    ctx.save();
    ctx.fillStyle = 'rgba(18,38,18,0.30)';
    ctx.beginPath(); ctx.ellipse(cx, cy + 16, 17, 7, 0, 0, Math.PI * 2); ctx.fill();
    // Base tower body
    ctx.fillStyle = b.kind === 'frost' ? '#d4eef7' : b.kind === 'cannon' ? '#cfc9be' : '#e6dfd0';
    ctx.strokeStyle = '#33281d'; ctx.lineWidth = 1.8;
    ctx.beginPath(); ctx.roundRect(cx - 13, cy - 10, 26, 26, 4); ctx.fill(); ctx.stroke();
    // Top roof / turret
    const roofColor = b.kind === 'arrow' ? '#3d82de' : b.kind === 'cannon' ? '#d95738' : '#35b3db';
    ctx.fillStyle = roofColor;
    ctx.beginPath();
    ctx.moveTo(cx - 17, cy - 8); ctx.lineTo(cx, cy - (isLv2 ? 28 : 23)); ctx.lineTo(cx + 17, cy - 8);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    // Tower icon
    ctx.font = '15px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(TOWERS[b.kind].icon, cx, cy + 4);
    if (isLv2) drawPillText(cx, cy - 28, '★2', '#2c1c04', '#ffd86b');
    ctx.restore();
  }
}

function drawResident(r){
  const px = r.x * CELL, py = r.y * CELL + Math.sin(r.bob) * 1.6;
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.22)';
  ctx.beginPath(); ctx.ellipse(px, py + 7, 7, 3.5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = r.role === 'guard' ? '#4a85c9' : '#d69948';
  ctx.strokeStyle = '#2b2218'; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.roundRect(px - 6, py - 4, 12, 11, 4); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#ffe0b8';
  ctx.beginPath(); ctx.arc(px, py - 8, 5.2, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.restore();
}

function drawHero(h){
  const px = h.x * CELL, py = h.y * CELL;
  ctx.save();
  if (h.invuln > 0 && Math.floor(performance.now() / 60) % 2 === 0) ctx.globalAlpha = 0.6;
  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.32)';
  ctx.beginPath(); ctx.ellipse(px, py + 11, 12, 5, 0, 0, Math.PI * 2); ctx.fill();
  // Shield ring
  if (h.shield > 0) {
    ctx.strokeStyle = '#7be6ff'; ctx.lineWidth = 2.6;
    ctx.beginPath(); ctx.arc(px, py - 2, 18, 0, Math.PI * 2); ctx.stroke();
  }
  // Cape & armor
  ctx.fillStyle = '#2d74d6'; ctx.strokeStyle = '#281f16'; ctx.lineWidth = 1.8;
  ctx.beginPath(); ctx.roundRect(px - 9, py - 6, 18, 16, 5); ctx.fill(); ctx.stroke();
  // Head + helmet + red plume
  ctx.fillStyle = '#e7edf2';
  ctx.beginPath(); ctx.arc(px, py - 12, 7.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#e64c3c';
  ctx.beginPath(); ctx.moveTo(px, py - 20); ctx.lineTo(px - h.face * 7, py - 24); ctx.lineTo(px + h.face * 2, py - 17); ctx.closePath(); ctx.fill();
  // Sword
  ctx.strokeStyle = '#fff5cf'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(px + h.face * 9, py - 1); ctx.lineTo(px + h.face * 19, py - 11); ctx.stroke();

  // Swing arc
  if (h.swing) {
    const a0 = h.swing.face > 0 ? -1.1 : Math.PI - 1.1;
    ctx.strokeStyle = 'rgba(255,240,175,0.88)'; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.arc(px, py - 2, 1.35 * CELL, a0, a0 + 2.2); ctx.stroke();
  }
  // Hero HP bar
  drawMiniBar(px, py - 27, 28, h.hp / h.maxHp, '#7ef070');
  ctx.restore();
}

function drawEnemy(e){
  const spec = ENEMY_TYPES[e.kind];
  const px = e.x * CELL, py = e.y * CELL;
  const r = e.radius * CELL;
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.28)';
  ctx.beginPath(); ctx.ellipse(px, py + r * 0.7, r * 0.9, r * 0.4, 0, 0, Math.PI * 2); ctx.fill();

  ctx.fillStyle = e.flash > 0 ? '#ffffff' : e.slowTimer > 0 ? '#7ad8ff' : spec.color;
  ctx.strokeStyle = '#291c18'; ctx.lineWidth = e.boss ? 2.6 : 1.7;
  ctx.beginPath();
  if (e.kind === 'ram' || e.boss) {
    ctx.roundRect(px - r, py - r * 0.9, r * 2, r * 1.7, 6);
  } else {
    ctx.arc(px, py - 2, r, 0, Math.PI * 2);
  }
  ctx.fill(); ctx.stroke();

  // Distinguish silhouette accent
  ctx.fillStyle = spec.accent;
  if (e.boss) {
    // Crown horns
    ctx.beginPath(); ctx.moveTo(px - 10, py - r); ctx.lineTo(px - 16, py - r - 10); ctx.lineTo(px - 3, py - r); ctx.fill();
    ctx.beginPath(); ctx.moveTo(px + 10, py - r); ctx.lineTo(px + 16, py - r - 10); ctx.lineTo(px + 3, py - r); ctx.fill();
  } else if (e.ranged) {
    ctx.strokeStyle = '#ffe5a8'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(px + e.face * 6, py - 2, 7, -1, 1); ctx.stroke();
  }

  if (e.hp < e.maxHp || e.boss) {
    drawMiniBar(px, py - r - 9, e.boss ? 44 : 24, e.hp / e.maxHp, e.boss ? '#ff6a52' : '#ff9468');
  }
  ctx.restore();
}

function drawZones(){
  for (const z of game.zones) {
    const cx = z.x * CELL, cy = z.y * CELL, rad = z.r * CELL;
    ctx.save();
    if (z.kind === 'lava') {
      ctx.fillStyle = `rgba(255,104,40,${0.32 * (z.t / z.max)})`;
      ctx.beginPath(); ctx.arc(cx, cy, rad, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(255,190,82,0.75)'; ctx.lineWidth = 2; ctx.stroke();
    } else if (z.kind === 'bossSlam') {
      const prog = 1 - z.t / z.max;
      ctx.fillStyle = 'rgba(255,66,46,0.20)';
      ctx.beginPath(); ctx.arc(cx, cy, rad, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,66,46,0.36)';
      ctx.beginPath(); ctx.arc(cx, cy, rad * prog, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#ff6e54'; ctx.lineWidth = 2.5; ctx.setLineDash([6, 4]);
      ctx.beginPath(); ctx.arc(cx, cy, rad, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.restore();
  }
}

function drawProjectiles(){
  for (const p of game.projectiles) {
    if (p.t < 0) continue;
    const u = clamp(p.t / p.dur, 0, 1);
    const arc = (p.kind === 'cannon') ? Math.sin(u * Math.PI) * 28 : Math.sin(u * Math.PI) * 8;
    const px = p.x * CELL, py = p.y * CELL - arc;
    ctx.save();
    if (p.enemyArrow) {
      ctx.fillStyle = '#ff8570'; ctx.beginPath(); ctx.arc(px, py, 3.6, 0, Math.PI * 2); ctx.fill();
    } else if (p.kind === 'cannon') {
      ctx.fillStyle = '#2a2a2e'; ctx.strokeStyle = '#ffb357'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(px, py, 6.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    } else if (p.kind === 'frost') {
      ctx.fillStyle = '#92ecff'; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.arc(px, py, 5.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    } else {
      ctx.fillStyle = '#ffe994'; ctx.beginPath(); ctx.arc(px, py, 3.8, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }
}

function drawEffects(){
  for (const fx of game.effects) {
    const a = clamp(fx.t / fx.max, 0, 1);
    ctx.save(); ctx.globalAlpha = a;
    if (fx.type === 'ring') {
      const r = fx.r * CELL * (1.15 - a * 0.55);
      ctx.strokeStyle = fx.color; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(fx.x * CELL, fx.y * CELL, Math.max(2, r), 0, Math.PI * 2); ctx.stroke();
    } else if (fx.type === 'whirl') {
      ctx.fillStyle = 'rgba(255,190,82,0.22)';
      ctx.strokeStyle = '#ffdc7d'; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.arc(fx.x * CELL, fx.y * CELL, fx.r * CELL, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    } else if (fx.type === 'dash') {
      ctx.strokeStyle = '#8ee8ff'; ctx.lineWidth = 6; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(fx.x1 * CELL, fx.y1 * CELL); ctx.lineTo(fx.x2 * CELL, fx.y2 * CELL); ctx.stroke();
    }
    ctx.restore();
  }
}

function drawFloats(){
  ctx.save();
  ctx.font = '900 13px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const f of game.floats) {
    ctx.globalAlpha = clamp(f.t / f.max * 1.4, 0, 1);
    ctx.strokeStyle = 'rgba(18,22,18,0.88)'; ctx.lineWidth = 3.2;
    ctx.strokeText(f.text, f.x * CELL, f.y * CELL);
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, f.x * CELL, f.y * CELL);
  }
  ctx.restore();
}

function drawMiniBar(cx, y, w, ratio, color){
  ctx.fillStyle = 'rgba(12,18,16,0.78)';
  ctx.fillRect(cx - w / 2 - 1, y - 1, w + 2, 6);
  ctx.fillStyle = color;
  ctx.fillRect(cx - w / 2, y, w * clamp(ratio, 0, 1), 4);
}

function drawPillText(cx, cy, text, fg, bg){
  ctx.save();
  ctx.font = '800 11px sans-serif';
  const tw = ctx.measureText(text).width;
  ctx.fillStyle = bg;
  ctx.beginPath(); ctx.roundRect(cx - tw / 2 - 6, cy - 9, tw + 12, 18, 9); ctx.fill();
  ctx.fillStyle = fg; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, cx, cy);
  ctx.restore();
}

/* ---------- UI Rendering ---------- */
let toastTimer = null;
function toast(msg, bad = false){
  const el = $('toast');
  el.textContent = msg;
  el.className = bad ? 'bad' : '';
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, 2600);
}

let bannerTimer = null;
function showBanner(title, sub, tone = ''){
  $('bannerTitle').textContent = title;
  $('bannerSub').textContent = sub;
  $('banner').className = tone;
  $('banner').hidden = false;
  clearTimeout(bannerTimer);
  bannerTimer = setTimeout(() => { $('banner').hidden = true; }, 2600);
}

function costStr(cost){
  return Object.entries(cost).map(([k, v]) => `${v} ${RES_LABELS[k]}`).join(' · ');
}
function fmtTime(sec){
  const s = Math.max(0, Math.ceil(sec));
  return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
}

function renderUI(){
  if (!game) return;
  const isDay = game.phase === 'day', isNight = game.phase === 'night';
  const rates = currentRates();

  $('phaseBox').classList.toggle('night', isNight);
  $('phaseIcon').textContent = isNight ? '🌙' : '☀️';
  $('phaseLabel').textContent = isNight ? `第 ${game.day} 夜 · 守卫中` : game.phase === 'won' ? '边境守卫成功！' : game.phase === 'lost' ? '主城失守' : `第 ${game.day} 日 · 白天`;
  $('phaseClock').textContent = isDay ? `距开战 ${fmtTime(game.dayTimer)}` : isNight ? `已守 ${fmtTime(game.nightClock)}` : '';
  $('timeFill').style.width = isDay ? `${clamp(game.dayTimer / DAY_DURATION * 100, 0, 100)}%` : '100%';

  $('valGold').textContent = game.resources.gold;
  $('valMat').textContent = game.resources.material;
  $('valFood').textContent = game.resources.food;
  $('valPop').textContent = game.residents.length;

  for (const [key, elId] of [['gold','rateGold'],['material','rateMat'],['food','rateFood']]) {
    const el = $(elId);
    el.textContent = `+${rates[key]}/5s`;
    el.classList.toggle('zero', rates[key] <= 0);
  }

  $('speedBtn').textContent = `${game.speed}×`;
  $('speedBtn').classList.toggle('active', game.speed === 2);
  $('pauseBtn').textContent = paused ? '继续' : '暂停';
  $('soundBtn').textContent = AudioKit.enabled ? '🔊' : '🔇';
  $('cardsBtn').textContent = `强化 ${game.cardList.length}`;

  const cfg = NIGHT_CONFIG[game.day] || NIGHT_CONFIG[LAST_NIGHT];
  $('wavePreview').textContent = isNight ? `第 ${game.day} 夜：${cfg.preview}` : `今夜敌袭：${cfg.preview}`;

  if (game.mode) {
    $('subHint').textContent = game.mode === 'move'
      ? '点城内任意高亮草地免费搬迁防御塔（保留等级）· 右键 / Esc 取消'
      : game.mode === 'expand'
      ? '点城墙外高亮绿格扩建领地（6 金币）· 右键 / Esc 取消'
      : `点城墙内高亮草地建造【${TOWERS[game.mode].name}】（严禁建在树/路/门上）· 右键 / Esc 取消`;
  } else if (isDay) {
    const devCount = game.tiles.filter(t => t.owned && t.node?.developed).length;
    const towerCount = game.tiles.filter(t => t.building?.type === 'tower').length;
    $('subHint').textContent = devCount === 0
      ? '① 先点城内带 + 号的资源点开发（每 5 秒自动产出）！'
      : towerCount === 0
      ? '② 选底栏「箭塔 / 炮塔 / 冰塔」，摆在今夜来袭侧的草地塔位上！'
      : '点已建防御塔可免费「移动塔位」或升级，准备好点右下「立即开战」！';
  } else if (isNight) {
    $('subHint').textContent = 'WASD 或点地走位 · Q 旋风重斩 · E 冲刺 · R 号令齐射';
  }

  // Vitals
  const pC = $('pillCastle'), pW = $('pillWall'), pH = $('pillHero'), pE = $('pillEnemies');
  pC.textContent = `🏰 主城 ${Math.ceil(game.castleHp)}/${game.castleMax}${game.castleShield > 0 ? ' 🛡️' : ''}`;
  pC.className = 'vpill' + (game.castleHp < game.castleMax * 0.4 ? ' warn' : game.castleShield > 0 ? ' shield' : '');
  pW.textContent = game.wall.broken ? '🧱 城墙 已破！' : `🧱 城墙 ${Math.ceil(game.wall.hp)}/${game.wall.maxHp}`;
  pW.className = 'vpill' + (game.wall.broken || game.wall.hp < game.wall.maxHp * 0.35 ? ' warn' : '');
  pH.textContent = game.hero.downTimer > 0
    ? `⚔️ 领主 ${Math.ceil(game.hero.downTimer)}s 回场`
    : `⚔️ 领主 ${Math.ceil(game.hero.hp)}/${game.hero.maxHp}${game.hero.shield > 0 ? ` +${Math.ceil(game.hero.shield)}` : ''}`;
  pH.className = 'vpill' + (game.hero.downTimer > 0 || game.hero.hp < game.hero.maxHp * 0.35 ? ' warn' : '');
  const remEnemies = game.enemies.filter(e => e.hp > 0).length + game.wavePlan.filter(w => !w.spawned).length;
  pE.hidden = !isNight;
  pE.textContent = `👾 剩余敌军 ${remEnemies}`;

  renderDock();
  renderInspector();
}

let dockPhase = null;
let dockBtns = {};

function makeDockBtn(id, { icon, name, sub, key, onClick }){
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'cmd-btn';
  b.dataset.cmd = id;
  if (key) {
    const k = document.createElement('span'); k.className = 'ckey'; k.textContent = key; b.append(k);
  }
  const ico = document.createElement('span'); ico.className = 'cico'; ico.textContent = icon;
  const nm = document.createElement('span'); nm.className = 'cname'; nm.textContent = name;
  const sb = document.createElement('span'); sb.className = 'csub'; sb.textContent = sub;
  const cd = document.createElement('span'); cd.className = 'cd-mask'; cd.hidden = true;
  b.append(ico, nm, sb, cd);
  b.addEventListener('click', onClick);
  return { el: b, nameEl: nm, subEl: sb, cdEl: cd };
}

function patchDockBtn(ref, { name, sub, active, gold, disabled, cd }){
  if (!ref) return;
  if (name != null && ref.nameEl.textContent !== name) ref.nameEl.textContent = name;
  if (sub != null && ref.subEl.textContent !== sub) ref.subEl.textContent = sub;
  ref.el.classList.toggle('active', !!active);
  ref.el.classList.toggle('gold', !!gold);
  ref.el.disabled = !!disabled;
  if (cd > 0) {
    ref.cdEl.hidden = false;
    ref.cdEl.textContent = `${cd.toFixed(1)}s`;
  } else if (!ref.cdEl.hidden) {
    ref.cdEl.hidden = true;
  }
}

function renderDock(){
  const dock = $('dock');
  const ph = game.phase;

  // Rebuild DOM nodes ONLY when phase switches (day <-> night <-> end) so hover & clicks NEVER drop!
  if (dockPhase !== ph) {
    dockPhase = ph;
    dockBtns = {};
    dock.replaceChildren();
    if (ph === 'day') {
      for (const kind of ['arrow','cannon','frost']) {
        const s = TOWERS[kind];
        dockBtns[kind] = makeDockBtn(kind, {
          icon: s.icon, name: s.name, sub: `${s.cost.material}材 ${s.cost.gold}金`, key: s.hotkey,
          onClick: () => {
            game.movingTowerFrom = null;
            game.mode = game.mode === kind ? null : kind;
            game.selectedTile = null;
            if (game.mode) toast(`已选中【${s.name}】，请点击城内高亮草地放置。`);
            renderUI();
          }
        });
        dock.append(dockBtns[kind].el);
      }
      dockBtns.expand = makeDockBtn('expand', {
        icon: '🚩', name: '扩建领地', sub: '6 金币', key: '4',
        onClick: () => {
          game.movingTowerFrom = null;
          game.mode = game.mode === 'expand' ? null : 'expand';
          game.selectedTile = null;
          if (game.mode) toast('已选中【扩建领地】，请点击城墙外高亮绿格。');
          renderUI();
        }
      });
      dockBtns.recruit = makeDockBtn('recruit', {
        icon: '👥', name: '招募居民', sub: '6金 3粮',
        onClick: recruitResident
      });
      dockBtns.wall = makeDockBtn('wall', {
        icon: '🧱', name: '加固城防', sub: '耐久已满',
        onClick: repairWallDay
      });
      dockBtns.start = makeDockBtn('start', {
        icon: '⚔️', name: '立即开战', sub: '提前入夜有奖',
        onClick: () => startNight(true)
      });
      dock.append(dockBtns.expand.el, dockBtns.recruit.el, dockBtns.wall.el, dockBtns.start.el);
    } else if (ph === 'night') {
      dockBtns.q = makeDockBtn('q', { icon: '🌪️', name: '旋风重斩', sub: '范围高伤击退', key: 'Q', onClick: castWhirlwind });
      dockBtns.e = makeDockBtn('e', { icon: '⚡', name: '战术冲刺', sub: '突进 + 护盾', key: 'E', onClick: castDash });
      dockBtns.r = makeDockBtn('r', { icon: '📯', name: '号令齐射', sub: '可用 1 次', key: 'R', onClick: castRally });
      dockBtns.repair = makeDockBtn('repair', { icon: '🛠️', name: '城堡急修', sub: '6金 · +30血+盾', onClick: repairCastleNight });
      dockBtns.auto = makeDockBtn('auto', {
        icon: '🤖', name: '自动普攻', sub: '已开启',
        onClick: () => { game.autoAttack = !game.autoAttack; renderUI(); }
      });
      dock.append(dockBtns.q.el, dockBtns.e.el, dockBtns.r.el, dockBtns.repair.el, dockBtns.auto.el);
    }
  }

  // Patch live state in place (zero DOM destruction!)
  if (ph === 'day') {
    for (const kind of ['arrow','cannon','frost']) {
      const s = TOWERS[kind];
      patchDockBtn(dockBtns[kind], {
        active: game.mode === kind,
        disabled: !canAfford(s.cost)
      });
    }
    patchDockBtn(dockBtns.expand, {
      active: game.mode === 'expand',
      disabled: !canAfford({ gold:6 })
    });
    patchDockBtn(dockBtns.recruit, {
      sub: game.residents.length >= 10 ? '已满 10 人' : '6金 3粮',
      disabled: game.residents.length >= 10 || !canAfford({ gold:6, food:3 })
    });
    const wallMissing = game.wall.broken ? game.wall.maxHp : (game.wall.maxHp - game.wall.hp);
    const needMat = wallMissing > 0 ? Math.max(1, Math.ceil(wallMissing / 60)) : 0;
    patchDockBtn(dockBtns.wall, {
      name: game.wall.broken ? '重建城墙' : '加固城防',
      sub: wallMissing <= 0 ? '耐久已满' : `需 ${needMat} 材 (可部分修)`,
      disabled: wallMissing <= 0 || game.resources.material <= 0
    });
    patchDockBtn(dockBtns.start, {
      sub: game.dayTimer >= 15 ? '提前入夜有奖' : `迎接第 ${game.day} 夜`,
      gold: true,
      disabled: false
    });
  } else if (ph === 'night') {
    const h = game.hero;
    patchDockBtn(dockBtns.q, { gold: h.qCd <= 0 && h.downTimer <= 0, disabled: h.downTimer > 0 || h.qCd > 0, cd: h.qCd });
    patchDockBtn(dockBtns.e, { disabled: h.downTimer > 0 || h.eCd > 0, cd: h.eCd });
    patchDockBtn(dockBtns.r, { sub: h.rallyCharges > 0 ? `可用 ${h.rallyCharges} 次` : '本夜已用', gold: h.rallyCharges > 0, disabled: h.rallyCharges <= 0 });
    patchDockBtn(dockBtns.repair, { disabled: game.castleHp >= game.castleMax || !canAfford({ gold:6 }) });
    patchDockBtn(dockBtns.auto, { sub: game.autoAttack ? '已开启' : '已关闭', active: game.autoAttack });
  }
}

let lastInspKey = '';
function inspectorKey(t){
  if (!t) return '';
  const b = t.building, n = t.node;
  const rSig = b?.type === 'castle' ? game.residents.map(r => `${r.id}:${r.role}:${r.workTile}`).join(',') : '';
  const affordSig = `${canAfford({gold:6,food:3})?1:0}${canAfford({material:2})?1:0}${canAfford({material:6,gold:4})?1:0}${canAfford({gold:6})?1:0}${game.resources.material>0?1:0}${b?.type==='tower'&&canAfford(TOWERS[b.kind].upCost)?1:0}`;
  const wallFlag = game.wall.broken ? 'B' : (game.wall.hp >= game.wall.maxHp ? 'F' : 'D');
  const castleFlag = game.castleHp >= game.castleMax ? 'F' : 'D';
  const moveFlag = game.mode === 'move' && game.movingTowerFrom === game.selectedTile ? 'M' : '';
  return [game.phase, game.selectedTile, t.owned?1:0, b?.type||'', b?.kind||'', b?.level||0, n?.kind||'', n?.developed?1:0, n?.level||0, n?.workerId||0, rSig, affordSig, wallFlag, castleFlag, moveFlag].join('|');
}

function renderInspector(){
  const box = $('inspector');
  if (game.selectedTile == null) { box.hidden = true; lastInspKey = ''; return; }
  const t = game.tiles[game.selectedTile];
  if (!t || (!t.building && !t.node)) { box.hidden = true; lastInspKey = ''; return; }
  box.hidden = false;

  // Update live HP bars in place even when structural key hasn't changed
  if (t.building?.type === 'castle') {
    const cBar = $('inspCastleBar'), cVal = $('inspCastleVal'), wBar = $('inspWallBar'), wVal = $('inspWallVal');
    if (cBar) cBar.style.width = `${game.castleHp / game.castleMax * 100}%`;
    if (cVal) cVal.textContent = `${Math.ceil(game.castleHp)}/${game.castleMax}`;
    if (wBar) wBar.style.width = `${game.wall.broken ? 0 : game.wall.hp / game.wall.maxHp * 100}%`;
    if (wVal) wVal.textContent = game.wall.broken ? '已破' : `${Math.ceil(game.wall.hp)}/${game.wall.maxHp}`;
  }

  const key = inspectorKey(t);
  if (key === lastInspKey) return;
  lastInspKey = key;

  const title = $('inspTitle'), desc = $('inspDesc'), stats = $('inspStats'), actions = $('inspActions'), list = $('inspList');
  stats.replaceChildren(); actions.replaceChildren(); list.replaceChildren(); list.hidden = true;

  const addAct = (label, sub, fn, opts = {}) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'btn' + (opts.gold ? ' gold' : '') + (opts.active ? ' active' : '') + (opts.danger ? ' danger' : '');
    b.disabled = !!opts.disabled;
    if (opts.id) b.dataset.act = opts.id;
    b.innerHTML = `<span>${label}</span>${sub ? `<small>${sub}</small>` : ''}`;
    b.addEventListener('click', fn);
    actions.append(b);
  };

  if (t.building?.type === 'castle') {
    title.textContent = '🏰 主城与居民管理';
    desc.textContent = '居民默认自动进驻空余工坊提产，也可随时切换为「守卫」在夜间协防射击。';
    stats.innerHTML = `
      <div class="bar-row"><span class="blabel">主城</span><div class="bar-track"><i id="inspCastleBar" style="width:${game.castleHp/game.castleMax*100}%"></i></div><span class="bar-val" id="inspCastleVal">${Math.ceil(game.castleHp)}/${game.castleMax}</span></div>
      <div class="bar-row"><span class="blabel">城墙</span><div class="bar-track wall"><i id="inspWallBar" style="width:${game.wall.broken?0:game.wall.hp/game.wall.maxHp*100}%"></i></div><span class="bar-val" id="inspWallVal">${game.wall.broken?'已破':`${Math.ceil(game.wall.hp)}/${game.wall.maxHp}`}</span></div>
    `;
    if (game.phase === 'day') {
      addAct('招募居民', '6 金币 · 3 粮食', recruitResident, { gold:true, disabled: game.residents.length >= 10 || !canAfford({ gold:6, food:3 }) });
      addAct('加固城防', '按现有材料修墙', repairWallDay, { disabled: !game.wall.broken && game.wall.hp >= game.wall.maxHp || game.resources.material <= 0 });
    } else if (game.phase === 'night') {
      addAct('主城急修', '6 金币 · +30血+减伤盾', repairCastleNight, { gold:true, disabled: game.castleHp >= game.castleMax || !canAfford({ gold:6 }) });
    }
    list.hidden = false;
    for (const r of game.residents) {
      const row = document.createElement('div');
      row.className = 'res-row';
      const wt = r.workTile != null ? game.tiles[r.workTile] : null;
      const jobText = r.role === 'guard' ? '城墙守卫 · 夜间协防' : wt?.node ? `工匠 · ${NODE_META[wt.node.kind].prod}作业中` : '工匠 · 待命中';
      row.innerHTML = `<div><div class="rrole">居民 #${r.id}</div><div class="rsub">${jobText}</div></div>`;
      if (game.phase === 'day') {
        const sw = document.createElement('button');
        sw.type = 'button'; sw.className = 'btn';
        sw.textContent = r.role === 'worker' ? '转守卫' : '转工匠';
        sw.addEventListener('click', () => toggleResidentRole(r.id));
        row.append(sw);
      }
      list.append(row);
    }
    return;
  }

  if (t.building?.type === 'tower') {
    const spec = TOWERS[t.building.kind];
    const lv = spec.levels[t.building.level - 1];
    const isMovingThis = game.mode === 'move' && game.movingTowerFrom === idxOf(t.x, t.y);
    title.textContent = `${spec.icon} ${spec.name} · Lv.${t.building.level}`;
    desc.textContent = `${spec.desc}（伤害 ${lv.dmg} · 射程 ${lv.range} 格 · 间隔 ${lv.cd}s · 扩墙后可免费搬迁）`;
    if (game.phase === 'day') {
      addAct(isMovingThis ? '取消移动' : '移动塔位', isMovingThis ? '点高亮草地搬迁' : '免费搬迁 · 保留等级', () => {
        if (isMovingThis) { game.mode = null; game.movingTowerFrom = null; renderUI(); }
        else startMoveTower(t);
      }, { id:'moveTower', active: isMovingThis });
      if (t.building.level < 2) {
        addAct('升级 Lv.2', costStr(spec.upCost), () => upgradeTower(t), { id:'upgradeTower', gold:true, disabled: !canAfford(spec.upCost) });
      }
      addAct('拆除返还', '返还 70% 资源', () => sellTower(t), { id:'sellTower', danger:true });
    }
    return;
  }

  if (t.node) {
    const meta = NODE_META[t.node.kind];
    title.textContent = `${meta.icon} ${t.node.developed ? `${meta.prod} Lv.${t.node.level}` : meta.name}`;
    if (!t.owned) {
      desc.textContent = `位于城墙外的野外资源。扩建领地圈入后可开发，每 5 秒产出 +${meta.worker} ${RES_LABELS[meta.res]}！`;
      if (game.phase === 'day' && canExpandTile(t)) {
        addAct('扩建到此格', '6 金币', () => expandTile(t), { gold:true, disabled: !canAfford({ gold:6 }) });
      }
    } else if (!t.node.developed) {
      desc.textContent = `开发成【${meta.prod}】后，居民将自动进驻，白天每 5 秒实时产出 +${meta.worker} ${RES_LABELS[meta.res]}。`;
      if (game.phase === 'day') {
        addAct(`开发${meta.prod}`, '2 材料', () => developNode(t), { gold:true, disabled: !canAfford({ material:2 }) });
      }
    } else {
      const hasW = !!t.node.workerId;
      desc.textContent = `当前每 5 秒实时产出 +${workshopYield(t)} ${RES_LABELS[meta.res]}（${hasW ? `居民 #${t.node.workerId} 作业中` : '暂无工人，招募居民后产量翻倍'}）。`;
      if (game.phase === 'day' && t.node.level < 2) {
        addAct('升级工坊 Lv.2', '6 材料 · 4 金币 · 产量 +1', () => upgradeWorkshop(t), { gold:true, disabled: !canAfford({ material:6, gold:4 }) });
      }
    }
    return;
  }
}
