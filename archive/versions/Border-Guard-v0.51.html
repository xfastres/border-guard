<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>边境守卫 v0.51 · 魔兽斗塔 × 领主割草</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23121e24'/%3E%3Ctext x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-size='38'%3E%E2%9A%94%EF%B8%8F%3C/text%3E%3C/svg%3E" />
<style>
  :root{
    --bg:#0d1519;
    --panel:rgba(13,22,27,0.92);
    --panel-strong:rgba(10,17,22,0.96);
    --line:rgba(182,218,214,0.22);
    --text:#eef6f4;
    --muted:#95b3ae;
    --gold:#ffd666;
    --gold-deep:#d99a26;
    --danger:#ff6b57;
    --good:#7ce896;
    --wind:#72f2b4;
    --fire:#ff7b47;
    --frost:#6ce2ff;
    --thunder:#c68cff;
    --holy:#ffe478;
    --top-h:52px;
    --sub-bottom:96px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{
    margin:0;padding:0;width:100%;height:100%;overflow:hidden;
    background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    user-select:none;
  }
  canvas{display:block;width:100vw;height:100vh;touch-action:none;cursor:crosshair}

  /* Top Bar */
  .topbar{
    position:fixed;top:0;left:0;right:0;z-index:20;
    min-height:50px;padding:6px 12px;
    background:linear-gradient(180deg,rgba(8,14,18,0.97),rgba(11,20,25,0.88));
    border-bottom:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;
    backdrop-filter:blur(8px);
  }
  .top-left,.top-mid,.top-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:6px;font-weight:900;font-size:15px;letter-spacing:.3px;white-space:nowrap}
  .brand .ver{font-size:11px;font-weight:800;color:#121b18;background:linear-gradient(135deg,#ffe27a,#f4a636);padding:2px 7px;border-radius:999px}
  .pill{
    display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;
    font-size:12px;font-weight:800;border:1px solid var(--line);background:rgba(255,255,255,0.06);
    white-space:nowrap;
  }
  .pill[hidden]{display:none}
  .pill.wave-prep{border-color:rgba(124,232,150,0.45);color:#c4ffd2;background:rgba(38,108,65,0.28)}
  .pill.wave-live{border-color:rgba(255,112,88,0.58);color:#ffd2c9;background:rgba(145,42,30,0.42)}
  .pill.wave-endless{border-color:rgba(198,140,255,0.62);color:#ebd4ff;background:rgba(98,42,145,0.42)}
  .pill.gold{
    border-color:rgba(255,214,102,0.8);color:#ffe89c;
    background:linear-gradient(180deg,rgba(158,112,26,0.55),rgba(112,78,16,0.45));
    font-size:15px;padding:5px 14px;font-weight:900;letter-spacing:.3px;
    box-shadow:0 0 12px rgba(255,214,102,0.22);
  }
  @keyframes goldBump{0%{transform:scale(1)}35%{transform:scale(1.22)}100%{transform:scale(1)}}
  .gold-bump{animation:goldBump .32s ease}
  .dock-gold{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
    min-width:66px;padding:6px 10px;border-radius:11px;flex-shrink:0;
    border:1px solid rgba(255,214,102,0.6);background:rgba(122,86,18,0.38);color:#ffe89c;
  }
  .dock-gold .lbl{font-size:9.5px;color:#e3c47c;font-weight:800;white-space:nowrap}
  .dock-gold b{font-size:18px;line-height:1.1;font-weight:900;color:#ffd666}
  .pill.warn{border-color:rgba(255,107,87,0.72);color:#ffd2ca;background:rgba(150,40,30,0.45)}
  .xp-wrap{display:flex;align-items:center;gap:6px}
  .xp-bar{width:74px;height:7px;border-radius:999px;background:rgba(255,255,255,0.12);overflow:hidden;border:1px solid rgba(108,226,255,0.3)}
  .xp-fill{height:100%;width:0%;background:linear-gradient(90deg,#4cc9ff,#a4f4ff);transition:width .15s}

  .btn{
    appearance:none;border:1px solid var(--line);background:rgba(24,40,48,0.92);color:var(--text);
    padding:6px 10px;border-radius:9px;font-size:12px;font-weight:700;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;gap:5px;
    transition:transform .08s,background .12s,border-color .12s;
  }
  .btn:hover:not(:disabled){background:rgba(39,65,78,0.96);border-color:rgba(210,240,235,0.45)}
  .btn:active:not(:disabled){transform:translateY(1px)}
  .btn:disabled{opacity:.42;cursor:not-allowed}
  .btn.active{background:rgba(235,180,60,0.26);border-color:var(--gold);color:#fff2bd}
  .btn.gold{background:linear-gradient(180deg,#ffdb72,#d89626);border-color:#fff0b3;color:#1f1606;font-weight:900}
  .btn.gold:hover:not(:disabled){background:linear-gradient(180deg,#ffe594,#e6a634)}
  .btn.purple{background:linear-gradient(180deg,#b77dff,#7940c7);border-color:#e6ccff;color:#fff;font-weight:900}
  .btn.danger{background:rgba(155,44,34,0.88);border-color:rgba(255,142,126,0.55);color:#ffe4df}

  /* Subbar: Synergies + Hero Button */
  .subbar{
    position:fixed;top:calc(var(--top-h) + 6px);left:12px;right:12px;z-index:18;
    display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;
    pointer-events:none;
  }
  .syn-strip,.sub-actions{
    pointer-events:auto;display:flex;align-items:center;gap:6px;flex-wrap:wrap;
    padding:5px 9px;border-radius:12px;background:var(--panel);border:1px solid var(--line);
    box-shadow:0 8px 22px rgba(0,0,0,0.34);backdrop-filter:blur(6px);
  }
  .syn-pill{
    display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:999px;
    font-size:11.5px;font-weight:800;border:1px solid rgba(255,255,255,0.12);
    background:rgba(255,255,255,0.04);color:#8aa6a2;cursor:help;position:relative;
  }
  .syn-pill.t1{color:#fff;border-color:var(--syn-c);background:rgba(255,255,255,0.11);box-shadow:0 0 10px rgba(255,255,255,0.12)}
  .syn-pill.t2{color:#12191d;border-color:#fff;background:var(--syn-c);box-shadow:0 0 14px var(--syn-c)}
  .hint-txt{font-size:12px;color:#cde4de;font-weight:700;padding:0 4px}

  /* Inspector (Right floating card for Tower or Hero) */
  .inspector{
    position:fixed;top:calc(var(--sub-bottom) + 8px);right:12px;z-index:22;
    width:288px;max-width:calc(100vw - 24px);max-height:calc(100vh - var(--sub-bottom) - 134px);
    overflow-y:auto;padding:12px;border-radius:14px;
    background:var(--panel-strong);border:1px solid rgba(255,220,128,0.38);
    box-shadow:0 16px 36px rgba(0,0,0,0.52);backdrop-filter:blur(10px);
  }
  .inspector[hidden]{display:none}
  .insp-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
  .insp-title{font-size:15px;font-weight:900;color:#ffeaa0;display:flex;align-items:center;gap:6px}
  .insp-sub{font-size:11.5px;color:var(--muted);line-height:1.45;margin-bottom:8px}
  .stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:5px;margin-bottom:9px}
  .stat-box{padding:5px 8px;border-radius:8px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);font-size:11.5px;color:#cfe4df}
  .stat-box b{color:#fff}
  .slot-row{display:flex;gap:6px;margin:8px 0 10px}
  .gear-slot{
    flex:1;min-height:48px;padding:5px 6px;border-radius:10px;
    border:1px dashed rgba(255,220,128,0.4);background:rgba(255,255,255,0.04);
    color:#a8c2bd;font-size:11px;font-weight:700;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;
  }
  .gear-slot.filled{border-style:solid;border-color:var(--gold);background:rgba(255,214,102,0.14);color:#fff2bd}
  .gear-slot:hover{background:rgba(255,214,102,0.22)}
  .insp-actions{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .insp-actions .btn{padding:8px 6px;flex-direction:column;gap:2px}
  .insp-actions .btn.full{grid-column:1/-1}
  .insp-actions .btn small{font-size:10px;opacity:.9;font-weight:600}
  .skill-list{display:flex;flex-direction:column;gap:5px;margin-top:8px}
  .skill-row{
    display:flex;align-items:center;justify-content:space-between;gap:6px;
    padding:5px 8px;border-radius:8px;background:rgba(255,255,255,0.05);font-size:11.5px;
  }
  .skill-row .lv{color:var(--gold);font-weight:900}

  /* Bottom Dock: Skills + Shop + Bag + Wave Start */
  .dock-wrap{
    position:fixed;left:0;right:0;bottom:8px;z-index:22;
    display:flex;justify-content:center;padding:0 10px;pointer-events:none;
  }
  .dock{
    pointer-events:auto;display:flex;align-items:stretch;gap:7px;
    max-width:100%;overflow-x:auto;padding:7px 9px;border-radius:16px;
    background:var(--panel-strong);border:1px solid var(--line);
    box-shadow:0 14px 36px rgba(0,0,0,0.58);backdrop-filter:blur(10px);
  }
  .dock-sec{display:flex;align-items:stretch;gap:6px}
  .dock-div{width:1px;background:rgba(182,218,214,0.2);margin:4px 1px;flex-shrink:0}

  .act-btn{
    position:relative;min-width:74px;padding:7px 8px;border-radius:11px;
    border:1px solid rgba(182,218,214,0.22);background:rgba(24,41,49,0.92);color:var(--text);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    cursor:pointer;flex-shrink:0;transition:background .12s,border-color .12s,transform .08s;
  }
  .act-btn:hover:not(:disabled){background:rgba(40,66,79,0.98);border-color:rgba(255,224,132,0.55)}
  .act-btn:disabled{opacity:.42;cursor:not-allowed}
  .act-btn.active{border-color:var(--gold);background:rgba(240,185,60,0.26);box-shadow:0 0 0 2px rgba(255,214,102,0.26)}
  .act-btn.primary{background:linear-gradient(180deg,#ffda70,#d99220);border-color:#fff2bd;color:#1e1505;min-width:96px}
  .act-btn.primary:hover:not(:disabled){background:linear-gradient(180deg,#ffe490,#e5a230)}
  .act-btn .k{position:absolute;top:4px;left:5px;font-size:9.5px;font-weight:900;color:#8bb0aa}
  .act-btn.primary .k{color:#5e420e}
  .act-btn .ic{font-size:20px;line-height:1}
  .act-btn .nm{font-size:11.5px;font-weight:900;white-space:nowrap}
  .act-btn .sb{font-size:10px;color:#b4d2cc;white-space:nowrap}
  .act-btn.primary .sb{color:#3c2a08;font-weight:800}
  .act-btn .cd-mask{
    position:absolute;inset:0;border-radius:10px;background:rgba(8,14,18,0.78);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;color:#fff;
  }
  .act-btn .cd-mask[hidden]{display:none}

  .shop-card{
    position:relative;min-width:96px;padding:7px 8px 6px;border-radius:11px;
    border:1px solid rgba(182,218,214,0.24);background:linear-gradient(180deg,rgba(28,46,56,0.95),rgba(17,29,36,0.95));
    color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    cursor:pointer;flex-shrink:0;transition:transform .08s,border-color .12s,box-shadow .12s;
  }
  .shop-card:hover:not(:disabled){transform:translateY(-2px);border-color:var(--elem-c,var(--gold))}
  .shop-card:disabled{opacity:.38;cursor:not-allowed}
  .shop-card.active{border-color:var(--gold);background:rgba(240,185,60,0.24);box-shadow:0 0 0 2px rgba(255,214,102,0.4)}
  .shop-card.mergeable{border-color:#ffe478;box-shadow:0 0 12px rgba(255,218,92,0.4)}
  .shop-card .elem-dot{position:absolute;top:5px;left:6px;width:8px;height:8px;border-radius:50%;background:var(--elem-c)}
  .shop-card .merge-tag{
    position:absolute;top:-7px;right:4px;padding:1px 6px;border-radius:999px;
    font-size:9.5px;font-weight:900;background:linear-gradient(90deg,#ffda66,#ff9a44);color:#1f1202;
    box-shadow:0 2px 8px rgba(0,0,0,0.45);
  }
  .shop-card .ic{font-size:21px;line-height:1}
  .shop-card .nm{font-size:11.5px;font-weight:900;white-space:nowrap}
  .shop-card .cost{font-size:10.5px;font-weight:800;color:#ffe38a}

  /* Bag strip */
  .bag-tray{display:flex;align-items:center;gap:5px;padding:2px 4px}
  .bag-empty{font-size:10.5px;color:#7d9c97;padding:0 6px;text-align:center;line-height:1.3;max-width:74px}
  .bag-item{
    position:relative;width:48px;height:56px;border-radius:10px;padding:4px 3px;
    border:1px solid rgba(198,140,255,0.45);background:rgba(66,38,96,0.45);color:#fff;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    cursor:pointer;flex-shrink:0;
  }
  .bag-item.legend{border-color:#ffbe4f;background:rgba(130,78,18,0.55);box-shadow:0 0 10px rgba(255,190,79,0.35)}
  .bag-item.active{border-color:#fff;box-shadow:0 0 0 2px var(--gold);transform:translateY(-2px)}
  .bag-item .ic{font-size:18px;line-height:1}
  .bag-item .nm{font-size:9px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:44px}
  .bag-item .star-tag{
    position:absolute;top:-7px;right:-4px;padding:0 5px;border-radius:999px;
    font-size:9px;font-weight:900;background:linear-gradient(90deg,#ffda66,#ff9a44);color:#1f1202;
    box-shadow:0 2px 6px rgba(0,0,0,0.4);
  }

  /* Toast & Banner */
  .toast{
    position:fixed;left:50%;bottom:98px;transform:translateX(-50%);z-index:28;
    padding:7px 14px;border-radius:999px;font-size:12.5px;font-weight:800;
    background:rgba(10,18,22,0.95);border:1px solid rgba(255,214,102,0.55);color:#fff3c4;
    box-shadow:0 10px 26px rgba(0,0,0,0.48);pointer-events:none;white-space:nowrap;max-width:92vw;
    overflow:hidden;text-overflow:ellipsis;
  }
  .toast.warn{border-color:rgba(255,112,92,0.75);color:#ffd4cc}
  .toast[hidden]{display:none}

  .banner{
    position:fixed;top:calc(var(--sub-bottom) + 14px);left:50%;transform:translateX(-50%);z-index:26;
    padding:10px 22px;border-radius:14px;text-align:center;pointer-events:none;
    background:rgba(14,24,30,0.94);border:1px solid rgba(255,214,102,0.55);
    box-shadow:0 14px 36px rgba(0,0,0,0.55);
  }
  .banner.boss{background:rgba(95,22,22,0.95);border-color:rgba(255,126,102,0.85)}
  .banner.good{background:rgba(20,66,44,0.95);border-color:rgba(124,232,150,0.75)}
  .banner[hidden]{display:none}
  .banner .bt{font-size:17px;font-weight:900;color:#fff6d0}
  .banner .bs{font-size:12px;color:#d6e9e4;margin-top:2px}

  /* Modal (Intro, Level-Up Skills, Chest Gear Draft, Victory/Defeat) */
  .modal-backdrop{
    position:fixed;inset:0;z-index:40;background:rgba(5,10,13,0.74);backdrop-filter:blur(5px);
    display:flex;align-items:center;justify-content:center;padding:14px;
  }
  .modal-backdrop[hidden]{display:none}
  .modal{
    width:min(700px,96vw);max-height:90vh;overflow-y:auto;
    padding:20px 22px;border-radius:18px;background:linear-gradient(180deg,#15242c,#0d171d);
    border:1px solid rgba(255,214,102,0.42);box-shadow:0 24px 60px rgba(0,0,0,0.7);
  }
  .modal h2{margin:0 0 6px;font-size:21px;font-weight:900;color:#ffe694}
  .modal .lead{margin:0 0 14px;font-size:13px;color:#c3dbd6;line-height:1.55}
  .choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0 4px}
  .choice-card{
    text-align:left;padding:13px 12px;border-radius:14px;cursor:pointer;
    border:1px solid rgba(190,224,218,0.24);background:rgba(24,42,52,0.92);color:var(--text);
    display:flex;flex-direction:column;gap:6px;transition:transform .1s,border-color .12s,background .12s;
  }
  .choice-card:hover{transform:translateY(-3px);border-color:var(--gold);background:rgba(40,68,82,0.98)}
  .choice-card.legend{border-color:#ffbe4f;background:linear-gradient(180deg,rgba(112,68,18,0.55),rgba(34,26,18,0.92))}
  .choice-card .tag{
    align-self:flex-start;padding:2px 7px;border-radius:999px;font-size:10px;font-weight:900;
    background:rgba(255,214,102,0.18);color:#ffe58f;
  }
  .choice-card .ci{font-size:28px;line-height:1}
  .choice-card .cn{font-size:14.5px;font-weight:900;color:#fff}
  .choice-card .cd{font-size:12px;color:#c6ded9;line-height:1.45}
  .modal-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;flex-wrap:wrap}
  .intro-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin:10px 0}
  .intro-box{padding:10px 12px;border-radius:12px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.09)}
  .intro-box h4{margin:0 0 4px;font-size:13px;color:#ffe38c}
  .intro-box p{margin:0;font-size:12px;color:#c4ddd8;line-height:1.45}

  @media (max-width:760px){
    .choices,.intro-grid{grid-template-columns:1fr}
    .topbar{padding:5px 8px;gap:5px}
    .brand{font-size:13.5px}
    .pill{padding:3px 7px;font-size:11px}
    .dock{padding:5px 6px;gap:5px}
    .shop-card{min-width:80px;padding:6px 6px}
    .act-btn{min-width:64px;padding:6px 6px}
    .inspector{left:10px;right:10px;width:auto}
  }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>

<header class="topbar" id="topbar">
  <div class="top-left">
    <div class="brand">⚔️ 边境守卫 <span class="ver">v0.51 斗塔割草</span></div>
    <span class="pill wave-prep" id="wavePill">第 1 / 15 波 · 备战</span>
    <span class="pill gold" id="goldPill">💰 45</span>
    <span class="pill" id="castlePill">🏰 圣堡 200/200</span>
    <span class="pill" id="heroPill">
      <span id="heroLvTxt">⚔️ 领主 Lv.1</span>
      <span class="xp-bar"><span class="xp-fill" id="xpFill"></span></span>
    </span>
    <span class="pill" id="enemyPill" hidden>👾 0</span>
  </div>
  <div class="top-right">
    <button class="btn" id="speedBtn" type="button">1×</button>
    <button class="btn" id="pauseBtn" type="button">暂停</button>
    <button class="btn" id="soundBtn" type="button" title="音效开关">🔊</button>
    <button class="btn" id="helpBtn" type="button">玩法</button>
    <button class="btn" id="resetBtn" type="button">重开</button>
  </div>
</header>

<section class="subbar" id="subbar">
  <div class="syn-strip" id="synStrip"></div>
  <div class="sub-actions">
    <span class="hint-txt" id="subHint">选底栏塔牌点击发光塔基建造，点「开始第 1 波」冲进怪海割草！</span>
    <button class="btn" id="heroPanelBtn" type="button">👑 领主装备 (0/3)</button>
    <button class="btn" id="autoWaveBtn" type="button">自动下波：关</button>
  </div>
</section>

<aside class="inspector" id="inspector" hidden>
  <div class="insp-head">
    <div class="insp-title" id="inspTitle">防御塔</div>
    <button class="btn" id="inspClose" type="button" style="padding:3px 8px">关闭</button>
  </div>
  <div class="insp-sub" id="inspSub"></div>
  <div class="stat-grid" id="inspStats"></div>
  <div style="font-size:11px;font-weight:800;color:#ffe28a">构装槽（点击空槽装入，点击已装卸回背包）</div>
  <div class="slot-row" id="inspSlots"></div>
  <div class="insp-actions" id="inspActions"></div>
  <div class="skill-list" id="inspSkills"></div>
</aside>

<div class="toast" id="toast" hidden></div>
<div class="banner" id="banner" hidden>
  <div class="bt" id="bannerTitle"></div>
  <div class="bs" id="bannerSub"></div>
</div>

<div class="dock-wrap">
  <div class="dock" id="dock">
    <div class="dock-sec" id="heroSkillSec">

/* Gear stacking: identical gear auto-fuses up to 3★. Encoded as 'key' (1★) / 'key#2' / 'key#3'. */
const GEAR_MAX_STAR = 3;
const GEAR_STAR_MULT = [1, 1.6, 2.3]; // index = star-1
function gearBase(k){ return String(k).split('#')[0]; }
function gearStar(k){ const s = parseInt(String(k).split('#')[1] || '1', 10); return Math.min(GEAR_MAX_STAR, Math.max(1, s || 1)); }
function gearLabel(k){ const s = gearStar(k); return `${GEARS[gearBase(k)].name}${s > 1 ? ` ${s}★` : ''}`; }
function findGearStackTarget(baseKey){
  // Priority: hero > towers > bag; first copy below max star gets upgraded.
  const lists = [game.hero.gear, ...game.towers.map(t => t.gear), game.bag];
  for (const list of lists){
    for (let i = 0; i < list.length; i++){
      if (gearBase(list[i]) === baseKey && gearStar(list[i]) < GEAR_MAX_STAR) return { list, idx: i, star: gearStar(list[i]) };
    }
  }
  return null;
}
function ownedGearStar(baseKey){
  let best = 0;
  const scan = list => { for (const k of list) if (gearBase(k) === baseKey) best = Math.max(best, gearStar(k)); };
  scan(game.hero.gear); for (const t of game.towers) scan(t.gear); scan(game.bag);
  return best;
}

const AudioKit = {
  ctx: null, enabled: true, last: {},
  unlock(){
    if (!this.enabled) return;
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) this.ctx = new AC();
    }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(()=>{});
  },
  play(kind, pitchMul = 1){
    if (!this.enabled || !this.ctx) return;
    const now = performance.now();
    const minGap = { hit:45, xp:32, coin:50, arrow:55, fire:85, frost:80, thunder:75, holy:85, slash:65, crit:60, merge:120, chest:120, level:150, boss:350 }[kind] || 60;
    if (now - (this.last[kind] || 0) < minGap) return;
    this.last[kind] = now;
    const t = this.ctx.currentTime;
    const tone = (freq, dur, type='triangle', vol=0.06, endFreq=null, delay=0) => {
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq * pitchMul, t + delay);
      if (endFreq) o.frequency.exponentialRampToValueAtTime(Math.max(40, endFreq * pitchMul), t + delay + dur);
      g.gain.setValueAtTime(0.0001, t + delay);
      g.gain.linearRampToValueAtTime(vol, t + delay + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + delay + dur);
      o.connect(g); g.connect(this.ctx.destination);
      o.start(t + delay); o.stop(t + delay + dur + 0.02);
    };
    if (kind === 'xp') tone(680, 0.08, 'sine', 0.05, 980);
    else if (kind === 'coin') { tone(880, 0.07, 'sine', 0.05); tone(1320, 0.09, 'sine', 0.045, null, 0.045); }
    else if (kind === 'arrow') tone(560, 0.06, 'triangle', 0.04, 240);
    else if (kind === 'fire') tone(170, 0.17, 'sawtooth', 0.06, 52);
    else if (kind === 'frost') tone(920, 0.12, 'sine', 0.045, 520);
    else if (kind === 'thunder') tone(420, 0.11, 'sawtooth', 0.05, 1100);
    else if (kind === 'holy') tone(760, 0.13, 'sine', 0.045, 1180);
    else if (kind === 'slash') tone(320, 0.08, 'sawtooth', 0.05, 130);
    else if (kind === 'crit') tone(520, 0.09, 'square', 0.05, 860);
    else if (kind === 'merge') { tone(523, 0.11, 'triangle', 0.08); tone(659, 0.11, 'triangle', 0.08, null, 0.07); tone(1046, 0.24, 'triangle', 0.09, null, 0.14); }
    else if (kind === 'chest') { tone(660, 0.1, 'sine', 0.07); tone(990, 0.18, 'sine', 0.08, null, 0.08); }
    else if (kind === 'level') { [523,659,784,1046].forEach((f,i)=>tone(f,0.13,'triangle',0.075,null,i*0.06)); }
    else if (kind === 'boss') { tone(130, 0.4, 'sawtooth', 0.09, 85); tone(196, 0.42, 'sawtooth', 0.08, 120, 0.16); }
    else if (kind === 'hit') tone(190, 0.07, 'square', 0.04, 95);
  }
};

function mulberry32(seed){
  let a = seed >>> 0;
  return () => {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function dist(a, b){ return Math.hypot(a.x - b.x, a.y - b.y); }
function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }

/* ==================== SYNERGY & STAT COMPUTATION ==================== */
function getSynergyCounts(){
  const c = { wind:0, fire:0, frost:0, thunder:0, holy:0 };
  for (const t of game.towers) {
    const w = t.star === 3 ? 4 : t.star === 2 ? 2 : 1;
    c[t.elem] += w;
  }
  return c;
}
function getSynergyTier(elem){
  const n = getSynergyCounts()[elem] || 0;
  return n >= 4 ? 2 : n >= 2 ? 1 : 0;
}

function aggregateGear(gearList){
  const m = { dmgPct:0, aspd:0, crit:0, critDmg:0, rangePct:0, extraShot:0, splashBonus:0, slowOnHit:0, chainProc:0, lifesteal:0, bonusGold:0 };
  for (const k of gearList) {
    const gm = GEARS[gearBase(k)]?.mod;
    if (!gm) continue;
    const star = gearStar(k);
    const mult = GEAR_STAR_MULT[star - 1];
    for (const [key, val] of Object.entries(gm)) {
      const scaled = key === 'extraShot' ? val * star : val * mult;
      if (key === 'slowOnHit') m.slowOnHit = Math.max(m.slowOnHit, Math.min(0.65, scaled));
      else if (key === 'chainProc') m[key] = Math.min(0.8, m[key] + scaled);
      else m[key] += scaled;
    }
  }
  m.extraShot = Math.round(m.extraShot);
  m.bonusGold = Math.round(m.bonusGold);
  return m;
}

function getTowerStats(t){
  const spec = TOWERS[t.kind];
  const base = spec.stars[t.star - 1];
  const gm = aggregateGear(t.gear);
  const syn = getSynergyCounts();

  // Holy aura from other holy towers
  let auraAspd = 0;
  for (const o of game.towers) {
    if (o.id === t.id || o.kind !== 'holy') continue;
    const os = TOWERS.holy.stars[o.star - 1];
    if (Math.hypot(o.x - t.x, o.y - t.y) <= os.auraRange) {
      auraAspd = Math.max(auraAspd, os.auraAspd);
    }
  }
  const windAspd = (t.elem === 'wind' && syn.wind >= 2) ? 0.25 : 0;
  const ultAspd = game.hero.ultTimer > 0 ? 0.80 : 0;
  const totalAspd = 1 + gm.aspd + auraAspd + windAspd + ultAspd;

  const fireMult = (t.elem === 'fire' && syn.fire >= 2) ? 1.35 : 1;
  const dmg = Math.round(base.dmg * (1 + gm.dmgPct) * fireMult);
  const cd = Math.max(0.11, base.cd / totalAspd);
  const range = Number((base.range * (1 + gm.rangePct)).toFixed(2));
  const crit = Math.min(0.95, 0.08 + gm.crit + (syn.holy >= 2 ? 0.15 : 0) + (game.hero.ultTimer > 0 ? 0.35 : 0) + (t.kind === 'thunder' && t.star === 3 ? 0.50 : 0));
  const critDmg = (syn.holy >= 4 ? 2.2 : 1.65) + gm.critDmg;
  const shots = (base.shots || 1) + gm.extraShot;
  const chains = (base.chains || 0) + (syn.thunder >= 2 ? 2 : 0) + gm.extraShot;
  const splash = (base.splash || 0) + gm.splashBonus;

  return { dmg, cd, range, crit, critDmg, shots, chains, splash, pierce: base.pierce || 0, beams: (base.beams || 1) + gm.extraShot, slow: Math.max(base.slow || 0, gm.slowOnHit), slowDur: base.slowDur || (gm.slowOnHit ? 2.2 : 0), burn: base.burn || 0, gm };
}

function getHeroStats(){
  const h = game.hero;
  const gm = aggregateGear(h.gear);
  const syn = getSynergyCounts();
  const berkLv = h.skills.berserk || 0;
  const aspd = 1 + gm.aspd + berkLv * 0.18 + (syn.wind >= 2 ? 0.25 : 0) + (h.ultTimer > 0 ? 0.80 : 0);
  const dmgMult = (1 + gm.dmgPct + (h.lv - 1) * 0.10);
  const crit = Math.min(0.95, 0.12 + gm.crit + berkLv * 0.08 + (syn.holy >= 2 ? 0.15 : 0) + (h.ultTimer > 0 ? 0.35 : 0));
  const critDmg = (syn.holy >= 4 ? 2.2 : 1.75) + gm.critDmg;
  const magnet = 2.6 + berkLv * 0.85 + gm.rangePct * 2.0;
  const rangeMult = 1 + gm.rangePct;
  const lifesteal = gm.lifesteal + berkLv * 2;
  return { aspd, dmgMult, crit, critDmg, magnet, rangeMult, lifesteal, gm };
}

/* ==================== SHOP, BUILD, MERGE, MOVE, EQUIP ==================== */
function rollShop(free = false){
  if (!free) {
    if (game.gold < game.rerollCost) { toast(`需要 ${game.rerollCost} 金币才能刷新商店！`, true); return false; }
    game.gold -= game.rerollCost;
    game.rerollCost += 2; // Escalating sink: resets to 5 on every wave clear
    AudioKit.play('coin', 0.9);
  }
  game.shop = [];
  for (let i = 0; i < 4; i++) {
    const kind = TOWER_KEYS[Math.floor(game.rnd() * TOWER_KEYS.length)];
    const spec = TOWERS[kind];
    // 18% chance of discounted card on waves 2+
    const disc = (game.wave >= 2 && game.rnd() < 0.18) ? 3 : 0;
    game.shop.push({ uid: Math.floor(game.rnd() * 1e9), kind, cost: Math.max(10, spec.cost - disc), bought: false, disc });
  }
  if (game.mode?.type === 'buy') game.mode = null;
  renderAllUI();
  return true;
}

function towerAt(x, y){ return game.towers.find(t => t.x === x && t.y === y) || null; }

function findMergePartner(tower){
  if (tower.star >= 3) return null;
  return game.towers.find(o => o.id !== tower.id && o.kind === tower.kind && o.star === tower.star) || null;
}

function performMerge(keepTower, consumedTower){
  // Return extra gears to bag if exceeding 2 slots
  const combinedGear = [...keepTower.gear, ...consumedTower.gear];
  keepTower.gear = combinedGear.slice(0, 2);
  for (let i = 2; i < combinedGear.length; i++) game.bag.push(combinedGear[i]);
  keepTower.star++;
  keepTower.dmgDealt += consumedTower.dmgDealt;
  keepTower.kills += consumedTower.kills;
  game.towers = game.towers.filter(o => o.id !== consumedTower.id);
  game.stats.merges++;
  game.shake = Math.max(game.shake, 7);
  const col = ELEMENTS[keepTower.elem].color;
  addRing(keepTower.x + 0.5, keepTower.y + 0.5, '#ffe878', 2.2);
  addRing(keepTower.x + 0.5, keepTower.y + 0.5, col, 1.5);
  addFloat(keepTower.x + 0.5, keepTower.y, `★ 升至 ${keepTower.star}★ ${TOWERS[keepTower.kind].name}！`, '#ffe878', true);
  AudioKit.play('merge');
  toast(`合成成功！【${TOWERS[keepTower.kind].name}】晋升 ${keepTower.star}★ 形态质变！`);
  game.inspTarget = { type:'tower', id: keepTower.id };
  renderAllUI();
  return true;
}

function buyAndPlaceTower(shopIdx, x, y){
  const item = game.shop[shopIdx];
  if (!item || item.bought) return false;
  if (!PEDESTAL_KEY.has(`${x},${y}`)) { toast('请点击圣堡内发光的符文塔基！', true); return false; }
  if (game.gold < item.cost) { toast(`需要 ${item.cost} 金币！`, true); return false; }

  const existing = towerAt(x, y);
  if (existing) {
    // Instant buy-and-merge if clicking identical 1★ tower!
    if (existing.kind === item.kind && existing.star === 1) {
      game.gold -= item.cost;
      item.bought = true;
      game.mode = null;
      const phantom = { id: -1, gear: [], dmgDealt: 0, kills: 0 };
      performMerge(existing, phantom);
      return true;
    }
    toast('该塔基已有其他防御塔（点击同名 1★ 塔可直接秒合 2★）。', true);
    return false;
  }

  game.gold -= item.cost;
  item.bought = true;
  const spec = TOWERS[item.kind];
  const t = {
    id: game.nextTowerId++,
    kind: item.kind, elem: spec.elem,
    x, y, star: 1, cd: 0,
    gear: [], dmgDealt: 0, kills: 0
  };
  game.towers.push(t);
  game.mode = null;
  game.inspTarget = { type:'tower', id: t.id };
  addRing(x + 0.5, y + 0.5, ELEMENTS[spec.elem].color, 1.1);
  addFloat(x + 0.5, y + 0.1, `${spec.name} 1★`, ELEMENTS[spec.elem].color);
  AudioKit.play('coin', 1.15);
  renderAllUI();
  return true;
}

function mergeTowerAction(towerId){
  const t = game.towers.find(o => o.id === towerId);
  if (!t) return false;
  const partner = findMergePartner(t);
  if (!partner) { toast('场上需要另一座同名同星级防御塔才能合星。', true); return false; }
  return performMerge(t, partner);
}

function moveTowerTo(towerId, x, y){
  const t = game.towers.find(o => o.id === towerId);
  if (!t) { game.mode = null; renderAllUI(); return false; }
  if (!PEDESTAL_KEY.has(`${x},${y}`)) { toast('请选择圣堡内发光的符文塔基。', true); return false; }
  const other = towerAt(x, y);
  if (other && other.id === t.id) { game.mode = null; renderAllUI(); return false; }
  if (other) {
    // Swap or merge!
    if (other.kind === t.kind && other.star === t.star && t.star < 3) {
      game.mode = null;
      return performMerge(other, t);
    }
    const ox = other.x, oy = other.y;
    other.x = t.x; other.y = t.y;
    t.x = ox; t.y = oy;
    toast('已互换两座防御塔位置！');
  } else {
    t.x = x; t.y = y;
    toast('已免费移动防御塔位置！');
  }
  game.mode = null;
  game.inspTarget = { type:'tower', id: t.id };
  addRing(t.x + 0.5, t.y + 0.5, '#7be8ff', 1.0);
  AudioKit.play('coin', 1.2);
  renderAllUI();
  return true;
}

function sellTower(towerId){
  const t = game.towers.find(o => o.id === towerId);
  if (!t) return false;
  // Return gears safely to bag
  for (const gk of t.gear) game.bag.push(gk);
  const mult = t.star === 3 ? 4 : t.star === 2 ? 2 : 1;
  const refund = Math.round(TOWERS[t.kind].cost * mult * 0.8);
  game.gold += refund;
  game.towers = game.towers.filter(o => o.id !== towerId);
  game.inspTarget = null;
  game.mode = null;
  addFloat(t.x + 0.5, t.y, `+${refund} 金`, '#ffe27a');
  AudioKit.play('coin');
  toast(`已出售【${TOWERS[t.kind].name}】返还 ${refund} 金币，装备已退回背包。`);
  renderAllUI();
  return true;
}

function equipGearFromBag(bagIdx, target){
  if (bagIdx < 0 || bagIdx >= game.bag.length) return false;
  const gearKey = game.bag[bagIdx];
  if (target.type === 'hero') {
    if (game.hero.gear.length >= 3) { toast('领主装备槽已满（3/3），请先点击已有装备卸下。', true); return false; }
    game.bag.splice(bagIdx, 1);
    game.hero.gear.push(gearKey);
    game.mode = null;
    addRing(game.hero.x, game.hero.y, '#ffe478', 1.4);
    addFloat(game.hero.x, game.hero.y - 0.5, `装备 ${gearLabel(gearKey)}`, '#ffe88a', true);
    AudioKit.play('chest');
    toast(`领主已装备【${gearLabel(gearKey)}】！`);
    renderAllUI();
    return true;
  } else if (target.type === 'tower') {
    const t = game.towers.find(o => o.id === target.id);
    if (!t) return false;
    if (t.gear.length >= 2) { toast('该防御塔构装槽已满（2/2），请先卸下旧装备。', true); return false; }
    game.bag.splice(bagIdx, 1);
    t.gear.push(gearKey);
    game.mode = null;
    game.inspTarget = { type:'tower', id: t.id };
    addRing(t.x + 0.5, t.y + 0.5, '#ffe478', 1.3);
    addFloat(t.x + 0.5, t.y, `装入 ${gearLabel(gearKey)}`, '#ffe88a', true);
    AudioKit.play('chest');
    toast(`【${TOWERS[t.kind].name}】已装入【${gearLabel(gearKey)}】！`);
    renderAllUI();
    return true;
  }
  return false;
}

function unequipGear(target, slotIdx){
  const list = target.type === 'hero' ? game.hero.gear : game.towers.find(o => o.id === target.id)?.gear;
  if (!list || slotIdx < 0 || slotIdx >= list.length) return false;
  const [gk] = list.splice(slotIdx, 1);
  game.bag.push(gk);
  AudioKit.play('coin', 0.85);
  toast(`已卸下【${gearLabel(gk)}】放回背包。`);
  renderAllUI();
  return true;
}

/* ==================== WAVE GENERATION & COMBAT ==================== */
function buildWaveQueue(w){
  const q = [];
  const scale = Math.pow(1.26, w - 1);
  const sides = w <= 2 ? ['west','east'] : w <= 5 ? ['west','east','north'] : ['west','east','north','south'];
  const totalMobs = Math.min(145, Math.round(24 + w * 7.5));
  const duration = Math.min(26, 13 + w * 0.85);

  // Regular monster horde in exciting bursts
  for (let i = 0; i < totalMobs; i++) {
    const t = (i / totalMobs) * duration + (game.rnd() * 0.35);
    const side = sides[Math.floor(game.rnd() * sides.length)];
    const r = game.rnd();
    let kind = 'slime';
    if (w >= 2 && r > 0.72) kind = 'wolf';
    if (w >= 3 && r > 0.84) kind = 'mage';
    if (w >= 4 && r > 0.90) kind = 'brute';
    if (w >= 8 && r > 0.55 && r <= 0.72) kind = 'wolf';
    q.push({ at: 0.4 + t, side, kind, scale, spawned: false });
  }

  // Guaranteed Elite(s) from Wave 2 onward -> Drops Gear Chest!
  if (w >= 2) {
    const eliteCount = w >= 11 ? 3 : w >= 6 ? 2 : 1;
    for (let e = 0; e < eliteCount; e++) {
      q.push({
        at: 4.5 + e * 6.5,
        side: sides[e % sides.length],
        kind: 'elite', scale: Math.pow(1.24, w - 2), spawned: false
      });
    }
  }

  // Major Bosses on Wave 5, 10, 15, and every 5th Endless Wave
  if (w % 5 === 0) {
    const bossKind = w === 5 ? 'boss1' : w === 10 ? 'boss2' : 'boss3';
    const bScale = w > 15 ? Math.pow(1.28, (w - 15) / 2) : 1;
    q.push({ at: 2.2, side: 'west', kind: bossKind, scale: bScale, spawned: false });
  }

  q.sort((a, b) => a.at - b.at);
  return q;
}

function startWave(){
  if (game.phase !== 'prep') return false;
  AudioKit.unlock();
  game.phase = 'wave';
  game.waveClock = 0;
  game.eliteChestDropped = false;
  game.waveQueue = buildWaveQueue(game.wave);
  game.autoWaveTimer = 0;
  const isBoss = game.wave % 5 === 0;
  AudioKit.play(isBoss ? 'boss' : 'merge', isBoss ? 1 : 0.85);
  showBanner(
    isBoss ? `⚠️ 第 ${game.wave} 波 · 首领降临！` : (game.endless ? `无尽第 ${game.wave} 波 · 怪海来袭` : `第 ${game.wave} / ${MAIN_WAVES} 波 · 怪海来袭`),
    isBoss ? '击杀首领必掉传说/史诗构装宝箱！' : '冲进怪海割草吃经验，击败紫名精英爆神装！',
    isBoss ? 'boss' : ''
  );
  renderAllUI();
  return true;
}

function spawnPos(side){
  const pad = 0.55;
  if (side === 'west')  return { x: pad, y: 1.5 + game.rnd() * (H - 3) };
  if (side === 'east')  return { x: W - pad, y: 1.5 + game.rnd() * (H - 3) };
  if (side === 'north') return { x: 2 + game.rnd() * (W - 4), y: pad };
  return { x: 2 + game.rnd() * (W - 4), y: H - pad };
}

function spawnEnemy(kind, side, scale = 1, customPos = null){
  const sp = ENEMY_SPECS[kind];
  const pos = customPos || spawnPos(side);
  const hp = Math.round(sp.hp * scale);
  const e = {
    id: game.nextEnemyId++,
    kind, name: sp.name,
    x: pos.x, y: pos.y,
    hp, maxHp: hp,
    spd: sp.spd, dmg: Math.round(sp.dmg * (1 + (game.wave - 1) * 0.08)),
    xp: sp.xp, gold: sp.gold, r: sp.r,
    col: sp.col, rim: sp.rim,
    ranged: !!sp.ranged, range: sp.range || 0,
    elite: !!sp.elite, boss: !!sp.boss,
    cd: 0.4, slow: 0, slowT: 0, freezeT: 0, burnDps: 0, burnT: 0,
    flash: 0, bossTimer: 5.5
  };
  game.enemies.push(e);
  return e;
}

function dealDamage(e, rawDmg, opts = {}){
  if (!e || e.hp <= 0) return 0;
  const syn = getSynergyCounts();
  let dmg = rawDmg;
  if (syn.frost >= 2 && (e.slowT > 0 || e.freezeT > 0)) dmg *= 1.25;

  const isCrit = opts.critChance ? game.rnd() < opts.critChance : false;
  if (isCrit) dmg *= (opts.critDmg || 1.7);
  dmg = Math.max(1, Math.round(dmg));

  e.hp -= dmg;
  e.flash = 0.10;
  game.stats.dmgTotal += dmg;
  if (opts.tower) opts.tower.dmgDealt += dmg;

  // Floating combat numbers (limit spam on tiny non-crits while keeping punchy crits)
  if (isCrit || dmg >= 28 || game.floats.length < 40) {
    addFloat(e.x + (game.rnd()-0.5)*0.3, e.y - 0.3, isCrit ? `${dmg}!` : `${dmg}`, isCrit ? '#ffdf4d' : (opts.col || '#ffffff'), isCrit);
  }
  if (isCrit) {
    AudioKit.play('crit');
    if (syn.holy >= 4 && !opts.noHolyProc) {
      addRing(e.x, e.y, '#ffe478', 1.35);
      for (const o of game.enemies) {
        if (o.id !== e.id && o.hp > 0 && dist(o, e) <= 1.4) dealDamage(o, Math.round(dmg * 0.35), { col:'#ffe478', noHolyProc:true });
      }
    }
  }

  // Slow & Frost Tier-4 Freeze Shatter
  if (opts.slow > 0) {
    e.slow = Math.max(e.slow, opts.slow);
    e.slowT = Math.max(e.slowT, opts.slowDur || 2.4);
    if (syn.frost >= 4 && !e.boss && e.freezeT <= 0 && game.rnd() < 0.25) {
      e.freezeT = 1.5;
      addRing(e.x, e.y, '#a4f4ff', 0.9);
      e.hp -= 60;
      addFloat(e.x, e.y - 0.55, '碎冰 -60', '#96f2ff', true);
    }
  }
  if (opts.burn > 0) {
    e.burnDps = Math.max(e.burnDps, opts.burn);
    e.burnT = Math.max(e.burnT, 3.0);
  }

  // Lifesteal
  if (opts.lifesteal > 0) {
    game.hero.hp = Math.min(game.hero.maxHp, game.hero.hp + opts.lifesteal * 0.35);
    game.castleHp = Math.min(game.castleMax, game.castleHp + opts.lifesteal * 0.15);
  }

  // On-hit Volt Crest chain proc
  if (opts.chainProc > 0 && !opts.noChainProc && game.rnd() < opts.chainProc) {
    fireChainLightning(e, Math.round(dmg * 0.55), 3, { tower: opts.tower, noChainProc: true });
  }

  if (e.hp <= 0) onEnemyKilled(e, opts);
  return dmg;
}

function onEnemyKilled(e, opts){
  game.stats.kills++;
  if (opts.tower) opts.tower.kills++;
  const bonusGold = (opts.bonusGold || 0);
  const baseGold = (e.elite || e.boss || e.gold >= 2) ? e.gold : (game.rnd() < 0.52 ? e.gold : 0);
  game.gold += baseGold + bonusGold;

  // Fire Tier-4 Corpse Explosion!
  if (getSynergyTier('fire') >= 2 && !opts.fromCorpse) {
    const expDmg = Math.max(25, Math.round(e.maxHp * 0.18));
    addRing(e.x, e.y, '#ff6d38', 1.65);
    for (const o of game.enemies) {
      if (o.id !== e.id && o.hp > 0 && dist(o, e) <= 1.75) {
        dealDamage(o, expDmg, { col:'#ff884d', fromCorpse:true });
      }
    }
  }

  // Drop XP Gem
  game.gems.push({
    x: e.x + (game.rnd()-0.5)*0.25,
    y: e.y + (game.rnd()-0.5)*0.25,
    xp: e.xp, big: e.elite || e.boss,
    vx: (game.rnd()-0.5)*1.8, vy: (game.rnd()-0.5)*1.8, t: 0
  });

  // Drop Equipment Chest: Boss always drops Legend Chest; Elites drop 1 guaranteed Chest per wave (extra elites drop bonus gold!)
  if (e.boss || e.elite) {
    game.stats.elites++;
    if (e.boss || !game.eliteChestDropped) {
      if (e.elite) game.eliteChestDropped = true;
      game.chests.push({ x: e.x, y: e.y, legend: !!e.boss, bob: 0 });
      addRing(e.x, e.y, '#ffe478', 2.2);
      addFloat(e.x, e.y - 0.5, e.boss ? '👑 传说宝箱掉落！' : '📦 构装宝箱掉落！', '#ffe478', true);
      AudioKit.play('chest');
      game.shake = Math.max(game.shake, e.boss ? 10 : 5);
    } else {
      game.gold += 14;
      addFloat(e.x, e.y - 0.5, '💰 精英赏金 +14', '#ffe478', true);
      AudioKit.play('coin', 1.1);
    }
  }
}

function fireChainLightning(startEnemy, dmg, maxTargets, opts = {}){
  const visited = new Set([startEnemy.id]);
  let cur = startEnemy;
  const pts = [{ x: opts.ox ?? startEnemy.x, y: opts.oy ?? startEnemy.y }, { x: startEnemy.x, y: startEnemy.y }];
  dealDamage(cur, dmg, { ...opts, col:'#d8a6ff', noChainProc:true });

  for (let i = 1; i < maxTargets; i++) {
    let best = null, bestD = 4.2;
    for (const e of game.enemies) {
      if (e.hp <= 0 || visited.has(e.id)) continue;
      const d = dist(cur, e);
      if (d < bestD) { bestD = d; best = e; }
    }
    if (!best) break;
    visited.add(best.id);
    pts.push({ x: best.x, y: best.y });
    dealDamage(best, Math.round(dmg * 0.88), { ...opts, col:'#d8a6ff', noChainProc:true });
    cur = best;
  }
  game.bolts.push({ pts, t: 0.24, max: 0.24, col: opts.col || '#cf96ff' });
  AudioKit.play('thunder');
}

/* ==================== HERO SKILLS (ACTIVE & PASSIVE MUSOU) ==================== */
function castHeroDash(){
  if (paused || game.activeModal) return false;
  const h = game.hero;
  if (h.downTimer > 0) return false;
  if (h.dashCd > 0) { toast(`烈焰冲刺冷却中 (${h.dashCd.toFixed(1)}s)`, true); return false; }
  const hs = getHeroStats();
  let dx = Number(keys.has('d')||keys.has('arrowright')) - Number(keys.has('a')||keys.has('arrowleft'));
  let dy = Number(keys.has('s')||keys.has('arrowdown')) - Number(keys.has('w')||keys.has('arrowup'));
  if (!dx && !dy) {
    if (pointerWorld) { dx = pointerWorld.x - h.x; dy = pointerWorld.y - h.y; }
    else { dx = h.face; dy = 0; }
  }
  const len = Math.max(0.01, Math.hypot(dx, dy));
  dx /= len; dy /= len;
  const ox = h.x, oy = h.y;
  const dashDist = 3.5;
  h.x = clamp(h.x + dx * dashDist, 0.5, W - 0.5);
  h.y = clamp(h.y + dy * dashDist, 0.5, H - 0.5);
  h.invuln = 0.6;
  h.shield = Math.max(h.shield, 35);
  h.shieldTimer = 3.5;
  h.dashCd = Math.max(2.2, 4.5 / (1 + hs.gm.aspd * 0.6));
  // 3 fiery blast rings along the dash trail
  for (let s = 0; s < 3; s++) {
    const px = ox + (h.x - ox) * (s / 2);
    const py = oy + (h.y - oy) * (s / 2);
    addRing(px, py, '#ff7b47', 1.45);
    for (const e of game.enemies) {
      if (e.hp > 0 && dist(e, {x:px,y:py}) <= 1.55) {
        dealDamage(e, Math.round(32 * hs.dmgMult), { critChance:hs.crit, critDmg:hs.critDmg, col:'#ff8e52', burn:12, lifesteal:hs.lifesteal });
      }
    }
  }
  AudioKit.play('fire', 1.2);
  renderAllUI();
  return true;
}

function castHeroOverdrive(){
  if (paused || game.activeModal) return false;
  const h = game.hero;
  if (h.ultCd > 0) { toast(`全军超载冷却中 (${h.ultCd.toFixed(1)}s)`, true); return false; }
  h.ultTimer = 5.0;
  h.ultCd = 18.0;
  game.shake = 6;
  addRing(h.x, h.y, '#ffe478', 4.5);
  addFloat(h.x, h.y - 0.6, '⚡ 全军超载 5s！攻速+80% 暴击+35%', '#ffe878', true);
  AudioKit.play('merge', 1.15);
  renderAllUI();
  return true;
}

function updateHero(dt){
  const h = game.hero;
  const hs = getHeroStats();
  h.atkCd = Math.max(0, h.atkCd - dt);
  h.dashCd = Math.max(0, h.dashCd - dt);
  h.ultCd = Math.max(0, h.ultCd - dt);
  h.ultTimer = Math.max(0, h.ultTimer - dt);
  h.invuln = Math.max(0, h.invuln - dt);
  if (h.shieldTimer > 0) { h.shieldTimer = Math.max(0, h.shieldTimer - dt); if (h.shieldTimer === 0) h.shield = 0; }
  if (h.swing) { h.swing.t += dt; if (h.swing.t >= 0.22) h.swing = null; }
  if (h.downTimer > 0) {
    h.downTimer = Math.max(0, h.downTimer - dt);
    if (h.downTimer === 0) {
      h.x = CX + 0.5; h.y = CY + 1.3;
      h.hp = h.maxHp; h.invuln = 1.8;
      addFloat(h.x, h.y - 0.5, '领主满血重返！', '#ffe688', true);
    }
    return;
  }

  // Movement (WASD / Arrows / Hold-pointer)
  const spd = 5.6 + (h.skills.berserk || 0) * 0.35;
  let dx = Number(keys.has('d')||keys.has('arrowright')) - Number(keys.has('a')||keys.has('arrowleft'));
  let dy = Number(keys.has('s')||keys.has('arrowdown')) - Number(keys.has('w')||keys.has('arrowup'));
  if (dx || dy) {
    h.goal = null;
    const len = Math.hypot(dx, dy);
    dx /= len; dy /= len;
    if (dx) h.face = dx < 0 ? -1 : 1;
    h.x = clamp(h.x + dx * spd * dt, 0.45, W - 0.45);
    h.y = clamp(h.y + dy * spd * dt, 0.45, H - 0.45);
    h.moving = true;
  } else if (pointerDown && pointerWorld && !game.mode) {
    const d = dist(h, pointerWorld);
    if (d > 0.2) {
      const mx = (pointerWorld.x - h.x) / d, my = (pointerWorld.y - h.y) / d;
      if (Math.abs(mx) > 0.05) h.face = mx < 0 ? -1 : 1;
      h.x = clamp(h.x + mx * spd * dt, 0.45, W - 0.45);
      h.y = clamp(h.y + my * spd * dt, 0.45, H - 0.45);
      h.moving = true;
    } else h.moving = false;
  } else if (h.goal) {
    const d = dist(h, h.goal);
    if (d <= 0.18) { h.goal = null; h.moving = false; }
    else {
      const mx = (h.goal.x - h.x) / d, my = (h.goal.y - h.y) / d;
      if (Math.abs(mx) > 0.05) h.face = mx < 0 ? -1 : 1;
      h.x = clamp(h.x + mx * spd * dt, 0.45, W - 0.45);
      h.y = clamp(h.y + my * spd * dt, 0.45, H - 0.45);
      h.moving = true;
    }
  } else {
    h.moving = false;
  }

  // Only fire combat skills when enemies exist
  const alive = game.enemies.filter(e => e.hp > 0);
  if (!alive.length) return;

  // 1. Auto Wide Cleave Slash
  if (h.atkCd <= 0) {
    const reach = 2.05 * hs.rangeMult;
    const hits = alive.filter(e => dist(h, e) <= reach + e.r).sort((a,b) => dist(h,a) - dist(h,b)).slice(0, 8);
    if (hits.length) {
      h.atkCd = Math.max(0.18, 0.52 / hs.aspd);
      h.face = hits[0].x < h.x ? -1 : 1;
      h.swing = { t: 0, face: h.face, r: reach };
      AudioKit.play('slash');
      for (const e of hits) {
        dealDamage(e, Math.round(24 * hs.dmgMult), {
          critChance: hs.crit, critDmg: hs.critDmg, lifesteal: hs.lifesteal,
          slow: hs.gm.slowOnHit, chainProc: hs.gm.chainProc, bonusGold: hs.gm.bonusGold
        });
        // Subtle satisfying knockback
        const kd = Math.max(0.05, dist(h, e));
        if (!e.boss) {
          e.x = clamp(e.x + (e.x - h.x) / kd * 0.28, 0.3, W - 0.3);
          e.y = clamp(e.y + (e.y - h.y) / kd * 0.28, 0.3, H - 0.3);
        }
      }
    }
  }

  // 2. Orbiting Blades (割草旋风飞刃)
  const bLv = h.skills.blades || 0;
  if (bLv > 0) {
    h.bladeAngle += dt * (3.8 + bLv * 0.55) * (1 + (hs.aspd - 1) * 0.35);
    const count = bLv + 1;
    const orbitR = (1.55 + bLv * 0.12) * hs.rangeMult;
    const now = game.waveClock;
    for (let i = 0; i < count; i++) {
      const ang = h.bladeAngle + (Math.PI * 2 * i) / count;
      const bx = h.x + Math.cos(ang) * orbitR;
      const by = h.y + Math.sin(ang) * orbitR;
      for (const e of alive) {
        if (e.hp <= 0) continue;
        if (Math.hypot(e.x - bx, e.y - by) <= 0.55 + e.r) {
          const lastHit = h.bladeHitMap.get(e.id) || -9;
          if (now - lastHit >= 0.30) {
            h.bladeHitMap.set(e.id, now);
            dealDamage(e, Math.round((15 + bLv * 7) * hs.dmgMult), {
              critChance: hs.crit, critDmg: hs.critDmg, col:'#8cf2ff', lifesteal: hs.lifesteal, bonusGold: hs.gm.bonusGold
            });
          }
        }
      }
    }
  }

  // 3. Fire Wave (烈焰剑波)
  const fwLv = h.skills.firewave || 0;
  if (fwLv > 0) {
    h.skillTimers.firewave -= dt * hs.aspd;
    if (h.skillTimers.firewave <= 0) {
      h.skillTimers.firewave = Math.max(0.85, 1.85 - fwLv * 0.15);
      const nearest = alive.slice().sort((a,b) => dist(h,a) - dist(h,b))[0];
      const baseAng = Math.atan2(nearest.y - h.y, nearest.x - h.x);
      const count = Math.min(4, Math.ceil(fwLv / 2) + 1) + hs.gm.extraShot;
      for (let i = 0; i < count; i++) {
        const a = baseAng + (i - (count - 1) / 2) * 0.24;
        game.projectiles.push({
          kind: 'firewave', x: h.x, y: h.y,
          vx: Math.cos(a) * 11, vy: Math.sin(a) * 11,
          life: 0.72 * hs.rangeMult, r: 0.55, hitSet: new Set(),
          dmg: Math.round((24 + fwLv * 12) * hs.dmgMult),
          critChance: hs.crit, critDmg: hs.critDmg, lifesteal: hs.lifesteal, bonusGold: hs.gm.bonusGold
        });
      }
      AudioKit.play('fire', 1.35);
    }
  }

  // 4. Hero Chain Thunder (天雷轰顶)
  const thLv = h.skills.thunder || 0;
  if (thLv > 0) {
    h.skillTimers.thunder -= dt * hs.aspd;
    if (h.skillTimers.thunder <= 0) {
      h.skillTimers.thunder = Math.max(0.85, 2.1 - thLv * 0.26);
      const near = alive.filter(e => dist(h, e) <= 7.5 * hs.rangeMult);
      if (near.length) {
        const strikes = thLv + 1;
        for (let s = 0; s < strikes; s++) {
          const tgt = near[Math.floor(game.rnd() * near.length)];
          if (tgt && tgt.hp > 0) {
            fireChainLightning(tgt, Math.round((28 + thLv * 14) * hs.dmgMult), 3, {
              ox: tgt.x, oy: tgt.y - 3.2, critChance: hs.crit, critDmg: hs.critDmg, bonusGold: hs.gm.bonusGold
            });
          }
        }
      }
    }
  }

  // 5. Frost Nova (冰霜新星)
  const nvLv = h.skills.nova || 0;
  if (nvLv > 0) {
    h.skillTimers.nova -= dt * hs.aspd;
    if (h.skillTimers.nova <= 0) {
      h.skillTimers.nova = Math.max(1.8, 3.4 - nvLv * 0.26);
      const rad = (2.3 + nvLv * 0.35) * hs.rangeMult;
      addRing(h.x, h.y, '#7ce8ff', rad);
      AudioKit.play('frost');
      for (const e of alive) {
        if (dist(h, e) <= rad + e.r) {
          dealDamage(e, Math.round((22 + nvLv * 12) * hs.dmgMult), {
            critChance: hs.crit, critDmg: hs.critDmg, col:'#8cf0ff', slow: 0.55, slowDur: 3.0, bonusGold: hs.gm.bonusGold
          });
        }
      }
    }
  }

  // 6. Quake Stomp (重锤震地)
  const stLv = h.skills.stomp || 0;
  if (stLv > 0) {
    h.skillTimers.stomp -= dt * hs.aspd;
    if (h.skillTimers.stomp <= 0) {
      h.skillTimers.stomp = Math.max(2.0, 3.8 - stLv * 0.3);
      const rad = (2.4 + stLv * 0.32) * hs.rangeMult;
      addRing(h.x, h.y, '#ffbe55', rad);
      game.shake = Math.max(game.shake, 4);
      AudioKit.play('fire', 0.75);
      for (const e of alive) {
        if (dist(h, e) <= rad + e.r) {
          dealDamage(e, Math.round((36 + stLv * 18) * hs.dmgMult), {
            critChance: hs.crit, critDmg: hs.critDmg, col:'#ffd478', bonusGold: hs.gm.bonusGold
          });
          if (!e.boss) e.freezeT = Math.max(e.freezeT, 0.75);
        }
      }
    }
  }
}

/* ==================== TOWERS & SYNERGY EFFECTS ==================== */
function updateTowers(dt){
  const alive = game.enemies.filter(e => e.hp > 0);
  if (!alive.length) return;
  const castleC = { x: CX + 0.5, y: CY + 0.5 };
  const syn = getSynergyCounts();

  // Thunder Tier-4 Global Wrath Strike every 3s!
  if (syn.thunder >= 4) {
    game.thunderSynTimer -= dt;
    if (game.thunderSynTimer <= 0) {
      game.thunderSynTimer = 3.0;
      const targets = alive.slice().sort((a,b) => dist(a, castleC) - dist(b, castleC)).slice(0, 3);
      for (const tgt of targets) {
        fireChainLightning(tgt, Math.round(75 + game.wave * 18), 4, { ox: tgt.x, oy: tgt.y - 4.0, col:'#e2b8ff' });
        addRing(tgt.x, tgt.y, '#c68cff', 1.6);
      }
    }
  }

  for (const t of game.towers) {
    t.cd = Math.max(0, t.cd - dt);
    if (t.cd > 0) continue;
    const st = getTowerStats(t);
    const origin = { x: t.x + 0.5, y: t.y + 0.5 };
    const inRange = alive.filter(e => dist(origin, e) <= st.range);
    if (!inRange.length) continue;

    // Smart target prioritization
    inRange.sort((a, b) => {
      if (t.kind === 'frost' && (a.slowT <= 0) !== (b.slowT <= 0)) return a.slowT <= 0 ? -1 : 1;
      const sa = dist(a, castleC) - (t.kind === 'wind' && a.ranged ? 1.8 : 0);
      const sb = dist(b, castleC) - (t.kind === 'wind' && b.ranged ? 1.8 : 0);
      return sa - sb;
    });
    const mainTarget = inRange[0];
    t.cd = st.cd;

    const dmgOpts = {
      tower: t, critChance: st.crit, critDmg: st.critDmg,
      slow: st.slow, slowDur: st.slowDur, burn: st.burn,
      lifesteal: st.gm.lifesteal, chainProc: st.gm.chainProc, bonusGold: st.gm.bonusGold
    };

    if (t.kind === 'wind') {
      const baseAng = Math.atan2(mainTarget.y - origin.y, mainTarget.x - origin.x);
      let totalShots = st.shots;
      if (syn.wind >= 4 && game.rnd() < 0.35) totalShots += 2;
      for (let i = 0; i < totalShots; i++) {
        const a = baseAng + (i - (totalShots - 1) / 2) * 0.14;
        game.projectiles.push({
          kind: 'arrow', x: origin.x, y: origin.y,
          vx: Math.cos(a) * 16, vy: Math.sin(a) * 16,
          life: (st.range + 1.5) / 16, r: 0.25,
          pierce: st.pierce, hitSet: new Set(),
          dmg: st.dmg, splash: st.splash, opts: dmgOpts
        });
      }
      AudioKit.play('arrow');
    } else if (t.kind === 'fire') {
      for (let i = 0; i < st.shots; i++) {
        const tgt = inRange[i % inRange.length];
        const d = Math.max(0.14, dist(origin, tgt) / 9.5);
        game.projectiles.push({
          kind: 'fireball', sx: origin.x, sy: origin.y, x: origin.x, y: origin.y,
          tx: tgt.x, ty: tgt.y, t: 0, dur: d,
          dmg: st.dmg, splash: st.splash, burn: st.burn, star: t.star, opts: dmgOpts
        });
      }
      AudioKit.play('fire');
    } else if (t.kind === 'frost') {
      for (let i = 0; i < st.shots; i++) {
        const tgt = inRange[i % inRange.length];
        const d = Math.max(0.12, dist(origin, tgt) / 11.5);
        game.projectiles.push({
          kind: 'frostball', sx: origin.x, sy: origin.y, x: origin.x, y: origin.y,
          tx: tgt.x, ty: tgt.y, t: 0, dur: d,
          dmg: st.dmg, splash: st.splash, opts: dmgOpts
        });
      }
      AudioKit.play('frost');
    } else if (t.kind === 'thunder') {
      fireChainLightning(mainTarget, st.dmg, st.chains, { ...dmgOpts, ox: origin.x, oy: origin.y - 0.15 });
    } else if (t.kind === 'holy') {
      for (let i = 0; i < st.beams; i++) {
        const tgt = inRange[i % inRange.length];
        const ang = Math.atan2(tgt.y - origin.y, tgt.x - origin.x);
        const ex = origin.x + Math.cos(ang) * st.range;
        const ey = origin.y + Math.sin(ang) * st.range;
        game.beams.push({ x1: origin.x, y1: origin.y, x2: ex, y2: ey, t: 0.22, max: 0.22, w: 4 + t.star * 2.5 });
        // Hit all enemies along the beam!
        for (const e of alive) {
          if (pointToSegDist(e.x, e.y, origin.x, origin.y, ex, ey) <= 0.55 + e.r) {
            dealDamage(e, st.dmg, { ...dmgOpts, col:'#fff094' });
          }
        }
      }
      AudioKit.play('holy');
    }
  }
}

function pointToSegDist(px, py, x1, y1, x2, y2){
  const dx = x2 - x1, dy = y2 - y1;
  const l2 = dx * dx + dy * dy;
  if (l2 === 0) return Math.hypot(px - x1, py - y1);
  const t = clamp(((px - x1) * dx + (py - y1) * dy) / l2, 0, 1);
  return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
}

function updateProjectilesAndZones(dt){
  for (const p of game.projectiles) {
    if (p.kind === 'enemyShot') {
      p.t += dt;
      const u = clamp(p.t / p.dur, 0, 1);
      p.x = p.sx + (p.tx - p.sx) * u;
      p.y = p.sy + (p.ty - p.sy) * u;
      if (u >= 1) {
        p.done = true;
        if (p.tgt === 'hero') damageHero(p.dmg);
        else damageCastle(p.dmg);
      }
      continue;
    }
    if (p.kind === 'arrow' || p.kind === 'firewave') {
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.life -= dt;
      if (p.life <= 0) { p.done = true; continue; }
      for (const e of game.enemies) {
        if (e.hp <= 0 || p.hitSet.has(e.id)) continue;
        if (Math.hypot(e.x - p.x, e.y - p.y) <= p.r + e.r) {
          p.hitSet.add(e.id);
          if (p.kind === 'firewave') {
            dealDamage(e, p.dmg, { critChance:p.critChance, critDmg:p.critDmg, col:'#ff9a52', lifesteal:p.lifesteal, bonusGold:p.bonusGold });
          } else {
            if (p.splash > 0) {
              addRing(p.x, p.y, '#ff9848', p.splash);
              for (const o of game.enemies) {
                if (o.hp > 0 && dist(o, p) <= p.splash + o.r) dealDamage(o, p.dmg, { ...p.opts, col:'#9affc8' });
              }
            } else {
              dealDamage(e, p.dmg, { ...p.opts, col:'#a8ffd2' });
            }
            if (p.pierce > 0) p.pierce--;
            else { p.done = true; break; }
          }
        }
      }
      continue;
    }
    // Arcing explosive / frost balls
    p.t += dt;
    const u = clamp(p.t / p.dur, 0, 1);
    p.x = p.sx + (p.tx - p.sx) * u;
    p.y = p.sy + (p.ty - p.sy) * u;
    if (u >= 1) {
      p.done = true;
      const isFire = p.kind === 'fireball';
      addRing(p.tx, p.ty, isFire ? '#ff7b47' : '#6ce2ff', p.splash);
      for (const e of game.enemies) {
        if (e.hp > 0 && dist(e, {x:p.tx, y:p.ty}) <= p.splash + e.r) {
          dealDamage(e, p.dmg, { ...p.opts, col: isFire ? '#ff9f66' : '#8ceeff' });
        }
      }
      if (isFire && p.star >= 2) {
        game.zones.push({ kind:'lava', x:p.tx, y:p.ty, r:p.splash * 0.85, t:3.0, max:3.0, tick:0.45, dps:p.burn, tower:p.opts.tower });
      }
    }
  }
  game.projectiles = game.projectiles.filter(p => !p.done);

  for (const z of game.zones) {
    z.t -= dt;
    if (z.kind === 'lava') {
      z.tick -= dt;
      if (z.tick <= 0) {
        z.tick = 0.45;
        for (const e of game.enemies) {
          if (e.hp > 0 && dist(e, z) <= z.r + e.r) dealDamage(e, Math.round(z.dps * 0.45), { tower:z.tower, col:'#ff884d' });
        }
      }
    } else if (z.kind === 'bossSlam' && z.t <= 0) {
      z.done = true;
      addRing(z.x, z.y, '#ff4d42', z.r);
      game.shake = 8;
      AudioKit.play('boss', 1.2);
      if (game.hero.downTimer <= 0 && dist(game.hero, z) <= z.r) damageHero(34);
      if (dist({x:CX+0.5, y:CY+0.5}, z) <= z.r + 1.4) damageCastle(18);
    }
  }
  game.zones = game.zones.filter(z => z.t > 0 && !z.done);
}

function updateEnemies(dt){
  const castleC = { x: CX + 0.5, y: CY + 0.5 };
  const h = game.hero;

  for (const e of game.enemies) {
    if (e.hp <= 0) continue;
    e.cd = Math.max(0, e.cd - dt);
    e.flash = Math.max(0, e.flash - dt);
    if (e.slowT > 0) { e.slowT = Math.max(0, e.slowT - dt); if (e.slowT === 0) e.slow = 0; }
    if (e.burnT > 0) {
      e.burnT = Math.max(0, e.burnT - dt);
      e.hp -= e.burnDps * dt;
      if (e.hp <= 0) { onEnemyKilled(e, {}); continue; }
    }
    if (e.freezeT > 0) { e.freezeT = Math.max(0, e.freezeT - dt); continue; }

    // Boss special slam + summon
    if (e.boss) {
      e.bossTimer -= dt;
      if (e.bossTimer <= 0) {
        e.bossTimer = 6.5;
        const tgt = (h.downTimer <= 0 && dist(e, h) < 4.5) ? { x: h.x, y: h.y } : castleC;
        game.zones.push({ kind:'bossSlam', x: tgt.x, y: tgt.y, r: 2.1, t: 1.5, max: 1.5 });
        addFloat(e.x, e.y - 0.7, '首领毁灭重击！', '#ff8c70', true);
        for (let k = 0; k < 4; k++) {
          spawnEnemy('slime', 'west', Math.pow(1.18, game.wave - 1), {
            x: clamp(e.x + (game.rnd()-0.5)*1.5, 0.5, W-0.5),
            y: clamp(e.y + (game.rnd()-0.5)*1.5, 0.5, H-0.5)
          });
        }
      }
    }

    // Target hero if close, else castle
    const dHero = h.downTimer <= 0 ? dist(e, h) : 999;
    const dCastle = dist(e, castleC);
    const chaseHero = dHero < 2.6;
    const target = chaseHero ? h : castleC;
    const dTgt = chaseHero ? dHero : dCastle;

    if (e.ranged && dTgt <= (chaseHero ? e.range : e.range + 2.2)) {
      if (e.cd <= 0) {
        e.cd = 1.65;
        game.projectiles.push({
          kind:'enemyShot', sx:e.x, sy:e.y, x:e.x, y:e.y, tx:target.x, ty:target.y,
          t:0, dur:0.32, dmg: e.dmg, tgt: chaseHero ? 'hero' : 'castle'
        });
      }
      continue;
    }

    const hitDist = chaseHero ? (0.62 + e.r) : (1.15 + e.r);
    if (dTgt <= hitDist) {
      if (e.cd <= 0) {
        e.cd = 0.95;
        if (chaseHero) damageHero(e.dmg);
        else damageCastle(e.dmg);
      }
      continue;
    }

    const curSpd = e.spd * (1 - e.slow);
    const mx = (target.x - e.x) / Math.max(0.01, dTgt);
    const my = (target.y - e.y) / Math.max(0.01, dTgt);
    e.x = clamp(e.x + mx * curSpd * dt, 0.3, W - 0.3);
    e.y = clamp(e.y + my * curSpd * dt, 0.3, H - 0.3);
  }

  // Light separation
  for (let i = 0; i < game.enemies.length; i++) {
    const a = game.enemies[i];
    if (a.hp <= 0) continue;
    for (let j = i + 1; j < Math.min(game.enemies.length, i + 14); j++) {
      const b = game.enemies[j];
      if (b.hp <= 0) continue;
      const dx = b.x - a.x, dy = b.y - a.y;
      const d = Math.hypot(dx, dy), md = a.r + b.r;
      if (d > 0.001 && d < md) {
        const push = (md - d) * 0.28;
        a.x -= dx / d * push; a.y -= dy / d * push;
        b.x += dx / d * push; b.y += dy / d * push;
      }
    }
  }
  game.enemies = game.enemies.filter(e => e.hp > 0);
}

function updatePickups(dt){
  const h = game.hero;
  const hs = getHeroStats();
  if (game.xpComboTimer > 0) { game.xpComboTimer -= dt; if (game.xpComboTimer <= 0) game.xpCombo = 0; }

  for (const g of game.gems) {
    g.t += dt;
    if (g.t < 0.22) { g.x += g.vx * dt; g.y += g.vy * dt; continue; }
    const d = dist(g, h);
    if (d <= hs.magnet || g.magnetized) {
      g.magnetized = true;
      const spd = 13.5;
      if (d <= 0.48) {
        g.done = true;
        gainHeroXp(g.xp);
      } else {
        g.x += (h.x - g.x) / d * spd * dt;
        g.y += (h.y - g.y) / d * spd * dt;
      }
    }
  }
  game.gems = game.gems.filter(g => !g.done);

  for (const c of game.chests) {
    c.bob += dt * 4.5;
    if (dist(c, h) <= 1.05) {
      c.done = true;
      queueModal({ type:'chest', legend: c.legend });
      AudioKit.play('chest', 1.15);
    }
  }
  game.chests = game.chests.filter(c => !c.done);
}

function gainHeroXp(amt){
  const h = game.hero;
  h.xp += amt;
  game.xpCombo = Math.min(14, game.xpCombo + 1);
  game.xpComboTimer = 0.65;
  AudioKit.play('xp', 1 + game.xpCombo * 0.045);
  while (h.xp >= h.xpNext) {
    h.xp -= h.xpNext;
    h.lv++;
    h.xpNext = Math.round(14 + h.lv * 9 + h.lv * h.lv * 1.4);
    h.maxHp += 15;
    h.hp = Math.min(h.maxHp, h.hp + 35);
    addRing(h.x, h.y, '#7ce8ff', 2.4);
    addFloat(h.x, h.y - 0.6, `✨ 领主升级 Lv.${h.lv}！`, '#8cf4ff', true);
    AudioKit.play('level');
    queueModal({ type:'levelup' });
  }
}

function damageHero(amt){
  const h = game.hero;
  if (h.downTimer > 0 || h.invuln > 0) return;
  h.invuln = 0.28;
  let rem = amt;
  if (h.shield > 0) { const a = Math.min(h.shield, rem); h.shield -= a; rem -= a; }
  if (rem > 0) {
    h.hp = Math.max(0, h.hp - rem);
    addFloat(h.x, h.y - 0.45, `-${rem}`, '#ff8070');
    AudioKit.play('hit');
  }
  if (h.hp <= 0) {
    h.downTimer = 5.0;
    toast('领主重伤撤回圣堡，5 秒后满血重返！', true);
  }
}

function damageCastle(amt){
  game.castleHp = Math.max(0, game.castleHp - amt);
  game.shake = Math.max(game.shake, 4.5);
  addFloat(CX + 0.5, CY - 0.3, `圣堡 -${amt}`, '#ff6b57', true);
  AudioKit.play('hit', 0.8);
  if (game.castleHp <= 0) finishGame(false);
}

function onWaveCleared(){
  // Magnetize all remaining gems & auto-collect any chests so player NEVER loses loot!
  for (const g of game.gems) gainHeroXp(g.xp);
  game.gems = [];
  for (const c of game.chests) queueModal({ type:'chest', legend: c.legend });
  game.chests = [];

  const clearBonus = 18 + game.wave * 3;
  game.gold += clearBonus;
  game.castleHp = Math.min(game.castleMax, game.castleHp + 15);
  game.hero.hp = Math.min(game.hero.maxHp, game.hero.hp + 45);
  game.hero.downTimer = 0;

  if (game.wave === MAIN_WAVES && !game.endless) {
    game.phase = 'won';
    AudioKit.play('level', 1.1);
    showEndModal(true);
    renderAllUI();
    return;
  }

  game.wave++;
  game.phase = 'prep';
  game.rerollCost = 5;
  rollShop(true); // Free fresh shop every wave!
  showBanner(`✅ 第 ${game.wave - 1} 波通关！`, `通关赏金 +${clearBonus} 金 · 商店已免费刷新`, 'good');
  AudioKit.play('merge');
  if (game.autoWave) game.autoWaveTimer = 4.0;
  renderAllUI();
}

function finishGame(victory){
  game.phase = victory ? 'won' : 'lost';
  game.speed = 1;
  showEndModal(victory);
  renderAllUI();
}

function enterEndlessMode(){
  game.endless = true;
  game.wave = MAIN_WAVES + 1;
  game.phase = 'prep';
  game.castleHp = game.castleMax;
  game.rerollCost = 5;
  rollShop(true);
  closeModal();
  showBanner('🔥 无尽割草模式已开启！', '从第 16 波起无限叠加怪海，冲刺你的极限 DPS！', 'boss');
  renderAllUI();
}

/* ==================== SIMULATION TICK ==================== */
function tick(dt){
  if (!game || !['prep','wave'].includes(game.phase)) return;
  if (paused || game.activeModal) return;

  updateVfx(dt);
  updateHero(dt);

  // Holy Tier-2 passive regen
  if (getSynergyTier('holy') >= 1) {
    game.holyRegenTimer -= dt;
    if (game.holyRegenTimer <= 0) {
      game.holyRegenTimer = 1.0;
      game.hero.hp = Math.min(game.hero.maxHp, game.hero.hp + 4);
      game.castleHp = Math.min(game.castleMax, game.castleHp + 2);
    }
  }

  if (game.phase === 'prep') {
    if (game.autoWave) {
      game.autoWaveTimer -= dt;
      if (game.autoWaveTimer <= 0) startWave();
    }
    return;
  }

  // Wave Simulation
  game.waveClock += dt;
  for (const w of game.waveQueue) {
    if (!w.spawned && game.waveClock >= w.at) {
      w.spawned = true;
      spawnEnemy(w.kind, w.side, w.scale);
    }
  }

  updateTowers(dt);
  updateProjectilesAndZones(dt);
  updateEnemies(dt);
  updatePickups(dt);

  if (game.phase !== 'wave') return;
  const allSpawned = game.waveQueue.every(w => w.spawned);
  if (allSpawned && game.enemies.length === 0) {
    onWaveCleared();
  }
}

/* ==================== VFX HELPERS ==================== */
function addRing(x, y, col, r){ game.rings.push({ x, y, col, r, t: 0.34, max: 0.34 }); }
function addFloat(x, y, txt, col='#fff', big=false){
  game.floats.push({ x, y, txt, col, big, t: big ? 1.05 : 0.72, max: big ? 1.05 : 0.72 });
  if (game.floats.length > 75) game.floats.shift();
}
function updateVfx(dt){
  game.shake = Math.max(0, game.shake - dt * 18);
  for (const r of game.rings) r.t -= dt;
  game.rings = game.rings.filter(r => r.t > 0);
  for (const b of game.beams) b.t -= dt;
  game.beams = game.beams.filter(b => b.t > 0);
  for (const l of game.bolts) l.t -= dt;
  game.bolts = game.bolts.filter(l => l.t > 0);
  for (const f of game.floats) { f.t -= dt; f.y -= dt * (f.big ? 0.95 : 0.68); }
  game.floats = game.floats.filter(f => f.t > 0);
}
