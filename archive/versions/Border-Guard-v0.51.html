/* ==================== RENDERING (CANVAS) ==================== */
function fitCamera(){
  cam.w = window.innerWidth;
  cam.h = window.innerHeight;
  cam.dpr = Math.min(2, window.devicePixelRatio || 1);
  canvas.width = Math.round(cam.w * cam.dpr);
  canvas.height = Math.round(cam.h * cam.dpr);
  const availH = Math.max(300, cam.h - 190);
  const availW = Math.max(300, cam.w - 24);
  cam.zoom = clamp(Math.min(availW / (W * CELL), availH / (H * CELL)), 0.56, 1.35);
  cam.x = (W / 2) * CELL;
  cam.y = (H / 2) * CELL + 8;
}

function screenToWorld(sx, sy){
  return {
    x: ((sx - cam.w / 2) / cam.zoom + cam.x) / CELL,
    y: ((sy - cam.h / 2) / cam.zoom + cam.y) / CELL
  };
}
function worldToScreen(wx, wy){
  return {
    x: (wx * CELL - cam.x) * cam.zoom + cam.w / 2,
    y: (wy * CELL - cam.y) * cam.zoom + cam.h / 2
  };
}

function render(){
  if (!game) return;
  ctx.setTransform(cam.dpr, 0, 0, cam.dpr, 0, 0);
  ctx.fillStyle = '#0c1418';
  ctx.fillRect(0, 0, cam.w, cam.h);

  const sx = game.shake > 0 ? (Math.random() - 0.5) * game.shake : 0;
  const sy = game.shake > 0 ? (Math.random() - 0.5) * game.shake : 0;

  ctx.save();
  ctx.translate(cam.w / 2 + sx, cam.h / 2 + sy);
  ctx.scale(cam.zoom, cam.zoom);
  ctx.translate(-cam.x, -cam.y);

  drawArena();
  drawZones();
  drawPedestalsAndHighlights();
  drawCastle();
  drawTowers();
  drawPickups();
  drawEnemies();
  drawHero();
  drawProjectilesBeamsBolts();
  drawRingsAndFloats();

  ctx.restore();
}

function drawArena(){
  // Subtle dark frontier checkerboard so bright VFX pop dramatically
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const inFort = x >= 9 && x <= 13 && y >= 5 && y <= 9;
      const isRoad = x === CX || y === CY;
      if (inFort) {
        ctx.fillStyle = isRoad ? '#2a383f' : ((x + y) % 2 ? '#1e2c33' : '#223139');
      } else {
        ctx.fillStyle = isRoad ? '#1d2a2f' : ((x + y) % 2 ? '#132024' : '#162429');
      }
      ctx.fillRect(x * CELL, y * CELL, CELL, CELL);
    }
  }
  // Outer battlefield border
  ctx.strokeStyle = 'rgba(130,190,185,0.22)';
  ctx.lineWidth = 2;
  ctx.strokeRect(0, 0, W * CELL, H * CELL);

  // Fortress outer glowing perimeter frame (5x5 at x=9..13, y=5..9)
  ctx.strokeStyle = 'rgba(255,214,112,0.55)';
  ctx.lineWidth = 3.5;
  ctx.strokeRect(9 * CELL, 5 * CELL, 5 * CELL, 5 * CELL);
  // Subtle corner bastion pillars
  ctx.fillStyle = '#c8b68c';
  for (const [cx, cy] of [[9,5],[14,5],[9,10],[14,10]]) {
    ctx.fillRect(cx * CELL - 5, cy * CELL - 5, 10, 10);
  }
}

function drawPedestalsAndHighlights(){
  const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 220);
  const buying = game.mode?.type === 'buy' ? game.shop[game.mode.shopIdx] : null;
  const moving = game.mode?.type === 'move' ? game.towers.find(o => o.id === game.mode.towerId) : null;
  const equipping = game.mode?.type === 'equip';

  for (const p of PEDESTALS) {
    const cx = (p.x + 0.5) * CELL, cy = (p.y + 0.5) * CELL;
    const occ = towerAt(p.x, p.y);
    // Base rune pedestal
    ctx.beginPath();
    ctx.arc(cx, cy, CELL * 0.36, 0, Math.PI * 2);
    ctx.fillStyle = occ ? 'rgba(255,255,255,0.06)' : 'rgba(130,210,200,0.09)';
    ctx.fill();
    ctx.strokeStyle = occ ? 'rgba(255,255,255,0.14)' : 'rgba(150,225,215,0.28)';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Mode highlights
    if (buying) {
      const canMerge = occ && occ.kind === buying.kind && occ.star === 1;
      if (!occ || canMerge) {
        ctx.fillStyle = canMerge ? `rgba(255,218,88,${0.26 + 0.16*pulse})` : `rgba(114,242,180,${0.16 + 0.12*pulse})`;
        ctx.fillRect(p.x * CELL + 2, p.y * CELL + 2, CELL - 4, CELL - 4);
        ctx.strokeStyle = canMerge ? '#ffe878' : '#72f2b4';
        ctx.lineWidth = canMerge ? 3 : 2;
        ctx.strokeRect(p.x * CELL + 3, p.y * CELL + 3, CELL - 6, CELL - 6);
        if (canMerge) {
          ctx.fillStyle = '#ffe878'; ctx.font = '900 11px sans-serif'; ctx.textAlign = 'center';
          ctx.fillText('合2★', cx, p.y * CELL + 13);
        }
      }
    } else if (moving) {
      const canMerge = occ && occ.id !== moving.id && occ.kind === moving.kind && occ.star === moving.star && moving.star < 3;
      ctx.strokeStyle = canMerge ? '#ffe878' : '#7be8ff';
      ctx.lineWidth = canMerge ? 3 : 1.8;
      ctx.strokeRect(p.x * CELL + 3, p.y * CELL + 3, CELL - 6, CELL - 6);
    } else if (equipping && occ && occ.gear.length < 2) {
      ctx.fillStyle = `rgba(255,218,90,${0.20 + 0.14*pulse})`;
      ctx.fillRect(p.x * CELL + 2, p.y * CELL + 2, CELL - 4, CELL - 4);
      ctx.strokeStyle = '#ffe478';
      ctx.lineWidth = 2.5;
      ctx.strokeRect(p.x * CELL + 3, p.y * CELL + 3, CELL - 6, CELL - 6);
    }
  }

  // Selected tower range circle
  if (game.inspTarget?.type === 'tower') {
    const t = game.towers.find(o => o.id === game.inspTarget.id);
    if (t) {
      const st = getTowerStats(t);
      const col = ELEMENTS[t.elem].color;
      ctx.beginPath();
      ctx.arc((t.x + 0.5) * CELL, (t.y + 0.5) * CELL, st.range * CELL, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,235,140,0.07)';
      ctx.fill();
      ctx.setLineDash([6, 5]);
      ctx.strokeStyle = col;
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.setLineDash([]);
    }
  }
}

function drawCastle(){
  const cx = (CX + 0.5) * CELL, cy = (CY + 0.5) * CELL;
  const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 350);
  // Crystal aura
  ctx.beginPath();
  ctx.arc(cx, cy, CELL * (0.48 + 0.06 * pulse), 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(92,216,255,0.18)';
  ctx.fill();
  // Octagon crystal bastion
  ctx.beginPath();
  ctx.moveTo(cx, cy - 17); ctx.lineTo(cx + 14, cy - 6); ctx.lineTo(cx + 10, cy + 14);
  ctx.lineTo(cx - 10, cy + 14); ctx.lineTo(cx - 14, cy - 6); ctx.closePath();
  ctx.fillStyle = '#5bd2ff'; ctx.fill();
  ctx.strokeStyle = '#e8fbff'; ctx.lineWidth = 2.2; ctx.stroke();
  // Inner highlight
  ctx.beginPath();
  ctx.moveTo(cx, cy - 11); ctx.lineTo(cx + 6, cy); ctx.lineTo(cx, cy + 8); ctx.lineTo(cx - 6, cy); ctx.closePath();
  ctx.fillStyle = '#dffaff'; ctx.fill();

  // HP Bar
  const r = clamp(game.castleHp / game.castleMax, 0, 1);
  ctx.fillStyle = 'rgba(0,0,0,0.65)';
  ctx.fillRect(cx - 20, cy + 18, 40, 6);
  ctx.fillStyle = r < 0.35 ? '#ff6250' : '#6ef29e';
  ctx.fillRect(cx - 19, cy + 19, 38 * r, 4);
}

function drawTowers(){
  for (const t of game.towers) {
    const cx = (t.x + 0.5) * CELL, cy = (t.y + 0.5) * CELL;
    const col = ELEMENTS[t.elem].color;
    const isSel = game.inspTarget?.type === 'tower' && game.inspTarget.id === t.id;

    // 3★ Mythic golden halo
    if (t.star === 3) {
      ctx.beginPath();
      ctx.arc(cx, cy, CELL * 0.44, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,216,92,0.22)';
      ctx.fill();
      ctx.strokeStyle = '#ffe478';
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    // Tower plinth
    ctx.beginPath();
    ctx.arc(cx, cy, CELL * (0.29 + t.star * 0.035), 0, Math.PI * 2);
    ctx.fillStyle = '#182830'; ctx.fill();
    ctx.strokeStyle = isSel ? '#fff' : col;
    ctx.lineWidth = isSel ? 3 : (1.8 + t.star * 0.6);
    ctx.stroke();

    // Icon
    ctx.font = `${16 + t.star * 2}px sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(TOWERS[t.kind].icon, cx, cy + 1);

    // Stars above
    ctx.fillStyle = t.star === 3 ? '#ffdf4d' : t.star === 2 ? '#a8f0ff' : '#d6eae5';
    ctx.font = '900 10px sans-serif';
    ctx.fillText('★'.repeat(t.star), cx, cy - 17);

    // Gear pips below
    if (t.gear.length) {
      for (let i = 0; i < t.gear.length; i++) {
        ctx.beginPath();
        ctx.arc(cx - 5 + i * 10, cy + 16, 2.5 + gearStar(t.gear[i]) * 1.1, 0, Math.PI * 2);
        ctx.fillStyle = GEARS[gearBase(t.gear[i])].rarity === 'legend' ? '#ffbe4f' : '#d294ff';
        ctx.fill();
      }
    }
  }
}

function drawHero(){
  const h = game.hero;
  if (h.downTimer > 0) return;
  const hx = h.x * CELL, hy = h.y * CELL;
  const hs = getHeroStats();

  // Overdrive golden aura
  if (h.ultTimer > 0) {
    ctx.beginPath();
    ctx.arc(hx, hy, 28 + Math.sin(performance.now()/80)*4, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,220,90,0.22)'; ctx.fill();
    ctx.strokeStyle = '#ffe878'; ctx.lineWidth = 2; ctx.stroke();
  }

  // Cleave swing arc
  if (h.swing) {
    const u = h.swing.t / 0.22;
    const rad = h.swing.r * CELL;
    const a0 = h.swing.face > 0 ? -1.35 : Math.PI - 1.35;
    ctx.save();
    ctx.beginPath();
    ctx.arc(hx, hy, rad, a0, a0 + 2.7);
    ctx.strokeStyle = `rgba(255,232,126,${1 - u})`;
    ctx.lineWidth = 10 * (1 - u * 0.5);
    ctx.stroke();
    ctx.restore();
  }

  // Orbiting Blades (旋风飞刃)
  const bLv = h.skills.blades || 0;
  if (bLv > 0) {
    const count = bLv + 1;
    const orbitR = (1.55 + bLv * 0.12) * hs.rangeMult * CELL;
    for (let i = 0; i < count; i++) {
      const ang = h.bladeAngle + (Math.PI * 2 * i) / count;
      const bx = hx + Math.cos(ang) * orbitR;
      const by = hy + Math.sin(ang) * orbitR;
      ctx.save();
      ctx.translate(bx, by);
      ctx.rotate(ang + Math.PI / 2);
      ctx.beginPath();
      ctx.moveTo(0, -11); ctx.lineTo(5, 6); ctx.lineTo(0, 3); ctx.lineTo(-5, 6); ctx.closePath();
      ctx.fillStyle = '#8ef4ff'; ctx.fill();
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.4; ctx.stroke();
      ctx.restore();
    }
  }

  // Hero Body
  ctx.beginPath();
  ctx.arc(hx, hy, 14, 0, Math.PI * 2);
  ctx.fillStyle = h.invuln > 0 ? '#ffffff' : '#2a8fff';
  ctx.fill();
  ctx.strokeStyle = h.shield > 0 ? '#8ef5ff' : '#ffe688';
  ctx.lineWidth = 3;
  ctx.stroke();
  // Crown / helmet visor
  ctx.fillStyle = '#ffe478';
  ctx.beginPath();
  ctx.moveTo(hx - 7, hy - 9); ctx.lineTo(hx - 4, hy - 16); ctx.lineTo(hx, hy - 11);
  ctx.lineTo(hx + 4, hy - 16); ctx.lineTo(hx + 7, hy - 9); ctx.closePath();
  ctx.fill();

  // HP Bar
  const r = clamp(h.hp / h.maxHp, 0, 1);
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(hx - 16, hy - 23, 32, 5);
  ctx.fillStyle = '#6cf29c';
  ctx.fillRect(hx - 15, hy - 22, 30 * r, 3);
}

function drawEnemies(){
  for (const e of game.enemies) {
    const ex = e.x * CELL, ey = e.y * CELL;
    const rad = e.r * CELL;

    if (e.elite || e.boss) {
      ctx.beginPath();
      ctx.arc(ex, ey, rad + 6, 0, Math.PI * 2);
      ctx.fillStyle = e.boss ? 'rgba(255,65,50,0.22)' : 'rgba(190,102,255,0.22)';
      ctx.fill();
    }
    ctx.beginPath();
    ctx.arc(ex, ey, rad, 0, Math.PI * 2);
    ctx.fillStyle = e.flash > 0 ? '#ffffff' : e.freezeT > 0 ? '#8ceeff' : e.col;
    ctx.fill();
    ctx.strokeStyle = e.slowT > 0 ? '#7ce8ff' : e.rim;
    ctx.lineWidth = (e.boss || e.elite) ? 3 : 1.8;
    ctx.stroke();

    // HP Bar for damaged / elites / bosses
    if (e.hp < e.maxHp || e.elite || e.boss) {
      const bw = e.boss ? 48 : e.elite ? 32 : 20;
      const r = clamp(e.hp / e.maxHp, 0, 1);
      ctx.fillStyle = 'rgba(0,0,0,0.72)';
      ctx.fillRect(ex - bw/2, ey - rad - 9, bw, 4.5);
      ctx.fillStyle = e.boss ? '#ff4f42' : e.elite ? '#d284ff' : '#ff7b61';
      ctx.fillRect(ex - bw/2 + 0.5, ey - rad - 8.5, (bw - 1) * r, 3.5);
    }
  }
}

function drawPickups(){
  for (const g of game.gems) {
    const gx = g.x * CELL, gy = g.y * CELL;
    const s = g.big ? 6 : 4;
    ctx.fillStyle = g.big ? '#ffe478' : '#6ef4ff';
    ctx.beginPath();
    ctx.moveTo(gx, gy - s); ctx.lineTo(gx + s * 0.8, gy); ctx.lineTo(gx, gy + s); ctx.lineTo(gx - s * 0.8, gy); ctx.closePath();
    ctx.fill();
  }
  for (const c of game.chests) {
    const cx = c.x * CELL, cy = c.y * CELL + Math.sin(c.bob) * 3;
    ctx.beginPath();
    ctx.arc(cx, cy, 16, 0, Math.PI * 2);
    ctx.fillStyle = c.legend ? 'rgba(255,196,64,0.3)' : 'rgba(196,120,255,0.28)';
    ctx.fill();
    ctx.font = '20px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(c.legend ? '👑' : '📦', cx, cy);
  }
}

function drawZones(){
  for (const z of game.zones) {
    const zx = z.x * CELL, zy = z.y * CELL, zr = z.r * CELL;
    if (z.kind === 'lava') {
      ctx.beginPath(); ctx.arc(zx, zy, zr, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,95,35,${0.25 * (z.t / z.max)})`; ctx.fill();
    } else if (z.kind === 'bossSlam') {
      const prog = 1 - z.t / z.max;
      ctx.beginPath(); ctx.arc(zx, zy, zr, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,55,40,0.16)'; ctx.fill();
      ctx.strokeStyle = '#ff5642'; ctx.lineWidth = 2.5; ctx.stroke();
      ctx.beginPath(); ctx.arc(zx, zy, zr * prog, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,70,50,0.28)'; ctx.fill();
    }
  }
}

function drawProjectilesBeamsBolts(){
  for (const p of game.projectiles) {
    const px = p.x * CELL, py = p.y * CELL;
    if (p.kind === 'firewave') {
      const a = Math.atan2(p.vy, p.vx);
      ctx.save(); ctx.translate(px, py); ctx.rotate(a);
      ctx.beginPath(); ctx.arc(0, 0, 14, -1.1, 1.1);
      ctx.strokeStyle = '#ff8c42'; ctx.lineWidth = 5; ctx.stroke();
      ctx.strokeStyle = '#fff0a0'; ctx.lineWidth = 2; ctx.stroke();
      ctx.restore();
    } else if (p.kind === 'arrow') {
      const a = Math.atan2(p.vy, p.vx);
      ctx.save(); ctx.translate(px, py); ctx.rotate(a);
      ctx.strokeStyle = '#8ef8c6'; ctx.lineWidth = 2.8;
      ctx.beginPath(); ctx.moveTo(-7, 0); ctx.lineTo(7, 0); ctx.stroke();
      ctx.restore();
    } else if (p.kind === 'fireball') {
      ctx.beginPath(); ctx.arc(px, py, 6.5, 0, Math.PI * 2);
      ctx.fillStyle = '#ff7b38'; ctx.fill();
      ctx.strokeStyle = '#fff09c'; ctx.lineWidth = 1.6; ctx.stroke();
    } else if (p.kind === 'frostball') {
      ctx.beginPath(); ctx.arc(px, py, 5.5, 0, Math.PI * 2);
      ctx.fillStyle = '#7beeff'; ctx.fill();
    } else if (p.kind === 'enemyShot') {
      ctx.beginPath(); ctx.arc(px, py, 4.5, 0, Math.PI * 2);
      ctx.fillStyle = '#ff66c4'; ctx.fill();
    }
  }
  for (const b of game.beams) {
    const alpha = b.t / b.max;
    ctx.save();
    ctx.strokeStyle = `rgba(255,232,120,${alpha})`;
    ctx.lineWidth = b.w * alpha;
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(b.x1 * CELL, b.y1 * CELL); ctx.lineTo(b.x2 * CELL, b.y2 * CELL); ctx.stroke();
    ctx.strokeStyle = `rgba(255,255,255,${alpha})`;
    ctx.lineWidth = Math.max(1.5, b.w * 0.35 * alpha);
    ctx.stroke();
    ctx.restore();
  }
  for (const l of game.bolts) {
    const alpha = l.t / l.max;
    ctx.save();
    ctx.strokeStyle = l.col;
    ctx.globalAlpha = alpha;
    ctx.lineWidth = 3;
    ctx.beginPath();
    l.pts.forEach((pt, i) => {
      const lx = pt.x * CELL + (i > 0 ? (Math.random()-0.5)*7 : 0);
      const ly = pt.y * CELL + (i > 0 ? (Math.random()-0.5)*7 : 0);
      if (i === 0) ctx.moveTo(lx, ly); else ctx.lineTo(lx, ly);
    });
    ctx.stroke();
    ctx.restore();
  }
}

function drawRingsAndFloats(){
  for (const r of game.rings) {
    const u = 1 - r.t / r.max;
    ctx.beginPath();
    ctx.arc(r.x * CELL, r.y * CELL, Math.max(4, r.r * CELL * (0.28 + 0.72 * u)), 0, Math.PI * 2);
    ctx.strokeStyle = r.col;
    ctx.globalAlpha = 1 - u;
    ctx.lineWidth = 3 * (1 - u * 0.5);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
  ctx.textAlign = 'center';
  for (const f of game.floats) {
    const alpha = clamp(f.t / f.max * 1.4, 0, 1);
    ctx.globalAlpha = alpha;
    ctx.font = f.big ? '900 15px sans-serif' : '800 12px sans-serif';
    ctx.fillStyle = '#000';
    ctx.fillText(f.txt, f.x * CELL + 1, f.y * CELL + 1);
    ctx.fillStyle = f.col;
    ctx.fillText(f.txt, f.x * CELL, f.y * CELL);
  }
  ctx.globalAlpha = 1;
}

/* ==================== UI RENDERING (ZERO-FLICKER RECONCILIATION) ==================== */
function syncOffsets(){
  const topH = $('topbar').getBoundingClientRect().height || 52;
  document.documentElement.style.setProperty('--top-h', `${Math.ceil(topH)}px`);
  const subB = $('subbar').getBoundingClientRect().bottom || (topH + 44);
  document.documentElement.style.setProperty('--sub-bottom', `${Math.ceil(subB)}px`);
}

function renderAllUI(force = false){
  if (!game) return;
  const h = game.hero;
  const isWave = game.phase === 'wave';

  // Top bar plain-text updates (zero DOM destruction!)
  const wp = $('wavePill');
  wp.textContent = game.endless
    ? `无尽第 ${game.wave} 波 · ${isWave ? '激战中' : '备战'}`
    : `第 ${game.wave} / ${MAIN_WAVES} 波 · ${isWave ? '激战中' : '备战'}`;
  wp.className = 'pill ' + (game.endless ? 'wave-endless' : isWave ? 'wave-live' : 'wave-prep');
  const goldTxt = `💰 ${game.gold}`;
  if ($('goldPill').textContent !== goldTxt) {
    $('goldPill').textContent = goldTxt;
    $('dockGoldNum').textContent = game.gold;
    for (const el of [$('goldPill'), $('dockGold')]) {
      el.classList.remove('gold-bump'); void el.offsetWidth; el.classList.add('gold-bump');
    }
  }
  const cp = $('castlePill');
  cp.textContent = `🏰 圣堡 ${Math.ceil(game.castleHp)}/${game.castleMax}`;
  cp.className = 'pill' + (game.castleHp < game.castleMax * 0.4 ? ' warn' : '');
  $('heroLvTxt').textContent = `⚔️ 领主 Lv.${h.lv}`;
  $('xpFill').style.width = `${clamp((h.xp / h.xpNext) * 100, 0, 100)}%`;

  const rem = game.enemies.length + game.waveQueue.filter(w => !w.spawned).length;
  $('enemyPill').hidden = !isWave;
  if (isWave) $('enemyPill').textContent = `👾 剩余 ${rem}`;

  $('speedBtn').textContent = `${game.speed}×`;
  $('speedBtn').classList.toggle('active', game.speed === 2);
  $('pauseBtn').textContent = paused ? '继续' : '暂停';
  $('soundBtn').textContent = AudioKit.enabled ? '🔊' : '🔇';
  $('heroPanelBtn').textContent = `👑 领主装备 (${h.gear.length}/3)`;
  $('heroPanelBtn').classList.toggle('active', game.inspTarget?.type === 'hero' || game.mode?.type === 'equip');
  $('autoWaveBtn').textContent = `自动下波：${game.autoWave ? '开' : '关'}`;
  $('autoWaveBtn').classList.toggle('active', game.autoWave);

  // Cooldown masks
  const dc = $('dashCd');
  if (h.dashCd > 0) { dc.hidden = false; dc.textContent = `${h.dashCd.toFixed(1)}s`; } else dc.hidden = true;
  const uc = $('ultCd');
  if (h.ultTimer > 0) { uc.hidden = false; uc.textContent = `🔥${h.ultTimer.toFixed(1)}s`; }
  else if (h.ultCd > 0) { uc.hidden = false; uc.textContent = `${h.ultCd.toFixed(1)}s`; }
  else uc.hidden = true;

  // Wave start button
  const wb = $('waveBtn');
  wb.disabled = isWave || ['won','lost'].includes(game.phase);
  $('waveBtnNm').textContent = isWave ? `第 ${game.wave} 波激战` : `开始第 ${game.wave} 波`;
  $('waveBtnSb').textContent = isWave ? `剩余 ${rem} 敌` : (game.wave % 5 === 0 ? '⚠️ 首领波' : '免费移塔/合星');

  // Reroll button
  $('rerollBtn').disabled = game.gold < game.rerollCost;
  $('rerollCost').textContent = `${game.rerollCost} 金币`;

  // Sub hint
  if (game.mode?.type === 'buy') {
    const sp = TOWERS[game.shop[game.mode.shopIdx].kind];
    $('subHint').textContent = `点发光塔基放置【${sp.name}】，或点同名 1★ 塔直接秒合 2★！（右键/Esc取消）`;
  } else if (game.mode?.type === 'move') {
    $('subHint').textContent = '点任意塔基免费搬迁/互换，点同名同星塔直接合星！（右键/Esc取消）';
  } else if (game.mode?.type === 'equip') {
    const bk = game.bag[game.mode.bagIdx];
    const g = bk ? GEARS[gearBase(bk)] : null;
    $('subHint').textContent = `点城内高亮防御塔，或点右上「👑 领主装备」穿戴【${g?.name || ''}】！（右键/Esc取消）`;
  } else if (isWave) {
    $('subHint').textContent = 'WASD 或按住屏幕走位割草 · 战斗中也能随时买塔合星装装备！';
  } else {
    $('subHint').textContent = '底栏抽塔摆阵凑 2/4 元素羁绊 · 准备好点右下「开始下一波」冲进怪海！';
  }

  renderSynergies(force);
  renderShop(force);
  renderBag(force);
  renderInspector(force);
  syncOffsets();
}

function renderSynergies(force){
  const counts = getSynergyCounts();
  const key = Object.entries(counts).map(([k,v])=>`${k}:${v}`).join('|');
  if (!force && key === lastSynKey) return;
  lastSynKey = key;
  const wrap = $('synStrip');
  wrap.replaceChildren();
  for (const el of Object.values(ELEMENTS)) {
    const n = counts[el.key];
    const tier = n >= 4 ? 2 : n >= 2 ? 1 : 0;
    const pill = document.createElement('span');
    pill.className = 'syn-pill' + (tier === 2 ? ' t2' : tier === 1 ? ' t1' : '');
    pill.style.setProperty('--syn-c', el.color);
    pill.title = `${el.name}羁绊（按星级计权 1★=1, 2★=2, 3★=4）\n[2层] ${el.t1}\n[4层] ${el.t2}`;
    pill.textContent = `${el.icon} ${el.name} ${n}/${n >= 2 ? 4 : 2}`;
    wrap.append(pill);
  }
}

let shopCardNodes = null;
function renderShop(force){
  const mergeFlags = game.shop.map(s => !s.bought && game.towers.some(t => t.kind === s.kind && t.star === 1) ? 1 : 0);
  const key = game.shop.map((s,i)=>`${s.uid}:${s.bought?1:0}:${s.cost}:${mergeFlags[i]}:${game.gold>=s.cost?1:0}:${game.mode?.type==='buy'&&game.mode.shopIdx===i?1:0}`).join('|');
  if (!force && key === lastShopKey) return;
  lastShopKey = key;

  const sec = $('shopSec');
  if (!shopCardNodes) {
    sec.replaceChildren();
    shopCardNodes = [];
    for (let idx = 0; idx < 4; idx++) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'shop-card';
      btn.dataset.shopIdx = String(idx);
      btn.innerHTML = `<span class="elem-dot"></span><span class="merge-tag" hidden>★ 可合2★</span><span class="ic"></span><span class="nm"></span><span class="cost"></span>`;
      btn.addEventListener('click', () => {
        AudioKit.unlock();
        if (game.shop[idx]?.bought) return;
        game.mode = (game.mode?.type === 'buy' && game.mode.shopIdx === idx) ? null : { type:'buy', shopIdx: idx };
        renderAllUI();
      });
      sec.append(btn);
      shopCardNodes.push({
        btn,
        tag: btn.querySelector('.merge-tag'),
        ic: btn.querySelector('.ic'),
        nm: btn.querySelector('.nm'),
        cost: btn.querySelector('.cost')
      });
    }
  }
  game.shop.forEach((item, idx) => {
    const node = shopCardNodes[idx];
    if (!node) return;
    const spec = TOWERS[item.kind];
    const el = ELEMENTS[spec.elem];
    const active = game.mode?.type === 'buy' && game.mode.shopIdx === idx;
    const canMerge = mergeFlags[idx] === 1;
    node.btn.className = 'shop-card' + (active ? ' active' : '') + (canMerge ? ' mergeable' : '');
    node.btn.style.setProperty('--elem-c', el.color);
    node.btn.disabled = item.bought || game.gold < item.cost;
    node.btn.title = `${spec.name}（${el.name}）\n${spec.desc}`;
    node.tag.hidden = !canMerge;
    node.ic.textContent = spec.icon;
    node.nm.textContent = item.bought ? '已购买' : spec.name;
    node.cost.textContent = item.bought ? '—' : `${item.cost} 金${item.disc ? ' 折' : ''}`;
  });
}

function renderBag(force){
  const key = game.bag.map((k,i) => `${k}:${game.mode?.type==='equip'&&game.mode.bagIdx===i?1:0}`).join('|');
  if (!force && key === lastBagKey) return;
  lastBagKey = key;

  const tray = $('bagTray');
  tray.replaceChildren();
  if (!game.bag.length) {
    const sp = document.createElement('div');
    sp.className = 'bag-empty';
    sp.textContent = '构装背包空\n打精英爆装';
    tray.append(sp);
    return;
  }
  game.bag.forEach((gk, idx) => {
    const g = GEARS[gearBase(gk)];
    const star = gearStar(gk);
    const active = game.mode?.type === 'equip' && game.mode.bagIdx === idx;
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'bag-item' + (g.rarity === 'legend' ? ' legend' : '') + (active ? ' active' : '');
    btn.dataset.bagIdx = String(idx);
    btn.title = `${gearLabel(gk)}：${g.desc}${star > 1 ? `\n叠星效果 ×${GEAR_STAR_MULT[star - 1]}` : ''}\n同名再选自动叠星（最高 3★）`;
    btn.innerHTML = `<span class="ic">${g.icon}</span><span class="nm">${g.name}</span>${star > 1 ? `<span class="star-tag">${star}★</span>` : ''}`;
    btn.addEventListener('click', () => {
      game.mode = (game.mode?.type === 'equip' && game.mode.bagIdx === idx) ? null : { type:'equip', bagIdx: idx };
      renderAllUI();
    });
    tray.append(btn);
  });
}

function renderInspector(force){
  const panel = $('inspector');
  if (!game.inspTarget) {
    if (!panel.hidden) { panel.hidden = true; lastInspKey = ''; }
    return;
  }
  if (game.inspTarget.type === 'tower') {
    const t = game.towers.find(o => o.id === game.inspTarget.id);
    if (!t) { game.inspTarget = null; panel.hidden = true; lastInspKey = ''; return; }
    const partner = findMergePartner(t);
    const key = ['T', t.id, t.star, t.gear.join(','), partner ? 1 : 0, game.bag.length, game.mode?.type || '', Math.floor(t.dmgDealt / 50)].join('|');
    if (!force && key === lastInspKey && !panel.hidden) return;
    lastInspKey = key;
    panel.hidden = false;

    const spec = TOWERS[t.kind], el = ELEMENTS[t.elem], st = getTowerStats(t);
    $('inspTitle').textContent = `${spec.icon} ${spec.name} ${'★'.repeat(t.star)}`;
    $('inspSub').textContent = `[${el.name}系] ${spec.desc}`;
    $('inspStats').innerHTML = `
      <div class="stat-box">攻击伤害 <b>${st.dmg}</b></div>
      <div class="stat-box">攻击间隔 <b>${st.cd.toFixed(2)}s</b></div>
      <div class="stat-box">覆盖射程 <b>${st.range} 格</b></div>
      <div class="stat-box">累计输出 <b>${t.dmgDealt.toLocaleString()}</b></div>
    `;
    const slots = $('inspSlots');
    slots.replaceChildren();
    for (let s = 0; s < 2; s++) {
      const gk = t.gear[s];
      const sb = document.createElement('button');
      sb.type = 'button';
      sb.className = 'gear-slot' + (gk ? ' filled' : '');
      sb.innerHTML = gk ? `<span style="font-size:16px">${GEARS[gearBase(gk)].icon}</span><span>${gearLabel(gk)}</span>` : '<span>+ 空构装槽</span><span style="font-size:9.5px">点此装入背包首件</span>';
      sb.addEventListener('click', () => {
        if (gk) unequipGear({ type:'tower', id: t.id }, s);
        else if (game.bag.length) equipGearFromBag(game.mode?.type === 'equip' ? game.mode.bagIdx : 0, { type:'tower', id: t.id });
        else toast('构装背包为空，击败精英怪即可爆出装备宝箱！', true);
      });
      slots.append(sb);
    }
    const acts = $('inspActions');
    acts.replaceChildren();
    if (partner) {
      const mb = document.createElement('button');
      mb.type = 'button'; mb.className = 'btn gold full'; mb.dataset.act = 'merge';
      mb.innerHTML = `<span>★ 一键合成 ${t.star + 1}★ 质变！</span><small>融合场上另一座同星 ${spec.name}</small>`;
      mb.addEventListener('click', () => mergeTowerAction(t.id));
      acts.append(mb);
    }
    const mv = document.createElement('button');
    mv.type = 'button'; mv.className = 'btn' + (game.mode?.type === 'move' ? ' active' : ''); mv.dataset.act = 'move';
    mv.innerHTML = `<span>移动塔位</span><small>免费搬迁/互换</small>`;
    mv.addEventListener('click', () => {
      game.mode = game.mode?.type === 'move' ? null : { type:'move', towerId: t.id };
      renderAllUI();
    });
    acts.append(mv);

    const sell = document.createElement('button');
    sell.type = 'button'; sell.className = 'btn danger'; sell.dataset.act = 'sell';
    const mult = t.star === 3 ? 4 : t.star === 2 ? 2 : 1;
    sell.innerHTML = `<span>出售返还</span><small>+${Math.round(spec.cost * mult * 0.8)} 金</small>`;
    sell.addEventListener('click', () => sellTower(t.id));
    acts.append(sell);
    $('inspSkills').replaceChildren();
    return;
  }

  // Hero Inspector
  const h = game.hero, hs = getHeroStats();
  const skSig = Object.entries(h.skills).map(([k,v])=>`${k}${v}`).join(',');
  const key = ['H', h.lv, h.gear.join(','), skSig, game.bag.length, game.mode?.type || ''].join('|');
  if (!force && key === lastInspKey && !panel.hidden) return;
  lastInspKey = key;
  panel.hidden = false;

  $('inspTitle').textContent = `👑 边境领主 · Lv.${h.lv}`;
  $('inspSub').textContent = '冲进怪海自动割草、吸经验球升级神技，也可穿戴 3 件构装成为满屏主 C！';
  $('inspStats').innerHTML = `
    <div class="stat-box">伤害倍率 <b>${Math.round(hs.dmgMult * 100)}%</b></div>
    <div class="stat-box">攻速倍率 <b>${Math.round(hs.aspd * 100)}%</b></div>
    <div class="stat-box">暴击 / 暴伤 <b>${Math.round(hs.crit*100)}% / ${Math.round(hs.critDmg*100)}%</b></div>
    <div class="stat-box">磁铁范围 <b>${hs.magnet.toFixed(1)} 格</b></div>
  `;
  const slots = $('inspSlots');
  slots.replaceChildren();
  for (let s = 0; s < 3; s++) {
    const gk = h.gear[s];
    const sb = document.createElement('button');
    sb.type = 'button';
    sb.className = 'gear-slot' + (gk ? ' filled' : '');
    sb.innerHTML = gk ? `<span style="font-size:16px">${GEARS[gearBase(gk)].icon}</span><span>${gearLabel(gk)}</span>` : '<span>+ 空槽</span><span style="font-size:9.5px">点此穿戴</span>';
    sb.addEventListener('click', () => {
      if (gk) unequipGear({ type:'hero' }, s);
      else if (game.bag.length) equipGearFromBag(game.mode?.type === 'equip' ? game.mode.bagIdx : 0, { type:'hero' });
      else toast('构装背包为空，击败第 2 波起的紫名精英即可爆装！', true);
    });
    slots.append(sb);
  }
  $('inspActions').replaceChildren();
  const sl = $('inspSkills');
  sl.replaceChildren();
  for (const [k, lv] of Object.entries(h.skills)) {
    const row = document.createElement('div');
    row.className = 'skill-row';
    row.innerHTML = `<span>${HERO_SKILLS[k].icon} ${HERO_SKILLS[k].name}</span><span class="lv">Lv.${lv} / 5</span>`;
    sl.append(row);
  }
}

/* ==================== INPUT HANDLING ==================== */
function handleCanvasClick(wx, wy){
  const gx = Math.floor(wx), gy = Math.floor(wy);
  if (game.mode?.type === 'buy') { buyAndPlaceTower(game.mode.shopIdx, gx, gy); return; }
  if (game.mode?.type === 'move') { moveTowerTo(game.mode.towerId, gx, gy); return; }
  if (game.mode?.type === 'equip') {
    const t = towerAt(gx, gy);
    if (t) { equipGearFromBag(game.mode.bagIdx, { type:'tower', id: t.id }); return; }
    if (dist({x:wx,y:wy}, game.hero) <= 1.2) { equipGearFromBag(game.mode.bagIdx, { type:'hero' }); return; }
    toast('请点击城内高亮防御塔或领主进行穿戴，右键取消。', true);
    return;
  }
  // Clicking a tower selects it
  const t = towerAt(gx, gy);
  if (t) {
    game.inspTarget = (game.inspTarget?.type === 'tower' && game.inspTarget.id === t.id) ? null : { type:'tower', id: t.id };
    renderAllUI();
    return;
  }
  // Otherwise move Hero smoothly to clicked location!
  game.hero.goal = { x: clamp(wx, 0.45, W - 0.45), y: clamp(wy, 0.45, H - 0.45) };
}

canvas.addEventListener('pointerdown', e => {
  if (e.button !== 0) return;
  AudioKit.unlock();
  const w = screenToWorld(e.clientX, e.clientY);
  pointerWorld = w;
  pointerDown = true;
  handleCanvasClick(w.x, w.y);
});
window.addEventListener('pointermove', e => {
  pointerWorld = screenToWorld(e.clientX, e.clientY);
});
window.addEventListener('pointerup', () => { pointerDown = false; });
canvas.addEventListener('contextmenu', e => {
  if (game?.mode) { e.preventDefault(); game.mode = null; renderAllUI(); }
});

window.addEventListener('keydown', e => {
  if (!game) return;
  const k = e.key.toLowerCase();
  keys.add(k);
  if (k === 'escape') {
    if (game.mode) { game.mode = null; renderAllUI(); }
    else if (game.inspTarget) { game.inspTarget = null; renderAllUI(); }
    else if (paused) { paused = false; renderAllUI(); }
    return;
  }
  if (game.activeModal) return;
  if (k === ' ' || k === 'e') { e.preventDefault(); castHeroDash(); return; }
  if (k === 'r') { castHeroOverdrive(); return; }
  if (k === 'q') { rollShop(false); return; }
  if (k === 'enter' && game.phase === 'prep') { startWave(); return; }
  if (k === 'f') { game.speed = game.speed === 2 ? 1 : 2; renderAllUI(); return; }
});
window.addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));

// Static button listeners
$('speedBtn').addEventListener('click', () => { game.speed = game.speed === 2 ? 1 : 2; renderAllUI(); });
$('pauseBtn').addEventListener('click', () => { paused = !paused; renderAllUI(); });
$('soundBtn').addEventListener('click', () => { AudioKit.enabled = !AudioKit.enabled; renderAllUI(); });
$('helpBtn').addEventListener('click', showIntroModal);
$('resetBtn').addEventListener('click', () => startNewRun());
$('dashBtn').addEventListener('click', castHeroDash);
$('ultBtn').addEventListener('click', castHeroOverdrive);
$('rerollBtn').addEventListener('click', () => rollShop(false));
$('waveBtn').addEventListener('click', startWave);
$('inspClose').addEventListener('click', () => { game.inspTarget = null; if (game.mode?.type === 'move') game.mode = null; renderAllUI(); });
$('heroPanelBtn').addEventListener('click', () => {
  if (game.mode?.type === 'equip') {
    equipGearFromBag(game.mode.bagIdx, { type:'hero' });
    return;
  }
  game.inspTarget = game.inspTarget?.type === 'hero' ? null : { type:'hero' };
  renderAllUI();
});
$('autoWaveBtn').addEventListener('click', () => {
  game.autoWave = !game.autoWave;
  if (game.autoWave && game.phase === 'prep') game.autoWaveTimer = 2.0;
  renderAllUI();
});
window.addEventListener('resize', () => { fitCamera(); syncOffsets(); });

/* ==================== MAIN LOOP ==================== */
let lastTs = performance.now(), uiAccum = 0;
function loop(ts){
  const rawDt = Math.min(0.05, (ts - lastTs) / 1000);
  lastTs = ts;
  if (game) {
    const steps = game.speed === 2 ? 2 : 1;
    for (let i = 0; i < steps; i++) tick(rawDt);
    render();
    uiAccum += rawDt;
    if (uiAccum >= 0.14) {
      uiAccum = 0;
      renderAllUI(false);
    }
  }
  requestAnimationFrame(loop);
}

/* ==================== BOOT & QA EXPORT ==================== */
startNewRun(2026);
showIntroModal();
requestAnimationFrame(loop);

window.BG51 = {
  get game(){ return game; },
  startNewRun, startWave, rollShop, buyAndPlaceTower, mergeTowerAction, moveTowerTo, sellTower,
  equipGearFromBag, unequipGear, castHeroDash, castHeroOverdrive, pickHeroSkill, pickGearReward,
  grantGear, gearBase, gearStar, gearLabel, findGearStackTarget, GEAR_STAR_MULT,
  enterEndlessMode, tick, getSynergyCounts, getTowerStats, getHeroStats, worldToScreen,
  TOWERS, ELEMENTS, GEARS, HERO_SKILLS, PEDESTALS, MAIN_WAVES
};
window.BG50 = window.BG51; // backward-compat alias for existing test harnesses
})();
</script>
