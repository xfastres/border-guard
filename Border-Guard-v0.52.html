<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>边境守卫 v0.52 · 境界渡劫 × 五行灵印割草</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23121e24'/%3E%3Ctext x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-size='38'%3E%E2%9A%94%EF%B8%8F%3C/text%3E%3C/svg%3E" />
<style>
  :root{
    --bg:#0d1519;
    --panel:rgba(13,22,27,0.92);
    --panel-strong:rgba(10,17,22,0.96);
    --line:rgba(182,218,214,0.22);
    --text:#eef6f4;
    --muted:#95b3ae;
    --gold:#ffd666;
    --gold-deep:#d99a26;
    --danger:#ff6b57;
    --good:#7ce896;
    --wind:#72f2b4;
    --fire:#ff7b47;
    --frost:#6ce2ff;
    --thunder:#c68cff;
    --holy:#ffe478;
    --top-h:52px;
    --sub-bottom:96px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{
    margin:0;padding:0;width:100%;height:100%;overflow:hidden;
    background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    user-select:none;
  }
  canvas{display:block;width:100vw;height:100vh;touch-action:none;cursor:crosshair}

  /* Top Bar */
  .topbar{
    position:fixed;top:0;left:0;right:0;z-index:20;
    min-height:50px;padding:6px 12px;
    background:linear-gradient(180deg,rgba(8,14,18,0.97),rgba(11,20,25,0.88));
    border-bottom:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;
    backdrop-filter:blur(8px);
  }
  .top-left,.top-mid,.top-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:6px;font-weight:900;font-size:15px;letter-spacing:.3px;white-space:nowrap}
  .brand .ver{font-size:11px;font-weight:800;color:#121b18;background:linear-gradient(135deg,#ffe27a,#f4a636);padding:2px 7px;border-radius:999px}
  .pill{
    display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;
    font-size:12px;font-weight:800;border:1px solid var(--line);background:rgba(255,255,255,0.06);
    white-space:nowrap;
  }
  .pill[hidden]{display:none}
  .pill.wave-prep{border-color:rgba(124,232,150,0.45);color:#c4ffd2;background:rgba(38,108,65,0.28)}
  .pill.wave-live{border-color:rgba(255,112,88,0.58);color:#ffd2c9;background:rgba(145,42,30,0.42)}
  .pill.wave-endless{border-color:rgba(198,140,255,0.62);color:#ebd4ff;background:rgba(98,42,145,0.42)}
  .pill.gold{
    border-color:rgba(255,214,102,0.8);color:#ffe89c;
    background:linear-gradient(180deg,rgba(158,112,26,0.55),rgba(112,78,16,0.45));
    font-size:15px;padding:5px 14px;font-weight:900;letter-spacing:.3px;
    box-shadow:0 0 12px rgba(255,214,102,0.22);
  }
  @keyframes goldBump{0%{transform:scale(1)}35%{transform:scale(1.14)}100%{transform:scale(1)}}
  .gold-bump{animation:goldBump .28s ease}
  .dock-gold{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
    min-width:66px;padding:6px 10px;border-radius:11px;flex-shrink:0;overflow:hidden;
    border:1px solid rgba(255,214,102,0.6);background:rgba(122,86,18,0.38);color:#ffe89c;
  }
  .dock-gold .lbl{font-size:9.5px;color:#e3c47c;font-weight:800;white-space:nowrap}
  .dock-gold b{font-size:18px;line-height:1.1;font-weight:900;color:#ffd666;display:inline-block}
  .pill.warn{border-color:rgba(255,107,87,0.72);color:#ffd2ca;background:rgba(150,40,30,0.45)}
  .xp-wrap{display:flex;align-items:center;gap:6px}
  .xp-bar{width:74px;height:7px;border-radius:999px;background:rgba(255,255,255,0.12);overflow:hidden;border:1px solid rgba(108,226,255,0.3)}
  .xp-fill{height:100%;width:0%;background:linear-gradient(90deg,#4cc9ff,#a4f4ff);transition:width .15s}

  .btn{
    appearance:none;border:1px solid var(--line);background:rgba(24,40,48,0.92);color:var(--text);
    padding:6px 10px;border-radius:9px;font-size:12px;font-weight:700;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;gap:5px;
    transition:transform .08s,background .12s,border-color .12s;
  }
  .btn:hover:not(:disabled){background:rgba(39,65,78,0.96);border-color:rgba(210,240,235,0.45)}
  .btn:active:not(:disabled){transform:translateY(1px)}
  .btn:disabled{opacity:.42;cursor:not-allowed}
  .btn.active{background:rgba(235,180,60,0.26);border-color:var(--gold);color:#fff2bd}
  .btn.gold{background:linear-gradient(180deg,#ffdb72,#d89626);border-color:#fff0b3;color:#1f1606;font-weight:900}
  .btn.gold:hover:not(:disabled){background:linear-gradient(180deg,#ffe594,#e6a634)}
  .btn.purple{background:linear-gradient(180deg,#b77dff,#7940c7);border-color:#e6ccff;color:#fff;font-weight:900}
  .btn.danger{background:rgba(155,44,34,0.88);border-color:rgba(255,142,126,0.55);color:#ffe4df}

  /* Subbar: Synergies + Hero Button */
  .subbar{
    position:fixed;top:calc(var(--top-h) + 6px);left:12px;right:12px;z-index:18;
    display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;
    pointer-events:none;
  }
  .syn-strip,.sub-actions{
    pointer-events:auto;display:flex;align-items:center;gap:6px;flex-wrap:wrap;
    padding:5px 9px;border-radius:12px;background:var(--panel);border:1px solid var(--line);
    box-shadow:0 8px 22px rgba(0,0,0,0.34);backdrop-filter:blur(6px);
  }
  .syn-pill{
    display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:999px;
    font-size:11.5px;font-weight:800;border:1px solid rgba(255,255,255,0.12);
    background:rgba(255,255,255,0.04);color:#8aa6a2;cursor:help;position:relative;
  }
  .syn-pill.t1{color:#fff;border-color:var(--syn-c);background:rgba(255,255,255,0.11);box-shadow:0 0 10px rgba(255,255,255,0.12)}
  .syn-pill.t2{color:#12191d;border-color:#fff;background:var(--syn-c);box-shadow:0 0 14px var(--syn-c)}
  .hint-txt{font-size:12px;color:#cde4de;font-weight:700;padding:0 4px}
  .art-strip{display:flex;align-items:center;gap:4px}
  .art-chip{
    display:inline-flex;align-items:center;gap:3px;padding:3px 7px;border-radius:8px;
    border:1px solid rgba(182,218,214,0.28);background:rgba(20,34,42,0.92);color:#eef6f4;
    font-size:11px;font-weight:800;cursor:pointer;transition:border-color .12s,transform .08s;
  }
  .art-chip:hover{border-color:var(--gold);transform:translateY(-1px)}
  .art-chip.active{border-color:#fff;box-shadow:0 0 0 2px rgba(255,214,102,0.45)}
  .art-chip.mergeable{border-color:#ffe478;box-shadow:0 0 8px rgba(255,214,102,0.45)}
  .art-chip.empty{border-style:dashed;opacity:.45;cursor:default;pointer-events:none}
  .skill-strip{display:flex;align-items:center;gap:4px}
  .sk-chip{
    display:inline-flex;align-items:center;gap:2px;padding:3px 6px;border-radius:8px;
    border:1px solid rgba(108,226,255,0.36);background:rgba(20,42,54,0.92);color:#d8f8ff;
    font-size:11px;font-weight:800;cursor:pointer;
  }
  .sk-chip:hover{border-color:var(--gold)}
  .sk-chip b{color:#ffe478;font-size:10px}
  .pill.hp{border-color:rgba(110,242,158,0.55);color:#ccffde;background:rgba(28,96,56,0.36);font-weight:900}
  .pill.fps{font-size:10.5px;color:#9bc4bc;border-color:rgba(182,218,214,0.16);padding:3px 7px}
  .pill.realm-btn{color:var(--text);cursor:pointer;transition:transform .1s,box-shadow .15s,border-color .15s}
  .pill.realm-btn:hover{border-color:var(--gold)}
  @keyframes tribPulse{0%,100%{box-shadow:0 0 8px rgba(255,214,102,0.55);transform:scale(1)}50%{box-shadow:0 0 20px rgba(255,214,102,0.95);transform:scale(1.04)}}
  .pill.trib-ready{
    border-color:#ffe478;color:#1e1304;background:linear-gradient(135deg,#ffe788,#ffaa38);
    font-weight:900;animation:tribPulse 1.35s infinite;
  }
  .pill.trib-full{
    border-color:#ff7e52;color:#fff4dc;background:linear-gradient(135deg,#ff6a38,#d93829);
    font-weight:900;animation:tribPulse .9s infinite;
  }
  .pill.trib-ready .xp-bar,.pill.trib-full .xp-bar{border-color:rgba(0,0,0,0.35);background:rgba(0,0,0,0.22)}
  .pill.trib-ready .xp-fill{background:#fff8d6}
  .pill.trib-full .xp-fill{background:#ffe878}
  .seal-badge{
    display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:10px;
    border:1px solid rgba(182,218,214,0.32);background:rgba(20,34,42,0.94);color:#eef6f4;
    font-size:11.5px;font-weight:800;cursor:pointer;transition:border-color .12s;
  }
  .seal-badge:hover{border-color:var(--gold)}
  .seal-badge .tier-tag{padding:1px 6px;border-radius:999px;font-size:10px;font-weight:900;background:rgba(255,214,102,0.2);color:#ffe478}
  .sub-seal-chip{
    display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:9px;
    border:1px solid rgba(182,218,214,0.28);background:rgba(16,28,35,0.92);color:#d7ebe6;
    font-size:11px;font-weight:800;cursor:pointer;transition:border-color .12s,transform .08s;
  }
  .sub-seal-chip:hover{border-color:var(--gold);transform:translateY(-1px)}
  .sub-seal-chip.empty{border-style:dashed;opacity:.62;color:#92b2ac}
  .sub-seal-chip.locked{border-style:dotted;opacity:.45;cursor:default;color:#7b9490}
  .meta-badge{
    display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:9px;
    border:1px solid rgba(198,140,255,0.42);background:rgba(68,36,102,0.42);color:#ebd4ff;
    font-size:11px;font-weight:800;cursor:pointer;
  }
  .meta-badge:hover{border-color:#ffe478}
  .shop-card.pill-card{border-color:rgba(124,232,150,0.55);background:linear-gradient(180deg,rgba(24,68,54,0.95),rgba(14,36,30,0.95))}
  .shop-card.mend-card{border-color:rgba(255,146,96,0.8);background:linear-gradient(180deg,rgba(105,46,24,0.95),rgba(48,22,14,0.95));box-shadow:0 0 12px rgba(255,126,72,0.4)}
  .shop-card.locked-cap{opacity:.68}
  .choices.six{grid-template-columns:repeat(3,1fr);gap:8px}
  .choices.four{grid-template-columns:repeat(2,1fr);gap:10px}
  .choice-card.common{border-color:#6fd492;background:linear-gradient(180deg,rgba(28,68,46,0.58),rgba(16,32,24,0.95))}
  .choice-card.rare{border-color:#6ce2ff;background:linear-gradient(180deg,rgba(24,68,94,0.65),rgba(16,32,44,0.95))}
  .choice-card.epic{border-color:#d284ff;background:linear-gradient(180deg,rgba(78,36,118,0.65),rgba(24,18,38,0.95))}
  .choice-card .combo-tag{align-self:flex-start;padding:2px 7px;border-radius:999px;font-size:10px;font-weight:900;background:rgba(124,232,150,0.25);color:#c9ffd8}
  .choice-card .up-tag{align-self:flex-start;padding:2px 7px;border-radius:999px;font-size:10px;font-weight:900;background:linear-gradient(90deg,#ffda66,#ff9a44);color:#201202}
  .trib-box{display:flex;flex-direction:column;gap:10px;margin:10px 0}
  .trib-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .trib-tab{padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(24,40,48,0.85);color:#dceee9;cursor:pointer;text-align:left}
  .trib-tab.active{border-color:var(--gold);background:rgba(235,180,60,0.22);box-shadow:0 0 12px rgba(255,214,102,0.22)}
  .trib-tab b{display:block;font-size:13.5px;color:#ffe78f;margin-bottom:2px}
  .trib-tab small{font-size:11px;color:#b8d4ce}
  .trib-odds{padding:10px 12px;border-radius:12px;background:rgba(10,18,24,0.85);border:1px solid rgba(255,214,102,0.3)}
  .odds-bar{display:flex;height:14px;border-radius:999px;overflow:hidden;margin:6px 0;border:1px solid rgba(255,255,255,0.16)}
  .odds-bar .o-ren{background:#7ea8a6}.odds-bar .o-di{background:#52c8ff}.odds-bar .o-tian{background:linear-gradient(90deg,#ffda66,#ff8844)}
  .bet-grid{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .bet-chip{padding:5px 9px;border-radius:9px;border:1px solid rgba(198,140,255,0.4);background:rgba(48,28,72,0.5);color:#f4e8ff;font-size:11.5px;font-weight:800;cursor:pointer}
  .bet-chip.active{border-color:#ffe478;background:rgba(255,190,70,0.28);color:#fff6cc;box-shadow:0 0 8px rgba(255,214,102,0.35)}
  .trib-flash{position:fixed;inset:0;z-index:55;pointer-events:none;opacity:0;transition:opacity .28s}
  .trib-flash.show-gold{background:radial-gradient(circle,rgba(255,232,126,0.55),rgba(255,160,40,0.12));opacity:1}
  .trib-flash.show-fail{background:radial-gradient(circle,rgba(198,108,255,0.55),rgba(160,30,40,0.2));opacity:1}
  .trib-flash.show-dmg{background:radial-gradient(circle,rgba(255,60,40,0.02) 48%,rgba(255,48,36,0.42) 100%);opacity:1}
  @keyframes lowHpPulse{0%,100%{opacity:.42}50%{opacity:.82}}
  .hp-vignette{position:fixed;inset:0;z-index:16;pointer-events:none;opacity:0;background:radial-gradient(circle,rgba(255,30,20,0) 56%,rgba(205,24,18,0.55) 100%);transition:opacity .25s}
  .hp-vignette.danger{animation:lowHpPulse 1.1s infinite}
  .tel-table{width:100%;border-collapse:collapse;font-size:10px;margin-top:4px;color:#cde4df}
  .tel-table th,.tel-table td{padding:3px 4px;border-bottom:1px solid rgba(182,218,214,0.14);text-align:left;white-space:nowrap}
  .tel-table th{color:#ffe28a;font-weight:900}
  .tel-bar{display:inline-block;height:6px;border-radius:3px;vertical-align:middle;margin-right:3px}

  /* Left Permanent Build HUD */
  .left-hud{
    position:fixed;top:calc(var(--sub-bottom) + 8px);left:12px;z-index:21;
    width:248px;max-width:calc(100vw - 24px);max-height:calc(100vh - var(--sub-bottom) - 122px);
    overflow-y:auto;padding:9px 11px;border-radius:14px;
    background:rgba(10,17,22,0.80);border:1px solid rgba(182,218,214,0.28);
    box-shadow:0 12px 30px rgba(0,0,0,0.48);backdrop-filter:blur(8px);
    font-size:11px;line-height:1.4;
  }
  .left-hud.collapsed{width:auto;max-height:none;padding:6px 10px}
  .left-hud.collapsed .lh-body{display:none}
  .lh-head{display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:pointer;font-weight:900;font-size:12.5px;color:#ffe694}
  .lh-body{display:flex;flex-direction:column;gap:7px;margin-top:7px}
  .lh-sec{padding:6px 7px;border-radius:9px;background:rgba(255,255,255,0.04);border:1px solid rgba(182,218,214,0.13)}
  .lh-sec-t{font-size:10.5px;font-weight:900;color:#ffe28a;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center}
  .lh-row{padding:3px 0;border-bottom:1px dashed rgba(182,218,214,0.10);color:#d7ebe6}
  .lh-row:last-child{border-bottom:none;padding-bottom:0}
  .lh-row b{color:#fff}
  .lh-sub{display:block;font-size:10px;color:#8cccb8;margin-top:1px}
  .lh-gear-btn{
    display:flex;width:100%;text-align:left;align-items:flex-start;justify-content:space-between;gap:5px;
    padding:4px 6px;margin-top:3px;border-radius:7px;cursor:pointer;
    border:1px solid rgba(255,214,102,0.22);background:rgba(255,214,102,0.07);color:#f3e7c2;font-size:10.5px;
  }
  .lh-gear-btn:hover{border-color:var(--gold);background:rgba(255,214,102,0.15)}
  .lh-badge{display:inline-block;padding:0 5px;border-radius:999px;font-size:9.5px;font-weight:900;background:rgba(124,232,150,0.2);color:#b8ffcf;margin-left:3px}
  .lh-badge.dual{background:rgba(198,140,255,0.25);color:#ebd4ff}
  .lh-badge.set{background:rgba(255,214,102,0.25);color:#ffe89c}

  /* Inspector (Right floating card for Hero Stats/Skills/Gear or Artifact) */
  .inspector{
    position:fixed;top:calc(var(--sub-bottom) + 8px);right:12px;z-index:22;
    width:340px;max-width:calc(100vw - 24px);max-height:calc(100vh - var(--sub-bottom) - 122px);
    overflow-y:auto;padding:12px 13px;border-radius:14px;
    background:var(--panel-strong);border:1px solid rgba(255,220,128,0.42);
    box-shadow:0 16px 36px rgba(0,0,0,0.58);backdrop-filter:blur(10px);
  }
  .inspector[hidden]{display:none}
  .insp-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
  .insp-title{font-size:15px;font-weight:900;color:#ffeaa0;display:flex;align-items:center;gap:6px}
  .insp-sub{font-size:11.5px;color:var(--muted);line-height:1.45;margin-bottom:8px}
  .insp-sec-lbl{font-size:11px;font-weight:900;color:#ffe28a;margin:9px 0 5px;letter-spacing:.2px}
  .stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:5px;margin-bottom:8px}
  .stat-box{padding:5px 8px;border-radius:8px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);font-size:11px;color:#cfe4df;line-height:1.35}
  .stat-box b{color:#fff}
  .stat-box .sub{display:block;font-size:9.5px;color:#8cccb8}
  .gear-fx-list{display:flex;flex-direction:column;gap:4px;margin:4px 0 8px}
  .gear-fx-row{padding:5px 8px;border-radius:8px;background:rgba(255,214,102,0.08);border:1px solid rgba(255,214,102,0.22);font-size:11px;color:#f4e6be;line-height:1.4}
  .gear-fx-row b{color:#ffe478}
  .slot-row{display:flex;gap:6px;margin:6px 0 8px}
  .gear-slot{
    flex:1;min-height:48px;padding:5px 4px;border-radius:10px;
    border:1px dashed rgba(255,220,128,0.4);background:rgba(255,255,255,0.04);
    color:#a8c2bd;font-size:10.5px;font-weight:700;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;
  }
  .gear-slot.filled{border-style:solid;border-color:var(--gold);background:rgba(255,214,102,0.14);color:#fff2bd}
  .gear-slot:hover{background:rgba(255,214,102,0.22)}
  .insp-actions{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .insp-actions .btn{padding:8px 6px;flex-direction:column;gap:2px}
  .insp-actions .btn.full{grid-column:1/-1}
  .insp-actions .btn small{font-size:10px;opacity:.9;font-weight:600}
  .skill-list{display:flex;flex-direction:column;gap:6px;margin-top:6px}
  .skill-card{
    padding:7px 9px;border-radius:9px;background:rgba(255,255,255,0.05);border:1px solid rgba(182,218,214,0.14);
    font-size:11px;line-height:1.45;
  }
  .skill-card .sh{display:flex;align-items:center;justify-content:space-between;gap:6px;font-weight:900;color:#fff;margin-bottom:2px}
  .skill-card .lv{color:var(--gold);font-weight:900}
  .skill-card .dmg{color:#9bf2d0;font-size:10.5px}
  .skill-card .next{color:#ffd88a;font-size:10px;margin-top:2px}

  /* Bottom Dock: Skills + Shop + Bag + Wave Start (strict overflow-y:hidden prevents vertical scrollbar flicker!) */
  .dock-wrap{
    position:fixed;left:0;right:0;bottom:8px;z-index:22;
    display:flex;justify-content:center;padding:0 10px;pointer-events:none;
  }
  .dock{
    pointer-events:auto;display:flex;align-items:stretch;gap:7px;
    max-width:100%;overflow-x:auto;overflow-y:hidden;padding:8px 9px;border-radius:16px;
    background:var(--panel-strong);border:1px solid var(--line);
    box-shadow:0 14px 36px rgba(0,0,0,0.58);backdrop-filter:blur(10px);
  }
  .dock-sec{display:flex;align-items:stretch;gap:6px}

/* Gear stacking: identical gear auto-fuses up to 3★. Priority: hero 4 slots > bag. */
const GEAR_MAX_STAR = 3;
const GEAR_STAR_MULT = [1, 1.6, 2.3]; // index = star-1
function gearBase(k){ return String(k).split('#')[0]; }
function gearStar(k){ const s = parseInt(String(k).split('#')[1] || '1', 10); return Math.min(GEAR_MAX_STAR, Math.max(1, s || 1)); }
function gearLabel(k){ const s = gearStar(k); return `${GEARS[gearBase(k)].name}${s > 1 ? ` ${s}★` : ''}`; }
function findGearStackTarget(baseKey){
  const lists = [game.hero.gear, game.bag];
  for (const list of lists){
    for (let i = 0; i < list.length; i++){
      if (gearBase(list[i]) === baseKey && gearStar(list[i]) < GEAR_MAX_STAR) return { list, idx: i, star: gearStar(list[i]) };
    }
  }
  return null;
}
function ownedGearStar(baseKey){
  let best = 0;
  for (const k of game.hero.gear) if (gearBase(k) === baseKey) best = Math.max(best, gearStar(k));
  for (const k of game.bag) if (gearBase(k) === baseKey) best = Math.max(best, gearStar(k));
  return best;
}

function describeGearEffect(gk){
  const spec = GEARS[gearBase(gk)];
  if (!spec) return '';
  const star = gearStar(gk);
  const mult = GEAR_STAR_MULT[star - 1];
  const parts = [];
  for (const [k, v] of Object.entries(spec.mod)) {
    const val = v * mult;
    const sign = val >= 0 ? '+' : '';
    if (k === 'dmgPct') parts.push(`全伤 ${sign}${Math.round(val * 100)}%`);
    else if (k === 'aspd') parts.push(`攻速 ${sign}${Math.round((v < 0 ? v : val) * 100)}%`);
    else if (k === 'crit') parts.push(`暴击 ${sign}${Math.round(val * 100)}%`);
    else if (k === 'critDmg') parts.push(`暴伤 ${sign}${Math.round(val * 100)}%`);
    else if (k === 'rangePct') parts.push(`范围/射程 ${sign}${Math.round(val * 100)}%`);
    else if (k === 'movePct') parts.push(`移速 ${sign}${Math.round(val * 100)}%`);
    else if (k === 'flatHp') parts.push(`最大生命 ${sign}${Math.round(val)}`);
    else if (k === 'hpPct') parts.push(`最大生命 ${sign}${Math.round(v * 100)}%`);
    else if (k === 'extraShot') parts.push(`额外弹道 +${Math.round(v * star)}`);
    else if (k === 'splashBonus') parts.push(`溅射范围 +${val.toFixed(2)}格`);
    else if (k === 'slowOnHit') parts.push(`攻击减速 ${Math.round(Math.min(0.65, val) * 100)}%`);
    else if (k === 'chainProc') parts.push(`命中 ${Math.round(Math.min(0.8, val) * 100)}% 连锁雷`);
    else if (k === 'lifesteal') parts.push(`攻击回血 +${(val * 0.5).toFixed(1)}`);
    else if (k === 'bonusGold') parts.push(`击杀 +${Math.round(val)} 金`);
  }
  return parts.join(' · ');
}

function getSkillBreakdown(key, lv, hs){
  const spec = HERO_SKILLS[key];
  const nextLv = lv < 5 ? lv + 1 : null;
  const sm = hs.skillDmgMult || hs.dmgMult;
  const rm = hs.skillRangeMult || hs.rangeMult;
  const cdM = hs.skillCdMult || 1;
  if (key === 'blades') {
    const dmg = Math.round((15 + lv * 7) * sm);
    const cnt = lv + 1;
    const rad = ((1.65 + lv * 0.10) * rm).toFixed(2);
    const nDmg = nextLv ? Math.round((15 + nextLv * 7) * sm) : 0;
    return {
      name: `${spec.icon} ${spec.name}`, lvText: `Lv.${lv}/5`,
      cur: `${cnt} 把飞刃 · 单次 ${dmg} 伤（基础${15+lv*7}×${Math.round(sm*100)}%）· 半径 ${rad}格`,
      next: nextLv ? `升至 Lv.${nextLv}：飞刃 ${cnt}→${nextLv+1} 把，单次 ${dmg}→${nDmg} 伤，转速与半径提升` : '已满级 Lv.5'
    };
  }
  if (key === 'firewave') {
    const dmg = Math.round((26 + lv * 13) * sm);
    const cnt = Math.min(4, Math.ceil(lv / 2) + 1) + hs.gm.extraShot;
    const cd = (Math.max(0.75, 1.45 - lv * 0.14) * cdM / hs.aspd).toFixed(2);
    const nCnt = nextLv ? Math.min(4, Math.ceil(nextLv / 2) + 1) + hs.gm.extraShot : 0;
    const nDmg = nextLv ? Math.round((26 + nextLv * 13) * sm) : 0;
    return {
      name: `${spec.icon} ${spec.name}`, lvText: `Lv.${lv}/5`,
      cur: `${cnt} 道穿透剑气 · 单次 ${dmg} 伤 · 间隔 ${cd}s`,
      next: nextLv ? `升至 Lv.${nextLv}：剑气 ${cnt}→${nCnt} 道，单次 ${dmg}→${nDmg} 伤，冷却缩短` : '已满级 Lv.5'
    };
  }
  if (key === 'thunder') {
    const dmg = Math.round((30 + lv * 15) * sm);
    const strikes = lv + 1;
    const cd = (Math.max(0.75, 1.65 - lv * 0.18) * cdM / hs.aspd).toFixed(2);
    const nDmg = nextLv ? Math.round((30 + nextLv * 15) * sm) : 0;
    return {
      name: `${spec.icon} ${spec.name}`, lvText: `Lv.${lv}/5`,
      cur: `召唤 ${strikes} 道 3连天雷 · 单次 ${dmg} 伤 · 间隔 ${cd}s`,
      next: nextLv ? `升至 Lv.${nextLv}：落雷 ${strikes}→${nextLv+1} 道，单次 ${dmg}→${nDmg} 伤，冷却缩短` : '已满级 Lv.5'
    };
  }
  if (key === 'nova') {
    const dmg = Math.round((25 + lv * 13) * sm);
    const rad = ((1.95 + lv * 0.24) * rm).toFixed(2);
    const cd = (Math.max(1.45, 2.25 - lv * 0.16) * cdM / hs.aspd).toFixed(2);
    const nDmg = nextLv ? Math.round((25 + nextLv * 13) * sm) : 0;
    return {
      name: `${spec.icon} ${spec.name}`, lvText: `Lv.${lv}/5`,
      cur: `冰环半径 ${rad}格 · 单次 ${dmg} 伤 + 55% 减速 · 间隔 ${cd}s`,
      next: nextLv ? `升至 Lv.${nextLv}：单次 ${dmg}→${nDmg} 伤，半径扩大，冷却缩短` : '已满级 Lv.5'
    };
  }
  if (key === 'stomp') {
    const dmg = Math.round((40 + lv * 20) * sm);
    const rad = ((2.00 + lv * 0.24) * rm).toFixed(2);
    const cd = (Math.max(1.60, 2.45 - lv * 0.17) * cdM / hs.aspd).toFixed(2);
    const nDmg = nextLv ? Math.round((40 + nextLv * 20) * sm) : 0;
    return {
      name: `${spec.icon} ${spec.name}`, lvText: `Lv.${lv}/5`,
      cur: `震荡半径 ${rad}格 · 单次 ${dmg} 伤 + 0.75s 晕眩 · 间隔 ${cd}s`,
      next: nextLv ? `升至 Lv.${nextLv}：单次 ${dmg}→${nDmg} 伤，范围更大，冷却缩短` : '已满级 Lv.5'
    };
  }
  return {
    name: `${spec.icon} ${spec.name}`, lvText: `Lv.${lv}/5`,
    cur: `攻速 +${lv*18}% · 暴击 +${lv*8}% · 移速 +${(lv*0.35).toFixed(2)} · 吸血 +${lv*2} · 磁铁 +${(lv*0.85).toFixed(1)}格`,
    next: nextLv ? `升至 Lv.${nextLv}：攻速 +${nextLv*18}%、暴击 +${nextLv*8}%、吸血 +${nextLv*2}、磁铁再扩` : '已满级 Lv.5'
  };
}

/* ==================== AUDIO ENGINE ==================== */
const AudioKit = {
  ctx: null, enabled: true, last: {},
  unlock(){
    if (!this.enabled) return;
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) this.ctx = new AC();
    }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(()=>{});
  },
  play(kind, pitchMul = 1){
    if (!this.enabled || !this.ctx) return;
    const now = performance.now();
    const minGap = { hit:45, xp:32, coin:50, arrow:55, fire:85, frost:80, thunder:75, holy:85, slash:65, crit:60, merge:120, chest:120, level:150, boss:350 }[kind] || 60;
    if (now - (this.last[kind] || 0) < minGap) return;
    this.last[kind] = now;
    const t = this.ctx.currentTime;
    const tone = (freq, dur, type='triangle', vol=0.06, endFreq=null, delay=0) => {
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq * pitchMul, t + delay);
      if (endFreq) o.frequency.exponentialRampToValueAtTime(Math.max(40, endFreq * pitchMul), t + delay + dur);
      g.gain.setValueAtTime(0.0001, t + delay);
      g.gain.linearRampToValueAtTime(vol, t + delay + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + delay + dur);
      o.connect(g); g.connect(this.ctx.destination);
      o.start(t + delay); o.stop(t + delay + dur + 0.02);
    };
    if (kind === 'xp') tone(680, 0.08, 'sine', 0.05, 980);
    else if (kind === 'coin') { tone(880, 0.07, 'sine', 0.05); tone(1320, 0.09, 'sine', 0.045, null, 0.045); }
    else if (kind === 'arrow') tone(560, 0.06, 'triangle', 0.04, 240);
    else if (kind === 'fire') tone(170, 0.17, 'sawtooth', 0.06, 52);
    else if (kind === 'frost') tone(920, 0.12, 'sine', 0.045, 520);
    else if (kind === 'thunder') tone(420, 0.11, 'sawtooth', 0.05, 1100);
    else if (kind === 'holy') tone(760, 0.13, 'sine', 0.045, 1180);
    else if (kind === 'slash') tone(320, 0.08, 'sawtooth', 0.05, 130);
    else if (kind === 'crit') tone(520, 0.09, 'square', 0.05, 860);
    else if (kind === 'merge') { tone(523, 0.11, 'triangle', 0.08); tone(659, 0.11, 'triangle', 0.08, null, 0.07); tone(1046, 0.24, 'triangle', 0.09, null, 0.14); }
    else if (kind === 'chest') { tone(660, 0.1, 'sine', 0.07); tone(990, 0.18, 'sine', 0.08, null, 0.08); }
    else if (kind === 'level') { [523,659,784,1046].forEach((f,i)=>tone(f,0.13,'triangle',0.075,null,i*0.06)); }
    else if (kind === 'boss') { tone(130, 0.4, 'sawtooth', 0.09, 85); tone(196, 0.42, 'sawtooth', 0.08, 120, 0.16); }
    else if (kind === 'hit') tone(190, 0.07, 'square', 0.04, 95);
  }
};

function buildTerrainProps(seed){
  const r = mulberry32(seed ^ 0x9e3779b9);
  const props = [];
  // Subtle ancient rune circles across the 64x48 wilds for spatial motion landmarks
  for (let i = 0; i < 18; i++) {
    props.push({ kind: 'rune', x: 5 + r() * (W - 10), y: 5 + r() * (H - 10), rad: 1.4 + r() * 1.4, col: i % 2 ? 'rgba(114,242,180,0.09)' : 'rgba(108,226,255,0.09)' });
  }
  // Decorative flat flagstones & grass tufts (zero collision!)
  for (let i = 0; i < 180; i++) {
    props.push({ kind: r() < 0.55 ? 'stone' : 'tuft', x: 1.5 + r() * (W - 3), y: 1.5 + r() * (H - 3), s: 0.22 + r() * 0.35, rot: r() * Math.PI * 2 });
  }
  return props;
}

function mulberry32(seed){
  let a = seed >>> 0;
  return () => {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function dist(a, b){ return Math.hypot(a.x - b.x, a.y - b.y); }
function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }

  updateCamera(0, true);
  if (showStarter) queueModal({ type: 'starter' });
  renderAllUI(true);
}

/* ==================== SYNERGY, COMBO & STAT COMPUTATION ==================== */
function getSynergyCounts(){
  const c = { wind:0, fire:0, frost:0, thunder:0, holy:0 };
  if (game?.seal) {
    // Unique 1★-5★ seal: 1-2★ = 1, 3-4★ = 2 (Tier 1), 5★ = 4 (Tier 2 Ultimate!)
    c[game.seal.elem] += game.seal.star >= 5 ? 4 : game.seal.star >= 3 ? 2 : 1;
  }
  if (game?.subSeals?.length) {
    for (const s of game.subSeals) {
      c[s.elem] += s.star >= 3 ? 2 : 1;
    }
  }
  if (game?.hero?.gear?.length) {
    for (const gk of game.hero.gear) {
      const sp = GEARS[gearBase(gk)];
      if (sp?.elem && c[sp.elem] !== undefined) c[sp.elem] += 1;
    }
  }
  return c;
}
function getSynergyTier(elem){
  const n = getSynergyCounts()[elem] || 0;
  return n >= 4 ? 2 : n >= 2 ? 1 : 0;
}
function getSubSeal(elem){
  return game?.subSeals?.find(s => s.elem === elem) || null;
}
function getGearSetCounts(gearList = game?.hero?.gear || []){
  const counts = {};
  for (const gk of gearList) {
    const sp = GEARS[gearBase(gk)];
    if (sp?.set) counts[sp.set] = (counts[sp.set] || 0) + 1;
  }
  return counts;
}
function gearSetTier(setKey){
  const n = getGearSetCounts()[setKey] || 0;
  return n >= 3 ? 3 : n >= 2 ? 2 : 0;
}
function getActiveGearSets(){
  const counts = getGearSetCounts();
  const out = [];
  for (const [k, n] of Object.entries(counts)) {
    if (n >= 2 && GEAR_SETS[k]) {
      const tier = n >= 3 ? 3 : 2;
      out.push({ ...GEAR_SETS[k], count: n, tier, desc: tier >= 3 ? GEAR_SETS[k].d3 : GEAR_SETS[k].d2 });
    }
  }
  return out;
}
function getActiveDualResonances(){
  const c = getSynergyCounts();
  return DUAL_RESONANCES.filter(r => {
    if (r.req[1] === '_any') {
      return c[r.req[0]] >= 2 && ['wind','fire','frost','thunder'].some(e => c[e] >= 2);
    }
    return c[r.req[0]] >= 2 && c[r.req[1]] >= 2;
  });
}
function hasDualRes(key){
  return getActiveDualResonances().some(r => r.key === key);
}

function refreshCombos(announce = true){
  const h = game.hero;
  for (const c of COMBO_LIST) {
    if (h.combos[c.key]) continue;
    const sumLv = c.req.reduce((s, sk) => s + (h.skills[sk] || 0), 0);
    if (h.realm >= c.realm && c.req.every(sk => (h.skills[sk] || 0) >= 1) && sumLv >= 3) {
      h.combos[c.key] = true;
      if (announce) {
        AudioKit.play('level', 1.15);
        game.shake = Math.max(game.shake, 7);
        addRing(h.x, h.y, '#ffe878', 3.4);
        showBanner(`✨ 组合技觉醒 · 【${c.name}】！`, c.desc, 'good');
      }
    }
  }
}

function aggregateGear(gearList){
  const m = { dmgPct:0, aspd:0, crit:0, critDmg:0, rangePct:0, movePct:0, flatHp:0, hpPct:0, extraShot:0, splashBonus:0, slowOnHit:0, chainProc:0, lifesteal:0, bonusGold:0 };
  const dfBoost = perkLv('dao_fortune') >= 2 ? 1.25 : 1;
  const greedSetBoost = (getGearSetCounts(gearList).greed || 0) >= 3 ? 1.15 : 1;
  for (const k of gearList) {
    const gm = GEARS[gearBase(k)]?.mod;
    if (!gm) continue;
    const star = gearStar(k);
    const mult = GEAR_STAR_MULT[star - 1] * dfBoost * greedSetBoost;
    for (const [key, val] of Object.entries(gm)) {
      const scaled = key === 'extraShot' ? val * star : (val < 0 ? val : val * mult);
      if (key === 'slowOnHit') m.slowOnHit = Math.max(m.slowOnHit, Math.min(0.65, scaled));
      else if (key === 'chainProc') m[key] = Math.min(0.8, m[key] + scaled);
      else m[key] += scaled;
    }
  }
  m.extraShot = Math.round(m.extraShot);
  m.bonusGold = Math.round(m.bonusGold);
  m.flatHp = Math.round(m.flatHp);
  return m;
}

function syncHeroMaxHp(){
  if (!game?.hero) return;
  const h = game.hero;
  const gm = aggregateGear(h.gear);
  const oldMax = h.maxHp;
  const rawMax = Math.round((h.baseMaxHp + gm.flatHp) * Math.max(0.4, 1 + gm.hpPct));
  h.maxHp = Math.max(60, rawMax);
  if (h.maxHp > oldMax) h.hp = Math.min(h.maxHp, h.hp + (h.maxHp - oldMax));
  else h.hp = Math.min(h.hp, h.maxHp);
}

function getHeroStats(){
  const h = game.hero;
  const r = getRealm(h.realm);
  const gm = aggregateGear(h.gear);
  const syn = getSynergyCounts();
  const berkLv = h.skills.berserk || 0;
  const holyAura = (game.seal && game.seal.kind === 'holy') ? (ARTIFACTS.holy.stars[game.seal.star - 1].auraAspd || 0) : 0;
  const holySub = getSubSeal('holy');
  const holySubCrit = holySub ? SUB_SEAL_RESONANCE.holy.crit[holySub.star - 1] : 0;

  // Perk bonuses
  const bloodLv = perkLv('blood_oath');
  const lostPct = clamp((h.maxHp - h.hp) / Math.max(1, h.maxHp), 0, 1);
  const bloodSteps = Math.floor(lostPct * 10);
  const bloodDmg = bloodLv === 2 ? bloodSteps * 0.18 : bloodLv === 1 ? bloodSteps * 0.12 : 0;
  const bloodAspd = (bloodLv >= 2 && h.hp <= h.maxHp * 0.5) ? 0.35 : 0;
  const bloodLeech = bloodLv >= 1 ? bloodSteps * 2 : 0;

  const goldLv = perkLv('gold_power');
  const goldDmg = goldLv === 2 ? Math.min(0.63, Math.floor(game.gold / 50) * 0.09)
                : goldLv === 1 ? Math.min(0.42, Math.floor(game.gold / 50) * 0.06) : 0;

  const ocLv = perkLv('artifact_overclock');
  const sealDmgBonus = (ocLv >= 1 && game.seal) ? game.seal.star * 0.08 : 0;

  const windGaleLv = perkLv('wind_gale');
  const dashAspd = (windGaleLv >= 2 && h.dashBuffT > 0) ? 0.60 : 0;
  const swordSet = gearSetTier('sword');
  const greedSet = gearSetTier('greed');
  const greedCap = greedSet >= 3 ? 0.45 : 0.28;
  const greedAspd = greedSet >= 2 ? Math.min(greedCap, Math.floor(game.gold / 40) * 0.04) : 0;
  const greedMove = greedSet >= 2 ? Math.min(greedCap, Math.floor(game.gold / 40) * 0.03) : 0;
  const wfDualMove = hasDualRes('wind_frost') ? 0.15 : 0;
  const bloodKillDmg = (h.bloodKills || 0) * 0.03;

  const aspd = Math.max(0.5, 1 + gm.aspd + berkLv * 0.18 + holyAura + (syn.wind >= 2 ? 0.25 : 0) + (h.ultTimer > 0 ? 0.80 : 0) + bloodAspd + dashAspd + greedAspd);
  const dmgMult = 1 + gm.dmgPct + (h.lv - 1) * 0.08 + r.dmgBonus + bloodDmg + goldDmg + sealDmgBonus + bloodKillDmg;

  // Mono-mastery (一法破万法): tightened multiplier
  const ownedSkills = Object.values(h.skills).filter(v => v > 0).length;
  const mmLv = perkLv('mono_mastery');
  const mmActive = (mmLv === 1 && ownedSkills <= 2) || (mmLv >= 2 && ownedSkills <= 3);
  const skillDmgMult = dmgMult * (mmActive ? (mmLv >= 2 ? 1.55 : 1.30) : 1);
  const rangeMult = Math.max(0.65, 1 + gm.rangePct);
  const skillRangeMult = rangeMult * (mmActive ? (mmLv >= 2 ? 1.15 : 1.08) : 1);
  const skillCdMult = r.cdMult * (mmActive && mmLv >= 2 ? 0.80 : 1);

  const csLv = perkLv('crit_surge');
  const swordSetCrit = swordSet >= 3 ? 0.20 : swordSet >= 2 ? 0.12 : 0;
  const rawCrit = 0.12 + gm.crit + berkLv * 0.08 + (syn.holy >= 2 ? 0.15 : 0) + holySubCrit + (h.ultTimer > 0 ? 0.35 : 0)
    + swordSetCrit + (csLv === 2 ? 0.25 : csLv === 1 ? 0.15 : 0)
    + (windGaleLv >= 1 && h.dashBuffT > 0 ? 1.0 : 0);
  const overflowCrit = Math.max(0, rawCrit - 1.0);
  const crit = Math.min(1.0, rawCrit);
  const critDmg = (syn.holy >= 4 ? 2.2 : 1.75) + gm.critDmg + (hasDualRes('holy_omni') ? 0.25 : 0)
    + (csLv === 2 ? overflowCrit * 3 : csLv === 1 ? overflowCrit * 2 : 0)
    + (perkLv('sword_rain') >= 2 ? 0.60 : 0);

  const moveSpd = (5.6 + berkLv * 0.35)
    * (1 + gm.movePct + greedMove + wfDualMove + (windGaleLv === 2 ? 0.30 : windGaleLv === 1 ? 0.20 : 0) + (perkLv('ult_engine') >= 1 && h.ultTimer > 0 ? 0.30 : 0));
  const magnet = 2.9 + berkLv * 0.85 + gm.rangePct * 2.0;
  const lifesteal = gm.lifesteal + berkLv * 2 + bloodLeech;

  return { aspd, dmgMult, skillDmgMult, crit, critDmg, magnet, rangeMult, skillRangeMult, skillCdMult, moveSpd, lifesteal, mmActive, gm };
}

function getSealStats(a = game.seal){
  if (!a) return null;
  const spec = ARTIFACTS[a.kind];
  const base = spec.stars[clamp(a.star - 1, 0, spec.stars.length - 1)];
  const hs = getHeroStats();
  const gm = hs.gm;
  const syn = getSynergyCounts();
  const ocLv = perkLv('artifact_overclock');
  const windSub = getSubSeal('wind');
  const fireSub = getSubSeal('fire');
  const frostSub = getSubSeal('frost');

  const fireSubMult = fireSub ? (1 + SUB_SEAL_RESONANCE.fire.dmgBonus[fireSub.star - 1]) : 1;
  const windSubCd = windSub ? (1 - SUB_SEAL_RESONANCE.wind.cdRed[windSub.star - 1]) : 1;
  const frostSubSlow = frostSub ? SUB_SEAL_RESONANCE.frost.slow[frostSub.star - 1] : 0;
  const fireSubBurn = fireSub ? SUB_SEAL_RESONANCE.fire.burn[fireSub.star - 1] : 0;

  const fireMult = (a.elem === 'fire' && syn.fire >= 2) ? 1.35 : 1;
  const dmg = Math.max(5, Math.round(base.dmg * hs.dmgMult * fireMult * fireSubMult));
  const cd = Math.max(0.16, base.cd * windSubCd * (ocLv >= 1 ? 0.75 : 1) / hs.aspd);
  const range = Number((base.range * hs.rangeMult * (ocLv >= 2 ? 1.3 : 1)).toFixed(2));
  const shots = (base.shots || 1) + gm.extraShot + (ocLv >= 2 ? 1 : 0);
  const chains = (base.chains || 0) + (syn.thunder >= 2 ? 2 : 0) + gm.extraShot + (ocLv >= 2 ? 1 : 0);
  const wfRadiusMult = hasDualRes('wind_fire') ? 1.28 : 1;
  const splash = ((base.splash || 0) + gm.splashBonus) * (ocLv >= 2 ? 1.3 : 1) * wfRadiusMult;
  const beams = (base.beams || 2) + gm.extraShot + (ocLv >= 2 ? 1 : 0);

  return {
    dmg, cd, range, crit: hs.crit, critDmg: hs.critDmg, shots, chains, splash, pierce: base.pierce || 0, beams,
    slow: Math.max(base.slow || 0, gm.slowOnHit, frostSubSlow),
    slowDur: base.slowDur || ((gm.slowOnHit || frostSubSlow) ? 2.2 : 0),
    burn: Math.max(base.burn || 0, fireSubBurn), gm
  };
}

/* ==================== SHOP (T1/T2/T3 + PILLS + MAIN & SUB SEALS) ==================== */
function mendPillPrice(){
  if (!game.lastDestroyedGear) return 60;
  const base = GEARS[gearBase(game.lastDestroyedGear)]?.rarity === 'legend' ? 40 : 20;
  return Math.round(base * gearStar(game.lastDestroyedGear) * 1.5);
}

function rollShop(free = false){
  if (!free) {
    const freeProc = perkLv('gold_power') >= 2 && game.rnd() < 0.25;
    if (!freeProc) {
      if (game.gold < game.rerollCost) { toast(`需要 ${game.rerollCost} 金币才能刷新商店！`, true); return false; }
      game.gold -= game.rerollCost;
      game.rerollCost += 2;
      AudioKit.play('coin', 0.9);
    } else {
      toast('💰 点石成金精通触发：本次刷新免费！');
    }
  }
  const tier = getShopTier();
  const isHuashen = game.hero.realm >= 4;
  game.shop = [];

  for (let i = 0; i < 4; i++) {
    // Slot 4: Pill slot (Mend pill guaranteed within 2 waves after destruction, max 1/run; else 25% pill chance)
    if (i === 3) {
      const needMend = !!game.lastDestroyedGear && !game.mendPillBought;
      const forceMend = needMend && (game.wave - game.destroyedAtWave >= 1 || game.rnd() < 0.6);
      if (forceMend) {
        game.shop.push({ uid: Math.floor(game.rnd() * 1e9), itemType: 'pill', pillKey: 'mend', cost: mendPillPrice(), bought: false });
        continue;
      }
      if (game.rnd() < 0.25) {
        const pk = game.rnd() < 0.55 ? 'guard' : 'xp';
        game.shop.push({ uid: Math.floor(game.rnd() * 1e9), itemType: 'pill', pillKey: pk, cost: PILLS[pk].cost, bought: false });
        continue;
      }
    }

    const kind = ARTIFACT_KEYS[Math.floor(game.rnd() * ARTIFACT_KEYS.length)];
    const spec = ARTIFACTS[kind];
    let star = 1;
    const r = game.rnd();
    if (tier === 2 && r < 0.25) star = 2;
    else if (tier === 3) {
      const t3Chance = isHuashen ? 0.20 : 0.10;
      if (r < t3Chance) star = 3;
      else if (r < t3Chance + 0.45) star = 2;
    }
    const mult = star === 3 ? 3.8 : star === 2 ? 2.0 : 1.0;
    const disc = (star === 1 && game.wave >= 2 && game.rnd() < 0.16) ? 3 : 0;
    const cost = Math.max(15, Math.round(spec.cost * mult) - disc);
    game.shop.push({ uid: Math.floor(game.rnd() * 1e9), itemType: 'seal', kind, star, cost, bought: false, disc });
  }
  renderAllUI();
  return true;
}

function checkShopAutoRestock(){
  if (game.shop.length > 0 && game.shop.every(s => s.bought)) {
    rollShop(true);
    toast('商店已买空，已自动免费补货！');
  }
}

function sealTotalPoints(seal){
  if (!seal) return 0;
  let pts = 1 + (seal.prog || 0);
  for (let s = 1; s < seal.star; s++) pts += SEAL_FUSE_NEED[s];
  return pts;
}

function buyShopItem(shopIdx){
  const item = game.shop[shopIdx];
  if (!item || item.bought) return false;
  if (game.gold < item.cost) { toast(`需要 ${item.cost} 金币！`, true); return false; }

  // 1. Pill purchase
  if (item.itemType === 'pill') {
    game.gold -= item.cost;
    item.bought = true;
    AudioKit.play('chest', 1.1);
    if (item.pillKey === 'guard') {
      game.pills.guard++;
      toast(`购入【护法丹】！当前储备 ${game.pills.guard} 颗（渡劫成功率 +10%/颗）`);
    } else if (item.pillKey === 'xp') {
      const gain = Math.round(game.hero.xpNext * 0.35);
      gainHeroXp(gain);
      toast(`服下【修为丹】！修为 +${gain}！`);
    } else if (item.pillKey === 'mend') {
      const restored = game.lastDestroyedGear;
      game.mendPillBought = true;
      game.lastDestroyedGear = null;
      if (restored) {
        game.bag.push(restored);
        addRing(game.hero.x, game.hero.y, '#ffe478', 2.4);
        toast(`✨【补天丹】生效！已重塑【${gearLabel(restored)}】回背包！`);
      }
    }
    checkShopAutoRestock();
    renderAllUI(true);
    return true;
  }

  // 2. Main Seal & Sub-Seal Resonance purchase
  const spec = ARTIFACTS[item.kind];
  const cap = getSealStarCap();
  const subCap = getSubSealSlotCap();
  const cardPts = item.star === 3 ? 4 : item.star === 2 ? 2 : 1;
  const subIdx = game.subSeals.findIndex(s => s.kind === item.kind);

  if (!game.seal) {
    game.gold -= item.cost;
    item.bought = true;
    const initStar = Math.min(cap, item.star);
    game.seal = { kind: item.kind, elem: spec.elem, star: initStar, prog: 0, cd: 0, dmgDealt: 0, kills: 0 };
    addRing(game.hero.x, game.hero.y, ELEMENTS[spec.elem].color, 1.8);
    addFloat(game.hero.x, game.hero.y - 0.5, `附魔 ${spec.name} ${initStar}★`, ELEMENTS[spec.elem].color, true);
    AudioKit.play('merge', 1.05);
    toast(`已铭刻主灵印【${spec.name} ${initStar}★ ${SEAL_TIER_NAMES[initStar]}】！`);
  } else if (game.seal.kind === item.kind) {
    if (game.seal.star >= cap) {
      const nextR = REALMS[game.hero.realm + 1];
      toast(game.seal.star >= 5 ? '【主灵印】已达 5★ 仙印巅峰！' : `当前境界主印上限 ${cap}★，突破【${nextR?.name || '更高境界'}】后解锁 ${cap + 1}★！`, true);
      return false;
    }
    game.gold -= item.cost;
    item.bought = true;
    game.seal.prog += cardPts;
    let leveled = false;
    while (game.seal.star < cap && game.seal.prog >= SEAL_FUSE_NEED[game.seal.star]) {
      game.seal.prog -= SEAL_FUSE_NEED[game.seal.star];
      game.seal.star++;
      game.stats.merges++;
      leveled = true;
    }
    if (game.seal.star >= cap) game.seal.prog = 0;
    if (leveled) {
      game.shake = Math.max(game.shake, 7);
      addRing(game.hero.x, game.hero.y, '#ffe878', 2.6);
      addFloat(game.hero.x, game.hero.y - 0.6, `★ ${spec.name} 晋升 ${game.seal.star}★ ${SEAL_TIER_NAMES[game.seal.star]}！`, '#ffe878', true);
      AudioKit.play('merge');
      const synMsg = game.seal.star === 3 ? ' · 已激活 2 层元素羁绊！' : game.seal.star === 5 ? ' · 已激活 4 层终极羁绊！' : '';
      toast(`主印升阶！【${spec.name}】晋升 ${game.seal.star}★ ${SEAL_TIER_NAMES[game.seal.star]}${synMsg}`);
    } else {
      AudioKit.play('coin', 1.2);
      toast(`吸收灵印精华！${spec.name} ${game.seal.star}★ 升星进度 ${game.seal.prog}/${SEAL_FUSE_NEED[game.seal.star]}`);
    }
  } else if (subIdx >= 0) {
    const sub = game.subSeals[subIdx];
    if (sub.star >= 3) {
      toast(`辅印【${spec.name}】已达 3★ 阵眼巅峰！`, true);
      return false;
    }
    game.gold -= item.cost;
    item.bought = true;
    sub.prog += cardPts;
    let leveled = false;
    while (sub.star < 3 && sub.prog >= SEAL_FUSE_NEED[sub.star]) {
      sub.prog -= SEAL_FUSE_NEED[sub.star];
      sub.star++;
      game.stats.merges++;
      leveled = true;
    }
    if (sub.star >= 3) sub.prog = 0;
    if (leveled) {
      AudioKit.play('merge', 1.15);
      addRing(game.hero.x, game.hero.y, ELEMENTS[spec.elem].color, 2.1);
      addFloat(game.hero.x, game.hero.y - 0.6, `★ 辅印 ${spec.name} 升至 ${sub.star}★！`, ELEMENTS[spec.elem].color, true);
      toast(`辅印升阶！【${SUB_SEAL_RESONANCE[spec.elem].name}】晋升 ${sub.star}★${sub.star === 3 ? '（额外+2羁绊权重）' : ''}！`);
    } else {
      AudioKit.play('coin', 1.15);
      toast(`强化辅印【${spec.name}】进度 ${sub.prog}/${SEAL_FUSE_NEED[sub.star]}`);
    }
  } else if (game.subSeals.length < subCap) {
    game.gold -= item.cost;
    item.bought = true;
    const initStar = Math.min(3, item.star);
    game.subSeals.push({ kind: item.kind, elem: spec.elem, star: initStar, prog: 0, dmgDealt: 0 });
    const res = SUB_SEAL_RESONANCE[spec.elem];
    addRing(game.hero.x, game.hero.y, ELEMENTS[spec.elem].color, 2.0);
    addFloat(game.hero.x, game.hero.y - 0.55, `✨ 辅印共鸣 · ${res.name} ${initStar}★`, ELEMENTS[spec.elem].color, true);
    AudioKit.play('merge', 1.1);
    toast(`✨ 辅印共鸣激活！【${res.name} ${initStar}★】${res.desc(initStar)}`);
  } else {
    // Switch Main Seal: refund 80% of old main seal invested value and equip new element!
    const oldSpec = ARTIFACTS[game.seal.kind];
    const refund = Math.round(oldSpec.cost * sealTotalPoints(game.seal) * 0.8);
    game.gold = game.gold - item.cost + refund;
    item.bought = true;
    const initStar = Math.min(cap, item.star);
    game.seal = { kind: item.kind, elem: spec.elem, star: initStar, prog: 0, cd: 0, dmgDealt: 0, kills: 0 };
    addRing(game.hero.x, game.hero.y, ELEMENTS[spec.elem].color, 2.0);
    addFloat(game.hero.x, game.hero.y - 0.5, `转修 ${spec.name} ${initStar}★ (+${refund}金)`, ELEMENTS[spec.elem].color, true);
    AudioKit.play('merge', 1.0);
    toast(`转修换主印！【${oldSpec.name}】折价返还 +${refund} 金，已切换为【${spec.name} ${initStar}★】！`);
  }

  checkShopAutoRestock();
  renderAllUI(true);
  return true;
}

function sellSeal(){
  if (!game.seal) return false;
  const oldSpec = ARTIFACTS[game.seal.kind];
  const refund = Math.round(oldSpec.cost * sealTotalPoints(game.seal) * 0.8);
  game.gold += refund;
  game.seal = null;
  if (!game.subSeals.length) game.inspTarget = null;
  addFloat(game.hero.x, game.hero.y - 0.5, `+${refund} 金`, '#ffe27a');
  AudioKit.play('coin');
  toast(`已卸售主灵印【${oldSpec.name}】返还 ${refund} 金币。`);
  renderAllUI(true);
  return true;
}

function sellSubSeal(idx){
  const sub = game.subSeals[idx];
  if (!sub) return false;
  const spec = ARTIFACTS[sub.kind];
  const refund = Math.round(spec.cost * sealTotalPoints(sub) * 0.8);
  game.gold += refund;
  game.subSeals.splice(idx, 1);
  addFloat(game.hero.x, game.hero.y - 0.5, `卸辅印 +${refund} 金`, '#ffe27a');
  AudioKit.play('coin');
  toast(`已卸售辅灵印【${spec.name}】返还 ${refund} 金币，空出 1 个辅印槽。`);
  renderAllUI(true);
  return true;
}

function equipGearFromBag(bagIdx){
  if (bagIdx < 0 || bagIdx >= game.bag.length) return false;
  const gearKey = game.bag[bagIdx];
  if (game.hero.gear.length >= HERO_GEAR_SLOTS) {
    toast(`领主构装槽已满（${HERO_GEAR_SLOTS}/${HERO_GEAR_SLOTS}），请先卸下一件或右键背包构装熔炼换金。`, true);
    return false;
  }
  game.bag.splice(bagIdx, 1);
  game.hero.gear.push(gearKey);
  syncHeroMaxHp();
  game.mode = null;
  const fx = describeGearEffect(gearKey);
  addRing(game.hero.x, game.hero.y, '#ffe478', 1.5);
  addFloat(game.hero.x, game.hero.y - 0.5, `穿戴 ${gearLabel(gearKey)}`, '#ffe88a', true);
  AudioKit.play('chest');
  toast(`已穿戴【${gearLabel(gearKey)}】生效：${fx}`);
  renderAllUI(true);
  return true;
}

function unequipGear(slotIdx){
  const list = game.hero.gear;
  if (!list || slotIdx < 0 || slotIdx >= list.length) return false;
  const [gk] = list.splice(slotIdx, 1);
  game.bag.push(gk);
  syncHeroMaxHp();
  AudioKit.play('coin', 0.85);
  toast(`已卸下【${gearLabel(gk)}】放回背包。`);
  renderAllUI(true);
  return true;
}

function salvageBagGear(bagIdx){
  if (bagIdx < 0 || bagIdx >= game.bag.length) return false;
  const gk = game.bag[bagIdx];
  const spec = GEARS[gearBase(gk)];
  const star = gearStar(gk);
  const gold = Math.round((GEAR_SALVAGE_GOLD[spec?.rarity || 'common'] || 15) * star);
  game.bag.splice(bagIdx, 1);
  game.gold += gold;
  AudioKit.play('coin', 1.1);
  addFloat(game.hero.x, game.hero.y - 0.5, `熔炼 +${gold} 金`, '#ffe27a');
  toast(`🔥 已熔炼【${gearLabel(gk)}】，获得 +${gold} 金币！`);
  renderAllUI(true);
  return true;
}

/* ==================== WAVE GENERATION (SAWTOOTH CURVE + 3-STAGE) & SHRINE ==================== */
function getWavePhaseMeta(w){
  if (w <= 2)       return { tag:'爬升·初探',     kind:'climb',  mobMult:1.00, hpMult:1.00 };
  if (w <= 4)       return { tag:'爬升·合围',     kind:'climb',  mobMult:1.00, hpMult:1.06 };
  if (w === 5)      return { tag:'波峰·熔岩首领', kind:'peak',   mobMult:0.95, hpMult:1.08 };
  if (w === 6)      return { tag:'消退·筑基割草', kind:'relief', mobMult:1.20, hpMult:0.78 };
  if (w <= 9)       return { tag:'爬升·破阵强敌', kind:'climb',  mobMult:1.00, hpMult:1.04 + (w - 7) * 0.03 };
  if (w === 10)     return { tag:'波峰·死灵首领', kind:'peak',   mobMult:0.95, hpMult:1.12 };
  if (w === 11)     return { tag:'消退·金丹割草', kind:'relief', mobMult:1.22, hpMult:0.78 };
  if (w <= 14)      return { tag:'爬升·精锐狂潮', kind:'climb',  mobMult:1.00, hpMult:1.05 + (w - 12) * 0.03 };
  if (w === 15)     return { tag:'波峰·泰坦首领', kind:'peak',   mobMult:0.95, hpMult:1.14 };
  if (w === 16)     return { tag:'消退·元婴割草', kind:'relief', mobMult:1.25, hpMult:0.80 };
  if (w <= 19)      return { tag:'爬升·天劫前夜', kind:'climb',  mobMult:1.12, hpMult:1.08 + (w - 17) * 0.04 };
  return              { tag: w === 20 ? '终极波峰·天劫魔尊' : '无尽狂潮', kind:'peak', mobMult:1.05, hpMult:1.15 };
}

function buildWaveQueue(w){
  const q = [];
  const meta = getWavePhaseMeta(w);
  const lateScale = w >= 12 ? Math.pow(1.05, w - 11) : w >= 7 ? Math.pow(1.035, w - 6) : 1;
  const scale = Math.pow(1.26, w - 1) * meta.hpMult * lateScale;
  const sides = w <= 2 ? ['west','east','north'] : ['west','east','north','south'];
  const baseMobs = Math.min(155, Math.round(48 + w * 8));
  const totalMobs = Math.min(185, Math.round(baseMobs * meta.mobMult));
  const duration = Math.min(24, 14 + w * 0.55);

  const pickMobKind = (forceHeavy = false) => {
    const r = game.rnd();
    if (w === 1) return 'slime';
    if (w === 2) return r >= 0.72 ? 'wolf' : 'slime';
    if (w === 3) {
      if (r >= 0.90) return 'bomber';
      if (r >= 0.78) return 'mage';
      if (r >= 0.64) return 'wolf';
      return 'slime';
    }
    if (w <= 5) {
      if (r >= (forceHeavy ? 0.80 : 0.90)) return 'brute';
      if (r >= 0.80) return 'bomber';
      if (r >= 0.70) return 'mage';
      if (r >= 0.54) return 'wolf';
      return 'slime';
    }
    if (w <= 9) {
      if (r >= 0.90) return 'shaman';
      if (r >= (forceHeavy ? 0.74 : 0.82)) return 'brute';
      if (r >= 0.70) return 'bomber';
      if (r >= 0.60) return 'mage';
      if (r >= 0.40) return 'wolf';
      return 'slime';
    }
    if (w <= 15) {
      if (r >= 0.90) return 'shaman';
      if (r >= (forceHeavy ? 0.70 : 0.78)) return 'brute';
      if (r >= 0.66) return 'bomber';
      if (r >= 0.56) return 'mage';
      if (r >= 0.32) return 'wolf';
      return 'slime';
    }
    if (r >= 0.88) return 'shaman';
    if (r >= (forceHeavy ? 0.62 : 0.70)) return 'brute';
    if (r >= 0.56) return 'bomber';
    if (r >= 0.42) return 'mage';
    if (r >= 0.20) return 'wolf';
    return 'slime';
  };

  // Arknights-style 3-stage waveform inside each wave:
  // Stage 1 (0..40% dur): 40% probing wave -> Stage 2 (40..54% dur): quiet storm buffer -> Stage 3 (54..100% dur): dense surge!
  const s1Count = Math.round(totalMobs * 0.40);
  const s2Count = Math.min(4, Math.max(2, Math.round(totalMobs * 0.04)));
  const s3Count = Math.max(0, totalMobs - s1Count - s2Count);

  const pushPacks = (count, tStart, tEnd, packSz, heavy) => {
    for (let i = 0; i < count; ) {
      const pack = Math.min(packSz, count - i);
      const frac = count <= packSz ? 0.5 : i / count;
      const t = tStart + frac * (tEnd - tStart) + game.rnd() * 0.18;
      const side = sides[Math.floor(game.rnd() * sides.length)];
      for (let k = 0; k < pack; k++) {
        q.push({ at: t + k * 0.06, side, kind: pickMobKind(heavy), scale, spawned: false });
      }
      i += pack;
    }
  };

  pushPacks(s1Count, 0.35, duration * 0.40, 4, false);
  pushPacks(s2Count, duration * 0.44, duration * 0.48, 2, false);
  pushPacks(s3Count, duration * 0.54, duration, 6, true);

  // Elites from Wave 2 onward: 1 elite W2-11, 2 elites W12+
  if (w >= 2) {
    const eliteCount = w >= 12 ? 2 : 1;
    for (let e = 0; e < eliteCount; e++) {
      q.push({
        at: duration * (0.28 + e * 0.36),
        side: sides[e % sides.length],
        kind: 'elite', scale: Math.pow(1.25, w - 2), spawned: false
      });
    }
  }

  // 4 Major Bosses on Wave 5, 10, 15, 20, and every 5th Endless Wave
  if (w % 5 === 0) {
    const bossKind = w === 5 ? 'boss1' : w === 10 ? 'boss2' : w === 15 ? 'boss3' : 'boss4';
    const bScale = w > 20 ? Math.pow(1.28, (w - 20) / 2) : 1;
    q.push({ at: 2.2, side: 'west', kind: bossKind, scale: bScale, spawned: false });
  }

  q.sort((a, b) => a.at - b.at);
  return q;
}

function startWave(){
  if (game.phase !== 'prep') return false;
  AudioKit.unlock();
  // Safety net: auto-collect any unpicked ground chests from prep before starting next wave!
  if (game.chests.length) {
    for (const c of game.chests) queueModal({ type:'chest', legend: c.legend, shrineTier: !!c.shrineTier });
    game.chests = [];
    toast('已自动收起地面遗留的构装宝箱！');
    renderAllUI();
    return false;
  }
  const meta = getWavePhaseMeta(game.wave);
  const duration = Math.min(24, 14 + game.wave * 0.55);
  game.phase = 'wave';
  game.waveClock = 0;
  game.stormWarnAt = duration * 0.44;
  game.stormWarned = false;
  game.eliteChestDropped = false;
  game.waveQueue = buildWaveQueue(game.wave);
  game.autoWaveTimer = 0;

  // Spawn optional Black-Myth-style Blood Shrine (once per chapter: W3/W7/W12/W17)
  if (SHRINE_WAVES.includes(game.wave)) {
    const ang = game.rnd() * Math.PI * 2;
    const d = 10 + game.rnd() * 3.5;
    game.shrine = {
      x: clamp(game.hero.x + Math.cos(ang) * d, 3.2, W - 3.2),
      y: clamp(game.hero.y + Math.sin(ang) * d, 3.2, H - 3.2),
      r: 1.45, active: false, cleared: false, charge: 0, wave: game.wave
    };
  } else {
    game.shrine = null;
  }

  // Start Wave Telemetry sampler
  const h = game.hero;
  game.curWaveTel = {
    wave: game.wave, phaseTag: meta.tag, kind: meta.kind,
    duration: 0, minHpPct: Math.round(h.hp * 100 / Math.max(1, h.maxHp)),
    dmgTaken: 0, hitsTaken: 0, moveDist: 0, dashCount: 0, ultCount: 0,
    shrineTried: false, shrineCleared: false, ehpTotal: 0,
    dmgDealtStart: game.stats.dmgTotal, goldStart: game.gold
  };

  const isBoss = game.wave % 5 === 0;
  AudioKit.play(isBoss ? 'boss' : 'merge', isBoss ? 1 : 0.85);
  showBanner(
    isBoss ? `⚠️ 第 ${game.wave} 波 [${meta.tag}] · 首领降临！`
           : (game.endless ? `无尽第 ${game.wave} 波 · ${meta.tag}` : `第 ${game.wave} / ${MAIN_WAVES} 波 · ${meta.tag}`),
    isBoss ? '高能首领战！注意走位躲避破阵重击，斩首必爆高阶宝箱！'
           : (game.shrine ? '本章【🩸血煞妖碑】已现身远端！高危妖王试炼赢金币与天道+4%！' : '注意走位切入外圈弓巫并避开重击破阵！'),
    isBoss ? 'boss' : (meta.kind === 'relief' ? 'good' : '')
  );
  renderAllUI();
  return true;
}

/* Dynamic viewport-perimeter rectangle spawn: ALWAYS outside visible screen regardless of aspect ratio! */
function spawnPosAroundHero(side){
  const h = game.hero;
  const viewHalfW = (cam.w / (2 * Math.max(0.5, cam.zoom))) / CELL;
  const viewHalfH = (cam.h / (2 * Math.max(0.5, cam.zoom))) / CELL;
  const rx = Math.max(11.5, viewHalfW + 1.6);
  const ry = Math.max(8.5, viewHalfH + 1.6);
  const pick = side || ['west','east','north','south'][Math.floor(game.rnd() * 4)];
  const jitter = (game.rnd() * 2 - 1);
  let sx = h.x, sy = h.y;
  if (pick === 'east')       { sx = h.x + rx; sy = h.y + jitter * ry; }
  else if (pick === 'west')  { sx = h.x - rx; sy = h.y + jitter * ry; }
  else if (pick === 'south') { sy = h.y + ry; sx = h.x + jitter * rx; }
  else                       { sy = h.y - ry; sx = h.x + jitter * rx; }

  // If hero hugs a world border and spawn falls outside world, reflect to opposite open side
  if (sx < 0.8) sx = h.x + rx;
  else if (sx > W - 0.8) sx = h.x - rx;
  if (sy < 0.8) sy = h.y + ry;
  else if (sy > H - 0.8) sy = h.y - ry;

  return { x: clamp(sx, 0.8, W - 0.8), y: clamp(sy, 0.8, H - 0.8) };
}

function pickEliteAffixes(cnt = 1){
  const pool = ELITE_AFFIXES.slice();
  const out = [];
  while (out.length < cnt && pool.length) {
    out.push(pool.splice(Math.floor(game.rnd() * pool.length), 1)[0]);
  }
  return out;
}

function spawnEnemy(kind, side, scale = 1, customPos = null){
  const sp = ENEMY_SPECS[kind];
  const pos = customPos || spawnPosAroundHero(side);
  const hp = Math.round(sp.hp * scale);
  const affixCnt = sp.elite ? (game.wave >= 12 ? 2 : 1) : 0;
  const waveSpdMult = game.wave >= 16 ? 1.20 : game.wave >= 11 ? 1.14 : game.wave >= 6 ? 1.08 : 1.00;
  const wDmgMult = (1 + (game.wave - 1) * 0.095) * (game.wave >= 7 ? Math.pow(1.045, game.wave - 6) : 1);
  const e = {
    id: game.nextEnemyId++,
    kind, name: sp.name,
    x: pos.x, y: pos.y,
    hp, maxHp: hp, shield: 0,
    spd: Number((sp.spd * waveSpdMult).toFixed(2)), dmg: Math.round(sp.dmg * wDmgMult),
    xp: sp.xp, gold: sp.gold, r: sp.r,
    col: sp.col, rim: sp.rim,
    ranged: !!sp.ranged, range: sp.range || 0,
    leaper: !!sp.leaper, charger: !!sp.charger, bomber: !!sp.bomber, shaman: !!sp.shaman,
    elite: !!sp.elite, boss: !!sp.boss,
    affixes: affixCnt > 0 ? pickEliteAffixes(affixCnt) : [],
    cd: 0.4, slow: 0, slowT: 0, freezeT: 0, burnDps: 0, burnT: 0, vulnT: 0, frenzyT: 0,
    flash: 0, bossTimer: 5.0, bossPhase: 0, frenzied: false,
    aiState: 'chase', aiTimer: 0, aiCd: 2.0 + game.rnd() * 1.4, aiVx: 0, aiVy: 0,
    affixTimer: 2.4 + game.rnd() * 1.2, shamanTimer: 2.2, unstopFloatCd: 0
  };
  game.enemies.push(e);
  if (game.curWaveTel) game.curWaveTel.ehpTotal += hp;
  return e;
}
function isEnemyUnstoppable(e){
  return !!e && (e.aiState === 'windup' || e.aiState === 'leap' || e.aiState === 'charge');
}
function applyHeroLifesteal(rawAmt){
  const h = game.hero;
  if (!h || rawAmt <= 0 || h.hp >= h.maxHp) return 0;
  const bloodSet = gearSetTier('blood');
  const bloodMult = bloodSet >= 3 ? 1.80 : bloodSet >= 2 ? 1.45 : 1.0;
  const afkMult = (game.phase === 'wave' && !h.moving && h.invuln <= 0) ? 0.50 : 1.0;
  const cap = Math.max(8, Math.round(h.maxHp * 0.055 * bloodMult * afkMult));
  const avail = Math.max(0, cap - (h.leechUsed || 0));
  const heal = Math.min(rawAmt, avail, h.maxHp - h.hp);
  if (heal > 0) {
    h.hp += heal;
    h.leechUsed = (h.leechUsed || 0) + heal;
  }
  return heal;
}

function dealDamage(e, rawDmg, opts = {}){
  if (!e || e.hp <= 0) return 0;
  const syn = getSynergyCounts();
  const frostSet = gearSetTier('frost');
  const flameSet = gearSetTier('flame');
  let dmg = rawDmg;
  const frostSub = getSubSeal('frost');
  const chillAmp = frostSub ? SUB_SEAL_RESONANCE.frost.chillAmp[frostSub.star - 1] : 0;
  if ((e.slowT > 0 || e.freezeT > 0)) {
    if (syn.frost >= 2) dmg *= 1.25;
    if (chillAmp > 0) dmg *= (1 + chillAmp);
    if (frostSet >= 2) dmg *= (frostSet >= 3 ? 1.35 : 1.20);
  }
  if (flameSet >= 2 && (opts.skillKey === 'firewave' || opts.tower?.elem === 'fire' || opts.isFireExp)) {
    dmg *= (flameSet >= 3 ? 1.40 : 1.25);
  }
  if (e.vulnT > 0) dmg *= 1.20;

  // Dual Cataclysm (雷火劫印): burning enemy takes bonus thunder dmg + instant burn burst!
  const dcLv = perkLv('dual_cataclysm');
  if (dcLv > 0 && opts.isThunder && e.burnT > 0) {
    dmg *= (dcLv >= 2 ? 2.0 : 1.6);
    const burnBurst = Math.round(e.burnDps * e.burnT * 0.6);
    if (burnBurst > 0) dmg += burnBurst;
    e.burnT = 3.0;
    if (dcLv >= 2) applyHeroLifesteal(3);
  }

  const isCrit = opts.critChance ? game.rnd() < opts.critChance : false;
  if (isCrit) dmg *= (opts.critDmg || 1.7);
  dmg = Math.max(1, Math.round(dmg));

  // Zero Execution (绝对零度): Boss extra missing HP true dmg at Lv.2
  const zeLv = perkLv('zero_exec');
  if (zeLv >= 2 && e.boss && !opts.fromExec) {
    dmg += Math.round((e.maxHp - e.hp) * 0.06);
  }

  // Absorb enemy shield first if present (Elite affix)
  let hpDmg = dmg;
  if (e.shield > 0) {
    const abs = Math.min(e.shield, hpDmg);
    e.shield -= abs;
    hpDmg -= abs;
  }
  e.hp -= hpDmg;
  e.flash = 0.10;
  game.stats.dmgTotal += dmg;
  if (opts.tower) opts.tower.dmgDealt = (opts.tower.dmgDealt || 0) + dmg;
  if (opts.skillKey && game.stats.skillDmg && opts.skillKey in game.stats.skillDmg) {
    game.stats.skillDmg[opts.skillKey] += dmg;
  }

  // Zero Execution instant shatter kill on non-boss
  if (zeLv > 0 && e.hp > 0 && !e.boss && (e.freezeT > 0 || e.hp < e.maxHp * (zeLv >= 2 ? 0.30 : 0.20))) {
    e.hp = 0;
    addRing(e.x, e.y, '#8ef4ff', 1.1);
    addFloat(e.x, e.y - 0.5, '💠 绝对斩杀!', '#a8f8ff', true);
  }

  if (isCrit || dmg >= 28 || game.floats.length < 40) {
    addFloat(e.x + (game.rnd()-0.5)*0.3, e.y - 0.3, isCrit ? `${dmg}!` : `${dmg}`, isCrit ? '#ffdf4d' : (opts.col || '#ffffff'), isCrit);
  }
  if (isCrit) {
    AudioKit.play('crit');
    if (perkLv('crit_surge') >= 2) {
      game.hero.dashCd = Math.max(0, game.hero.dashCd - 0.15);
      game.hero.ultCd = Math.max(0, game.hero.ultCd - 0.15);
    }
    if (syn.holy >= 4 && !opts.noHolyProc) {
      addRing(e.x, e.y, '#ffe478', 1.35);
      for (const o of game.enemies) {
        if (o.id !== e.id && o.hp > 0 && dist(o, e) <= 1.4) dealDamage(o, Math.round(dmg * 0.35), { col:'#ffe478', noHolyProc:true, skillKey:'perk' });
      }
    }
    // Thunder Arc (紫霄天引): crit calls extra chain lightning
    const taLv = perkLv('thunder_arc');
    if (taLv > 0 && !opts.noChainProc && game.rnd() < (taLv >= 2 ? 0.55 : 0.30)) {
      fireChainLightning(e, Math.round(dmg * 0.55), taLv >= 2 ? 5 : 3, {
        ox: e.x, oy: e.y - 2.6, noChainProc: true, isThunder: true, skillKey: 'perk', vuln: taLv >= 2
      });
    }
    // Flame Set 2pc/3pc: crit vs burning enemy erupts赤焰爆轰
    if (flameSet >= 2 && e.burnT > 0 && !opts.noFlameBlast) {
      const fRad = flameSet >= 3 ? 2.2 : 1.6;
      addRing(e.x, e.y, '#ff6a38', fRad);
      for (const o of game.enemies) {
        if (o.id !== e.id && o.hp > 0 && dist(o, e) <= fRad + o.r) {
          dealDamage(o, Math.max(8, Math.round(dmg * 0.45)), { col:'#ff884d', noFlameBlast:true, isFireExp:true, skillKey:'perk' });
        }
      }
    }
  }

  // Slow & Frost Tier-4 Freeze Shatter (BLOCKED if Unstoppable windup/leap/charge!)
  if (opts.slow > 0) {
    if (isEnemyUnstoppable(e)) {
      if ((e.unstopFloatCd || 0) <= 0) {
        e.unstopFloatCd = 0.85;
        addFloat(e.x, e.y - 0.55, '🛡️霸体!', '#ffcc4d', true);
      }
    } else {
      e.slow = Math.max(e.slow, opts.slow);
      e.slowT = Math.max(e.slowT, opts.slowDur || 2.4);
      if (syn.frost >= 4 && !e.boss && e.freezeT <= 0 && game.rnd() < 0.25) {
        e.freezeT = 1.5 * (perkLv('frost_shatter') >= 2 ? 1.5 : 1);
        addRing(e.x, e.y, '#a4f4ff', 0.9);
        e.hp -= 60;
        addFloat(e.x, e.y - 0.55, '碎冰 -60', '#96f2ff', true);
      }
    }
  }
  if (opts.vuln) e.vulnT = Math.max(e.vulnT || 0, 3.0);
  if (opts.burn > 0) {
    e.burnDps = Math.max(e.burnDps, opts.burn);
    e.burnT = Math.max(e.burnT, 3.0);
  }

  // Dual Resonance: Wind+Fire & Frost+Thunder procs
  if ((opts.isWind || opts.tower?.elem === 'wind') && hasDualRes('wind_fire')) {
    e.burnDps = Math.max(e.burnDps, 14);
    e.burnT = Math.max(e.burnT, 3.0);
    if (!opts.fromWindRes && e.hp > 0 && game.rnd() < 0.35) {
      dealDamage(e, Math.max(5, Math.round(dmg * 0.30)), { col:'#ff9a52', fromWindRes:true, isFireExp:true, skillKey:'perk' });
    }
  }
  if (opts.isThunder && hasDualRes('frost_thunder') && (e.slowT > 0 || e.freezeT > 0) && !opts.fromDualFrost && e.hp > 0) {
    addRing(e.x, e.y, '#9ce4ff', 1.65);
    e.vulnT = Math.max(e.vulnT || 0, 3.0);
    for (const o of game.enemies) {
      if (o.hp > 0 && dist(o, e) <= 1.65 + o.r) {
        dealDamage(o, Math.max(6, Math.round(dmg * 0.35)), { col:'#9ce4ff', fromDualFrost:true, skillKey:'perk' });
      }
    }
  }
  // Frost Set 2pc/3pc: chance to form +10 icy shield on chilled enemy
  if (frostSet >= 2 && (e.slowT > 0 || e.freezeT > 0) && opts.skillKey !== 'perk' && game.rnd() < (frostSet >= 3 ? 0.35 : 0.22)) {
    const h = game.hero;
    h.shield = Math.min(60, h.shield + 10);
    h.shieldTimer = Math.max(h.shieldTimer, 4.0);
    h.frostShieldActive = true;
  }

  // Capped Lifesteal (100% consolidated into Hero with per-second recovery cap)
  if (opts.lifesteal > 0) {
    applyHeroLifesteal(opts.lifesteal * 0.50);
  }

  // On-hit Volt Crest chain proc
  if (opts.chainProc > 0 && !opts.noChainProc && game.rnd() < opts.chainProc) {
    fireChainLightning(e, Math.round(dmg * 0.55), 3, { tower: opts.tower, noChainProc: true, isThunder: true });
  }

  // Hero active hits trigger: Unique Seal Imbuement + Sword Rain perk
  if (opts.fromHero) {
    triggerSealOnHeroHit(e);
    const srLv = perkLv('sword_rain');
    if (srLv > 0) {
      game.hero.swordRainHits++;
      const req = srLv >= 2 ? 4 : 6;
      if (game.hero.swordRainHits >= req) {
        game.hero.swordRainHits = 0;
        const alive = game.enemies.filter(o => o.hp > 0);
        const tgt = alive.sort((a,b) => ((b.boss||b.elite?1:0)-(a.boss||a.elite?1:0)) || dist(game.hero,a)-dist(game.hero,b))[0] || e;
        const cnt = srLv >= 2 ? 5 : 3;
        const hs = getHeroStats();
        for (let i = 0; i < cnt; i++) {
          const ang = Math.atan2(tgt.y - game.hero.y, tgt.x - game.hero.x) + (i - (cnt-1)/2) * 0.14;
          pushProjectile({
            kind:'arrow', x: game.hero.x, y: game.hero.y,
            vx: Math.cos(ang)*18, vy: Math.sin(ang)*18, life: 0.65, r: 0.3,
            pierce: 3, hitSet: new Set(), dmg: Math.round(34 * hs.dmgMult), splash: 0,
            opts: { fromHero:false, skillKey:'perk', critChance:hs.crit, critDmg:hs.critDmg, col:'#ffe688' }
          });
        }
        addFloat(game.hero.x, game.hero.y - 0.6, '🌠 天剑降临!', '#ffe896');
      }
    }
  }

  if (e.hp <= 0) onEnemyKilled(e, opts);
  return dmg;
}

function onEnemyKilled(e, opts){
  game.stats.kills++;
  if (opts.tower) opts.tower.kills = (opts.tower.kills || 0) + 1;
  const bonusGold = (opts.bonusGold || 0);
  const baseGold = (e.elite || e.boss || e.gold >= 2) ? e.gold : (game.rnd() < 0.52 ? e.gold : 0);
  game.gold += baseGold + bonusGold;
  if ((e.elite || e.boss) && gearSetTier('blood') >= 2 && (game.hero.bloodKills || 0) < 10) {
    game.hero.bloodKills++;
    game.hero.baseMaxHp += 12;
    syncHeroMaxHp();
    addFloat(game.hero.x, game.hero.y - 0.7, `🩸血煞吞噬(${game.hero.bloodKills}/10)`, '#ff6e88', true);
  }

  // Ult Engine (燃魂超载): kills shorten Overdrive CD
  const ueLv = perkLv('ult_engine');
  if (ueLv > 0) {
    game.hero.ultKillCounter++;
    const need = ueLv >= 2 ? 15 : 25;
    if (game.hero.ultKillCounter >= need) {
      game.hero.ultKillCounter = 0;
      game.hero.ultCd = Math.max(0, game.hero.ultCd - (ueLv >= 2 ? 4 : 3));
    }
  }

  // Bomber enemy (煞灵毒虫) death bomb -> poison puddle!
  if (e.bomber) {
    game.zones.push({ kind:'poisonBomb', x:e.x, y:e.y, r:1.55, t:0.75, max:0.75, dmg: Math.round(e.dmg * 1.35) });
  }

  // Fire Tier-4 Corpse Explosion + Fire Nova perk (焚天余烬) + Fire Sub-Seal burn explosion
  const fnLv = perkLv('fire_nova');
  const fireSub = getSubSeal('fire');
  if ((getSynergyTier('fire') >= 2 || ((fnLv > 0 || fireSub) && e.burnT > 0)) && !opts.fromCorpse) {
    const pct = fnLv >= 2 ? 0.25 : getSynergyTier('fire') >= 2 ? 0.18 : fnLv === 1 ? 0.15 : 0.12;
    const rad = fnLv >= 2 ? 2.4 : 1.75;
    const expDmg = Math.max(22, Math.round(e.maxHp * pct));
    addRing(e.x, e.y, '#ff6d38', rad);
    for (const o of game.enemies) {
      if (o.id !== e.id && o.hp > 0 && dist(o, e) <= rad) {
        dealDamage(o, expDmg, { col:'#ff884d', fromCorpse:true, skillKey:'perk', burn: fnLv >= 2 ? 16 : 0 });
      }
    }
  }

  // Frost Shatter perk (玄冰碎甲): chilled/frozen death bursts piercing ice shards
  const fsLv = perkLv('frost_shatter');
  if (fsLv > 0 && (e.slowT > 0 || e.freezeT > 0)) {
    const cnt = fsLv >= 2 ? 7 : 4;
    const hs = getHeroStats();
    for (let i = 0; i < cnt; i++) {
      const ang = (Math.PI * 2 * i) / cnt;
      pushProjectile({
        kind:'arrow', x: e.x, y: e.y, vx: Math.cos(ang)*13, vy: Math.sin(ang)*13,
        life: 0.35, r: 0.25, pierce: 2, hitSet: new Set([e.id]),
        dmg: Math.round(24 * hs.dmgMult), splash: 0,
        opts: { fromHero:false, skillKey:'perk', col:'#8cf2ff', slow: 0.35, slowDur: 1.8 }
      });
    }
  }

  // Drop XP Gem
  game.gems.push({
    x: e.x + (game.rnd()-0.5)*0.25,
    y: e.y + (game.rnd()-0.5)*0.25,
    xp: e.xp, big: e.elite || e.boss,
    vx: (game.rnd()-0.5)*1.8, vy: (game.rnd()-0.5)*1.8, t: 0
  });
  // Dao Fortune perk: Elite/Boss drops an extra big XP orb
  if (perkLv('dao_fortune') >= 1 && (e.elite || e.boss)) {
    game.gems.push({ x: e.x + 0.35, y: e.y - 0.25, xp: 28, big: true, vx: 1.2, vy: -1.0, t: 0 });
  }

  // Blood Shrine Boss Reward (Chapter-capped chest +25 gold + permanent +4% TianDao, NO giant XP skip!)
  if (e.isShrineBoss) {
    game.stats.elites++;
    if (game.shrine) game.shrine.cleared = true;
    if (game.curWaveTel) game.curWaveTel.shrineCleared = true;
    game.gold += 25;
    game.hero.shrineBonusTian = (game.hero.shrineBonusTian || 0) + 4;
    game.chests.push({ x: e.x, y: e.y, legend: game.wave >= 12, shrineTier: true, bob: 0 });
    addRing(e.x, e.y, '#ff4d6d', 2.8);
    showBanner('🩸 血煞妖王已伏诛！', '掉落章节血碑宝箱 + 25 金币 + 永久天道概率 +4%！', 'good');
    AudioKit.play('chest', 1.2);
    game.shake = Math.max(game.shake, 8);
    return;
  }

  // Drop Equipment Chest: Boss always drops Legend Chest; 1st Elite per wave guaranteed, 2nd Elite 25% chance
  if (e.boss || e.elite) {
    game.stats.elites++;
    const dropChest = e.boss || !game.eliteChestDropped || (e.elite && game.rnd() < 0.25);
    if (dropChest) {
      if (e.elite) game.eliteChestDropped = true;
      game.chests.push({ x: e.x, y: e.y, legend: !!e.boss, bob: 0 });
      addRing(e.x, e.y, '#ffe478', 2.2);
      addFloat(e.x, e.y - 0.5, e.boss ? '👑 传说宝箱掉落！' : '📦 构装宝箱掉落！', '#ffe478', true);
      AudioKit.play('chest');
      game.shake = Math.max(game.shake, e.boss ? 10 : 5);
    } else {
      game.gold += 14;
      addFloat(e.x, e.y - 0.5, '💰 精英赏金 +14', '#ffe478', true);
      AudioKit.play('coin', 1.1);
    }
  }
}

function fireChainLightning(startEnemy, dmg, maxTargets, opts = {}){
  const visited = new Set([startEnemy.id]);
  let cur = startEnemy;
  const thSet = gearSetTier('thunder');
  const totalTargets = maxTargets + (thSet >= 3 ? 1 : 0);
  const jumpMult = thSet >= 2 ? 1.12 : 0.88;
  const pts = [{ x: opts.ox ?? startEnemy.x, y: opts.oy ?? startEnemy.y }, { x: startEnemy.x, y: startEnemy.y }];
  dealDamage(cur, dmg, { ...opts, col:'#d8a6ff', noChainProc:true, isThunder:true });

  let curDmg = dmg;
  for (let i = 1; i < totalTargets; i++) {
    let best = null, bestD = 2.8;
    for (const e of game.enemies) {
      if (e.hp <= 0 || visited.has(e.id)) continue;
      const d = dist(cur, e);
      if (d < bestD) { bestD = d; best = e; }
    }
    if (!best) break;
    visited.add(best.id);
    pts.push({ x: best.x, y: best.y });
    curDmg = Math.max(1, Math.round(curDmg * jumpMult));
    dealDamage(best, curDmg, { ...opts, col:'#d8a6ff', noChainProc:true, isThunder:true });
    cur = best;
  }
  game.bolts.push({ pts, t: 0.24, max: 0.24, col: opts.col || '#cf96ff', comboThunderFire: !!opts.comboThunderFire });
  AudioKit.play('thunder');
}

/* ==================== HERO SKILLS (SMART TARGETING + SPIRIT SWORD + COMBOS) ==================== */
function castHeroDash(){
  if (paused || game.activeModal) return false;
  const h = game.hero;
  if (h.dashCd > 0) { toast(`烈焰冲刺冷却中 (${h.dashCd.toFixed(1)}s)`, true); return false; }
  if (game.curWaveTel) game.curWaveTel.dashCount++;
  const hs = getHeroStats();
  if (pointerScreen) pointerWorld = screenToWorld(pointerScreen.x, pointerScreen.y);
  let dx = Number(keys.has('d')||keys.has('arrowright')) - Number(keys.has('a')||keys.has('arrowleft'));
  let dy = Number(keys.has('s')||keys.has('arrowdown')) - Number(keys.has('w')||keys.has('arrowup'));
  if (!dx && !dy) {
    if (pointerWorld) { dx = pointerWorld.x - h.x; dy = pointerWorld.y - h.y; }
    else { dx = h.face; dy = 0; }
  }
  const len = Math.max(0.01, Math.hypot(dx, dy));
  dx /= len; dy /= len;
  const ox = h.x, oy = h.y;
  const dashDist = 3.8;
  h.x = clamp(h.x + dx * dashDist, 1.2, W - 1.2);
  h.y = clamp(h.y + dy * dashDist, 1.2, H - 1.2);
  h.invuln = 0.6;
  h.shield = Math.max(h.shield, 35);
  h.shieldTimer = 3.5;
  const wgLv = perkLv('wind_gale');
  const cdFactor = wgLv >= 2 ? 0.55 : wgLv === 1 ? 0.75 : 1.0;
  if (wgLv > 0) h.dashBuffT = 2.0;
  h.dashCd = Math.max(1.4, (4.2 * cdFactor) / (1 + Math.max(0, hs.gm.aspd) * 0.6));

  for (let s = 0; s < 3; s++) {
    const px = ox + (h.x - ox) * (s / 2);
    const py = oy + (h.y - oy) * (s / 2);
    addRing(px, py, '#ff7b47', 1.45);
    for (const e of game.enemies) {
      if (e.hp > 0 && dist(e, {x:px,y:py}) <= 1.55) {
        dealDamage(e, Math.round(32 * hs.dmgMult), { fromHero:true, skillKey:'dash', critChance:hs.crit, critDmg:hs.critDmg, col:'#ff8e52', burn:12, lifesteal:hs.lifesteal });
      }
    }
  }
  // Sword Echo (剑影分身): dash unleashes 1 or 4 piercing sword waves!
  const seLv = perkLv('sword_echo');
  if (seLv > 0) {
    const baseAng = Math.atan2(dy, dx);
    const dirs = seLv >= 2 ? [0, Math.PI/2, Math.PI, -Math.PI/2] : [0];
    for (const off of dirs) {
      const a = baseAng + off;
      pushProjectile({
        kind:'firewave', x: h.x, y: h.y, vx: Math.cos(a)*12, vy: Math.sin(a)*12,
        life: 0.35 * hs.rangeMult, r: 0.52, pierce: 2, hitSet: new Set(),
        dmg: Math.round(36 * hs.skillDmgMult), critChance: hs.crit, critDmg: hs.critDmg, lifesteal: hs.lifesteal, bonusGold: hs.gm.bonusGold,
        isThunderFireCombo: hasCombo('thunder_fire')
      });
    }
  }
  // Thunder Set 2pc/3pc: Dash calls purple chain lightning at landing (and start at 3pc)
  const thSet = gearSetTier('thunder');
  if (thSet >= 2) {
    const aliveTh = game.enemies.filter(e => e.hp > 0);
    const strikeAt = (px, py, ch) => {
      const tgt = aliveTh.filter(e => e.hp > 0 && dist({x:px, y:py}, e) <= 5.0).sort((a,b) => dist({x:px,y:py},a) - dist({x:px,y:py},b))[0];
      if (tgt) fireChainLightning(tgt, Math.round(40 * hs.dmgMult), ch, { ox: px, oy: py, skillKey:'perk', critChance:hs.crit, critDmg:hs.critDmg });
    };
    strikeAt(h.x, h.y, thSet >= 3 ? 4 : 3);
    if (thSet >= 3) strikeAt(ox, oy, 4);
  }
  AudioKit.play('fire', 1.2);
  renderAllUI();
  return true;
}

function castHeroOverdrive(){
  if (paused || game.activeModal) return false;
  const h = game.hero;
  if (h.ultCd > 0) { toast(`全军超载冷却中 (${h.ultCd.toFixed(1)}s)`, true); return false; }
  if (game.curWaveTel) game.curWaveTel.ultCount++;
  h.ultTimer = perkLv('ult_engine') >= 2 ? 8.0 : 5.0;
  h.ultCd = 18.0;
  game.shake = 6;
  addRing(h.x, h.y, '#ffe478', 4.5);
  addFloat(h.x, h.y - 0.6, `⚡ 全军超载 ${h.ultTimer}s！攻速+80% 暴击+35%`, '#ffe878', true);
  AudioKit.play('merge', 1.15);
  renderAllUI();
  return true;
}

function pickAimTarget(alive, range = 99, preferPriority = false){
  const h = game.hero;
  const inRange = alive.filter(e => dist(h, e) <= range);
  if (!inRange.length) return null;
  if (preferPriority) {
    return inRange.slice().sort((a, b) => {
      const sa = (a.boss ? 1000 : a.elite ? 500 : a.shaman ? 300 : (a.bomber || a.ranged) ? 150 : 0) - dist(h, a) * 10;
      const sb = (b.boss ? 1000 : b.elite ? 500 : b.shaman ? 300 : (b.bomber || b.ranged) ? 150 : 0) - dist(h, b) * 10;
      return sb - sa;
    })[0];
  }
  if (pointerWorld && dist(h, pointerWorld) > 0.5) {
    const aimAng = Math.atan2(pointerWorld.y - h.y, pointerWorld.x - h.x);
    const inCone = inRange.filter(e => {
      let diff = Math.abs(Math.atan2(e.y - h.y, e.x - h.x) - aimAng);
      if (diff > Math.PI) diff = Math.PI * 2 - diff;
      return diff <= 0.65;
    });
    if (inCone.length) return inCone.sort((a, b) => dist(h, a) - dist(h, b))[0];
  }
  return inRange.slice().sort((a, b) => dist(h, a) - dist(h, b))[0];
}

function updateHero(dt){
  const h = game.hero;
  const hs = getHeroStats();
  h.dashCd = Math.max(0, h.dashCd - dt);
  h.ultCd = Math.max(0, h.ultCd - dt);
  h.ultTimer = Math.max(0, h.ultTimer - dt);
  h.dashBuffT = Math.max(0, h.dashBuffT - dt);
  h.thornsCd = Math.max(0, h.thornsCd - dt);
  h.invuln = Math.max(0, h.invuln - dt);
  h.armorBreakT = Math.max(0, (h.armorBreakT || 0) - dt);
  h.leechTimer = (h.leechTimer || 0) + dt;
  if (h.leechTimer >= 1.0) { h.leechTimer -= 1.0; h.leechUsed = 0; }
  if (h.shieldTimer > 0) {
    h.shieldTimer = Math.max(0, h.shieldTimer - dt);
    if (h.shieldTimer === 0) { h.shield = 0; h.frostShieldActive = false; }
  }

  if (pointerDown && pointerScreen) {
    pointerWorld = screenToWorld(pointerScreen.x, pointerScreen.y);
  }

  // Crowd slowdown (怪群挤压阻滞): being surrounded slows normal walking unless Dashing/Overdriving!
  let crowdCnt = 0;
  if (game.phase === 'wave' && h.ultTimer <= 0 && h.invuln <= 0) {
    for (const e of game.enemies) {
      if (e.hp > 0 && dist(e, h) <= 0.85 + e.r) crowdCnt++;
    }
  }
  const crowdMult = crowdCnt > 0 ? Math.max(0.55, 1 - crowdCnt * 0.11) : 1.0;

  // Movement (WASD / Arrows / Hold-pointer) across open 64x48 world
  const prevX = h.x, prevY = h.y;
  const spd = hs.moveSpd * crowdMult;
  let dx = Number(keys.has('d')||keys.has('arrowright')) - Number(keys.has('a')||keys.has('arrowleft'));
  let dy = Number(keys.has('s')||keys.has('arrowdown')) - Number(keys.has('w')||keys.has('arrowup'));
  if (dx || dy) {
    h.goal = null;
    const len = Math.hypot(dx, dy);
    dx /= len; dy /= len;
    if (dx) h.face = dx < 0 ? -1 : 1;
    h.x = clamp(h.x + dx * spd * dt, 1.2, W - 1.2);
    h.y = clamp(h.y + dy * spd * dt, 1.2, H - 1.2);
    h.moving = true;
  } else if (pointerDown && pointerWorld && !game.mode) {
    const d = dist(h, pointerWorld);
    if (d > 0.25) {
      const mx = (pointerWorld.x - h.x) / d, my = (pointerWorld.y - h.y) / d;
      if (Math.abs(mx) > 0.05) h.face = mx < 0 ? -1 : 1;
      h.x = clamp(h.x + mx * spd * dt, 1.2, W - 1.2);
      h.y = clamp(h.y + my * spd * dt, 1.2, H - 1.2);
      h.moving = true;
    } else h.moving = false;
  } else if (h.goal) {
    const d = dist(h, h.goal);
    if (d <= 0.22) { h.goal = null; h.moving = false; }
    else {
      const mx = (h.goal.x - h.x) / d, my = (h.goal.y - h.y) / d;
      if (Math.abs(mx) > 0.05) h.face = mx < 0 ? -1 : 1;
      h.x = clamp(h.x + mx * spd * dt, 1.2, W - 1.2);
      h.y = clamp(h.y + my * spd * dt, 1.2, H - 1.2);
      h.moving = true;
    }
  } else {
    h.moving = false;
  }
  if (game.curWaveTel && game.phase === 'wave') {
    game.curWaveTel.moveDist += Math.hypot(h.x - prevX, h.y - prevY);
  }

  // Only fire combat skills when enemies exist AND starter skill has been picked!
  if (game.phase !== 'wave') return;
  const alive = game.enemies.filter(e => e.hp > 0);
  if (!alive.length) return;
  const hasAnySkill = Object.values(h.skills).some(v => v > 0);
  if (!hasAnySkill) return;

  // 0. Innate Spirit Sword Trigger (本命御剑引子: NEVER fires at thin air when no enemy is in range!)
  h.skillTimers.spirit = Math.max(0, (h.skillTimers.spirit ?? 0) - dt * hs.aspd);
  if (h.skillTimers.spirit <= 0) {
    const tgt = pickAimTarget(alive, 4.5 * hs.rangeMult, false);
    if (tgt) {
      h.skillTimers.spirit = 0.95 * hs.skillCdMult;
      const ang = Math.atan2(tgt.y - h.y, tgt.x - h.x);
      pushProjectile({
        kind: 'arrow', x: h.x, y: h.y, vx: Math.cos(ang) * 15.5, vy: Math.sin(ang) * 15.5,
        life: 0.30 * hs.rangeMult, r: 0.28, pierce: 1, hitSet: new Set(),
        dmg: Math.round(14 * hs.dmgMult), splash: 0,
        opts: { fromHero:true, skillKey:'spirit', critChance:hs.crit, critDmg:hs.critDmg, col:'#9fffe0', lifesteal:hs.lifesteal, bonusGold:hs.gm.bonusGold }
      });
    }
  }

  // Sword Set 2pc/3pc: firing bonus cloud swords while moving if enemies near
  const swordSet = gearSetTier('sword');
  if (swordSet >= 2 && h.moving) {
