<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="bg-build-kind" content="modular-game" />
<meta name="bg-source-baseline" content="295a0b9cb8329d12f7127886a2bc412416def6a1" />
<title>边境守卫 v0.60 · 30 波构筑重构试玩</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23121e24'/%3E%3Cpath fill='none' stroke='%23f3d47c' stroke-width='4' d='M32 11l17 9v12c0 11-8 17-17 22-9-5-17-11-17-22V20zM32 20v24m-7-15h14'/%3E%3C/svg%3E" />
</head>
<body data-phase="prep" data-dock-tab="shop">
<div class="final-prep-clock hud-island" id="finalPrepClock" hidden role="timer"></div>
<canvas id="gameCanvas"></canvas>

<!-- Floating Safe-Zone Top HUD Islands (no full-width web navbar) -->
<header class="topbar" id="topbar">
  <!-- Top-Left Island: Brand + Wave + Hero Vitals/Realm -->
  <div class="top-left hud-island">
    <div class="brand" title="边境守卫 v0.60">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m12 3 7 4v5c0 4-4 7-7 9-3-2-7-5-7-9V7zM12 7v9m-3-4h6"/></svg>
    </div>
    <span class="pill wave-prep" id="wavePill">第 1 / 30 波 · 备战</span>
    <button class="hero-vitals-btn" id="heroPill" type="button" title="当前生命、境界与经验（点击查看属性与突破详情）">
      <span class="hv-row">
        <span class="pill hp" id="heroHpPill">❤️ 220/220</span>
        <span class="hv-shield" id="heroShield" hidden title="剩余护盾"></span>
        <span class="hv-lv" id="heroLvTxt">炼气·初探 Lv.1</span>
      </span>
      <span class="hv-bars">
        <span class="hp-bar"><span class="hp-fill" id="heroHpFill" style="width:100%"></span></span>
        <span class="xp-bar"><span class="xp-fill" id="xpFill"></span></span>
      </span>
    </button>
  </div>

  <!-- Top-Center Contextual Boss & Wave Status Banner (visible during wave) -->
  <div class="wave-boss-banner hud-island" id="waveBossBanner" hidden>
    <div class="wbb-row">
      <span class="wbb-title" id="waveBossTitle">⚔️ 敌潮交战中</span>
      <span class="pill" id="enemyPill">👾 剩余 0</span>
    </div>
    <div class="wbb-track" id="waveBossTrack" hidden>
      <div class="wbb-fill" id="waveBossFill" style="width:100%"></div>
    </div>
  </div>

  <!-- Top-Right Islands: Active Currencies + Quiet System Controls -->
  <div class="top-right">
    <div class="hud-island res-island">
      <span class="pill gold" id="goldPill" title="金币（商店购买、刷新与天命赌局）">💰 55</span>
      <span class="res-sep" aria-hidden="true"></span>
      <span class="pill" id="matPill" title="锻材（用于构装强化与 W20 突破强化重抽）">⚙️ 0</span>
      <span class="pill" id="tokenPill" hidden title="天命转印符（用于词条转移台）">🔮 0</span>
      <span class="pill" id="shardPill" hidden title="局外传承碎片（仅用于局外横向解锁）">💠 0</span>
      <span class="pill fps" id="fpsPill" hidden>60 FPS</span>
    </div>
    <div class="hud-island sys-island">
      <button class="btn sys-meta" id="metaLegacyBtn" type="button" title="局外传承配置与解锁（局内只读展示并锁定配置）">💠 传承</button>
      <button class="btn" id="speedBtn" type="button" title="战斗倍速 [F]">1×</button>
      <button class="btn" id="pauseBtn" type="button" title="暂停/继续">暂停</button>
      <button class="btn" id="soundBtn" type="button" title="音效开关">🔊</button>
      <button class="btn" id="helpBtn" type="button" title="玩法说明">玩法</button>
      <button class="btn" id="resetBtn" type="button" title="重新开始本局">重开</button>
    </div>
  </div>
</header>

<!-- Legacy hidden anchors preserved for zero-flicker dirty render compatibility -->
<section class="subbar" id="subbar" hidden>
  <div class="syn-strip" id="sealStrip"></div>
  <div class="sub-actions" id="secondaryActions">
    <div class="skill-strip" id="skillStrip"></div>
    <button class="meta-badge" id="metaBadge" type="button">✨ 突破 0/2 · 组合 0/4</button>
    <button class="btn" id="heroPanelBtn" type="button">👑 属性/神通 [C]</button>
  </div>
</section>

<div class="hp-vignette" id="hpVignette"></div>
<div class="trib-flash" id="tribFlash"></div>

<!-- Unified Single Left Build Glance Card (auto-collapses in Wave for clean arena) -->
<aside class="left-hud build-hud hud-island" id="leftHud">
  <div class="lh-head" id="leftHudHead" title="按 [Tab] 或点击折叠/展开构筑总览">
    <span class="lh-collapsed-lbl">🧩 构筑</span>
    <div class="lh-tabs" id="leftHudTabs">
      <button class="lh-tab active" id="leftTabBuild" type="button" data-left-tab="build">🧩 构筑</button>
      <button class="lh-tab" id="leftTabSyn" type="button" data-left-tab="syn">✨ 羁绊</button>
    </div>
    <button class="btn lh-toggle" id="leftHudToggle" type="button">折叠 [Tab]</button>
  </div>
  <div class="lh-body" id="leftHudBody"></div>
</aside>

<!-- Layer-3 On-Demand Right Inspector Drawer -->
<aside class="inspector hud-island" id="inspector" hidden>
  <div class="insp-head">
    <div class="insp-title" id="inspTitle">领主</div>
    <button class="btn" id="inspClose" type="button">关闭</button>
  </div>
  <div class="insp-sub" id="inspSub"></div>
  <div class="stat-grid" id="inspStats"></div>
  <div class="insp-sec-lbl" id="inspSlotLbl">领主全局构装（4 槽 · 点击装卸）</div>
  <div class="slot-row" id="inspSlots"></div>
  <div class="gear-fx-list" id="inspGearFx"></div>
  <div class="insp-actions" id="inspActions"></div>
  <div class="insp-sec-lbl" id="inspSkillLbl" hidden>已选神通 · 伤害构成与升级效果</div>
  <div class="skill-list" id="inspSkills"></div>
</aside>

<div class="toast" id="toast" hidden></div>
<div class="banner" id="banner" hidden>
  <div class="bt" id="bannerTitle"></div>
  <div class="bs" id="bannerSub"></div>
</div>

<!-- Phase-Aware Bottom Command Console -->
<div class="dock-wrap">
  <!-- PREP MODE: Floating Mode Strip + Locked-Geometry Shop/Bag Console -->
  <div class="prep-console-wrap" id="prepConsoleWrap">
    <div class="prep-strip">
      <div class="hud-island seg-group" role="tablist" aria-label="备战操作台切换">
        <button class="seg-tab active" id="shopOpen" type="button" role="tab" aria-selected="true">
          <span>🏪</span><span>商店</span>
        </button>
        <button class="seg-tab" id="bagOpen" type="button" role="tab" aria-selected="false">
          <span>🎒</span><span>背包</span><span class="seg-badge" id="bagCount">0/12</span>
        </button>
      </div>
      <div class="hud-island prep-tools">
        <button class="btn prep-tool-gold" id="destinyBtn" type="button" title="天命赌局：自由押注金币抽取灵印/构装/丹药/天命专属强化与转印符（备战期可用）">🎲 天命赌局</button>
        <button class="btn prep-tool-purple" id="transferBtn" type="button" title="词条转移台：消耗天命转印符与金币，在已穿戴与背包装备间转移词条（备战期可用）">✨ 词条转移</button>
        <button class="btn gold" id="w20PrepBtn" type="button" hidden title="W16-W20 预选第二次突破方向与查看 W19 首领情报">⚡ W20 方向预选</button>
        <span class="res-sep" aria-hidden="true"></span>
        <button class="btn" id="intelOpen" type="button" title="查看本波敌情、首领机制与战绩统计">📊 情报</button>
        <button class="btn" id="autoWaveBtn" type="button" title="备战结束后自动开启下一波">自动下波：关</button>
        <span id="uiPanelTimer" class="pill gold" hidden></span>
      </div>
    </div>

    <div class="dock hud-island console-deck" id="dock">
      <!-- Shop View (Locked 156px height) -->
      <div class="deck-view" id="uiShopPanel">
        <div class="deck-anchor">
          <div class="dock-gold" id="dockGold">
            <span class="lbl">可用金币</span>
            <b id="dockGoldNum">55</b>
          </div>
          <button class="act-btn reroll-btn" id="rerollBtn" type="button" title="刷新商店商品 [Q]">
            <span class="rr-top">🎲 刷新 <kbd class="kbd-cap">Q</kbd></span>
            <span class="sb" id="rerollCost">5 金币</span>
          </button>
        </div>
        <div class="dock-sec shop-grid" id="shopSec"></div>
      </div>

      <!-- Bag View (IDENTICAL 156px height — 0px jump!) -->
      <div class="deck-view" id="uiBagPanel" hidden>
        <div class="deck-anchor">
          <div class="dock-gold bag-cap-card">
            <span class="lbl">背包容量</span>
            <b id="bagCapNum">0/12</b>
          </div>
          <div class="bag-mat-pill" id="bagMatNum">⚙️ 0 锻材</div>
        </div>
        <div class="bag-deck-main">
          <div class="bag-tray" id="bagTray"></div>
          <div id="bagSelection" class="bag-selection" hidden></div>
          <div id="bagSelectionEmpty" class="bag-selection-placeholder">点击左侧装备查看操作<br>右键快卖 · Shift+右键拆材</div>
        </div>
      </div>

      <!-- Right Primary CTA -->
      <button class="act-btn primary wave-cta" id="waveBtn" type="button">
        <kbd class="kbd-cap">Enter</kbd>
        <span class="ic">⚔️</span>
        <span class="nm" id="waveBtnNm">开始第 1 波</span>
        <span class="sb" id="waveBtnSb">备战中</span>
      </button>
    </div>
  </div>

  <!-- WAVE MODE: Clean Spacious Combat Action Bar (Shop/Bag auto-hidden!) -->
  <div class="wave-dock hud-island" id="heroSkillSec">
    <button class="act-btn skill-btn dash-skill" id="dashBtn" type="button">
      <span class="ic">🔥</span>
      <span class="sk-txt">
        <span class="nm">烈焰冲刺 <kbd class="kbd-cap">Space</kbd></span>
        <span class="sb">位移 + 留火径</span>
      </span>
      <span class="cd-mask" id="dashCd" hidden></span>
    </button>
    <button class="act-btn skill-btn ult-skill" id="ultBtn" type="button">
      <span class="ic">⚡</span>
      <span class="sk-txt">
        <span class="nm">全军超载 <kbd class="kbd-cap">R</kbd></span>
        <span class="sb">5s 全队狂暴</span>
      </span>
      <span class="cd-mask" id="ultCd" hidden></span>
    </button>
    <div class="dock-div"></div>
    <button class="btn wave-peek-btn" id="waveIntelBtn" type="button" title="查看战场情报与首领机制">📊 情报</button>
    <button class="btn wave-peek-btn" id="waveHeroBtn" type="button" title="查看领主属性与神通 [C]">👑 属性</button>
  </div>
</div>

<!-- On-Demand Battle Intel Overlay (replaces permanent left battle-hud wall) -->
<div class="ui-panel-backdrop" id="uiPanelBackdrop" hidden>
  <section class="ui-panel hud-island" role="dialog" aria-modal="true" aria-labelledby="uiPanelTitle">
    <header>
      <h2 id="uiPanelTitle">⚔️ 战场情报</h2>
      <button class="btn" id="uiPanelClose" type="button" aria-label="关闭">关闭 ×</button>
    </header>
    <section id="uiIntelPanel">
      <aside class="battle-hud" id="battleHud">
        <div class="lh-head" id="battleHudHead" hidden>
          <span>⚔️ 战场情报</span>
          <button class="btn" id="battleHudToggle" type="button">折叠</button>
        </div>
        <div class="lh-body" id="battleHudBody"></div>
      </aside>
    </section>
  </section>
</div>

<div id="uiDetailTooltip" role="tooltip" hidden></div>
<div class="modal-backdrop" id="modalBackdrop" hidden>
  <div class="modal" id="modalBox"></div>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
