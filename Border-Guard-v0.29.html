function boundaries(showStarting){
  if(showStarting||!(game.wallRings instanceof Map)||!game.wallRings.size){
    const lineColor=showStarting?'#efd49aa6':'#f1d68eb8';
    for(const t of game.tiles){
      const region=showStarting?game.sites.findIndex(s=>Math.abs(t.x-s.x)<=2&&Math.abs(t.y-s.y)<=2):t.owned?0:-1;
      if(region===-1)continue;
      const x=t.x*CELL,y=t.y*CELL;
      dirs.forEach(([dx,dy])=>{
        const n=tileAt(t.x+dx,t.y+dy);
        const adjacent=n&&(showStarting?Math.abs(n.x-game.sites[region].x)<=2&&Math.abs(n.y-game.sites[region].y)<=2:n.owned);
        if(adjacent)return;
        const sx=dx>0?x+CELL:x,sy=dy>0?y+CELL:y;
        line(sx,sy,dx?sx:x+CELL,dy?sy:y+CELL,lineColor,2);
      });
    }
    return;
  }
  drawWallRings();
}
function drawWallRings(){
  for(const ring of game.wallRings.values()){
    if(ring.status==='broken'||ring.hp<=0)continue;
    const selected=game.selectedRingId===ring.id;
    const corners=new Map();
    for(const edge of ring.edges.values()){
      const ends=edgeEndpoints(edge);
      if(!ends)continue;
      const [a,b]=ends;
      const gate=isGateEdge(ring,edge.id);
      const ax=a.x*CELL,ay=a.y*CELL,bx=b.x*CELL,by=b.y*CELL;
      const dx=bx-ax,dy=by-ay,len=Math.hypot(dx,dy)||1;
      const ux=dx/len,uy=dy/len,nx=-uy,ny=ux;
      const thick=gate?10:8;
      ctx.save();
      // 投影厚度
      ctx.strokeStyle='#2a322888';
      ctx.lineWidth=thick+4;
      ctx.lineCap='butt';
      ctx.beginPath();ctx.moveTo(ax+nx*2,ay+ny*2);ctx.lineTo(bx+nx*2,by+ny*2);ctx.stroke();
      // 墙身
      ctx.strokeStyle=gate?'#d4b36a':selected?'#e8d7a8':'#a8a48c';
      ctx.lineWidth=thick;
      ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(bx,by);ctx.stroke();
      // 顶缘高光
      ctx.strokeStyle=gate?'#f0d9a0':'#d2cbb4';
      ctx.lineWidth=3;
      ctx.beginPath();
      ctx.moveTo(ax-nx*thick*.28,ay-ny*thick*.28);
      ctx.lineTo(bx-nx*thick*.28,by-ny*thick*.28);
      ctx.stroke();
      // 雉堞
      const merlons=Math.max(1,Math.floor(len/18));
      for(let i=0;i<merlons;i++){
        const t=(i+.5)/merlons;
        const mx=ax+dx*t,my=ay+dy*t;
        ctx.fillStyle='#cfc8b0';
        ctx.fillRect(mx-nx*thick*.55-3.5,my-ny*thick*.55-3.5,7,7);
        ctx.fillStyle='#8f8a74';
        ctx.fillRect(mx-nx*thick*.55-3.5,my-ny*thick*.55+2,7,2);
      }
      if(gate){
        const mx=(ax+bx)/2,my=(ay+by)/2;
        ctx.fillStyle='#3a3530';
        ctx.fillRect(mx-11,my-4,22,14);
        ctx.fillStyle='#4a82a4';
        ctx.fillRect(mx-9,my-18,18,14);
        path([[mx-10,my-18],[mx,my-28],[mx+10,my-18]],'#5a96b8','#243e52',1.5);
        ctx.fillStyle='#1c2420';
        ctx.fillRect(mx-5,my-2,10,12);
        ctx.strokeStyle='#efc47e';ctx.lineWidth=2;
        ctx.strokeRect(mx-12,my-19,24,30);
      }
      ctx.restore();
      for(const p of [a,b]){
        const key=p.x+','+p.y;
        corners.set(key,(corners.get(key)||0)+1);
      }
    }
    // 拐角塔
    for(const [key,deg] of corners){
      if(deg<2)continue;
      const [cx,cy]=key.split(',').map(Number);
      const px=cx*CELL,py=cy*CELL;
      ctx.save();
      ctx.fillStyle='#2a3228aa';
      ctx.fillRect(px-9,py-7,20,20);
      ctx.fillStyle='#b7b29a';
      ctx.fillRect(px-8,py-10,16,16);
      ctx.fillStyle='#d2cbb4';
      ctx.fillRect(px-8,py-12,16,4);
      for(let i=0;i<3;i++)ctx.fillRect(px-8+i*5.5,py-15,4,4);
      ctx.fillStyle='#5a5348';
      ctx.fillRect(px-2,py-2,4,6);
      ctx.restore();
    }
    // 统一圈耐久
    const pts=[...ring.edges.values()].map(e=>edgeEndpoints(e)).filter(Boolean);
    if(pts.length){
      let sx=0,sy=0;
      for(const [a,b] of pts){sx+=(a.x+b.x)/2;sy+=(a.y+b.y)/2;}
      sx/=pts.length;sy/=pts.length;
      const label=ring.id==='home'?'主城城墙':'营地城墙';
      bar(sx*CELL-34,sy*CELL-20,68,ring.hp/ring.maxHp,'#8fd18a');
      ctx.fillStyle='#f3e6c4';ctx.font='700 11px Microsoft YaHei,sans-serif';
      ctx.textAlign='center';ctx.fillText(label+' '+Math.ceil(ring.hp)+'/'+ring.maxHp,sx*CELL,sy*CELL-26);
    }
  }
}
function drawCombatLayer(){
  // 死亡残影：倒地淡出，立即退出存活判定，不挡路、不吃伤害、不留永久尸体
  for(const c of game.corpses){
    const a=Math.max(0,1-c.t/c.max);
    ctx.save();
    ctx.globalAlpha=a*.72;
    ctx.translate(c.x*CELL,c.y*CELL);
    ctx.rotate((c.face<0?-1:1)*Math.min(1,c.t/c.max)*1.05);
    ctx.scale((c.boss?1.65:1)*CELL/60,(c.boss?1.65:1)*CELL/60);
    oval(0,8,13,5,'#111e1b88');
    path([[-11,7],[-9,-8],[8,-10],[12,7]],c.boss?'#8f5457':'#7c6658','#3f3330',2);
    ctx.restore();
  }
  // 弹体：高弧抛物线可越低矮障碍，抵达前不伤害
  for(const p of game.projectiles){
    const u=Math.min(1,p.t/p.duration),back=Math.max(0,u-.09);
    const arc=(p.arc?18:6)*CELL/60;
    const x=p.x*CELL,y=p.y*CELL-Math.sin(u*Math.PI)*arc;
    const px=(p.sx+(p.tx-p.sx)*back)*CELL;
    const py=(p.sy+(p.ty-p.sy)*back)*CELL-Math.sin(back*Math.PI)*arc;
    line(px,py,x,y,p.kind==='bolt'?'#dbe9c8':'#ffdc96',2);
    oval(x,y,2.8,2.8,'#fff0c0');
  }
  for(const e of game.effects){
    const fade=Math.max(0,e.time/e.max);
    if(e.type==='particle')oval(e.x*CELL,e.y*CELL,(2+3*fade)*CELL/60,(2+3*fade)*CELL/60,e.color);
    else oval(e.x*CELL,e.y*CELL,11*fade*CELL/60,11*fade*CELL/60,e.color);
  }
  for(const f of game.floats){
    const u=f.time/f.max;
    ctx.save();ctx.globalAlpha=Math.min(1,u*2);
    label(f.text,f.x*CELL,(f.y-.35-(1-u)*.55)*CELL,13*CELL/46,f.color);
    ctx.restore();
  }
  // 受击建筑短闪
  for(const [k,time] of Object.entries(game.buildingFlash)){
    const t=game.tiles[Number(k)];
    if(!t)continue;
    ctx.save();ctx.globalAlpha=Math.min(.5,time*3);
    inCell(t.x*CELL,t.y*CELL,()=>rect(0,0,60,60,'#ffe7bd'));
    ctx.restore();
  }
  // 城堡低耐久预警与夜间灯火
  if(game.castle){
    const c=game.castle;
    if(game.castleHp<game.castleMax*.35){
      ctx.save();ctx.strokeStyle='#ef8c74';ctx.lineWidth=3;
      ctx.globalAlpha=.5+.35*Math.sin(performance.now()/240);
      ctx.strokeRect(c.x*CELL+2,c.y*CELL+2,CELL-4,CELL-4);ctx.restore();
    }
    ctx.save();ctx.globalAlpha=.5+.22*Math.sin(performance.now()/500);
    oval((c.x+.28)*CELL,(c.y+.38)*CELL,3,3,'#ffd98a');
    oval((c.x+.72)*CELL,(c.y+.38)*CELL,3,3,'#ffd98a');
    ctx.restore();
  }
  // 营地受损 / 失守在地图上直接给提示，不只写进战报
  for(const c of game.camps)if(c.damaged||c.lost){
    const t=campTile(c);
    inCell(t.x*CELL,t.y*CELL,()=>{oval(46,14,9,9,'#8d4b3c');label('!',46,14,12,'#ffe2ad');});
  }
  // 近战是 1.35 格内最多两个目标的全向攻击：只画一套范围环，并标出每个真实目标
  const sw=game.hero.swing;
  if(sw&&game.hero.hp>0){
    const h=game.hero,u=Math.min(1,sw.t/.48);
    const a=Math.max(0,1-Math.abs(u-.34)/.34);
    if(a>0){
      ctx.save();ctx.globalAlpha=a*.9;
      ctx.strokeStyle='#ffe6ae';ctx.lineWidth=3*CELL/60;
      ctx.beginPath();ctx.arc(h.x*CELL,h.y*CELL,1.35*CELL,0,Math.PI*2);ctx.stroke();
      for(const tgt of sw.targets||[]){
        ctx.beginPath();ctx.arc(tgt.x*CELL,tgt.y*CELL,11*CELL/60,0,Math.PI*2);ctx.stroke();
      }
      ctx.restore();
    }
  }
}
function draw(){
  if(!game)return;
  /* v0.24 震屏只作用于 Canvas 绘制内容：不动 mapWorld 相机 transform，
     不改命中坐标，不影响固定 HUD 位置。 */
  ctx.save();
  const sh=game.shake&&game.shake.t>0?game.shake:null;
  if(sh){
    const k=sh.t/.22,now=performance.now();
    ctx.translate(Math.sin(now*.09)*sh.mag*k,Math.cos(now*.11)*sh.mag*k);
  }
  ctx.clearRect(-14,-14,canvas.width+28,canvas.height+28);
  const isNight=game.phase==='night';
  for(const t of game.tiles){
    const x=t.x*CELL,y=t.y*CELL;
    terrain(t);
    rect(x,y,CELL,1,'#1b322824');rect(x,y,1,CELL,'#1b322824');
    if(!t.visible){
      inCell(x,y,()=>{
        rect(0,0,60,60,'#283b34a6');
        line(9,51,52,9,'#7984771f');
      });
    }
  }
  const shade=ctx.createLinearGradient(0,0,canvas.width,canvas.height);
  shade.addColorStop(0,isNight?'#141e3d59':'#efd99414');
  shade.addColorStop(1,isNight?'#1323346b':'#203a2f26');
  rect(0,0,canvas.width,canvas.height,shade);
  boundaries(!game.castle);
  if(!game.castle){
    game.sites.forEach((s,i)=>{
      inCell(s.x*CELL,s.y*CELL,()=>{
        const known=tileAt(s.x,s.y)?.visible;
        oval(30,30,23,23,'#2b3526');
        oval(30,30,19,19,known?'#ecc37d':'#697761');
        label(i?'B':'A',30,31,23,known?'#28251d':'#f0ead4');
        if(known)label(SITE_NAMES[i],30,68,17,'#fff0c6');
      });
    });
  }
  if(['day','night'].includes(game.phase)){
    const gates=game.phase==='night'?game.fronts.flatMap(front=>front.gates):entrances(game.day);
    for(const t of gates){
      inCell(t.x*CELL,t.y*CELL,()=>{
        oval(30,31,15,15,'#582e2d');path([[23,24],[37,31],[23,38]],'#ef9e81');
      });
    }
  }
  if(game.phase==='night'&&game.rallyCharges>0&&game.hero.hp>0){
    ctx.save();ctx.strokeStyle='#f3d39255';ctx.lineWidth=2;ctx.setLineDash([7,7]);
    ctx.beginPath();ctx.arc(game.hero.x*CELL,game.hero.y*CELL,DEMO.rallyRange*CELL,0,Math.PI*2);
    ctx.stroke();ctx.setLineDash([]);ctx.restore();
  }
  if(game.phase==='night')for(const f of game.fronts){
    if(!f.staging||game.clock>=f.firstWaveAt)continue;
    inCell(f.staging.x*CELL,f.staging.y*CELL,()=>{
      ctx.save();ctx.globalAlpha=.55+.3*Math.sin(performance.now()/180);
      oval(30,30,20,20,'#7a3a2f');ctx.restore();
      label('进军',30,30,15,'#ffe0a8');
    });
  }
  const sel=game.tiles[game.selected];
  if(sel&&game.panel){
    ctx.strokeStyle='#ffe1a0';ctx.lineWidth=3;ctx.strokeRect(sel.x*CELL+2*CELL/60,sel.y*CELL+2*CELL/60,(60-4)*CELL/60,(60-4)*CELL/60);
    if(sel.building?.type==='tower'){
      ctx.beginPath();ctx.arc((sel.x+.5)*CELL,(sel.y+.5)*CELL,towerRange(sel.building)*CELL,0,Math.PI*2);
      ctx.fillStyle='#edd39415';ctx.fill();ctx.strokeStyle='#ffe1a093';ctx.setLineDash([6,6]);ctx.stroke();ctx.setLineDash([]);
    }
  }
  const route=game.hero.goal;
  if(route?.length&&game.hero.hp>0&&['day','night'].includes(game.phase)){
    const last=route[route.length-1];
    ctx.save();ctx.strokeStyle='#ffe1a099';ctx.lineWidth=Math.max(2,CELL*.05);ctx.setLineDash([CELL*.16,CELL*.14]);
    ctx.beginPath();ctx.moveTo(game.hero.x*CELL,game.hero.y*CELL);
    for(const p of route)ctx.lineTo(p.x*CELL,p.y*CELL);
    ctx.stroke();ctx.setLineDash([]);
    ctx.beginPath();ctx.arc(last.x*CELL,last.y*CELL,CELL*.24,0,Math.PI*2);ctx.stroke();
    ctx.beginPath();ctx.arc(last.x*CELL,last.y*CELL,CELL*.07,0,Math.PI*2);ctx.fillStyle='#ffe1a0';ctx.fill();
    ctx.restore();
  }
  /* v0.22 遮挡：建筑、树石、营地、居民、领主、敌军统一按脚底 Y 排序。
     树冠遮住领主时局部半透明；只在 Canvas 绘制层处理，不动相机与 HUD。 */
  const sprites=[];
  for(const t of game.tiles){
    // 已开发生产格不再叠画自然树石；cover/ground 已在 develop 中清理
    if(!t.node?.developed&&(t.ground==='trees'||t.ground==='rock')){
      const hiddenBehind=game.hero.hp>0&&Math.abs(game.hero.x-(t.x+.5))<.9&&
        game.hero.y<t.y+1&&game.hero.y>t.y-1.1;
      sprites.push({y:t.y+1,fn:()=>{
        if(hiddenBehind){ctx.save();ctx.globalAlpha=.78;drawFoliage(t);ctx.restore();}
        else drawFoliage(t);
      }});
    }
    if(t.visible&&t.node&&!t.node.developed)sprites.push({y:t.y+1,fn:()=>nodeArt(t)});
    if(t.building)sprites.push({y:t.y+1,fn:()=>structure(t)});
  }
  for(const c of game.camps)sprites.push({y:campTile(c).y+1,fn:()=>drawCamp(c)});
  for(const r of game.residents)if(r.state!=='dead'){
    // 作业中的工人按所属建筑入口层绘制，避免被屋顶/工棚盖住
    let y=r.y;
    if(r.work?.state==='working'&&r.work.dockTileId!=null){
      const dock=game.tiles[r.work.dockTileId];
      if(dock?.building)y=dock.y+1.2;
    }
    sprites.push({y,fn:()=>drawResident(r)});
  }
  if(game.militia)sprites.push({y:game.castle?game.castle.y+1.4:0,fn:drawMilitia});
  if(game.hero.hp>0&&['day','night'].includes(game.phase))sprites.push({y:game.hero.y,fn:()=>fighter(game.hero,true)});
  if(isNight)for(const e of game.enemies)sprites.push({y:e.y,fn:()=>fighter(e)});
  sprites.sort((a,b)=>a.y-b.y);
  for(const sp of sprites)sp.fn();
  if(isNight||game.presentation)drawCombatLayer();
  if(game.phase==='won')drawVictoryMarks();
  ctx.restore();
  followHero();
}

/* v0.20：地图相机只平移 #mapWorld。屏幕 UI 不参与 transform，边缘允许露出棋盘底色。 */
const MOBILE=()=>typeof window.matchMedia==='function'&&window.matchMedia('(any-pointer:coarse), (max-width:720px)').matches;
function syncSheet(){
  const mobile=MOBILE();
  document.body.classList.toggle('touch-ui',mobile);
  const view=game.phase==='won'?null:game.panel?'inspect':manualSheetOpen||null;
  document.body.classList.toggle('sheet-open',!!view);
  ensureRailDefaults();
  $('playSide').hidden=!view;
  $('inspectPanel').hidden=view!=='inspect';
  $('campaignPanel').hidden=view!=='campaign';
  $('reportPanel').hidden=view!=='report';
  $('sideTitle').textContent=view==='inspect'?'地点详情':view==='report'?'边境战报':game.phase==='lost'?'败局复盘':'战役简报';
  $('campaignBtn').setAttribute('aria-expanded',String(view==='campaign'));
  $('campaignBtn').setAttribute('aria-label',game.cardPending?'战役简报，有待选强化':view==='campaign'?'关闭战役简报':'战役简报');
  $('reportBtn').setAttribute('aria-expanded',String(view==='report'));
  const field=document.querySelector('.field');
  const prevBottom=field?.style.getPropertyValue('--hud-bottom')||'';
  layoutHudChrome();
  const nextBottom=field?.style.getPropertyValue('--hud-bottom')||'';
  if(camera.seenMobile!==mobile||camera.sideView!==view||prevBottom!==nextBottom){
    camera.seenMobile=mobile;
    camera.sideView=view;
    resizeCamera();
  }
  markSideOverflow();
}
function hudPanelVisible(el){
  if(!el||el.hidden)return false;
  const style=getComputedStyle(el);
  if(style.display==='none'||style.visibility==='hidden'||Number(style.opacity)===0)return false;
  const r=el.getBoundingClientRect();
  return r.width>=1&&r.height>=1;
}
function ensureRailDefaults(){
  const list=$('legendList');

  if(!camera.railCollapsedInit){
    if(list)list.hidden=true;

}
function syncRailToggleLabels(){

}
function layoutHudChrome(){
  const field=document.querySelector('.field');
  const deck=$('commandDeck');
  if(!deck)return;
  const compact=!!(game&&game.phase==='day'&&!game.castle);
  deck.classList.toggle('deck-compact',compact);
  syncCommandNavVisibility();
  if(!field||!field.style||typeof field.style.setProperty!=='function')return;
  let clearance=compact?72:100;
  const fr=field.getBoundingClientRect();
  if(hudPanelVisible(deck)){
    const dr=deck.getBoundingClientRect();
    clearance=Math.max(compact?64:72,Math.ceil(fr.bottom-dr.top+10));
  }
  field.style.setProperty('--hud-bottom',clearance+'px');
  // 仅窄屏底部 sheet 限额（max-width:600 才启用）；横屏右侧详情不受此影响
  let sheetMax=200;
  if(innerWidth<=600){
    const briefing=document.querySelector('.briefing');
    const topClear=hudPanelVisible(briefing)?Math.ceil(briefing.getBoundingClientRect().bottom-fr.top+8):72;
    const avail=Math.max(120,Math.floor(fr.height-clearance-topClear));
    sheetMax=Math.max(140,Math.min(200,Math.floor(avail*0.38)));
  }
  field.style.setProperty('--sheet-max',sheetMax+'px');
}
function syncCommandNavVisibility(){
  const nav=document.querySelector('#commandDeck .command-nav');
  if(!nav)return;
  const tabs=$('mobileGroups');
  const show=!!((tabs&&tabs.children.length)||!$('toolState').hidden||!$('cancelTool').hidden||!$('duskBtn').hidden);
  nav.hidden=!show;
}
function sizeMapToCover(){
  const board=$('board');
  if(!board||!canvas)return;
  const bw=board.clientWidth,bh=board.clientHeight;
  if(bw<1||bh<1)return;
  // 盖住视口并适度放大，主城与生产建筑更易辨认
  const scale=Math.max(bw/canvas.width,bh/canvas.height)*1.12;
  canvas.style.width=(canvas.width*scale)+'px';
  canvas.style.height=(canvas.height*scale)+'px';
}
function measureCameraViewport(){
  sizeMapToCover();
  const rect=$('board').getBoundingClientRect();
  const style=getComputedStyle($('board'));
  camera.vx=rect.left+(parseFloat(style.borderLeftWidth)||0);
  camera.vy=rect.top+(parseFloat(style.borderTopWidth)||0);
  const left=Math.max(camera.vx,0), top=Math.max(camera.vy,0);
  const right=Math.min(rect.right-(parseFloat(style.borderRightWidth)||0),innerWidth);
  const bottom=Math.min(rect.bottom-(parseFloat(style.borderBottomWidth)||0),innerHeight);
  camera.vw=Math.max(0,right-left);
  camera.vh=Math.max(0,bottom-top);
  // 安全中心避开顶栏 briefing、底栏、左右可见面板
  let insetL=0,insetR=0,insetT=8,insetB=8;
  const briefing=document.querySelector('.briefing');
  if(hudPanelVisible(briefing)){
    insetT=Math.max(insetT,briefing.getBoundingClientRect().bottom-top+6);
  }
  const deck=$('commandDeck');
  if(hudPanelVisible(deck)){
    insetB=Math.max(insetB,bottom-deck.getBoundingClientRect().top+6);
  }
  const rail=$('leftRail');
  if(rail&&getComputedStyle(rail).display!=='none'&&!rail.hidden){
    for(const sel of ['.legend-panel','.minimap-panel']){
      const panel=rail.querySelector(sel);
      if(!hudPanelVisible(panel))continue;
      const rr=panel.getBoundingClientRect();
      insetL=Math.max(insetL,Math.min(camera.vw*.38,rr.right-left+8));
    }
  }
  const side=$('playSide');
  let sideDock=null;
  if(hudPanelVisible(side)){
    const sr=side.getBoundingClientRect();
    // 按实际矩形判断：宽铺底部为 sheet，否则按右侧面板；不按触屏/MOBILE()
    const spansBottom=sr.width>=camera.vw*0.65&&sr.left<=left+camera.vw*0.22;
    sideDock=spansBottom?'bottom':'right';
    if(sideDock==='bottom'){
      insetB=Math.max(insetB,bottom-sr.top+6);
    }else{
      insetR=Math.max(insetR,Math.min(camera.vw*.45,right-sr.left+8));
    }
  }
  const safeW=Math.max(48,camera.vw-insetL-insetR);
  const safeH=Math.max(48,camera.vh-insetT-insetB);
  camera.safeX=insetL+safeW/2;
  camera.safeY=insetT+safeH/2;
  camera.insets={l:insetL,r:insetR,t:insetT,b:insetB,sideDock};
  const display=canvas.getBoundingClientRect();
  camera.sx=display.width/canvas.width;
  camera.sy=display.height/canvas.height;
  return camera;
}
function clampCamera(){
  if(!camera.sx||!camera.sy)return;
  const worldW=canvas.width*camera.sx;
  const worldH=canvas.height*camera.sy;
  const viewW=camera.vw,viewH=camera.vh;
  if(worldW>=viewW-0.5)camera.tx=Math.min(0,Math.max(viewW-worldW,camera.tx));
  else camera.tx=(viewW-worldW)/2;
  if(worldH>=viewH-0.5)camera.ty=Math.min(0,Math.max(viewH-worldH,camera.ty));
  else camera.ty=(viewH-worldH)/2;
}
function applyCamera(){
  const board=$('board'),world=$('mapWorld');
  if(board){board.scrollLeft=0;board.scrollTop=0;}
  clampCamera();
  if(world)world.style.transform='translate3d('+camera.tx+'px,'+camera.ty+'px,0)';
}
function setCameraMode(mode){
  camera.mode=mode==='manual'?'manual':'follow';
  camera.generation=(camera.generation||0)+1;
  
}
function panCameraBy(dx,dy){
  camera.tx+=dx;camera.ty+=dy;applyCamera();
}
function worldToScreen(worldX,worldY){
  if(!camera.sx)measureCameraViewport();
  return {x:camera.vx+camera.tx+worldX*camera.sx,y:camera.vy+camera.ty+worldY*camera.sy};
}
function screenToWorld(clientX,clientY){
  if(!camera.sx||!camera.sy)measureCameraViewport();
  if(!camera.sx||!camera.sy)return {x:NaN,y:NaN};
  return {x:(clientX-camera.vx-camera.tx)/camera.sx,y:(clientY-camera.vy-camera.ty)/camera.sy};
}
function screenToGrid(clientX,clientY){
  const w=screenToWorld(clientX,clientY);
  if(!Number.isFinite(w.x)||!Number.isFinite(w.y))return null;
  if(!(w.x>=0&&w.y>=0&&w.x<canvas.width&&w.y<canvas.height))return null;
  const gx=Math.floor(w.x/CELL),gy=Math.floor(w.y/CELL);
  if(gx<0||gy<0||gx>=WIDTH||gy>=HEIGHT)return null;
  return tileAt(gx,gy);
}
function snapCameraToPoint(wx,wy){
  if(!camera.sx||!camera.sy)measureCameraViewport();
  if(!camera.sx||!camera.sy)return;
  camera.tx=camera.safeX-wx*CELL*camera.sx;
  camera.ty=camera.safeY-wy*CELL*camera.sy;
  applyCamera();
}
function snapCameraToHero(){
  if(!game?.hero||!camera.sx||!camera.sy)return;
  snapCameraToPoint(game.hero.x,game.hero.y);
}
function centerOnHero(){
  if(game&&(game.phase==='won'||game.phase==='lost'))return;
  camera.hold=false;setCameraMode('follow');measureCameraViewport();snapCameraToHero();
}
function updateCamera(){
  if(!game||camera.hold||playClockFrozen())return;
  if(game.phase==='won'||game.phase==='lost'||camera.mode!=='follow')return;
  if(!camera.sx)measureCameraViewport();
  snapCameraToHero();
}
function followHero(){updateCamera();}
let cameraResizing=false;
function resizeCamera(){
  if(cameraResizing)return;
  cameraResizing=true;
  try{resizeCameraNow();}finally{cameraResizing=false;}
}
function resizeCameraNow(){
  layoutHudChrome();
  const sx=camera.sx||1,sy=camera.sy||1;
  const worldX=(camera.safeX-camera.tx)/sx,worldY=(camera.safeY-camera.ty)/sy;
  measureCameraViewport();
  const follow=camera.mode==='follow'&&!camera.hold&&game&&!['won','lost'].includes(game.phase)&&!paused&&!$('dialog').open;
  if(follow)snapCameraToHero();
  else if(camera.sx&&camera.sy){
    camera.tx=camera.safeX-worldX*camera.sx;camera.ty=camera.safeY-worldY*camera.sy;applyCamera();
  }
}
function bindCameraObservers(){
  layoutHudChrome();
  measureCameraViewport();
  if(typeof ResizeObserver==='function'){
    const ro=new ResizeObserver(resizeCamera);
    ro.observe($('board'));
    const deck=$('commandDeck'); if(deck)ro.observe(deck);
    const side=$('playSide'); if(side)ro.observe(side);
    const rail=$('leftRail'); if(rail)ro.observe(rail);
  }
}
function showSide(view){
  const next=manualSheetOpen===view&&!game.panel?null:view;
  game.panel=false;
  game.focusResident=null;
  manualSheetOpen=next;
  if(next==='report')$('reportBtn').classList.remove('has-news');

}
function closeTouchSheet(){

}
function canUsePlayMap(){
  return game.started&&['day','night'].includes(game.phase)&&!game.presentation&&!playClockFrozen();
}
let mapGesture=null, touchClickUntil=0, touchBlocked=false;
const touchPointers=new Set();
function releaseCameraHold(g){
  camera.hold=false;
  if(g&&!g.dragged&&g.generation===camera.generation)setCameraMode(g.modeBefore);
}
function cancelMapGesture(){
  const g=mapGesture;
  if(g)clearTimeout(g.timer);
  releaseCameraHold(g);
  mapGesture=null;touchPointers.clear();touchBlocked=false;
}
function bindMapGestures(){
  const board=$('board');
  const point=e=>{
    const w=screenToWorld(e.clientX,e.clientY);
    return {x:w.x/CELL,y:w.y/CELL};
  };
  const canBrowse=()=>!paused&&!$('dialog').open&&!document.hidden&&game.phase==='lost';
  board.addEventListener('pointerdown',e=>{
    if(e.button!==0||(!canUsePlayMap()&&!canBrowse())||touchBlocked)return;
    const mouse=e.pointerType==='mouse';
    const g={id:e.pointerId,x:e.clientX,y:e.clientY,sx:camera.tx,sy:camera.ty,
      modeBefore:camera.mode,generation:camera.generation||0,tile:tileFromPointer(e),
      point:point(e),phase:game.phase,mode:game.mode,dragged:false,long:false,mouse};
    mapGesture=g;camera.hold=true;
    if(!mouse&&canUsePlayMap()&&g.tile)g.timer=setTimeout(()=>{
      if(mapGesture!==g||g.dragged||touchBlocked||!canUsePlayMap()||game.phase!==g.phase||game.mode!==g.mode)return;
      g.long=true;
      if(!g.tile.visible){toast('先靠近探明这块地。');return;}
      inspectMapTile(g.tile,g.point);
    },350);
    if(e.isTrusted)try{(e.target===canvas?canvas:board).setPointerCapture(e.pointerId);}catch{}
    if(!mouse)e.preventDefault();
  });
  board.addEventListener('pointermove',e=>{
    const g=mapGesture;
    if(!g||g.id!==e.pointerId||touchBlocked||g.long)return;
    const dx=e.clientX-g.x,dy=e.clientY-g.y;
    if(!g.dragged&&Math.hypot(dx,dy)>(g.mouse?6:10)){
      g.dragged=true;clearTimeout(g.timer);setCameraMode('manual');
    }
    if(g.dragged){panCameraBy(g.sx+dx-camera.tx,g.sy+dy-camera.ty);e.preventDefault();}
  });
  window.addEventListener('pointerup',e=>{
    if(e.pointerType!=='mouse'){
      if(!touchPointers.delete(e.pointerId))return;
      touchClickUntil=performance.now()+900;
      if(touchBlocked){if(!touchPointers.size)touchBlocked=false;return;}
    }
    const g=mapGesture;
    if(!g||g.id!==e.pointerId)return;
    clearTimeout(g.timer);mapGesture=null;releaseCameraHold(g);
    if(g.dragged||g.long||!g.tile||game.phase!==g.phase||game.mode!==g.mode||!canUsePlayMap())return;
    mapClick(g.tile,g.point,!g.mouse);
  });
  window.addEventListener('pointerdown',e=>{
    if(e.pointerType==='mouse'||(!canUsePlayMap()&&!canBrowse()))return;
    const onMap=!!e.target?.closest?.('#board');
    if(!mapGesture&&!touchPointers.size&&!onMap)return;
    touchPointers.add(e.pointerId);
    touchClickUntil=performance.now()+900;
    if(touchPointers.size>1){
      if(mapGesture)clearTimeout(mapGesture.timer);
      releaseCameraHold(mapGesture);mapGesture=null;touchBlocked=true;
    }
  },true);
  window.addEventListener('pointercancel',()=>{cancelMapGesture();touchClickUntil=performance.now()+900;});
  window.addEventListener('blur',cancelMapGesture);
}

function inspectCamp(c,heading,info,actions,parent){

    ' · 运行 '+staff.filter(r=>r.state==='posted').length+' 人 · 待缴 '+staff.filter(r=>r.state==='waiting').length+' 人';
  if(c.controlled)info.textContent+=' · 基础防御 '+campDefenseCount(c)+'/'+DEMO.campDefenses;

  addInfo('每人维护 '+costText(maintenanceFor(1))+'；本周期尚需 '+costText(budget.due)+'（同人同营不重扣）。待缴人员不提供生产加成。');

  if(!c.lost){

          const status=workers.length?workers.map(r=>{

    }));
    return;
  }
  const b=t.building;
  heading.textContent=b?(b.type==='wall'?'城墙':b.level===2?'重型塔':b.level===1?'强化箭塔':'箭塔'):'地块';
  info.textContent=b?BUILDS[b.type].info:'点空地可移动。';
  if(day&&b){

    if(canPlaceCamp(t))actions.append(button('建立营地',()=>createCamp(t),{detail:costDetail(DEMO.campCost),disabled:disabled||!canPay(DEMO.campCost)}));
  }

function rectOverlap(a,b){
  const w=Math.max(0,Math.min(a.x+a.w,b.x+b.w)-Math.max(a.x,b.x));
  const h=Math.max(0,Math.min(a.y+a.h,b.y+b.h)-Math.max(a.y,b.y));
  return w*h;
}
function pickLeastOverlap(candidates,blocks){
  let best=0,bestScore=Infinity;
  candidates.forEach((rect,index)=>{
    const score=blocks.reduce((sum,block)=>sum+rectOverlap(rect,block),0)+index*0.001;
    if(score<bestScore){bestScore=score;best=index;}
  });
  return best;
}
function screenRectOfTile(t){
  const p=worldToScreen(t.x*CELL,t.y*CELL);
  return {x:p.x,y:p.y,w:CELL*camera.sx,h:CELL*camera.sy};
}
function victoryBlocks(){
  const blocks=[];
  if(game.castle)blocks.push(screenRectOfTile(game.castle));
  for(const c of game.camps){
    const t=campTile(c);
    if(t)blocks.push(screenRectOfTile(t));
  }
  const book=game.ledger&&game.ledger[game.day];
  for(const gate of book?.gates||[]){
    const t=tileAt(gate.x,gate.y);
    if(t)blocks.push(screenRectOfTile(t));
  }
  return blocks;
}
function clampVictoryCard(){
  if(victoryCardDrag)return;
  const card=$('victoryCard');
  if(!card||$('victoryHud').hidden)return;
  const w=card.offsetWidth,h=card.offsetHeight;
  if(!w||!h)return;
  const minY=$('board').getBoundingClientRect().top+8;
  const maxX=Math.max(8,innerWidth-w-8), maxY=Math.max(minY,innerHeight-h-8);
  const rect=card.getBoundingClientRect();
  card.style.left=Math.min(maxX,Math.max(8,rect.left))+'px';
  card.style.top=Math.min(maxY,Math.max(minY,rect.top))+'px';
}
function placeVictoryCard(){
  const ui=game?.victoryUi, card=$('victoryCard');
  if(!ui||!card||$('victoryHud').hidden)return;
  if(ui.userMoved||ui.placed){clampVictoryCard();return;}
  const w=card.offsetWidth,h=card.offsetHeight;
  if(w<40||h<40||canvas.getBoundingClientRect().width<40){
    if((ui.placeTries||0)<8){ui.placeTries=(ui.placeTries||0)+1;requestAnimationFrame(placeVictoryCard);}
    return;
  }
  const margin=10, topInset=$('board').getBoundingClientRect().top+margin;
  const candidates=[
    {x:margin,y:topInset,w,h},
    {x:Math.max(margin,innerWidth-w-margin),y:topInset,w,h},
    {x:margin,y:Math.max(topInset,innerHeight-h-margin),w,h},
    {x:Math.max(margin,innerWidth-w-margin),y:Math.max(topInset,innerHeight-h-margin),w,h}
  ];
  const spot=candidates[pickLeastOverlap(candidates,victoryBlocks())];
  card.style.left=spot.x+'px';
  card.style.top=spot.y+'px';
  ui.placed=true;
  clampVictoryCard();
}

function plainBag(bag){
  const parts=['gold','material','food','rare'].filter(key=>bag?.[key]).map(key=>RESOURCE_LABELS[key]+bag[key]);
  return parts.length?parts.join('｜'):'无';
}
function signedBag(bag){
  const parts=['gold','material','food','rare'].filter(key=>bag?.[key]).map(key=>(bag[key]>0?'+':'')+bag[key]+RESOURCE_LABELS[key]);
  return parts.length?parts.join('｜'):'无变化';
}
function mainStock(bag){
  return '金币'+(bag.gold||0)+'｜材料'+(bag.material||0)+'｜粮食'+(bag.food||0);
}
function netBag(book){
  return {
    gold:book.income.gold-book.expense.gold, material:book.income.material-book.expense.material,
    food:book.income.food-book.expense.food, rare:book.income.rare-book.expense.rare
  };
}
function endDelta(book){
  return {
    gold:book.end.gold-book.start.gold, material:book.end.material-book.start.material,
    food:book.end.food-book.start.food, rare:book.end.rare-book.start.rare
  };
}
function sumKind(book,side,kind){
  const total=copyBag({});
  for(const flow of book.flows)if(flow.side===side&&flow.kind===kind){
    for(const key of Object.keys(flow.amounts))total[key]+=flow.amounts[key];
  }
  return total;
}

  addVictoryLine(panel,'居民受伤 '+book.hurt+'，阵亡 '+book.dead+'。');

function renderVictory(){
  const on=!!(game&&game.phase==='won');
  document.body.classList.toggle('victory',on);
  const hud=$('victoryHud');
  if(!on){
    if(hud)hud.hidden=true;
    $('victoryMenu').hidden=true;
    $('victoryLegend').hidden=true;
    $('victoryInspect').hidden=true;
    $('victoryTip').hidden=true;
    $('victoryGear').setAttribute('aria-expanded','false');
    $('victoryLegendBtn').setAttribute('aria-expanded','false');
    $('victoryCard').classList.remove('enter');
    $('victoryCard').style.left='';
    $('victoryCard').style.top='';
    return;
  }
  hud.hidden=false;
  $('victoryTitle').textContent='你守住了边境';
  const reportHost=$('reports');reportHost.replaceChildren();
  for(const text of ['首领已被击败，边境守卫战胜利。','本局第 '+game.day+' 夜结束，共击退 '+game.kills+' 名敌军。','战役结束，库存停在战斗结束时，不再结算普通产出。']){
    const li=document.createElement('li');li.textContent=text;reportHost.append(li);
  }

  $('toast').hidden=true;

  if(!ui.seen){$('victoryCard').classList.add('enter');ui.seen=true;}
  renderVictoryCore();

  const book=game.ledger[ui.night];
  if(book)renderNightLine(book);
  else $('victoryNightLine').textContent='';

function visiblePlaceName(t){
  if(!t?.visible)return '';
  if(t.building?.type==='castle')return '城堡';
  if(t.node&&NODE_NAMES[t.node.kind])return NODE_NAMES[t.node.kind];
  const camp=campCore(t)||campAt(t);
  if(camp)return campName(camp);
  if(t.building?.type==='wall')return '城墙';
  if(t.building?.type==='tower')return '箭塔';
  return '';
}

function drawVictoryMarks(){
  if(!game.castle)return;
  const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const cx=(game.castle.x+.5)*CELL, cy=(game.castle.y+.5)*CELL;
  ctx.save();
  ctx.globalAlpha=reduce?.45:.26+.1*Math.sin(performance.now()/700);
  ctx.fillStyle='#e8b76c';
  ctx.beginPath();ctx.arc(cx,cy,CELL*1.15,0,Math.PI*2);ctx.fill();
  ctx.restore();
  const gate=game.ledger?.[game.day]?.bossGate;
  if(!gate)return;
  inCell(gate.x*CELL,gate.y*CELL,()=>{
    oval(30,30,16,16,'#3d2c24');
    label('败',30,31,18,'#f0c27a');
  });
}

    const card=$('victoryCard');
    const origin={id:event.pointerId,x:event.clientX,y:event.clientY,left:card.getBoundingClientRect().left,top:card.getBoundingClientRect().top};
    victoryCardDrag=true;
    function move(ev){
      if(ev.pointerId!==origin.id)return;
      card.style.left=(origin.left+ev.clientX-origin.x)+'px';
      card.style.top=(origin.top+ev.clientY-origin.y)+'px';
      const ui=ensureVictoryUi();
      ui.userMoved=true;ui.placed=true;
    }
    function up(ev){
      if(ev.pointerId!==origin.id)return;
      window.removeEventListener('pointermove',move);
      window.removeEventListener('pointerup',up);
      victoryCardDrag=false;
      clampVictoryCard();
    }
    window.addEventListener('pointermove',move);
    window.addEventListener('pointerup',up);
  });
  $('board').addEventListener('pointerdown',event=>{
    if(game.phase!=='won'||event.button>0)return;
    touchClickUntil=0;
    victorySuppressClick=false;
    victoryPointer={id:event.pointerId,x:event.clientX,y:event.clientY,sx:camera.tx,sy:camera.ty,moved:false};
  });
  window.addEventListener('pointermove',event=>{
    const tip=$('victoryTip');
    if(victoryPointer&&event.pointerId===victoryPointer.id){
      const dx=event.clientX-victoryPointer.x, dy=event.clientY-victoryPointer.y;
      if(Math.hypot(dx,dy)>8)victoryPointer.moved=true;
      if(victoryPointer.moved){
        setCameraMode('manual');
        panCameraBy(victoryPointer.sx+dx-camera.tx,victoryPointer.sy+dy-camera.ty);
        if(tip)tip.hidden=true;
      }
      return;
    }
    if(game.phase!=='won'||!tip)return;
    const name=visiblePlaceName(tileFromPointer(event));
    if(!name){tip.hidden=true;return;}
    tip.hidden=false;
    tip.textContent=name;
    tip.style.left=Math.min(innerWidth-8,event.clientX+14)+'px';
    tip.style.top=Math.min(innerHeight-8,event.clientY+16)+'px';
  });
  window.addEventListener('pointerup',event=>{
    if(!victoryPointer||event.pointerId!==victoryPointer.id)return;
    victorySuppressClick=victoryPointer.moved;
    victoryPointer=null;
  });
  canvas.addEventListener('pointerleave',()=>{if($('victoryTip'))$('victoryTip').hidden=true;});
}

function updateBattleHud(){
  updateStocks();
  const clock=$('clockReadout'), night=game.phase==='night', limit=phaseLimit();
  const nightLimit=nightStopAt(game.day,game.isBoss);
  const total=game.phase==='day'?limit:night?nightLimit:1;
  const early=game.phase==='day'&&game.earlyNightAt;
  const left=game.phase==='day'?(early?game.earlyNightAt-game.phaseElapsed:limit-game.phaseElapsed):
    night?(game.spawnStopped?0:nightLimit-game.clock):0;
  clock.textContent=game.phase==='day'?(early?'提前入夜 ':'距入夜 ')+timeLabel(left):
    night?(game.spawnStopped?'清场 · 残敌 '+game.enemies.length:'距停刷 '+timeLabel(left)):'';
  const action=$('duskBtn');
  if(early)action.textContent='取消入夜 '+Math.ceil(left)+'秒';
  const fill=$('timeFill');
  if(fill){
    fill.style.width=Math.max(0,Math.min(100,left/total*100))+'%';
    fill.style.background=game.phase==='day'?'#e8b76c':game.spawnStopped?'#a1bd77':'#ed9a7c';
  }
  refreshCastleWallVitals();
  if(!night)return;
  updateSupportButtons();
  const count=game.fronts.map(f=>(f.camp?campName(f.camp):game.castle?'主城':'追击')+' '+
    (f.schedule.filter(s=>!s.dispatched).length+game.enemies.filter(e=>e.front===f).length)).join(' · ');
  const boss=game.enemies.find(e=>e.boss);
  const down=game.hero.hp<=0&&game.castle?
    (game.heroDown?.phase==='waiting'?' · 领主 '+Math.max(0,Math.ceil(DEMO.heroDownDelay-game.heroDown.elapsed))+' 秒后回场':' · 本夜回场已用尽'):'';
  const battle=$('battleText');
  const stats=[];
  if(game.castle){
    const ring=game.wallRings?.get?.('home');
    stats.push(['主城 '+Math.ceil(game.castleHp)+'/'+game.castleMax,game.castleHp<game.castleMax*.35]);
    if(ring)stats.push(['城墙 '+(ring.status==='broken'?'破':Math.ceil(ring.hp)+'/'+ring.maxHp),ring.hp<ring.maxHp*.35||ring.status==='broken']);
  }
  stats.push(['领主 '+Math.ceil(game.hero.hp)+'/'+game.hero.max+down,game.hero.hp<game.hero.max*.35]);
  if(boss)stats.push(['首领 '+Math.ceil(boss.hp)+'/'+boss.max,true]);
  stats.push(['剩余敌军 · '+count+(reserveCount()?' · 待援 '+reserveCount():''),false]);
  const label=stats.map(([text])=>text).join(' | ');
  if(battle.dataset.label!==label){
    battle.dataset.label=label;
    battle.replaceChildren(...stats.map(([text,critical])=>{
      const stat=document.createElement('span');
      stat.className='battle-stat'+(critical?' critical':'');stat.textContent=text;
      return stat;
    }));
  }
  refreshCastleWallVitals();
}

function residentAt(t){
  if(!t||!game?.residents)return null;
  const p=center(t);
  return game.residents.find(r=>r.state!=='dead'&&Math.hypot(r.x-p.x,r.y-p.y)<.42)||null;
}
function mapAttackIntent(t,point){
  if(game.phase!=='night'||game.mode||game.hero.hp<=0)return false;
  point=point||center(t);
  let hit=null, closest=.48;
  for(const enemy of game.enemies){
    const d=distance(enemy,point);
    if(enemy.hp>0&&d<=closest){hit=enemy;closest=d;}
  }
  if(!hit)return false;
  if(distance(game.hero,hit)>=1.35){
    toast('先靠近敌军，再发动攻击。');
    return false;
  }
  if(!meleeClear(game.hero,hit)){toast('有障碍挡住攻击，绕过去再出手。');return 'blocked';}
  if(game.hero.cooldown>0){toast('攻击冷却中。');return 'blocked';}
  return 'attack';
}

      toast('请选择与领地相邻、已探明的未占领陆地。');
    }else claim(t);
  }else if(game.mode==='camp')createCamp(t);
  else if(String(game.mode).startsWith('develop-')){
    const kind=String(game.mode).slice(8);
    const want=kind==='lumber'?'wood':kind==='quarry'?'stone':kind==='mine'?'mine':kind==='farm'?'farm':kind;
    if(!t.node||t.node.kind!==want){
      toast('请点对应类型的未开发资源点（不会凭空产资源）。');
    }else if(t.node.developed||t.building){
      toast('这里已有生产建筑。');
    }else if(!canDevelop(t)){
      toast('还不能开发这里：先确认领地或营地控制。');
    }else develop(t);
  }else build(t,game.mode);
  return true;
}
function moveFromMap(t){
  game.focusResident=null;
  game.residentCommand=null;
  game.panel=false;manualSheetOpen=null;
  setDestination(t);

function residentNear(point){
  if(!point||!game?.residents)return null;
  let best=null, closest=.45;
  for(const r of game.residents){
    if(r.state==='dead')continue;
    const d=Math.hypot(r.x-point.x,r.y-point.y);
    if(d<=closest){best=r;closest=d;}
  }
  return best;
}
function inspectMapTile(t,point){
  const resident=residentNear(point||center(t))||residentAt(t);
  openInspector(resident?tileOf(resident)||t:t,resident?.id);
  sync();
}
function mapClick(t,point,touch=false){
  if(game.phase==='won'){if(!$('dialog').open)showVictoryPlace(t);return;}
  if(!['day','night'].includes(game.phase))return;
  const intent=mapAttackIntent(t,point);
  if(intent==='attack'){attack();return;}
  if(intent||applyMapTool(t))return;
  if(game.residentCommand?.type==='move'){
    const id=game.residentCommand.residentId;
    const got=orderResidentMove(id,t);
    game.residentCommand=null;
    if(!got.ok)toast(got.reason==='blocked'?'那里无法站立。':got.reason==='unreachable'?'居民到不了那里。':'无法移动居民。');
    else{
      openInspector(tileOf(game.residents.find(r=>r.id===id))||t,id);
      announce('居民 '+id+' 正在移动。');
    }
    sync();
    return;
  }
  const near=residentNear(point||center(t));
  if(near){
    openInspector(tileOf(near)||t,near.id);
    sync();
    return;
  }
  // 点中实际墙边：打开所属圈详情，不给领主发移动令
  const wallHit=ringEdgeNearPoint(point||center(t),.45);
  if(wallHit&&!game.mode){
    game.selectedRingId=wallHit.ring.id;
    game.hero.goal=null;game.hero.moving=false;
    if(wallHit.ring.id==='home'&&game.castle)openInspector(game.castle);
    else{
      game.panel=true;manualSheetOpen=null;syncSheet();
    }
    sync();
    return;
  }
  if(touch){moveFromMap(t);return;}
  const inspectable=t.visible&&(t.node||t.building||campCore(t)||t.site!==undefined&&!game.castle||residentAt(t));
  if(inspectable){
    if(game.panel&&game.selected===at(t.x,t.y)&&!game.focusResident)closeInspector();
    else inspectMapTile(t,point);
  }else moveFromMap(t);
}

let lastHud=0, lastDraw=0, paused=false;
function frame(now){
  // 全局暂停：停时钟也停重绘；卡牌模态只停时钟，仍重绘底层地图
  if(paused&&!game?.cardModal){lastFrame=now;requestAnimationFrame(frame);return;}
  if(!lastFrame)lastFrame=now;
  let remaining=Math.min(.5,Math.max(0,(now-lastFrame)/1000));
  lastFrame=now;
  while(remaining>0){
    const step=Math.min(.045,remaining);
    if(!game?.cardModal)tickCampaign(step);
    remaining-=step;
  }
  draw();
  if(now-lastHud>150){updateBattleHud();lastHud=now;}
  requestAnimationFrame(frame);
}
function drawMinimap(){
  const mini=$('miniMap');
  if(!mini||!game)return;
  const mctx=mini.getContext('2d');
  if(!mctx||typeof mctx.fillRect!=='function')return;
  const mw=mini.width,mh=mini.height;
  mctx.fillStyle='#142019';mctx.fillRect(0,0,mw,mh);
  const sx=mw/WIDTH,sy=mh/HEIGHT;
  for(const t of game.tiles){
    if(!t.visible&&game.castle)continue;
    let color='#1d3328';
    if(t.ground==='water')color='#2d4f4c';
    else if(t.ground==='road')color='#7a6f52';
    else if(tileCover(t)==='forest')color='#34553c';
    else if(tileCover(t)==='mountain')color='#6a6e60';
    else if(t.owned)color='#4d6a45';
    mctx.fillStyle=color;
    mctx.fillRect(t.x*sx,t.y*sy,Math.ceil(sx),Math.ceil(sy));
  }
  if(game.castle){
    mctx.fillStyle='#efc47e';
    mctx.fillRect(game.castle.x*sx,game.castle.y*sy,Math.max(2,sx),Math.max(2,sy));
  }
  // 真实城墙圈 / 城门 / 破圈
  if(game.wallRings instanceof Map){
    for(const ring of game.wallRings.values()){
      if(!ring.edges)continue;
      mctx.strokeStyle=ring.status==='broken'||ring.hp<=0?'#6a3a34':'#cfc8b0';
      mctx.lineWidth=ring.status==='broken'?1:1.6;
      for(const edge of ring.edges.values()){
        const ends=edgeEndpoints(edge);
        if(!ends)continue;
        const [a,b]=ends;
        mctx.beginPath();
        mctx.moveTo(a.x*sx,a.y*sy);mctx.lineTo(b.x*sx,b.y*sy);
        mctx.stroke();
        if(isGateEdge(ring,edge.id)&&ring.status!=='broken'){
          mctx.fillStyle='#4a82a4';
          mctx.fillRect(((a.x+b.x)/2)*sx-1.5,((a.y+b.y)/2)*sy-1.5,3,3);
        }
      }
    }
  }
  // 来袭入口 / 战线（真实 fronts / entrances，非假预告）
  if(game.phase==='night'&&game.fronts){
    for(const front of game.fronts){
      for(const g of front.gates||[]){
        mctx.fillStyle='#ed9a7c';
        mctx.beginPath();mctx.arc((g.x+.5)*sx,(g.y+.5)*sy,2.4,0,Math.PI*2);mctx.fill();
      }
      if(front.staging){
        mctx.strokeStyle='#ed9a7c';mctx.lineWidth=1;
        mctx.strokeRect(front.staging.x*sx,front.staging.y*sy,sx,sy);
      }
    }
  }
  if(game.hero){
    mctx.fillStyle='#ffe9bd';
    mctx.beginPath();mctx.arc(game.hero.x*sx,game.hero.y*sy,2.2,0,Math.PI*2);mctx.fill();
  }
  // 视口框
  if(camera.sx&&camera.sy){
    const left=(-camera.tx/camera.sx)/CELL, top=(-camera.ty/camera.sy)/CELL;
    const vw=(camera.vw/camera.sx)/CELL, vh=(camera.vh/camera.sy)/CELL;
    mctx.strokeStyle='#efc47e';mctx.lineWidth=1;
    mctx.strokeRect(left*sx,top*sy,vw*sx,vh*sy);
  }
}
function bindMinimap(){
  const mini=$('miniMap');
  if(!mini)return;
  mini.addEventListener('click',e=>{
    if(!game?.castle&&!game?.hero)return;
    const r=mini.getBoundingClientRect();
    const x=Math.floor((e.clientX-r.left)/r.width*WIDTH);
    const y=Math.floor((e.clientY-r.top)/r.height*HEIGHT);
    if(!inside(x,y))return;
    setCameraMode('manual');
    measureCameraViewport();
    camera.tx=camera.safeX-(x+.5)*CELL*camera.sx;
    camera.ty=camera.safeY-(y+.5)*CELL*camera.sy;
    applyCamera();
  });
  const toggle=$('toggleLegend');
  if(toggle)toggle.addEventListener('click',()=>{
    const list=$('legendList');
    if(!list)return;
    list.hidden=!list.hidden;
    syncRailToggleLabels();
    layoutHudChrome();
    resizeCamera();
  });
  const miniToggle=$('toggleMinimap');
  if(miniToggle)miniToggle.addEventListener('click',()=>{
    const mini=$('miniMap');
    if(!mini)return;
    mini.hidden=!mini.hidden;
    syncRailToggleLabels();
    if(!mini.hidden)drawMinimap();
    layoutHudChrome();
    resizeCamera();
  });
  const skip=$('cardSkip');
  if(skip)skip.addEventListener('click',()=>pickGrowthCard(null,'跳过'));
}
