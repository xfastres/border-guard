name: Modular shell build

on:
  push:
    branches:
      - refactor/modular-v060-phase1
  pull_request:
    branches:
      - feat/v060-30wave
    paths:
      - "Border-Guard-v0.60.html"
      - "balance/**"
      - "tests/v060-*.test.cjs"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - "src/**"
      - "scripts/verify-single-file.mjs"
      - ".github/workflows/modular-shell-build.yml"

permissions:
  contents: read

jobs:
  baseline-regression:
    name: Test original v0.60 baseline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Run original v0.60 regression suite
        run: npm run test:baseline

  build:
    name: Build offline single-file shell
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Build and verify single HTML
        run: npm run build

      - name: Upload modular shell artifact
        uses: actions/upload-artifact@v4
        with:
          name: border-guard-modular-shell
          path: release/Border-Guard-v0.60-modular-shell.html
          if-no-files-found: error
          retention-days: 14
