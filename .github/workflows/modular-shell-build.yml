name: Modular v0.60 build

on:
  push:
    branches:
      - refactor/modular-v060-phase1
  pull_request:
    branches:
      - feat/v060-30wave
    paths:
      - "Border-Guard-v0.60.html"
      - "balance/**"
      - "tests/v060-*.test.cjs"
      - "tests/unit/**"
      - "tests/integration/**"
      - "tests/parity/**"
      - "tests/helpers/**"
      - "tests/modular-game-browser.test.cjs"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - "src/**"
      - "scripts/verify-single-file.mjs"
      - ".github/workflows/modular-shell-build.yml"

permissions:
  contents: read

jobs:
  baseline-regression:
    name: Test original v0.60 baseline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Run original v0.60 regression suite
        run: npm run test:baseline

  build:
    name: Build offline single-file game preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Run modular unit tests
        run: npm run test:unit

      - name: Run headless integration tests
        run: npm run test:integration

      - name: Check module boundaries
        run: npm run test:arch

      - name: Build and verify single HTML
        run: npm run build

      - name: Compare the modular game with the original in Chrome
        run: npm run test:parity

      - name: Open modular game preview via file URL in Chrome
        run: npm run test:modular-game

      - name: Run interactive E2E against the modular build
        env:
          BG_GAME_HTML: release/Border-Guard-v0.60-modular-preview.html
        run: node --test tests/v060-e2e-browser.test.cjs

      - name: Upload modular game preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: border-guard-modular-game-preview
          path: release/Border-Guard-v0.60-modular-preview.html
          if-no-files-found: error
          retention-days: 14
